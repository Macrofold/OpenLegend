# Documentation example of generated field guidance. Do not send beside an identical tool schema.
kind: recipe
encoding: Typed JSON candidate inside ol_recipe_submit; no JSON string nested inside JSON.
fields:
  schemaVersion:
    meaning: The canonical recipe representation accepted by this adapter.
    type: integer
    value: 1
    required: true
  name:
    meaning: Name of the crafting recipe shown to the player.
    type: string
    length: { minimum: 1, maximum: 80 }
    required: true
  description:
    meaning: Explain what the recipe makes. Description text does not add mechanics.
    type: string
    length: { minimum: 1, maximum: 700 }
    required: true
  inputs:
    meaning: Native materials consumed by one crafting job.
    type: array
    required: true
    entries: { minimum: 2, maximum: 6 }
    fields:
      definitionId: Exact supplied eligible material ID, not a live item ID or a guessed label.
      quantity: Integer material units consumed, from 1 to 8 per role; at most 20 total.
      role: The material's supported function in the selected family; each role appears once.
  workSeconds:
    meaning: Simulation work required to complete one craft, not wall-clock execution time.
    type: integer
    allowed: { minimum: 48, maximum: 480 }
    required: true
  output:
    meaning: The single item produced by completing the craft.
    required: true
    fields:
      kind: Selected supported output family; not an arbitrary item class.
      name: The produced item's display name, 1 to 80 characters.
      description: The produced item's description, 1 to 700 characters; no executable effects.
      properties: Admitted material properties; cannot invent food, fuel or an unregistered effect.
      launcher: For a launcher, mechanism/ammunitionKind/damage/range/accuracy with current family bounds.
      ammunition: For arrow output, kind and bounded damageBonus; one projectile per craft.
      gatheringTool: For a gathering tool, an existing resourceId and total batch quantity, not bonus yield.
    representation: The current model-facing/provider schema uses null for inapplicable branches; normalization removes them before canonical storage. A future selected variant may omit these branches through the same codec.
submission_fields:
  operationId: Stable request identity; repeat the same ID and body to reconcile a lost response.
  packetRef: Non-secret reference to the retained context packet whose exact dependency pins must still match.
  contextHandle: Application-issued scope binding; not a session ID or an invention parameter.
  edit: Optional exact draftId and expectedRevision. Omit for a new draft.
  deriveFrom: Only in the derived-recipe variant; an exact inspected existing recipe reference.
  new_recipe_rule: No baseRecipeId field. A mechanism, material or actor is not a base recipe.

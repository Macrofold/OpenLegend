<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1020" viewBox="0 0 1400 1020" role="img" aria-labelledby="title desc">
<title id="title">Settings, session and save recovery — Design proposal — not runtime evidence</title>
<desc id="desc">04 · Local preferences stay separate from changes that replace the saved world. Original Open Legend proposal. All values and names are illustrative. This is a static diagram.</desc>

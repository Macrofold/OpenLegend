<text x="109" y="454" fill="#eee9d7" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700">Bring wood to Ada</text>
<text x="109" y="480" fill="#d1b675" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400">Open · Due before dusk</text>

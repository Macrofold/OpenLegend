<text x="96" y="375" fill="#eee9d7" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700">Your spoken promises</text>
<text x="96" y="402" fill="#a9bca9" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400">Shown as recorded; read-only here.</text>

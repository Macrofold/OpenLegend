<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" role="img"><rect width="100%" height="100%" fill="#0b1916"/><text x="30" y="33" font-family="sans-serif" font-size="15" font-weight="700" fill="#a9bca9">OPEN LEGEND / CONTEXTUAL ACTIVITY PROPOSAL</text><text x="30" y="86" font-family="sans-serif" font-size="30" font-weight="700" fill="#eee9d7">The fire supplies the context.</text><text x="30" y="119" font-family="sans-serif" font-size="17" font-weight="400" fill="#a9bca9">Choose what matters, then return to the world.</text><rect x="30" y="153" width="328" height="410" rx="8" fill="#173129" stroke="#3a5548" stroke-width="1"/><text x="50" y="196" font-family="sans-serif" font-size="24" font-weight="700" fill="#eee9d7">Campfire</text><text x="50" y="227" font-family="sans-serif" font-size="16" font-weight="400" fill="#c5aa65">Burning low</text><text x="50" y="270" font-family="sans-serif" font-size="13" font-weight="400" fill="#a9bca9">Available here</text><rect x="50" y="292" width="284" height="38" rx="5" fill="#10251f" stroke="#3a5548" stroke-width="1"/><text x="62" y="315" font-family="sans-serif" font-size="14" font-weight="400" fill="#eee9d7">Add fuel</text><rect x="50" y="342" width="284" height="38" rx="5" fill="#10251f" stroke="#3a5548" stroke-width="1"/><text x="62" y="365" font-family="sans-serif" font-size="14" font-weight="400" fill="#eee9d7">Cook…</text><rect x="50" y="392" width="284" height="38" rx="5" fill="#3c4a31" stroke="#c5aa65" stroke-width="1"/><text x="62" y="415" font-family="sans-serif" font-size="14" font-weight="700" fill="#eee9d7">Keep fire burning…</text><text x="50" y="504" font-family="sans-serif" font-size="12" font-weight="400" fill="#a9bca9">The selected fire is retained.</text><text x="50" y="527" font-family="sans-serif" font-size="12" font-weight="400" fill="#a9bca9">No need to choose it again.</text><rect x="388" y="153" width="702" height="410" rx="8" fill="#173129" stroke="#3a5548" stroke-width="1"/><text x="410" y="197" font-family="sans-serif" font-size="24" font-weight="700" fill="#eee9d7">Keep this fire burning</text><text x="410" y="239" font-family="sans-serif" font-size="19" font-weight="400" fill="#eee9d7">Use sticks from your backpack.</text><text x="410" y="279" font-family="sans-serif" font-size="18" font-weight="400" fill="#c5aa65">Until dusk</text><rect x="908" y="250" width="157" height="38" rx="5" fill="#10251f" stroke="#3a5548" stroke-width="1"/><text x="920" y="273" font-family="sans-serif" font-size="14" font-weight="400" fill="#eee9d7">Change time</text><text x="410" y="331" font-family="sans-serif" font-size="18" font-weight="400" fill="#eee9d7">Use at most 6 sticks</text><rect x="908" y="301" width="157" height="38" rx="5" fill="#10251f" stroke="#3a5548" stroke-width="1"/><text x="920" y="324" font-family="sans-serif" font-size="14" font-weight="400" fill="#eee9d7">Change limit</text><text x="410" y="383" font-family="sans-serif" font-size="18" font-weight="400" fill="#eee9d7">Keep 2 sticks for yourself</text><rect x="908" y="353" width="157" height="38" rx="5" fill="#10251f" stroke="#3a5548" stroke-width="1"/><text x="920" y="376" font-family="sans-serif" font-size="14" font-weight="400" fill="#eee9d7">Change reserve</text><text x="410" y="432" font-family="sans-serif" font-size="15" font-weight="400" fill="#a9bca9">You will stop gathering to tend this fire.</text><rect x="410" y="478" width="252" height="38" rx="5" fill="#3c4a31" stroke="#c5aa65" stroke-width="1"/><text x="422" y="501" font-family="sans-serif" font-size="14" font-weight="700" fill="#eee9d7">Start tending fire</text><rect x="686" y="478" width="157" height="38" rx="5" fill="#10251f" stroke="#3a5548" stroke-width="1"/><text x="698" y="501" font-family="sans-serif" font-size="14" font-weight="400" fill="#eee9d7">Cancel</text><rect x="30" y="590" width="1060" height="76" rx="8" fill="#173129" stroke="#3a5548" stroke-width="1"/><text x="50" y="618" font-family="sans-serif" font-size="13" font-weight="400" fill="#a9bca9">After starting</text><text x="50" y="649" font-family="sans-serif" font-size="18" font-weight="700" fill="#eee9d7">Tending the campfire · until dusk</text><rect x="790" y="609" width="130" height="38" rx="5" fill="#10251f" stroke="#3a5548" stroke-width="1"/><text x="802" y="632" font-family="sans-serif" font-size="14" font-weight="400" fill="#eee9d7">Stop</text><rect x="936" y="609" width="130" height="38" rx="5" fill="#10251f" stroke="#3a5548" stroke-width="1"/><text x="948" y="632" font-family="sans-serif" font-size="14" font-weight="400" fill="#eee9d7">Change…</text><text x="30" y="700" font-family="sans-serif" font-size="12" font-weight="400" fill="#a9bca9">Illustrative choices, not new world rules. Change uses native amendment or an explicit replacement.</text></svg>
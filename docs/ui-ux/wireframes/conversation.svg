nt-family="sans-serif" font-size="24" font-weight="400" fill="#a9bca9">×</text><text x="430" y="195" font-family="sans-serif" font-size="13" font-weight="400" fill="#a9bca9">Conversation</text><rect x="430" y="214" width="474" height="306" rx="8" fill="#10251f" stroke="#3a5548" stroke-width="1"/><text x="448" y="245" font-family="sans-serif" font-size="13" font-weight="700" fill="#c5aa65">You</text><text x="448" y="277" font-family="sans-serif" font-size="18" font-weight="400" fill="#eee9d7">I brought some food back.</text><text x="448" y="322" font-family="sans-serif" font-size="13" font-weight="700" fill="#c5aa65">Ada</text><text x="448" y="354" font-family="sans-serif" font-size="17" font-weight="400" fill="#eee9d7">Thank you. Sit with me a while?</text><text x="448" y="400" font-family="sans-serif" font-size="13" font-weight="700" fill="#c5aa65">You</text><text x="448" y="431" font-family="sans-serif" font-size="17" font-weight="400" fill="#eee9d7">How has your day been?</text><text x="448" y="485" font-family="sans-serif" font-size="20" font-weight="400" fill="#a9bca9">•  •  •</text><text x="921" y="250" font-family="sans-serif" font-size="11" font-weight="400" fill="#a9bca9">Shout</text><text x="916" y="364" font-family="sans-serif" font-size="11" font-weight="400" fill="#c5aa65">Normal</text><text x="918" y="490" font-family="sans-serif" font-size="11" font-weight="400" fill="#a9bca9">Whisper</text><rect x="944" y="277" width="4" height="191" rx="2" fill="#3a5548" stroke="#3a5548" stroke-width="1"/><rect x="936" y="382" width="20" height="20" rx="10" fill="#c5aa65" stroke="#c5aa65" stroke-width="1"/><rect x="430" y="540" width="474" height="60" rx="8" fill="#10251f" stroke="#3a5548" stroke-width="1"/><text x="446" y="575" font-family="sans-serif" font-size="17" font-weight="400" fill="#a9bca9">Say something to Ada…</text><rect x="915" y="540" width="66" height="38" rx="5" fill="#3c4a31" stroke="#c5aa65" stroke-width="1"/><text x="927" y="563" font-family="sans-serif" font-size="14" font-weight="700" fill="#eee9d7">Send</text><text x="430" y="631" font-family="sans-serif" font-size="12" font-weight="400" fill="#a9bca9">Shift+Enter: new line</text><text x="28" y="716" font-family="sans-serif" font-size="12" font-weight="400" fill="#a9bca9">Current composer, volume and reply-dot direction retained; person entry and draft scope require implementation.</text><text x="28" y="744" font-family="sans-serif" font-size="12" font-weight="400" fill="#a9bca9">Illustrative dialogue. This is a layout proposal, not a captured or playable interface.</text></svg>
<text x="32" y="848" fill="#d1b675" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700">DESIGN NOTES  /  Outside the proposed game interface</text>
<text x="32" y="881" fill="#eee9d7" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700">Read first; act deliberately</text>
<text x="32" y="909" fill="#a9bca9" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400">Selection, camera controls and inspection do</text>
<text x="32" y="930" fill="#a9bca9" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400">not move the character. Open is an explicit</text>
<text x="32" y="951" fill="#a9bca9" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400">read on the selected bag.</text>
<text x="482" y="881" fill="#eee9d7" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700">Status follows the authored world</text>
<text x="482" y="909" fill="#a9bca9" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400">This human shows Health, Food and Energy. Other</text>
<text x="482" y="930" fill="#a9bca9" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400">worlds supply other labels, units and</text>
<text x="482" y="951" fill="#a9bca9" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400">conditions; no fixed survival template.</text>
<text x="932" y="881" fill="#eee9d7" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700">A compact route back to work</text>
<text x="932" y="909" fill="#a9bca9" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400">Ongoing status names the work. Stop all work</text>
<text x="932" y="930" fill="#a9bca9" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400">ends the current action, active plan and</text>
<text x="932" y="951" fill="#a9bca9" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400">suspended work; it does not imply task-only</text>
<text x="932" y="972" fill="#a9bca9" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400">cancellation.</text>
<text x="32" y="998" fill="#a9bca9" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400">Static proposal • Illustrative content • Native permissions, world rules and saved results remain authoritative</text>
</svg>

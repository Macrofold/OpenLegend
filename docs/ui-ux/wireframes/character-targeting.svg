<text x="32" y="848" fill="#d1b675" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700">DESIGN NOTES  /  Outside the proposed game interface</text>
<text x="32" y="881" fill="#eee9d7" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700">The world remains usable</text>
<text x="32" y="909" fill="#a9bca9" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400">Targeting collapses the character sheet. The</text>
<text x="32" y="930" fill="#a9bca9" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400">scene stays visible and selectable; the short</text>
<text x="32" y="951" fill="#a9bca9" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400">action strip keeps Cancel and the exact commit</text>
<text x="32" y="972" fill="#a9bca9" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400">together.</text>
<text x="482" y="881" fill="#eee9d7" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700">An alternate selection route</text>
<text x="482" y="909" fill="#a9bca9" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400">The optional list is a readable equivalent to</text>
<text x="482" y="930" fill="#a9bca9" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400">pointing, not a required form. Hiding it</text>
<text x="482" y="951" fill="#a9bca9" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400">preserves the selected target; keyboard and</text>
<text x="482" y="972" fill="#a9bca9" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400">focus behavior still need qualification.</text>
<text x="932" y="881" fill="#eee9d7" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700">Authored character context</text>
<text x="932" y="909" fill="#a9bca9" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400">The compact summary uses the construct’s native</text>
<text x="932" y="930" fill="#a9bca9" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400">Integrity and Charge units. Opening more</text>
<text x="932" y="951" fill="#a9bca9" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400">character detail is separate; target selection</text>
<text x="932" y="972" fill="#a9bca9" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400">implies neither reach nor success.</text>
<text x="32" y="998" fill="#a9bca9" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400">Static proposal • Illustrative content • Native permissions, world rules and saved results remain authoritative</text>
</svg>

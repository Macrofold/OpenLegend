name: Hearing review source snapshot
on:
  push:
    branches: [feat/hearing-speech-captions]
    paths: [.github/workflows/hearing-review-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const crypto = require('node:crypto');
            const response = await fetch('https://registry.npmjs.org/yaml/-/yaml-2.8.1.tgz');
            if (!response.ok) throw new Error('Pinned dependency download failed');
            const bytes = Buffer.from(await response.arrayBuffer());
            const expected = 'lcYcMxX2PO9XMGvAJkJ3OsNMw+/7FKes7/hgerGUYWIoWu5j/+YQqcZr5JnPZWzOsEBgMbSbiSTn/dv/69Mkpw==';
            if (crypto.createHash('sha512').update(bytes).digest('base64') !== expected) throw new Error('Lockfile integrity mismatch');
            fs.writeFileSync('/tmp/yaml-2.8.1.tgz', bytes);
      - uses: actions/upload-artifact@v4
        with:
          name: hearing-pinned-build-dependency
          path: /tmp/yaml-2.8.1.tgz
          retention-days: 1

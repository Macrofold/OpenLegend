name: Hearing review source snapshot
on:
  push:
    branches: [feat/hearing-speech-captions]
    paths: [.github/workflows/hearing-review-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const ref = '97668413082446e08d1e1fa5c3ee788067a1c7ef';
            const archive = await github.rest.repos.downloadZipballArchive({...context.repo, ref});
            fs.writeFileSync('/tmp/hearing-source.zip', Buffer.from(archive.data));
            const tree = await github.rest.git.getTree({...context.repo, tree_sha: ref, recursive: '1'});
            if (tree.data.truncated) throw new Error('Incomplete source manifest');
            fs.writeFileSync('/tmp/hearing-tree.json', JSON.stringify(tree.data));
      - uses: actions/upload-artifact@v4
        with:
          name: hearing-native-review-source
          path: |
            /tmp/hearing-source.zip
            /tmp/hearing-tree.json
          retention-days: 1

name: Scoped invention production-data rebase
on:
  push:
    branches: [feature/invention-repertoire-foundation]
    paths:
      - .integration/replay.json
      - .github/workflows/invention-production-rebase.yml
permissions:
  contents: write
concurrency:
  group: invention-production-rebase
  cancel-in-progress: false
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Publish only reviewed trees and leased branch references
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json, runpy, urllib.error, urllib.request
          original = urllib.request.urlopen
          def request(*args, **kwargs):
              try:
                  return original(*args, **kwargs)
              except urllib.error.HTTPError as error:
                  try:
                      message = json.loads(error.read(8192)).get('message', '')
                      print('GitHub response:', str(message)[:2000], flush=True)
                  except (ValueError, UnicodeError):
                      print('GitHub returned a non-JSON rejection.', flush=True)
                  raise
          urllib.request.urlopen = request
          runpy.run_path('.integration/replay.py', run_name='__main__')
          PY
      - name: Retain exact publication progress for recovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invention-rebase-result
          path: .integration/replay-result.json
          if-no-files-found: warn
          retention-days: 3

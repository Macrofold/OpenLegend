name: Scoped invention production-data source preparation
on:
  push:
    branches: [feature/invention-repertoire-foundation]
    paths:
      - .integration/replay.json
      - .github/workflows/invention-production-rebase.yml
permissions:
  contents: write
concurrency:
  group: invention-production-rebase
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Prepare only hash-verified immutable source blobs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .integration/prepare-blobs.py
      - name: Retain exact source preparation progress
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invention-rebase-result
          path: .integration/replay-result.json
          if-no-files-found: warn
          retention-days: 3

name: Temporary Macrofold migration blob preparation
on:
  push:
    branches: [feat/macrofold-worker-api]
    paths:
      - .github/workflows/macrofold-migration-snapshot.yml
      - .github/macrofold-worker-patch.json.gz.b64
permissions:
  contents: read
jobs:
  prepare:
    if: github.ref == 'refs/heads/feat/macrofold-worker-api'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const crypto = require('node:crypto');
            const zlib = require('node:zlib');
            // Repair the one independently hash-verified transport insertion before decoding.
            const encoded = fs.readFileSync('.github/macrofold-worker-patch.json.gz.b64', 'utf8').trim().replace('W9xvW9VpjmkEw0tXW0', 'W9VpjmkEw0tXW0');
            const bytes = zlib.gunzipSync(Buffer.from(encoded, 'base64'));
            const digest = crypto.createHash('sha256').update(bytes).digest('hex');
            if (digest !== 'a6c7b292b6167633694f3ee452d33e25a79ce179b714d94ac20bb10d48a326cf') throw new Error('Patch data digest mismatch');
            const changes = JSON.parse(bytes.toString('utf8'));
            const allowed = new Set(['apps/server/src/ai-director.ts','apps/server/src/view.ts','apps/server/src/macrofold.ts','apps/server/src/config.ts','scripts/verify-live-memory.ts','scripts/macrofold-resume-setup.ts','.env.example','docs/verification.md','docs/maintainers/TODO.md','docs/maintainers/macrofold-worker-api.md','docs/maintainers/README.md','docs/ai-providers.md','docs/documentation-changelog.md','docs/architecture.md','docs/macrofold-world-agent-handoff.md','archive/05-project/implementation-status.md']);
            const blobHash = (text) => crypto.createHash('sha1').update(Buffer.concat([Buffer.from(`blob ${Buffer.byteLength(text)}\0`), Buffer.from(text)])).digest('hex');
            const lines = (text) => text.match(/[^\n]*\n|[^\n]+$/g) ?? [];
            if (changes.length !== allowed.size) throw new Error('Unexpected file count');
            const prepared = [];
            for (const change of changes) {
              if (!allowed.delete(change.path)) throw new Error('Unexpected or duplicate path');
              const original = fs.readFileSync(change.path, 'utf8');
              if (blobHash(original) !== change.base_blob) throw new Error(`Baseline mismatch: ${change.path}`);
              if (change.delete) {
                prepared.push({path:change.path, sha:null});
                continue;
              }
              const contentLines = lines(original);
              for (const edit of [...change.edits].reverse()) contentLines.splice(edit.start, edit.delete, ...lines(edit.text));
              const content = contentLines.join('');
              if (blobHash(content) !== change.new_blob) throw new Error(`Edited blob mismatch: ${change.path}`);
              prepared.push({path:change.path, sha:change.new_blob, content});
            }
            const manifest = [];
            for (const entry of prepared) {
              if (entry.sha !== null) {
                const response = await github.rest.git.createBlob({...context.repo, content:entry.content, encoding:'utf-8'});
                if (response.data.sha !== entry.sha) throw new Error(`Uploaded blob mismatch: ${entry.path}`);
              }
              manifest.push({path:entry.path, sha:entry.sha});
            }
            // This workflow creates immutable blobs only. The connector owns the final tree, commit and ref.
            fs.writeFileSync('macrofold-worker-manifest.json', JSON.stringify({sourceCommit:context.sha, patchSha256:digest, files:manifest}, null, 2));
            core.info(JSON.stringify(manifest, null, 2));
      - uses: actions/upload-artifact@v4
        with:
          name: macrofold-worker-verified-blobs
          path: macrofold-worker-manifest.json
          retention-days: 1

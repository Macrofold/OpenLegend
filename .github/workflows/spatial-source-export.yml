name: Spatial source export
on:
  push:
    branches: [feature/spatial-world-3d]
    paths: [.github/workflows/spatial-source-export.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Package tracked source and installed public dependencies
        run: |
          git archive --format=zip --output=/tmp/openlegend-source.zip HEAD
          tar -czf /tmp/openlegend-dependencies.tgz node_modules apps/client/node_modules apps/server/node_modules packages/ai/node_modules packages/domain/node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: spatial-source
          path: /tmp/openlegend-source.zip
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: spatial-dependencies
          path: /tmp/openlegend-dependencies.tgz
          retention-days: 1

name: Spatial source export
on:
  push:
    branches: [feature/spatial-world-3d]
    paths: [.github/workflows/spatial-source-export.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package tracked source only
        run: git archive --format=zip --output=/tmp/openlegend-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: spatial-source
          path: /tmp/openlegend-source.zip
          retention-days: 1

name: Workshop isolated source export
on:
  push:
    branches: [feature/invention-repertoire-foundation]
    paths: [.github/workflows/workshop-local-review.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Export pinned source and installed dependencies only
        run: tar --exclude=.git -czf /tmp/workshop-local-review.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: workshop-local-review
          path: /tmp/workshop-local-review.tar.gz
          retention-days: 1

name: Workshop PostgreSQL exercise
on:
  push:
    branches: [feature/invention-repertoire-foundation]
    paths: [.github/workflows/workshop-postgres-exercise.yml]
permissions:
  contents: read
jobs:
  exercise:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: workshop_fixture
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U fixture -d workshop_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run actual authoring repository against disposable PostgreSQL
        env:
          REVIEW_DATABASE_URL: postgresql://fixture:fixture-only@127.0.0.1:5432/workshop_fixture
          AI_BUDGET_USD: '0'
        run: |
          node --import tsx --input-type=module > /tmp/workshop-postgres.json <<'JS'
          import { PostgresDatabase } from './apps/server/src/postgres.ts';
          import { WorldAgentStore } from './apps/server/src/world-agent-store.ts';
          const db = new PostgresDatabase(process.env.REVIEW_DATABASE_URL);
          const records = new WorldAgentStore(db);
          try {
            await records.initialize();
            await records.initialize();
            const session = (id, createdAt) => ({id, worldId:'fixture-world', timeline:'fixture-timeline', principal:'fixture-owner', credential:'fixture', contextHash:'fixture-'+id, createdAt, expiresAt:9999999999999, closed:false, budgetUsd:5, policy:'fixture', actorId:'fixture-body'});
            for (const [id, at] of [['a',2],['b',10],['c',100]]) await records.saveSession(session(id,at));
            for (const sequence of [2,9,10,11,100]) await records.put('c','turn','turn-'+sequence,{fingerprint:'fixture',sequence,text:'Synthetic retained turn',createdAt:sequence});
            const sessions = await records.sessions('fixture-world','fixture-owner');
            const turns = await records.turns('c');
            const before = await records.turns('c',{sequence:10,id:'turn-10'});
            const active = {...session('a',2),activeTurn:'interrupted'};
            await records.saveSession(active);
            const recovery = await records.activeSessions('fixture-world');
            console.log(JSON.stringify({kind:'manual-disposable-postgresql-17',providerCalls:0,initialization:'completed-twice',sessionOrder:sessions.map(s=>s.createdAt),turnOrder:turns.turns.map(t=>t.sequence),beforeTen:before.turns.map(t=>t.sequence),interrupted:recovery.map(s=>s.id)},null,2));
          } finally { await db.close(); }
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workshop-postgres-observation
          path: /tmp/workshop-postgres.json
          retention-days: 1

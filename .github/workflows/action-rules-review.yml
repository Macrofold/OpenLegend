name: Action rules reconciliation review
on:
  push:
    branches: [review/action-rules-candidate]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      AI_BUDGET_USD: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 3c1198bc307bd95f4a1e0ed444aa9d3e1a00d238
          path: upstream
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: fc01e19b30060e6c7213b1c5405be13df209297e
          path: ancestor
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: candidate/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned development dependencies
        working-directory: candidate
        run: pnpm install --frozen-lockfile
      - name: Export only source and dependencies, never credentials or Git internals
        run: |
          python - <<'PY'
          import pathlib,tarfile
          with tarfile.open('/tmp/action-review-workspace.tgz','w:gz') as archive:
              for name in ('candidate','ancestor','upstream'):
                  def safe(info):
                      parts=pathlib.PurePosixPath(info.name).parts
                      if '.git' in parts or '.data' in parts or pathlib.PurePosixPath(info.name).name.startswith('.env'):
                          return None
                      return info
                  archive.add(name,filter=safe)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: action-review-workspace
          path: /tmp/action-review-workspace.tgz
          compression-level: 0
          retention-days: 1

name: Publish reviewed authoring core
on:
  push:
    branches: [feature/invention-repertoire-foundation]
    paths: [.github/workflows/mcp-core-publish.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply reviewed patch without tests
        run: |
          git apply --recount --check .mcp-core.patch
          git apply --recount .mcp-core.patch
          rm .mcp-core.patch .github/workflows/mcp-core-publish.yml
          git add -A
          test "$(git write-tree)" = "18fcbd7cc070d3303e000a51b3cf3e77139d7840"
          git -c user.name='OpenLegend implementation' -c user.email='implementation@users.noreply.github.com' commit -m '[skip ci] Retain authoring turns and enforce current preview and approval boundaries'
          git push origin HEAD:feature/invention-repertoire-foundation

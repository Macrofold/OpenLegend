name: Action capability review
on:
  push:
    branches: [review/action-capabilities-main-20260924]
    paths: [.github/workflows/action-capability-review.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare pinned source candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import urllib.request,os
          for name in ['review-prepare.py','review-reconcile.py']:
            req=urllib.request.Request('https://raw.githubusercontent.com/Macrofold/OpenLegend/'+os.environ['GITHUB_SHA']+'/.github/'+name,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN']})
            with urllib.request.urlopen(req) as response: script=response.read()
            exec(compile(script,name,'exec'))
          PY
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Production build only
        working-directory: /tmp/openlegend-reconcile/candidate
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

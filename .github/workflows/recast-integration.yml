name: Finish reviewed Recast integration and observe application
on:
  push:
    branches: [feature/spatial-world-3d]
    paths: ['.github/workflows/recast-integration.yml']
permissions:
  contents: write
jobs:
  publish-and-observe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Apply the exact reviewed source tree
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = "f5e24e88872a4b6b03577c6a30dc2c28c1b403b5"
          python3 - <<'PY'
          import base64,hashlib,json,lzma
          from pathlib import Path,PurePosixPath
          parts=sorted(Path('.github/recast-finish').glob('part-*.b64'))
          assert len(parts)==4
          payload=lzma.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts),validate=True))
          assert hashlib.sha256(payload).hexdigest()=='bb5d44b44c237af51eba6b1feaf43f5c4ff1908d5a16f0cf063e840dd0754ea7'
          files=json.loads(payload)
          assert len(files)==41 and len({f['path'] for f in files})==41
          for item in files:
              path=PurePosixPath(item['path'])
              assert not path.is_absolute() and '..' not in path.parts and path.parts[0]!='.github'
              target=Path(path)
              assert not target.is_symlink()
              lines=target.read_text(encoding='utf-8').splitlines(keepends=True) if target.exists() else []
              for start,count,replacement in reversed(item['edits']):
                  assert 0<=start<=len(lines) and 0<=count<=len(lines)-start
                  lines[start:start+count]=replacement
              content=''.join(lines).encode('utf-8')
              assert hashlib.sha256(content).hexdigest()==item['sha256'],str(path)
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(content)
          PY
          git add -A
          git diff --cached --check
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Publish source and docs without running automated tests
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '[skip ci] Complete Recast round-body movement and player-view presentation' -m 'Preserve technical navigation time, tighten shared clearance calibration, fix visual support interpolation, fence worker retirement and reconcile canonical design/task/evidence docs. Automated coverage remains TODO; actual runtime stress and application observations are recorded.'
          git push origin HEAD:refs/heads/feature/spatial-world-3d
      - run: pnpm exec playwright install --with-deps chromium
      - name: Observe the real built application without a test runner
        run: |
          set -euo pipefail
          mkdir -p /tmp/recast-observation
          env -i PATH="$PATH" HOME="$HOME" AI_BUDGET_USD=0 OPEN_LEGEND_DATABASE_URL='' OPEN_LEGEND_DATA_DIR=/tmp/recast-observation/save PORT=3230 node --import tsx apps/server/src/main.ts --production > /tmp/recast-observation/server.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID || true' EXIT
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:3230/ > /dev/null && break || sleep 1; done
          node --input-type=module <<'JS'
          import {chromium} from '@playwright/test';
          import {writeFile} from 'node:fs/promises';
          const browser=await chromium.launch({headless:true,args:['--enable-unsafe-swiftshader','--use-angle=swiftshader']});
          const page=await browser.newPage({viewport:{width:1440,height:950}});
          const messages=[],observations={};
          page.on('pageerror',e=>messages.push('PAGE '+e.message));
          page.on('console',m=>{if(['error','warning'].includes(m.type()))messages.push(m.type()+' '+m.text());});
          const snap=async(name)=>{await page.waitForTimeout(1200);await page.screenshot({path:`/tmp/recast-observation/${name}.png`});};
          const api=async(path,body)=>page.evaluate(async({path,body})=>{
            const state=await fetch('/api/state').then(r=>r.json());
            const r=await fetch(path,{method:'POST',headers:{'content-type':'application/json','x-ol-generation':state.historyEpoch.split(':')[0]},body:JSON.stringify(body==='move'?{commandId:crypto.randomUUID(),commandEpoch:state.commandEpoch,command:{type:'move',position:{x:24,y:3,z:6,surfaceId:'lookout-deck'}}}:body)});
            return {status:r.status,result:await r.json()};
          },{path,body});
          try{
            observations.pageStatus=(await page.goto('http://127.0.0.1:3230/',{waitUntil:'domcontentloaded'})).status();
            await page.locator('canvas[data-ready="true"]').first().waitFor({timeout:45000});
            await snap('start');
            const canvas=page.locator('canvas').first(),box=await canvas.boundingBox();
            observations.beforeOrbit=await canvas.evaluate(c=>({...c.dataset}));
            if(box){await page.mouse.move(box.x+box.width/2,box.y+box.height/2);await page.mouse.down({button:'right'});await page.mouse.move(box.x+box.width/2+135,box.y+box.height/2+45,{steps:20});await page.mouse.up({button:'right'});}
            observations.afterOrbit=await canvas.evaluate(c=>({...c.dataset}));
            await snap('orbit');
            const clientId=crypto.randomUUID();let sequence=0;
            observations.presence=await api('/api/presence',{clientId,visible:true,sequence:++sequence});
            observations.resume=await api('/api/control',{paused:false,speed:8,clientId,presenceSequence:++sequence});
            observations.move=await api('/api/command','move');
            const trace=[];
            for(let i=0;i<160;i++){
              await page.waitForTimeout(200);
              if(i%10===0)await api('/api/presence',{clientId,visible:true,sequence:++sequence});
              const s=await page.evaluate(()=>fetch('/api/state').then(r=>r.json()));
              trace.push({position:s.player.position,support:s.player.supportSurfaceId,pending:s.clock.preparingNavigation,action:s.player.action});
              if(!s.player.action&&i>2)break;
            }
            observations.trace=trace;
            observations.pause=await api('/api/control',{paused:true});
            await canvas.focus();await page.keyboard.press('Home');
            await page.mouse.wheel(0,-500);
            await snap('deck');
            observations.preferencesOff=await api('/api/profile/preferences',{revealMode:'off',revealRadius:8,revealStrength:.9});
            await snap('reveal-off');
            observations.preferencesOn=await api('/api/profile/preferences',{revealMode:'nearby',revealRadius:8,revealStrength:.9});
            await snap('reveal-on');
            await page.reload({waitUntil:'domcontentloaded'});
            await page.locator('canvas[data-ready="true"]').first().waitFor({timeout:45000});
            observations.afterReload=await page.evaluate(async()=>{const s=await fetch('/api/state').then(r=>r.json());return {position:s.player.position,support:s.player.supportSurfaceId,preferences:s.profile.preferences,clock:s.clock};});
            await snap('reload');
            const game=page.getByRole('button',{name:'Game',exact:true});
            if(await game.count())await game.click();
            const setting=page.getByLabel('See-through reveal',{exact:true});
            observations.settingsControlFound=await setting.count();
            if(await setting.count()){await setting.selectOption('player');await page.waitForTimeout(1000);observations.uiPreference=await page.evaluate(()=>fetch('/api/state').then(r=>r.json()).then(s=>s.profile.preferences));await snap('settings');}
          }catch(e){messages.push('OBSERVATION '+String(e));}
          await writeFile('/tmp/recast-observation/body.txt',await page.locator('body').innerText().catch(()=>''));
          await writeFile('/tmp/recast-observation/canvas.json',JSON.stringify(await page.locator('canvas').evaluateAll(cs=>cs.map(c=>({width:c.width,height:c.height,data:{...c.dataset}}))).catch(()=>[]),null,2));
          await writeFile('/tmp/recast-observation/observations.json',JSON.stringify(observations,null,2));
          await writeFile('/tmp/recast-observation/messages.json',JSON.stringify(messages,null,2));
          console.log(JSON.stringify({page:observations.pageStatus,ready:observations.afterOrbit,move:observations.move,final:observations.afterReload,settings:observations.settingsControlFound,messages},null,2));
          await browser.close();
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recast-completion-observation
          path: |
            /tmp/recast-observation/*.png
            /tmp/recast-observation/*.json
            /tmp/recast-observation/*.txt
            /tmp/recast-observation/server.log
          retention-days: 2

name: Repertoire task workspace
on:
  push:
    branches: [docs/canonical-repertoires-2026-10-03]
    paths: [.github/workflows/repertoire-task.yml]
permissions:
  contents: write
jobs:
  finish:
    if: github.ref == 'refs/heads/docs/canonical-repertoires-2026-10-03'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Finish current documentation owners
        run: |
          git fetch --depth=1 origin c4e18d91848b5b6d367dda1d7214a9f8222cf070
          python .repertoire-task/finish-text.py
      - name: Obtain the repository-pinned formatter outside the checkout
        run: |
          npm pack --pack-destination "$RUNNER_TEMP" prettier@3.6.2
          mkdir "$RUNNER_TEMP/repertoire-formatter"
          tar -xzf "$RUNNER_TEMP/prettier-3.6.2.tgz" -C "$RUNNER_TEMP/repertoire-formatter"
      - name: Format and verify exact reviewed output; remove task-only helpers
        shell: python
        run: |
          import hashlib, json, os, subprocess
          from pathlib import Path
          manifest = json.loads(Path('.repertoire-task/final-manifest.json').read_text())
          files = manifest['files']
          formatter = Path(os.environ['RUNNER_TEMP']) / 'repertoire-formatter/package/bin/prettier.cjs'
          for mode in ['--write', '--check']:
              subprocess.run(['node', str(formatter), mode, *files], check=True)
          failures = []
          for path, expected in files.items():
              actual = hashlib.sha256(Path(path).read_bytes()).hexdigest()
              if actual != expected:
                  failures.append({'path': path, 'expected': expected, 'actual': actual})
          if failures:
              print(json.dumps(failures, indent=2))
              raise SystemExit('Reviewed output mismatch; no final commit or cleanup performed')
          original = subprocess.check_output(['git', 'ls-tree', '-r', '--name-only', manifest['base'], 'docs/repertoires'], text=True).splitlines()
          retired = [p for p in original if Path(p).name.startswith(('inventory-', 'ranked-')) or Path(p).name == 'expanded-inventories.md']
          assert len(retired) == 58
          assert all(not Path(p).exists() for p in retired)
          helpers = {'consolidate.py', 'refine.py', 'entry-priorities.py', 'scene-priorities.py', 'coalesce.py', 'finish-text.py', 'final-manifest.json'}
          directory = Path('.repertoire-task')
          assert {p.name for p in directory.iterdir()} == helpers, 'Unexpected task-directory files; preserving them'
          for name in helpers:
              (directory / name).unlink()
          directory.rmdir()
          Path('.github/workflows/repertoire-task.yml').unlink()
          actual_paths = set(subprocess.check_output(['git', 'diff', '--name-only', manifest['base']], text=True).splitlines())
          assert actual_paths == set(files) | set(retired), sorted(actual_paths ^ (set(files) | set(retired)))
          assert not subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], text=True).strip()
          report = {'verified_final_file_hashes': len(files), 'retired_paths': len(retired), 'net_repertoire_documents_removed': 57, 'runtime_paths_changed': 0, 'reused_local_validation': {'original_entry_ids_preserved': 8255, 'non_action_entries': 7871, 'actions': 385, 'domain_tables': 555, 'worked_patterns': 270, 'situations': 25, 'world_proposals': 4, 'stale_retired_path_mentions': 0, 'undefined_explicit_references': 0, 'broken_repertoire_links': 0, 'unrelated_preexisting_changelog_anchors': 2}, 'full_runtime_validation': 'Not run for documentation-only work'}
          Path('/tmp/repertoire-final-verification.json').write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))
      - name: Commit only to the unchanged task branch
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch=docs/canonical-repertoires-2026-10-03
          actual=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$actual" = "$EXPECTED_SHA"
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'docs: finish canonical repertoires and remove superseded ranking layers' -m 'Preserve 8,255 original entry IDs, add ordinary melee CBT-13, and maintain priorities beside descriptions in 28 catalogues. Retain 270 contextual worked examples without duplicate scores, reconcile references and provenance, format the 46 changed Markdown files, and remove temporary task tooling. Final file hashes match the locally reviewed and validated output. No runtime code changes or acceptance closures.'
          git push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD | tee /tmp/repertoire-final-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: repertoire-final-verification
          path: |
            /tmp/repertoire-final-verification.json
            /tmp/repertoire-final-commit.txt
          retention-days: 1
          if-no-files-found: error

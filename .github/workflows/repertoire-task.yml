name: Repertoire task workspace
on:
  push:
    branches: [docs/canonical-repertoires-2026-10-03]
    paths: [.github/workflows/repertoire-task.yml]
permissions:
  contents: write
jobs:
  examples:
    if: github.ref == 'refs/heads/docs/canonical-repertoires-2026-10-03'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Read original examples and merge current constraints
        run: |
          git fetch --depth=1 origin c4e18d91848b5b6d367dda1d7214a9f8222cf070
          python .repertoire-task/coalesce.py
      - name: Commit only to the unchanged task branch
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch=docs/canonical-repertoires-2026-10-03
          actual=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$actual" = "$EXPECTED_SHA"
          git add -A -- docs/repertoires
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'docs: merge worked examples while preserving build scope and newer constraints'
          git push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: repertoire-example-checkpoint
          path: /tmp/repertoire-pattern-cleanup.json
          retention-days: 1
          if-no-files-found: error

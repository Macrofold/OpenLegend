name: Repertoire task workspace
on:
  push:
    branches: [docs/canonical-repertoires-2026-10-03]
    paths: [.github/workflows/repertoire-task.yml]
permissions:
  contents: write
jobs:
  priorities:
    if: github.ref == 'refs/heads/docs/canonical-repertoires-2026-10-03'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Apply scoped entry and scenario priority review
        run: |
          python .repertoire-task/entry-priorities.py
          python .repertoire-task/scene-priorities.py
      - name: Commit only to the unchanged task branch
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch=docs/canonical-repertoires-2026-10-03
          actual=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$actual" = "$EXPECTED_SHA"
          git add -A -- docs README.md archive .agents
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'docs: prioritize practical invention and character consequences without inflating simulation scope'
          git push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: repertoire-priority-checkpoint
          path: /tmp/repertoire-*-priorities.json
          retention-days: 1
          if-no-files-found: error

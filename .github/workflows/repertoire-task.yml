name: Repertoire task workspace
on:
  push:
    branches: [docs/canonical-repertoires-2026-10-03]
    paths: [.github/workflows/repertoire-task.yml]
permissions:
  contents: read
jobs:
  formatter:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Obtain repository-pinned formatter
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/repertoire-tools"
          npm pack --pack-destination "$RUNNER_TEMP/repertoire-tools" prettier@3.6.2
      - uses: actions/upload-artifact@v4
        with:
          name: repertoire-tools
          path: ${{ runner.temp }}/repertoire-tools
          retention-days: 1
          if-no-files-found: error

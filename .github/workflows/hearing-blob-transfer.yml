name: Hearing source blob transfer
on:
  push:
    branches: [feat/hearing-speech-captions]
    paths: [.github/hearing-source-edits.json]
permissions:
  contents: write
jobs:
  blobs:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const crypto = require('node:crypto');
            const repo = context.repo;
            const payload = await github.rest.repos.getContent({...repo, path: '.github/hearing-source-edits.json', ref: context.sha});
            const edits = JSON.parse(Buffer.from(payload.data.content, 'base64').toString('utf8'));
            if (!Array.isArray(edits) || edits.length > 100) throw new Error('Invalid transfer');
            const result = [];
            for (const entry of edits) {
              if (!/^(apps|packages|docs|archive)\//.test(entry.path) && entry.path !== 'README.md') throw new Error('Invalid source path');
              const source = await github.rest.git.getBlob({...repo, file_sha: entry.before});
              const lines = Buffer.from(source.data.content, 'base64').toString('utf8').split('\n');
              let previous = lines.length + 1;
              for (const edit of entry.edits) {
                if (!Number.isSafeInteger(edit.start) || !Number.isSafeInteger(edit.remove) || edit.start < 0 || edit.remove < 0 || edit.start + edit.remove > previous || !Array.isArray(edit.lines) || edit.lines.some(line => typeof line !== 'string' || line.includes('\n'))) throw new Error('Invalid descending edit range');
                lines.splice(edit.start, edit.remove, ...edit.lines);
                previous = edit.start;
              }
              const content = lines.join('\n');
              const bytes = Buffer.from(content);
              const hash = crypto.createHash('sha1').update(Buffer.from(`blob ${bytes.length}\0`)).update(bytes).digest('hex');
              if (hash !== entry.after) throw new Error(`Content digest mismatch: ${entry.path}`);
              const blob = await github.rest.git.createBlob({...repo, content, encoding: 'utf-8'});
              if (blob.data.sha !== hash) throw new Error('Published digest mismatch');
              result.push({path: entry.path, mode: '100644', type: 'blob', sha: blob.data.sha});
            }
            console.log('VERIFIED_TREE_ENTRIES=' + JSON.stringify(result));
            // This job never creates commits, moves refs, merges PRs or runs Git commands.
            // The caller reviews the manifest and publishes through the GitHub connector.

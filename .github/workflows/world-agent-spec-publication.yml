name: Publish reviewed World Agent specification
on:
  push:
    branches: [review/invention-extensibility]
    paths: [.github/workflows/world-agent-spec-publication.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact reviewed documentation patch without tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, lzma
          from pathlib import Path
          encoded = ''.join(Path(f'.world-agent-spec-part{i}').read_text() for i in range(7))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          expected = 'a689b637449d01f52b6783d9e3afd6cc946e73b030e6fb0244f1c6fc03b4a878'
          if hashlib.sha256(patch).hexdigest() != expected:
              raise SystemExit('Publication payload does not match the reviewed patch.')
          Path('/tmp/world-agent-spec.patch').write_bytes(patch)
          PY
          git apply --check --unidiff-zero /tmp/world-agent-spec.patch
          git apply --unidiff-zero --index /tmp/world-agent-spec.patch
          git rm --ignore-unmatch .invention-capability-part0 .world-agent-spec-part0 .world-agent-spec-part1 .world-agent-spec-part2 .world-agent-spec-part3 .world-agent-spec-part4 .world-agent-spec-part5 .world-agent-spec-part6 .github/workflows/world-agent-spec-publication.yml
          actual="$(git write-tree)"
          test "$actual" = 'cfc396861fad2ae6b41d0bb36d5b371b2db0d330'
          git diff --cached --check
          git config user.name 'OpenLegend documentation automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '[skip ci] Specify unified World Agent, MCP, graph and composition'
          git push origin HEAD:review/invention-extensibility
          printf 'Published commit: '
          git rev-parse HEAD
          printf 'Verified tree: '
          git rev-parse HEAD^{tree}

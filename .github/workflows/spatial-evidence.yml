name: Record spatial verification evidence
on:
  push:
    branches: [feature/spatial-world-3d]
    paths: [.github/workflows/spatial-evidence.yml]
permissions:
  contents: write
jobs:
  record:
    if: github.ref == 'refs/heads/feature/spatial-world-3d'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Update only the inspected evidence and task paragraphs
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD:docs/verification.md)" = 49ac05ea1798bef254e6afea3e9792428f5b1ee6
          test "$(git rev-parse HEAD:docs/maintainers/spatial-world.md)" = 93e6dd1b08db1ebdd79249cc3bba5fd7b9e7c676
          test "$(git rev-parse HEAD:docs/documentation-changelog.md)" = 7cecec86784c8ae2a14aeaabcd3cd1816744ed04
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/verification.md')
          s = p.read_text()
          start = "A new Playwright scenario in `tests/browser/spatial-world.spec.ts` exercises actual deck picking"
          matches = [paragraph for paragraph in s.split('\n\n') if paragraph.startswith(start)]
          assert len(matches) == 1
          new = "The Playwright scenario in `tests/browser/spatial-world.spec.ts` passed in GitHub Actions run [35803819218](https://github.com/Macrofold/OpenLegend/actions/runs/35803819218) on commit `5b4676c4e612619bd07b36607e225581e5243c90`. The same run passed the production build and all 24 focused tests. The browser clicked the real projected deck surface, observed the native actor ascend to y=3, exercised orbit/projection/floor focus and rotation lock, verified drag-release isolation and persisted projection after reload, and produced mixed sprite/mesh screenshots with no page errors or paid requests. The initial remote attempt failed because the fixture incorrectly tried to resume an already-running fresh world; only that test setup was corrected. Local Chromium navigation remains unavailable under the administrator policy, and no local browser success is claimed. Broader touch/accessibility, context-loss, late generated-model and multi-client cases remain open in SW16. Screenshots are retained in the run's `spatial-browser-evidence` artifact for seven days. The read-only `.github/workflows/spatial-check.yml` preserves this focused gate without replacing the repository's existing full check."
          p.write_text(s.replace(matches[0], new))
          p = Path('docs/maintainers/spatial-world.md')
          s = p.read_text()
          old = 'SW09.1 has pure camera controls and a browser scenario awaiting execution;'
          assert s.count(old) == 1
          s = s.replace(old, 'SW09.1 has pure camera controls and a passing real-browser scenario;')
          for task in ['SW09.1', 'SW11.1', 'SW16.2']:
              old = f'- [ ] **{task}**'
              assert s.count(old) == 1
              s = s.replace(old, f'- [x] **{task}**')
          p.write_text(s)
          p = Path('docs/documentation-changelog.md')
          p.write_text(p.read_text() + '\n## Spatial world browser verification\n\nRecorded the passing branch-only GitHub Actions production build, 24 focused tests and real PlayCanvas browser scenario in Verification. Updated the narrowly evidenced camera, surface-picking and executed-check task states while retaining broader acceptance gates. Removed temporary source/publication transport files; a read-only spatial workflow now supplements the unchanged full repository check. No live provider calls or legacy save conversion were introduced.\n')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/verification.md docs/maintainers/spatial-world.md docs/documentation-changelog.md
          git commit -m 'Record passing real-browser spatial verification and preserve deferred gates'
          git push origin HEAD:refs/heads/feature/spatial-world-3d

name: Interval common-base inputs
on:
  push:
    branches: [feature/spatial-world-3d]
    paths: [.github/workflows/interval-continuation-export.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c466b63f818021a6cd65d0809b94f220cce642d4
          persist-credentials: false
      - name: Package common-base source without credentials
        run: |
          python3 - <<'PY'
          import os,pathlib,zipfile
          root=pathlib.Path.cwd()
          with zipfile.ZipFile(pathlib.Path(os.environ['RUNNER_TEMP'])/'common-base.zip','w',zipfile.ZIP_DEFLATED) as z:
              for directory,dirs,files in os.walk(root):
                  dirs[:]=[d for d in dirs if d not in ('.git','node_modules','dist') and not d.startswith('.data')]
                  for f in files:
                      p=pathlib.Path(directory)/f
                      if not p.is_symlink() and (not f.startswith('.env') or f.endswith('.example')):
                          z.write(p,p.relative_to(root))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: interval-common-base
          path: ${{ runner.temp }}/common-base.zip
          retention-days: 2

name: Publish reviewed durable agent turns
on:
  push:
    branches: [feature/invention-repertoire-foundation]
    paths: [.github/workflows/agent-turn-publish.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply reviewed runtime diff without test execution
        run: |
          git apply --unidiff-zero --check .agent-turn.patch
          git apply --unidiff-zero .agent-turn.patch
          rm .agent-turn.patch .github/workflows/agent-turn-publish.yml
          git add -A
          test "$(git write-tree)" = "33cb3f5c9f55bcb3ec381a3163e889dc6b586ba9"
          git -c user.name='OpenLegend implementation' -c user.email='implementation@users.noreply.github.com' commit -m '[skip ci] Retain asynchronous World Agent turns and exact cancellation'
          git push origin HEAD:feature/invention-repertoire-foundation

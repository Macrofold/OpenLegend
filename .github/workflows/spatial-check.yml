              await expect(madeCell.locator('.ol-sigil')).toHaveText('W');
              await madeCell.click();
              const madeDetail = page.getByRole('dialog', {
                name: recipe.output.name + ' actions and details',
                exact: true,
              });
              await expect(madeDetail).toContainText(sling.output.description);
              const equipped = await act(
                'Equip the physical Sling that was just crafted',
                { type: 'equip', itemId: made.id },
                () => madeDetail.getByRole('button', { name: 'Equip', exact: true }).click(),
              );
              assert.equal(actor().equippedItemId, made.id);
              assert.equal(equipped.itemId, made.id);
              await expect(page.getByRole('region', { name: 'Equipped items', exact: true })).toContainText(
                recipe.output.name,
              );
              await own.locator('[data-item-id="' + made.id + '"]').click();
              await expect(madeDetail).toContainText('Equipped');
              await capture('04-crafted-sling-actual-item-and-fallback.png');
              report.crafting = {
                recipeId: recipe.id,
                itemId: made.id,
                definitionId: made.definitionId,
                consumed: { cord: 1, prepared_fiber: 2 },
                completedEventId: craftedEvent[0].id,
                equippedItemId: actor().equippedItemId,
                presentation: 'Native readable name and W fallback sigil; no generated art.',
              };
              const final = await state();
              assert.equal(requests.length, 7);
              assert.equal(report.commands.length, 7);
              assert.equal(requests.filter((body) => body.command.type === 'transfer-item').length, 1);
              assert.equal(total(bagId, 'wood'), 2);
              assert.equal(total(PLAYER_ID, 'wood'), 3);
              assert.deepEqual(report.pageErrors, []);
              assert.deepEqual(report.unexpectedRequests, []);
              assert.equal(final.ai.budget.spentUsd, 0);
              assert.equal(final.ai.budget.reservedUsd, 0);
              assert.equal(final.ai.usage.llmCalls + final.ai.usage.jevCalls, 0);
              report.final = {
                simTime: game.service.world.simTime,
                gameplayCommands: requests.length,
                originalReceipts: report.commands.length,
                providerCalls: 0,
                providerCostUsd: 0,
                bagBranches: 2,
                carriedBranches: 3,
                equippedSlingId: made.id,
              };
              report.nativeSequenceCompleted = true;
              report.passed = report.captureFailures.length === 0;
            } catch (error) {
              report.failure = errorText(error);
            } finally {
              if (deliveryWork)
                try {
                  await deliveryWork;
                } catch (error) {
                  report.cleanup.deliveryError = errorText(error);
                  report.passed = false;
                }
              if (traceStarted && context)
                try {
                  await context.tracing.stop({ path: join(output, 'trace.zip') });
                  report.trace = 'trace.zip';
                } catch (error) {
                  report.cleanup.traceError = errorText(error);
                  report.passed = false;
                }
              if (context)
                try {
                  await context.close();
                  report.cleanup.contextClosed = true;
                } catch (error) {
                  report.cleanup.contextError = errorText(error);
                  report.passed = false;
                }
              if (game)
                try {
                  report.cleanup.shutdown = await game.shutdown();
                  if (!report.cleanup.shutdown.saved || report.cleanup.shutdown.problems.length)
                    report.passed = false;
                } catch (error) {
                  report.cleanup.shutdownError = errorText(error);
                  report.passed = false;
                }
              if (store)
                try {
                  await store.close();
                  report.cleanup.repositoryClosed = true;
                } catch (error) {
                  report.cleanup.repositoryError = errorText(error);
                  report.passed = false;
                }
              report.finishedAt = new Date().toISOString();
              report.elapsedMs = Date.parse(report.finishedAt) - Date.parse(report.startedAt);
              await writeFile(join(output, 'report.json'), JSON.stringify(report, null, 2) + '\n');
            }
            return report;
          }

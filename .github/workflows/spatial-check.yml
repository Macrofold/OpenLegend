              for (const operation of ['decline', 'accept']) {
                await showPanel('inventory', 'Inventory');
                const from = await inventory(PLAYER_ID);
                const food = from.items.find(
                  (entry) => itemFor(game.service.world, entry.id)?.definitionId === 'cooked_meat',
                );
                assert.ok(food);
                const beforeOffer = custody();
                const foodCell = ownSide.locator('[data-item-id="' + food.id + '"]');
                if (!foodOfferObserverStarted) {
                  await foodCell.evaluate((cell) => {
                    const started = performance.now(),
                      first = [],
                      last = [];
                    let count = 0,
                      open = false;
                    const detail = () => document.querySelector('.ol-inventory-popover');
                    const scope = (target) =>
                      target == null
                        ? 'none'
                        : target === window || target === document
                          ? 'page'
                          : !(target instanceof Element)
                            ? 'outside'
                            : cell.contains(target)
                              ? 'food cell'
                              : detail()?.contains(target)
                                ? 'item details'
                                : target.contains(cell)
                                  ? 'inventory ancestor'
                                  : 'outside';
                    const record = (kind, target, relatedTarget = null) => {
                      const entry = {
                        ms: Math.round(performance.now() - started),
                        kind,
                        target: scope(target),
                        relatedTarget: scope(relatedTarget),
                        workspaceScrollTop: cell.closest('.ol-inventory-workspace')?.scrollTop ?? null,
                        popoverOpen: !!detail(),
                      };
                      count++;
                      if (first.length < 32) first.push(entry);
                      else {
                        last.push(entry);
                        if (last.length > 32) last.shift();
                      }
                    };
                    const observe = (event) => {
                      if (scope(event.target) !== 'outside' || detail()?.contains(event.relatedTarget))

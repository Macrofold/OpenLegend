                  continuation: 'native camp/object/care/crafting',
                  passed: control.passed,
                  stages: control.stageStatuses,
                  interrupted: !!control.stopRequested,
                  forcedTermination: !!control.forcedTermination,
                  reports: outputDirectory,
                }),
              );
              process.exitCode = control.passed ? 0 : 1;
            }
          }

          const isWorker = process.argv[2] === '--worker';
          const outputDirectory = resolve(process.argv[isWorker ? 3 : 2] ?? 'test-results/whole-ui');
          if (isWorker) await worker(outputDirectory);
          else await supervise(outputDirectory);
          OPENLEGEND_WHOLE_UI_2
          node --import tsx "$task_dir/run-whole-ui.mjs" test-results/whole-ui

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spatial-browser-evidence
          path: test-results/
          retention-days: 7

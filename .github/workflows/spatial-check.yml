              assert.equal(game.service.world.entities[PLAYER_ID].actor.equippedItemId, equipped.itemId);
              await expect(knifeDetail).toBeHidden();
              await expect(page.getByRole('region', { name: 'Equipped items', exact: true })).toContainText(
                'Knife',

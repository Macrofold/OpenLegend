name: Spatial world checks
on:
  push:
    branches: [feature/spatial-world-3d]
  pull_request:
    paths:
      - 'packages/**'
      - 'apps/**'
      - 'tests/browser/**'
      - 'tests/fixtures/**'
      - 'playwright.config.ts'
      - 'tsconfig*.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/spatial-check.yml'
permissions:
  contents: read
concurrency:
  group: spatial-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: openlegend
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openlegend -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      OPENLEGEND_TEST_DATABASE_URL: postgresql://openlegend:fixture@localhost:5432/postgres
      AI_BUDGET_USD: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # This focused gate supplements, not replaces, the repository's full check.
      - run: pnpm exec vitest run packages/spatial/src/spatial.test.ts packages/domain/src/spatial-world.test.ts apps/client/src/world-camera.test.ts apps/server/src/spatial-http.test.ts
      - id: playwright_install
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test tests/browser/spatial-world.spec.ts
        env:
          AI_BUDGET_USD: '0'
      # Preserve the original spatial evidence and failure while exercising the
      # existing interface journeys against their own disposable databases.
      - name: Check player and creator interfaces
        if: ${{ !cancelled() && steps.playwright_install.outcome == 'success' }}
        run: >-
          pnpm exec playwright test
          tests/browser/actions.spec.ts
          tests/browser/camera.spec.ts
          tests/browser/conversation-ui.spec.ts
          tests/browser/design-system.spec.ts
          tests/browser/god-editor.spec.ts
          tests/browser/time.spec.ts
          --output test-results/interface
      # One finite native continuation; remove after its requested evidence is retained.
      # The alternate-world roundtrip passed at d1315ea and is not repeated here.
      - name: Exercise native camp and creator recovery
        if: ${{ !cancelled() && steps.playwright_install.outcome == 'success' }}
        timeout-minutes: 6
        run: |
          task_dir="$RUNNER_TEMP/openlegend-whole-ui"
          mkdir -p "$task_dir"
          cat > "$task_dir/camp-stage.mjs" <<'OPENLEGEND_WHOLE_UI_0'
          // One finite scratch continuation, imported from an existing CI checkout with --import tsx.
          // Root owns Chromium, the hard CI deadline, build identity and final closeTestDatabases().
          // This stage owns one disposable native host and one ordinary App browser context.
          // It is not a test-runner case, a provider fixture or a permanent verification framework.
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { mkdir, readFile, writeFile } from 'node:fs/promises';
          import { createRequire } from 'node:module';
          import { join, resolve } from 'node:path';
          import { pathToFileURL } from 'node:url';

          export async function runCampStage({ browser, outputDirectory }) {
            const output = join(outputDirectory, 'camp');
            await mkdir(output, { recursive: true });
            const report = {
              startedAt: new Date().toISOString(),
              checkout: process.env.GITHUB_SHA ?? 'unrecorded-checkout',
              browser: browser.version(),
              node: process.version,
              scope:
                'One native base-world storage/equipment/gather/fire/cook/food-offer/conversation-boundary/return journey; J16 composition and supplied J14 decisions.',
              limitations: [
                'No generated speech, reply or autonomous recipient-decision quality.',
                'No complete J13/J14/J16 acceptance: positive conversation, expiry, changed access and broader recovery remain open.',
                'No approach walking, alternative recipes, broad inventory matrix, human IME, assistive-device or uncoached-usability claim.',
                'The installed knife is equipped; ordinary gathering uses its native two-unit batch, with no claimed knife gathering bonus.',
                'Fixture positions, camp supplies and partly burned initial fuel are prepared after real App entry; NPC decline/accept are explicit supplied native decisions.',
                'Six finite time amounts are offered once to the native clock, with zero-time drains for retained navigation debt; this does not qualify wall-clock pacing.',
              ],
              providerBudgetUsd: 0,
              providerCalls: null,
              commandObservations: [],
              nativeProgress: [],
              suppliedDecisions: [],
              captures: [],
              pageErrors: [],
              unexpectedRequests: [],
              cleanup: { finalDatabaseDrop: 'Owned by the root driver through closeTestDatabases().' },
              passed: false,
            };
            let game, store, context, page, base, authorityHeaders;
            let entered = false,
              traceStarted = false;
            const commandRequests = [],
              destinationRequests = [],
              providerRequests = [];
            const errorText = (error) => (error instanceof Error ? error.message : String(error));
            const nativeImport = (path) => import(pathToFileURL(resolve(path)).href);

            try {
              const { expect } = createRequire(resolve('package.json'))('@playwright/test');
              const [
                http,
                database,
                fixture,
                entry,
                domain,
                spatialState,
                spatial,
                cognition,
                handover,
                baseActions,
                language,
              ] = await Promise.all([
                nativeImport('apps/server/src/http.ts'),
                nativeImport('tests/fixtures/database.ts'),
                nativeImport('tests/fixtures/service.ts'),
                nativeImport('tests/fixtures/browser.ts'),
                nativeImport('packages/domain/src/index.ts'),
                nativeImport('packages/domain/src/spatial-state.ts'),
                nativeImport('packages/spatial/src/index.ts'),
                nativeImport('apps/server/src/cognition.ts'),
                nativeImport('apps/server/src/handover-actions.ts'),
                nativeImport('packages/domain/src/worlds/base/actions.ts'),
                nativeImport('packages/language/src/index.ts'),
              ]);
              const {
                PLAYER_ID,
                NPC_ID,
                createItemLot,
                moveLot,
                itemsForOwner,
                inventoryFor,
                itemFor,
                seesEntity,
                canReachEntity,
                executeCommand,
                BASE_FIRE_CARE,
              } = domain;
              const { worldPosition, worldSupport, setSpatialPosition, spatialMap } = spatialState;
              const { BODY_PROFILES, canStand } = spatial;
              const { BASE_ACTION_DEFAULTS, BASE_GATHER_QUANTITY } = baseActions;
              const { namePhrase } = language;
              const sourcePaths = [
                'apps/server/src/http.ts',
                'apps/server/src/inventory-view.ts',
                'apps/server/src/action-catalogue.ts',
                'apps/server/src/fire-actions.ts',
                'apps/server/src/handover-actions.ts',
                'apps/server/src/cognition.ts',
                'apps/client/src/main.tsx',
                'apps/client/src/ui/inventory.tsx',
                'apps/client/src/ui/inventory-offer.tsx',
                'apps/client/src/ui/composer.tsx',
                'apps/client/src/ui/world-events.tsx',
                'packages/domain/src/kernel.ts',
                'packages/domain/src/handover.ts',
                'packages/domain/src/worlds/base/fire.ts',
                'packages/domain/src/worlds/base/actions.ts',
                'tests/fixtures/service.ts',
              ];
              report.sha256 = Object.fromEntries(
                await Promise.all(
                  sourcePaths.map(async (path) => [
                    path,
                    createHash('sha256')
                      .update(await readFile(resolve(path)))
                      .digest('hex'),
                  ]),
                ),
              );
              report.scriptSha256 = createHash('sha256')
                .update(await readFile(new URL(import.meta.url)))
                .digest('hex');

              const fixedNow = Date.now();
              const config = database.readConfig({
                WORLD_SEED: '73',
                AI_BUDGET_USD: '0',
                OPEN_LEGEND_GOD_MODE: 'false',
                OPEN_LEGEND_AUTH_MODE: 'local',
              });
              assert.equal(config.budgetUsd, 0);
              assert.equal(config.godMode, false);
              for (const key of [
                'jevKey',
                'llmKey',
                'embeddingKey',
                'macrofoldKey',
                'macrofoldProviderConnectionId',
                'macrofoldJevConnectionId',
                'macrofoldWorldConnectionId',
              ])
                assert.equal(config[key], '', 'Fixture must not inherit provider configuration: ' + key);
              store = await database.testRepository();
              game = await http.createGameServer({
                config,
                store,
                production: true,
                tick: false,
                now: () => fixedNow,
              });
              await new Promise((resolve) => game.server.listen(0, '127.0.0.1', resolve));
              const address = game.server.address();
              assert.ok(address && typeof address !== 'string');
              base = 'http://127.0.0.1:' + address.port;
              context = await browser.newContext({ viewport: { width: 1440, height: 960 } });
              await context.tracing.start({ screenshots: false, snapshots: true, sources: true });
              traceStarted = true;
              page = await context.newPage();
              page.setDefaultTimeout(10_000);
              page.setDefaultNavigationTimeout(20_000);
              page.on('pageerror', (error) => report.pageErrors.push(error.message));
              page.on('request', (request) => {
                const url = new URL(request.url());
                if (url.origin !== base && !['data:', 'blob:'].includes(url.protocol))
                  report.unexpectedRequests.push(url.origin + url.pathname);
                if (
                  request.method() === 'POST' &&
                  /^\/api\/(?:chat(?:\/|$)|invent(?:\/|$)|inventions\/submit|world-agent\/.*(?:messages|start|apply))/.test(
                    url.pathname,
                  )
                )
                  providerRequests.push(url.pathname);
                if (/^\/api\/god(?:\/|$)/.test(url.pathname)) report.unexpectedRequests.push(url.pathname);
                if (url.pathname === '/api/command') commandRequests.push(request.postDataJSON());
                if (url.pathname === '/api/inventory/destinations')
                  destinationRequests.push(request.postDataJSON());
                const headers = request.headers();
                if (entered && headers['x-ol-client'] && headers['x-ol-scope']) {
                  const captured = {
                    Origin: base,
                    'X-OL-Client': headers['x-ol-client'],
                    'X-OL-Scope': headers['x-ol-scope'],
                  };
                  if (
                    authorityHeaders &&
                    (authorityHeaders['X-OL-Client'] !== captured['X-OL-Client'] ||
                      authorityHeaders['X-OL-Scope'] !== captured['X-OL-Scope'])
                  )
                    report.unexpectedRequests.push('The sole browser authority changed during camp.');
                  authorityHeaders = captured;
                }
              });
              await page.goto(base + '/auth/login');
              await entry.enterGame(page);
              await expect(page.locator('#world')).toHaveAttribute('data-ready', 'true');
              assert.equal(game.service.paused, false, 'Real App entry must precede fixture preparation');
              entered = true;

              const total = (ownerId, definitionId) =>
                itemsForOwner(game.service.world, ownerId)
                  .filter((item) => item.definitionId === definitionId)
                  .reduce((sum, item) => sum + item.quantity, 0);
              const lot = (ownerId, definitionId) => {
                const found = itemsForOwner(game.service.world, ownerId).filter(
                  (item) => item.definitionId === definitionId,
                );
                assert.equal(found.length, 1, 'This small fixture expects one exact lot of ' + definitionId);
                return found[0];
              };
              const custody = () =>
                [PLAYER_ID, seed.bagId, NPC_ID].map((id) => ({
                  id,
                  revision: game.service.world.entities[id].inventoryRevision ?? 0,
                  items: itemsForOwner(game.service.world, id)
                    .map((item) => ({
                      id: item.id,
                      ownerId: item.ownerId,
                      quantity: item.quantity,
                      revision: item.revision,
                      placementRevision: item.placementRevision,
                    }))
                    .sort((a, b) => a.id.localeCompare(b.id)),
                }));
              async function readOnly(path, body) {
                assert.ok(authorityHeaders, 'Read only with authority captured from the actual App');
                const response =
                  body === undefined
                    ? await page.request.get(base + path, { headers: authorityHeaders, timeout: 10_000 })
                    : await page.request.post(base + path, {
                        headers: authorityHeaders,
                        data: body,
                        timeout: 10_000,
                      });
                assert.equal(response.status(), 200, 'Native read: ' + path);
                return response.json();
              }
              async function state() {
                const view = await readOnly('/api/state');
                assert.equal(view.player.id, PLAYER_ID);
                assert.equal(view.worldId, 'wilderness-73');
                assert.equal(view.access.controlling, true);
                assert.equal(view.godMode, false);
                assert.equal(view.clock.paused, false);
                return view;
              }
              async function inventory(containerId) {
                const value = await readOnly('/api/inventory', { containerId });
                assert.equal(value.ok, true);
                assert.equal(value.container.id, containerId);
                assert.equal(value.next, undefined, 'The small camp fixture fits one native contents page');
                return value;
              }
              async function act(label, expected, gesture, input = 'pointer click') {
                const before = commandRequests.length;
                const [response] = await Promise.all([
                  page.waitForResponse((entry) => new URL(entry.url()).pathname === '/api/command'),
                  gesture(),
                ]);
                assert.equal(response.status(), 200);
                const request = response.request(),
                  body = request.postDataJSON(),
                  result = await response.json();
                assert.equal(commandRequests.length, before + 1, label + ' sends one command');
                for (const [key, value] of Object.entries(expected))
                  assert.deepEqual(body.command[key], value, label + ': ' + key);
                const headers = await request.allHeaders();
                assert.equal(headers['x-ol-client'], authorityHeaders['X-OL-Client']);
                assert.equal(headers['x-ol-scope'], authorityHeaders['X-OL-Scope']);
                const receipt = await readOnly('/api/command/receipt', body);
                assert.equal(receipt.status, 'resolved');
                for (const key of ['ok', 'code', 'message', 'itemId', 'actionId'])
                  assert.deepEqual(receipt.result[key], result[key]);
                report.commandObservations.push({
                  label,
                  input,
                  request: body,
                  result: Object.fromEntries(
                    ['ok', 'code', 'message', 'itemId', 'actionId'].map((key) => [key, result[key]]),
                  ),
                  receiptStatus: receipt.status,
                });
                assert.equal(result.ok, true, label + ': ' + result.message);
                return result;
              }
              async function showPanel(id, label) {
                const panel = page.locator('#' + id + 'Panel');
                if (!(await panel.isVisible()))
                  await page.getByRole('button', { name: label, exact: true }).click();
                await expect(panel).toBeVisible();
                return panel;
              }
              async function hidePanel(id) {
                const panel = page.locator('#' + id + 'Panel');
                if (await panel.isVisible()) await panel.getByRole('button', { name: /^Hide / }).click();
              }
              async function nearbyRow(id) {
                const panel = await showPanel('nearby', 'In view');
                const back = panel.getByRole('button', { name: 'Back to In view', exact: true });
                if (await back.isVisible()) await back.click();
                const row = panel.locator('[data-entity="' + id + '"]').getByRole('button');
                await expect(row).toBeVisible();
                return row;
              }
              async function choice(targetId, actionId) {
                await hidePanel('inventory');
                await (await nearbyRow(targetId)).click({ button: 'right' });
                const menu = page.locator('#contextMenu');
                const row = menu.locator('[data-catalogue-action="' + actionId + '"]');
                await expect(row).toHaveAttribute('aria-disabled', 'false');
                return { menu, row };
              }
              async function capture(name) {
                assert.ok(report.captures.length < 4);
                await page.screenshot({ path: join(output, name) });
                report.captures.push(name);
              }
              async function advance(label, seconds, actionId, partial = false) {
                // Preserve the actual NavigationCoordinator. An admitted finite amount is offered
                // once; zero-time ticks only drain its retained debt after technical work settles.
                await expect.poll(() => domain.navigationBlocked(game.service.world)).toBe(false);
                const before = game.service.world.simTime;
                const target = before + seconds;
                await game.service.tick(seconds / (config.baseRatio * game.service.speed), 0);
                await expect
                  .poll(async () => {
                    await game.service.tick(0, 0);
                    return Math.abs(game.service.world.simTime - target) < 1e-6;
                  })
                  .toBe(true);
                assert.ok(
                  Math.abs(game.service.world.simTime - target) < 1e-6,
                  label + ' advances its declared game time',
                );
                const view = await state();
                if (partial) {
                  assert.equal(view.player.action.id, actionId);
                  assert.ok(view.player.action.progress > 0 && view.player.action.progress < 1);
                  assert.equal(view.player.action.advancing, true);
                  await expect(page.locator('.ol-current-work')).toContainText(view.player.action.label);
                } else {
                  assert.equal(game.service.world.entities[PLAYER_ID].actor.action, null);
                  assert.equal(view.player.action, null);
                  await expect(page.locator('.ol-current-work')).toBeHidden();
                }
                report.nativeProgress.push({
                  label,
                  seconds,
                  before,
                  after: game.service.world.simTime,
                  action: view.player.action,
                });
              }
              function active(type, result, seconds) {
                const action = game.service.world.entities[PLAYER_ID].actor.action;
                assert.equal(action.id, result.actionId);
                assert.equal(action.type, type);
                assert.equal(
                  action.stage,
                  'working',
                  'Prepared positions must avoid an unqualified approach',
                );
                assert.equal(action.totalSeconds, seconds);
                assert.equal(action.remainingSeconds, seconds);
                return action;
              }
              function completion(type, targetId) {
                const events = game.service.world.events.filter(
                  (event) =>
                    event.type === type && event.actorId === PLAYER_ID && event.targetId === targetId,
                );
                assert.equal(events.length, 1, 'One native ' + type + ' event');
                return events[0];
              }

              // Existing immutable fixture construction prepares a valid scene, not world laws.
              const seed = await fixture.editWorld(game.service, (world) => {
                assert.equal(world.itemDefinitions.woven_bag.container.capacity, 24);
                assert.equal(world.entities[PLAYER_ID].actor.equippedItemId, null);
                const player = world.entities[PLAYER_ID],
                  point = worldPosition(player),
                  surfaceId = worldSupport(player);
                assert.ok(surfaceId);
                for (const [id, dx, dz] of [
                  [NPC_ID, 1, 0],
                  ['campfire', 0, -1],
                  ['branches', -1, 0],
                ]) {
                  const entity = world.entities[id],
                    position = { ...point, x: point.x + dx, z: point.z + dz };
                  assert.equal(
                    canStand(
                      spatialMap(world),
                      { ...position, surfaceId },
                      BODY_PROFILES[entity.spatial.bodyProfileId],
                    ),
                    true,
                  );
                  setSpatialPosition(world, entity, position, surfaceId);
                  assert.equal(seesEntity(world, player, entity), true);
                  assert.equal(
                    canReachEntity(
                      world,
                      player,
                      entity,
                      Math.min(world.itemHandling.reach, BASE_ACTION_DEFAULTS.interactionRadius),
                    ),
                    true,
                  );
                }
                assert.equal(seesEntity(world, world.entities[NPC_ID], player), true);
                const fire = world.entities.campfire;
                assert.equal(fire.heat.lit, true);
                const authoredInitialFuel = fire.heat.fuelSeconds;
                fire.heat.fuelSeconds = 7200;
                assert.ok(
                  fire.heat.fuelSeconds + BASE_FIRE_CARE.fuel.secondsPerUnit <=
                    BASE_FIRE_CARE.fuel.maximumFuelSeconds,
                );
                const bagId = createItemLot(world, PLAYER_ID, 'woven_bag', 1);
                const knife = itemsForOwner(world, PLAYER_ID).find((item) => item.definitionId === 'knife');
                const wood = itemsForOwner(world, PLAYER_ID).find((item) => item.definitionId === 'wood');
                assert.equal(knife.quantity, 1);
                assert.equal(wood.quantity, 2);
                moveLot(world, knife.id, bagId, 1, 'camp-fixture-supplies');
                const branchId = moveLot(world, wood.id, bagId, 2, 'camp-fixture-supplies');
                const extra = createItemLot(world, PLAYER_ID, 'wood', 2);
                assert.equal(moveLot(world, extra, bagId, 2, 'camp-fixture-supplies'), branchId);
                const rawId = createItemLot(world, bagId, 'raw_meat', 2);
                return {
                  bagId,
                  knifeId: knife.id,
                  branchId,
                  rawId,
                  actorId: PLAYER_ID,
                  recipientId: NPC_ID,
                  authoredInitialFuel,
                  preparedInitialFuel: fire.heat.fuelSeconds,
                  fuelMaximum: BASE_FIRE_CARE.fuel.maximumFuelSeconds,
                  positions: [PLAYER_ID, NPC_ID, 'campfire', 'branches'].map((id) => ({
                    id,
                    position: worldPosition(world.entities[id]),
                    support: worldSupport(world.entities[id]),
                  })),
                };
              });
              const preparedDrop = cognition.domainCommand(
                { type: 'drop', itemId: seed.bagId, quantity: 1 },
                PLAYER_ID,
                'camp-fixture-ground-bag',
              );
              const drop = await game.service.transition((world) => executeCommand(world, preparedDrop));
              assert.equal(drop.ok, true, drop.message);
              const pileId = itemFor(game.service.world, seed.bagId).ownerId;
              assert.equal(game.service.world.entities[pileId].kind, 'item-pile');
              report.fixture = {
                ...seed,
                pileId,
                preparationCommand: preparedDrop,
                preparationOutcome: drop,
              };
              assert.equal(total(seed.bagId, 'wood'), 4);
              assert.equal(total(seed.bagId, 'raw_meat'), 2);
              assert.equal(total(PLAYER_ID, 'wood'), 0);
              assert.equal(total(PLAYER_ID, 'raw_meat'), 0);
              assert.equal(total(PLAYER_ID, 'cooked_meat'), 0);
              assert.equal(total(NPC_ID, 'cooked_meat'), 0);

              await (await nearbyRow(pileId)).click();
              await page
                .locator('#nearbyPanel')
                .getByRole('button', { name: /^Open / })
                .click();
              const ownSide = page.locator('[data-side="belongings"]'),
                otherSide = page.locator('[data-side="container"]');
              await otherSide.locator('[data-item-id="' + seed.bagId + '"]').click();
              await page
                .getByRole('dialog', { name: 'Woven bag actions and details', exact: true })
                .getByRole('button', { name: /^Open / })
                .click();
              await expect(otherSide.getByRole('heading', { name: 'Woven bag', exact: true })).toBeVisible();
              await expect(otherSide).toContainText('On the ground');
              const opened = await inventory(seed.bagId);
              assert.equal(opened.container.load, 7);
              assert.equal(opened.container.capacity, 24);
              report.openedStorage = {
                id: opened.container.id,
                location: opened.container.location,
                load: opened.container.load,
                capacity: opened.container.capacity,
              };

              async function transfer(label, fromId, toId, definitionId, quantity, keyboard = false) {
                await showPanel('inventory', 'Inventory');
                await expect(
                  otherSide.getByRole('heading', { name: 'Woven bag', exact: true }),
                ).toBeVisible();
                const from = await inventory(fromId),
                  to = await inventory(toId);
                const item = from.items.find(
                  (entry) => itemFor(game.service.world, entry.id)?.definitionId === definitionId,
                );
                assert.ok(item);
                const side = fromId === PLAYER_ID ? ownSide : otherSide;
                await side.locator('[data-item-id="' + item.id + '"]').click();
                const detail = page.getByRole('dialog', {
                  name: item.name + ' actions and details',
                  exact: true,
                });
                if (quantity < item.quantity) {
                  await detail.getByRole('button', { name: 'Move an amount…', exact: true }).click();
                  await detail.getByLabel('Quantity', { exact: true }).fill(String(quantity));
                }
                const submit = detail.getByRole('button', {
                  name: quantity < item.quantity ? 'Move amount' : /^Move to /,
                  exact: quantity < item.quantity,
                });
                const result = await act(
                  label,
                  {
                    type: 'transfer-item',
                    itemId: item.id,
                    quantity,
                    targetId: toId,
                    expectedRevision: item.revision,
                    placementRevision: item.placementRevision,
                    targetRevision: to.container.revision,
                  },
                  async () => {
                    if (keyboard) {
                      await submit.focus();
                      await expect(submit).toBeFocused();
                      await submit.press('Enter');
                    } else await submit.click();
                  },
                  keyboard ? 'keyboard Enter on the focused transfer button' : 'pointer click',
                );
                assert.equal(result.code, 'items-arranged');
                assert.equal(itemFor(game.service.world, result.itemId).ownerId, toId);
                await expect(detail).toBeHidden();
                await expect(

                  assert.equal(loaded.request.id, "before-load");
                  const restored = await entered(page, enterGame);
                  assert.equal(restored.saveTimeline, displayed.timeline);
                  assert.equal(restored.player.name, nameB);
                  await assertPerson(nameB);
                  assert.notEqual(restored.saveTimeline, timelineB);
                  assert.equal(restored.clock.paused, true);
                  assert.equal(restored.clock.pauseReason, "manual");
                  const replacementProtection = await repository.saves.read(
                    controlledActor.worldId,
                    "before-load",
                  );
                  assert.equal(
                    replacementProtection.state.world.entities[controlledActor.id].name,
                    nameA,
                  );
                  assert.equal(
                    (
                      await repository.getIntegration(
                        "load-request:" + loaded.request.requestId,
                      )
                    ).saveId,
                    "before-load",
                  );
                  report.finalRestore = {
                    timeline: restored.saveTimeline,
                    actorName: nameB,
                    protectedActorName: nameA,
                    paused: restored.clock.pauseReason,
                  };
                },
              );

              await step(
                "Read native Operations, maintenance and the same catalogue without entering play",
                async () => {
                  const menu = await showGame();
                  [operations] = await Promise.all([
                    context.waitForEvent("page"),
                    menu
                      .getByRole("link", {
                        name: "World operations · opens separately",
                        exact: true,
                      })
                      .click(),
                  ]);
                  watch(operations);
                  await expect(
                    operations.getByRole("tablist", {
                      name: "World operations tasks",
                      exact: true,
                    }),
                  ).toBeVisible();
                  const state = await nativeRead(operations, "/api/operations");
                  assert.equal(state.worldId, controlledActor.worldId);
                  assert.equal(state.actorId, controlledActor.id);
                  assert.equal(state.accountId, controlledActor.accountId);
                  assert.deepEqual([...state.capabilities].sort(), [
                    "create",
                    "inspect",
                    "manage-access",
                    "play",
                    "save",
                  ]);
                  assert.equal(state.overview, undefined);
                  await expect(
                    operations.getByText(
                      "This account has a character. Return to your character to play.",
                      { exact: true },
                    ),
                  ).toBeVisible();
                  await operations
                    .getByText("World and account details", { exact: true })
                    .click();
                  await expect(
                    operations.getByText("World: " + controlledActor.worldId, {
                      exact: true,
                    }),
                  ).toBeVisible();
                  await expect(
                    operations.getByText("Account: " + controlledActor.accountId, {
                      exact: true,
                    }),
                  ).toBeVisible();
                  const granted = operations.getByRole("list", {
                    name: "Granted operations",
                    exact: true,
                  });
                  await expect(granted).toBeVisible();
                  assert.deepEqual(
                    (await granted.getByRole("listitem").allTextContents())
                      .map((value) => value.trim())
                      .sort(),
                    [
                      "Play a character",
                      "Creator tools and maintenance",
                      "Inspect characters and diagnostics",
                      "Save and load the world",
                      "Invite people and manage access",
                    ].sort(),
                  );
                  assert.equal(state.clock.paused, true);
                  assert.equal(state.clock.pauseReason, "manual");
                  await operations
                    .getByRole("tab", { name: "Maintenance", exact: true })
                    .click();
                  await expect(
                    operations.getByText(
                      "Whole world · creator permission required · real dates and times",
                      { exact: true },
                    ),
                  ).toBeVisible();
                  await expect(
                    operations.getByText(
                      "only Mark ready and resume ends active maintenance",
                      { exact: false },
                    ),
                  ).toBeVisible();
                  assert.ok(
                    state.maintenance === null || state.maintenance === undefined,
                  );
                  await operations
                    .getByRole("tab", { name: "Checkpoints", exact: true })
                    .click();
                  await expect(
                    operations.getByRole("button", {
                      name: "Load " + checkpointLabel,
                      exact: true,
                    }),
                  ).toBeEnabled();
                  await expect(
                    operations.getByRole("button", {
                      name: "Load Before last load",
                      exact: true,
                    }),
                  ).toBeEnabled();
                  const ownRequests = requests.filter(
                    (entry) => entry.page === pageNames.get(operations),
                  );
                  assert.deepEqual(
                    ownRequests.filter((entry) =>
                      ["/api/embodiment", "/api/presence", "/api/events"].includes(
                        entry.path,
                      ),
                    ),
                    [],
                  );
                  report.operations = {
                    actorId: state.actorId,
                    worldId: state.worldId,
                    accountId: state.accountId,
                    capabilities: state.capabilities,
                    paused: state.clock.pauseReason,
                    requestsBeforeReturn: ownRequests,
                  };
                },
              );

              await step(
                "Use Return to your character after closing the original game page",
                async () => {
                  await page.close();
                  await operations
                    .getByRole("link", { name: "Return to your character", exact: true })
                    .click();
                  const returned = await entered(operations, enterGame);
                  assert.equal(returned.player.name, nameB);
                  await assertPerson(nameB);
                  assert.equal(returned.saveTimeline, report.finalRestore.timeline);
                  assert.equal(returned.clock.paused, true);
                  assert.equal(returned.clock.pauseReason, "manual");
                  const menu = await showGame(operations);
                  await expect(menu).toContainText("playing as " + nameB);
                  report.returned = {
                    actorId: returned.player.id,
                    worldId: returned.worldId,
                    timeline: returned.saveTimeline,
                    actorName: returned.player.name,
                    pauseReason: returned.clock.pauseReason,
                  };
                },
              );

              assert.equal(report.writes.length, 4);
              assert.equal(
                requests.filter((entry) => deliberatePaths.has(entry.path)).length,
                4,
              );
              assert.deepEqual(
                requests.filter((entry) =>
                  ["/api/command", "/api/control"].includes(entry.path),
                ),
                [],
              );
              assert.deepEqual(
                requests.filter(
                  (entry) =>
                    entry.path.startsWith("/api/maintenance/") && entry.method === "POST",
                ),
                [],
              );
              assert.deepEqual(report.pageErrors, []);
              assert.deepEqual(report.unexpectedRequests, []);
              report.nativeParticipation = requests.filter((entry) =>
                ["/api/embodiment", "/api/presence"].includes(entry.path),
              );
              report.passed = true;
            } catch (error) {
              report.failure = {
                message: errorText(error),
                stack: error instanceof Error ? error.stack : undefined,
              };
              report.passed = false;
            } finally {
              report.requests = requests;
              if (traceStarted) {
                try {
                  await context.tracing.stop({ path: join(output, "trace.zip") });
                  report.cleanup.trace = "saved";
                } catch (error) {
                  report.cleanup.traceError = errorText(error);
                  report.passed = false;
                }
              }
              try {
                await context?.close();
                report.cleanup.context = "closed or not created";
              } catch (error) {
                report.cleanup.contextError = errorText(error);
                report.passed = false;
              }
              if (game) {
                try {
                  report.cleanup.shutdown = await game.shutdown();
                  if (
                    !report.cleanup.shutdown.saved ||
                    report.cleanup.shutdown.problems.length
                  )
                    report.passed = false;
                } catch (error) {
                  report.cleanup.shutdownError = errorText(error);
                  report.passed = false;
                }
              }
              try {
                await repository?.close();
                report.cleanup.repository = "closed or not created";
              } catch (error) {
                report.cleanup.repositoryError = errorText(error);
                report.passed = false;
              }
              report.cleanup.sharedBrowser = "left with driver";
              report.cleanup.disposableDatabases =
                "final closeTestDatabases belongs to driver";
              report.finishedAt = new Date().toISOString();
              await writeFile(
                join(output, "report.json"),
                JSON.stringify(report, null, 2) + "\n",
              );
            }
            return report;
          }

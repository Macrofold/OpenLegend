name: Spatial world checks
on:
  push:
    branches: [feature/spatial-world-3d]
  pull_request:
    paths:
      - 'packages/**'
      - 'apps/**'
      - 'tests/browser/**'
      - 'tests/fixtures/**'
      - 'playwright.config.ts'
      - 'tsconfig*.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/spatial-check.yml'
permissions:
  contents: read
concurrency:
  group: spatial-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: openlegend
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openlegend -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      OPENLEGEND_TEST_DATABASE_URL: postgresql://openlegend:fixture@localhost:5432/postgres
      AI_BUDGET_USD: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # This focused gate supplements, not replaces, the repository's full check.
      - run: pnpm exec vitest run packages/spatial/src/spatial.test.ts packages/domain/src/spatial-world.test.ts apps/client/src/world-camera.test.ts apps/server/src/spatial-http.test.ts
      - id: playwright_install
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test tests/browser/spatial-world.spec.ts
        env:
          AI_BUDGET_USD: '0'
      # Preserve the original spatial evidence and failure while exercising the
      # existing interface journeys against their own disposable databases.
      - name: Check player and creator interfaces
        if: ${{ !cancelled() && steps.playwright_install.outcome == 'success' }}
        run: |
          task_dir="$RUNNER_TEMP/openlegend-time-observation"
          mkdir -p "$task_dir"
          cat > "$task_dir/prepare.mjs" <<'OL_TIME_FILE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import { createRequire } from 'node:module';
          import { fileURLToPath, pathToFileURL } from 'node:url';
          const root = process.cwd(), dir = path.dirname(fileURLToPath(import.meta.url));
          const req = createRequire(path.join(root, 'package.json'));
          const pins = JSON.parse(fs.readFileSync(path.join(dir, 'pins.json'), 'utf8'));
          const hash = (bytes) => crypto.createHash('sha256').update(bytes).digest('hex');
          for (const [file, expected] of Object.entries(pins.files)) if (hash(fs.readFileSync(path.join(root, file))) !== expected) throw new Error('Observation source mismatch: ' + file);
          if (['observed-client', 'ordinary-client', 'finished-observed-client', 'build-manifest.json'].some((name) => fs.existsSync(path.join(dir, name)))) throw new Error('Observation build path is not fresh');
          const source = fs.readFileSync(path.join(root, 'apps/client/src/scene.ts'), 'utf8');
          const appendix = fs.readFileSync(path.join(dir, 'scene-observer.js'), 'utf8');
          const once = (text, from, to) => { if (text.split(from).length !== 2) throw new Error('Nonunique scene anchor'); return text.replace(from, to); };
          let observed = once(source, '      this.app.start();', '      globalThis.__olTimeProbe?.attach(this);\n      this.app.start();');
          observed = once(observed, '  return new WildernessScene(canvas, callbacks);', '  const probe = globalThis.__olTimeProbe;\n  return probe ? probe.create(() => new WildernessScene(canvas, callbacks)) : new WildernessScene(canvas, callbacks);');
          observed = once(observed, '    const release = () => this.pendingFrames.delete(fence);', '    const observedFence = globalThis.__olTimeProbe?.fenceStarted(this);\n    const release = () => {\n      const deleted = this.pendingFrames.delete(fence);\n      globalThis.__olTimeProbe?.fenceSettled(this, observedFence);\n      return deleted;\n    };');
          observed += '\n' + appendix;
          const { build } = await import(pathToFileURL(req.resolve('vite')).href);
          await build({ configFile: path.join(root, 'apps/client/vite.config.ts'), build: { outDir: path.join(dir, 'observed-client'), emptyOutDir: false }, plugins: [{ name: 'time-observation-only', enforce: 'pre', transform(text, id) { if (id === path.join(root, 'apps/client/src/scene.ts')) return observed; } }] });
          const tree = (folder) => Object.fromEntries(fs.readdirSync(folder, { recursive: true, withFileTypes: true }).filter((e) => e.isFile()).map((e) => { const file = path.join(e.parentPath, e.name); return [path.relative(folder, file), hash(fs.readFileSync(file))]; }));
          fs.writeFileSync(path.join(dir, 'build-manifest.json'), JSON.stringify({ diagnostic: true, checkout: process.env.GITHUB_SHA, pins, sourceScene: hash(source), observedScene: hash(observed), instrumentation: Object.fromEntries(['prepare.mjs', 'observe.cjs', 'page-probe.cjs', 'scene-observer.js', 'restore.mjs', 'pins.json'].map((name) => [name, hash(fs.readFileSync(path.join(dir, name)))])), clientSource: tree(path.join(root, 'apps/client/src')), ordinaryClient: tree(path.join(root, 'dist/client')), observedClient: tree(path.join(dir, 'observed-client')) }, null, 2));
          OL_TIME_FILE
          cat > "$task_dir/restore.mjs" <<'OL_TIME_FILE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import { fileURLToPath } from 'node:url';
          const dir = path.dirname(fileURLToPath(import.meta.url)), root = process.cwd();
          const backup = path.join(dir, 'ordinary-client'), client = path.join(root, 'dist/client');
          const hadBackup = fs.existsSync(backup); let equal = null, fileCount = null;
          if (fs.existsSync(backup)) {
            if (fs.existsSync(client)) fs.renameSync(client, path.join(dir, 'finished-observed-client'));
            fs.renameSync(backup, client);
          }
          const manifest = path.join(dir, 'build-manifest.json');
          if (fs.existsSync(manifest)) {
            const expected = JSON.parse(fs.readFileSync(manifest, 'utf8')).ordinaryClient;
            const actual = Object.fromEntries(fs.readdirSync(client, { recursive: true, withFileTypes: true }).filter((e) => e.isFile()).map((e) => {
              const file = path.join(e.parentPath, e.name);
              return [path.relative(client, file), crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex')];
            }));
            equal = Object.keys(actual).length === Object.keys(expected).length && Object.entries(expected).every(([file, hash]) => actual[file] === hash);
            fileCount = Object.keys(actual).length;
          }
          const output = path.join(root, 'test-results/time-observation');
          const observations = fs.existsSync(output) ? fs.readdirSync(output).filter((name) => /^observation-[0-9]+\.json$/.test(name)).sort() : [];
          let instrumentation = observations.length === 1 ? 'one-observation-file' : 'incomplete';
          let issue = observations.length === 0 ? 'absent-observation-file' : observations.length > 1 ? 'multiple-observation-files' : null;
          let reportedTimeStatus = 'unknown';
          if (observations.length === 1) {
            try {
              const file = path.join(output, observations[0]);
              if (fs.statSync(file).size > 4 * 1024 * 1024) throw new Error('Oversized observation');
              const value = JSON.parse(fs.readFileSync(file, 'utf8'));
              if (['passed', 'failed', 'timedOut', 'skipped', 'interrupted'].includes(value.status)) reportedTimeStatus = value.status;
              else throw new Error('Unknown observation status');
            } catch { instrumentation = 'incomplete'; issue = 'unreadable-observation-file'; }
          }
          const stepExitStatus = /^[0-9]+$/.test(process.argv[2] ?? '') ? Number(process.argv[2]) : null;
          fs.writeFileSync(path.join(dir, 'restore.json'), JSON.stringify({ restoredOrdinaryBytes: equal, files: fileCount, hadBackup,
            instrumentation: { status: instrumentation, issue, observationFileCount: observations.length, files: observations },
            reportedTimeStatus, stepExitStatus, exitScope: 'Existing interface step including preparation; Time-specific status is reported separately.',
            completeness: 'One file does not by itself prove sufficient timings or passing native acceptance.' }));
          if (equal === false || (hadBackup && equal === null)) throw new Error('Ordinary client restoration could not be verified');
          OL_TIME_FILE
          cat > "$task_dir/observe.cjs" <<'OL_TIME_FILE'
          // Temporary preload for the exact existing native Time case; no test or production edits.
          const fs = require('node:fs'), path = require('node:path'), crypto = require('node:crypto');
          const { createRequire } = require('node:module');
          const root = process.cwd(), dir = __dirname, req = createRequire(path.join(root, 'package.json'));
          const pw = path.dirname(createRequire(req.resolve('@playwright/test')).resolve('playwright/package.json'));
          const core = path.dirname(createRequire(path.join(pw, 'package.json')).resolve('playwright-core/package.json'));
          const pins = JSON.parse(fs.readFileSync(path.join(dir, 'pins.json'), 'utf8'));
          const hash = (file) => crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          for (const [file, expected] of Object.entries(pins.files)) if (hash(path.join(root, file)) !== expected) throw new Error('Time observation source mismatch: ' + file);
          for (const [file, expected] of Object.entries(pins.playwright)) {
            const base = file.startsWith('core/') ? core : pw;
            if (hash(path.join(base, file.slice(file.indexOf('/') + 1))) !== expected) throw new Error('Time observation pinned dependency mismatch: ' + file);
          }
          const { BrowserContext } = require(path.join(core, 'lib/server/browserContext.js'));
          const { CRConnection } = require(path.join(core, 'lib/server/chromium/crConnection.js'));
          const { TestInfoImpl } = require(path.join(pw, 'lib/worker/testInfo.js'));
          const { currentTestInfo } = require(path.join(pw, 'lib/common/globals.js'));
          const { monotonicTime, timeOrigin } = require(path.join(core, 'lib/utils/isomorphic/time.js'));
          const install = require('./page-probe.cjs');
          const title = 'time settings persist with sole-tab entry, explicit transfer, logout and manual world pause';
          const output = process.env.OL_TIME_OUTPUT, rows = [], pending = new Map(), sessions = new Map();
          let info, active = false, timer, stopped, dropped = 0, protocolPendingDropped = 0, malformed = 0, swaps = 0;
          const methods = new Set(['Page.getLayoutMetrics', 'Page.captureScreenshot', 'Runtime.callFunctionOn', 'Runtime.evaluate', 'Input.dispatchMouseEvent', 'Input.dispatchKeyEvent', 'Page.navigate', 'Page.reload', 'Page.close']);
          const matches = (test) => test?.title === title && test.file.replaceAll('\\', '/').endsWith('/tests/browser/time.spec.ts');
          const label = (connection, session) => {
            if (!connection.__olLabel) connection.__olLabel = sessions.size + 1;
            const key = connection.__olLabel + ':' + session;
            if (!sessions.has(key)) sessions.set(key, 'session-' + (sessions.size + 1));
            return sessions.get(key);
          };
          const add = (row) => { if (rows.length < 4096) rows.push(row); else dropped++; };
          const stop = (reason) => { if (!stopped) stopped = { reason, at: monotonicTime() }; active = false; clearTimeout(timer); };
          const flush = (reason) => {
            if (!info || !output) return;
            fs.mkdirSync(output, { recursive: true });
            fs.writeFileSync(path.join(output, 'observation-' + process.pid + '.json'), JSON.stringify({ diagnostic: true, status: info.status, originalTimeout: info.timeout, origin: timeOrigin(), begin: info._startTime, stopped, flush: reason, dropped, protocolPendingDropped, malformed, swaps, pending: [...pending.values()], rows }));
          };
          const step = TestInfoImpl.prototype._runAsStep;
          TestInfoImpl.prototype._runAsStep = function (data, ...args) {
            if (matches(this) && data.title === 'Before Hooks') {
              if (info) throw new Error('Only one Time observation is permitted');
              info = this; if (this.timeout !== 60000) throw new Error('Original Time deadline changed');
              const ordinary = path.join(dir, 'ordinary-client');
              if (fs.existsSync(ordinary)) throw new Error('Observation backup already exists');
              fs.renameSync(path.join(root, 'dist/client'), ordinary);
              fs.renameSync(path.join(dir, 'observed-client'), path.join(root, 'dist/client')); swaps++;
              active = true; timer = setTimeout(() => stop('original-deadline'), Math.max(0, this._startTime + this.timeout - monotonicTime())); timer.unref();
            }
            if (this === info && data.title === 'After Hooks') { stop('after-hooks'); flush('after-hooks'); }
            return step.call(this, data, ...args);
          };
          const initialize = BrowserContext.prototype._initialize;
          BrowserContext.prototype._initialize = async function (...args) {
            await initialize.apply(this, args);
            if (active && currentTestInfo() === info) {
              const deadline = timeOrigin() + info._startTime + info.timeout;
              await this.addInitScript(undefined, '(' + install.toString() + ')(' + deadline + ')');
              this.once(BrowserContext.Events.Close, () => flush('context-close'));
            }
          };
          const send = CRConnection.prototype._rawSend, receive = CRConnection.prototype._onMessage;
          CRConnection.prototype._rawSend = function (session, method, params) {
            if (active && monotonicTime() >= info._startTime + info.timeout) stop('original-deadline');
            if (!active) return send.call(this, session, method, params);
            const at = monotonicTime(), id = send.call(this, session, method, params);
            if (active && methods.has(method)) {
              if (pending.size >= 512) protocolPendingDropped++;
              else {
                const tag = label(this, session), key = tag + ':' + id;
                const row = { type: 'protocol', phase: 'send', session: tag, id, method, at };
                pending.set(key, row); add(row);
              }
            }
            return id;
          };
          CRConnection.prototype._onMessage = function (message) {
            if (info) {
              const tag = label(this, message.sessionId || ''), key = tag + ':' + message.id;
              const started = pending.get(key);
              if (started) {
                pending.delete(key); add({ type: 'protocol', phase: 'return', session: tag, id: message.id, method: started.method, at: monotonicTime(), duration: monotonicTime() - started.at, failed: !!message.error, late: !active });
              } else if ((active || (stopped && monotonicTime() - stopped.at < 10000)) && message.method === 'Runtime.consoleAPICalled') {
                const value = message.params?.args?.[0]?.value, prefix = 'OL_TIME_OBSERVATION ';
                if (typeof value === 'string' && value.startsWith(prefix) && value.length <= 2048) {
                  try {
                    const row = JSON.parse(value.slice(prefix.length)), safe = {};
                    const numeric = ['origin', 'at', 'duration', 'width', 'height', 'scene', 'revision', 'pending', 'draws', 'waitId', 'records', 'dropped', 'entities', 'entityMs', 'released', 'releaseMs', 'updates', 'updateMs', 'updateMax'];
                    const words = new Set(['document', 'input', 'longtask', 'app', 'fence-start', 'fence-settled', 'pagehide', 'truncated', 'create', 'render', 'setView', 'buildLandscape', 'makeEntity', 'releaseEntity', 'update', 'destroy', 'pointerdown', 'pointerup', 'click', 'Time settings', 'Resume world', 'Pause world', 'Resume Here', 'Log Out', 'Sign in', 'other']);
                    for (const key of numeric) if (Number.isFinite(row[key])) safe[key] = row[key];
                    for (const key of ['type', 'name', 'event', 'control']) if (words.has(row[key])) safe[key] = row[key];
                    for (const key of ['failed', 'suspended']) if (typeof row[key] === 'boolean') safe[key] = row[key];
                    const cutoff = timeOrigin() + Math.min(info._startTime + info.timeout, stopped?.at ?? Infinity);
                    if (safe.type && Number.isFinite(safe.origin) && Number.isFinite(safe.at) && safe.origin + safe.at < cutoff) add({ channel: 'app-observation', session: tag, received: monotonicTime(), ...safe });
                    else malformed++;
                  } catch { malformed++; }
                }
              }
            }
            return receive.call(this, message);
          };
          process.once('exit', () => { stop('worker-exit'); flush('worker-exit'); });
          OL_TIME_FILE
          cat > "$task_dir/page-probe.cjs" <<'OL_TIME_FILE'
          module.exports = function installTimeProbe(deadline) {
            if (window.top !== window || globalThis.__olTimeProbe) return;
            const origin = performance.timeOrigin, prefix = 'OL_TIME_OBSERVATION ', max = 1400;
            const debug = console.debug.bind(console); let count = 0, dropped = 0;
            const emit = (type, fields = {}) => {
              const at = fields.at ?? performance.now();
              if (origin + at >= deadline) return;
              if (count >= max) { dropped++; return; }
              // Reserve the last permitted record for explicit truncation; dropped is a lower bound.
              if (count === max - 1) { type = 'truncated'; fields = { records: count, dropped: ++dropped }; }
              count++;
              try { debug(prefix + JSON.stringify({ type, origin, at, ...fields })); } catch { /* Observation cannot fail an owner. */ }
            };
            const probe = { emit, alive: () => origin + performance.now() < deadline };
            Object.defineProperty(globalThis, '__olTimeProbe', { value: probe });
            emit('document', { width: innerWidth, height: innerHeight });
            const names = new Set(['Time settings', 'Resume world', 'Pause world', 'Resume Here', 'Log Out', 'Sign in']);
            const input = (e) => {
              if (!probe.alive()) return;
              const el = e.target instanceof Element ? e.target.closest('button,a,input') : null;
              const label = el?.getAttribute('aria-label') || el?.textContent?.trim();
              emit('input', { event: e.type, control: names.has(label) ? label : 'other' });
            };
            for (const event of ['pointerdown', 'pointerup', 'click']) window.addEventListener(event, input, true);
            let observer;
            if (PerformanceObserver.supportedEntryTypes.includes('longtask')) {
              observer = new PerformanceObserver((list) => { for (const e of list.getEntries()) emit('longtask', { at: e.startTime, duration: e.duration }); });
              observer.observe({ type: 'longtask', buffered: true });
            }
            window.addEventListener('pagehide', () => {
              emit('pagehide', { records: count, dropped }); observer?.disconnect();
              for (const event of ['pointerdown', 'pointerup', 'click']) window.removeEventListener(event, input, true);
            }, { once: true });
          };
          OL_TIME_FILE
          cat > "$task_dir/scene-observer.js" <<'OL_TIME_FILE'
          // Appended only to a scratch build; dormant without the Time context init script.
          if (globalThis.__olTimeProbe) {
            const p = globalThis.__olTimeProbe, seen = new WeakMap(), totals = new WeakMap(); let nextScene = 0;
            const stats = (scene) => { if (!totals.has(scene)) totals.set(scene, { entities: 0, entityMs: 0, released: 0, releaseMs: 0, updates: 0, updateMs: 0, updateMax: 0 }); return totals.get(scene); };
            const id = (scene) => { if (!seen.has(scene)) seen.set(scene, ++nextScene); return seen.get(scene); };
            const span = (name, scene, at, extra = {}) => p.emit('app', { name, scene: id(scene), at, duration: performance.now() - at, ...extra });
            p.create = (create) => {
              const at = performance.now(); let result;
              try { result = create(); return result; }
              finally { p.emit('app', { name: 'create', scene: result ? id(result) : 0, at, duration: performance.now() - at }); }
            };
            p.attach = (scene) => {
              const app = scene.app, device = app.graphicsDevice;
              if (app.__olObserved) return;
              app.__olObserved = true;
              const render = app.render;
              app.render = function (...args) {
                if (!p.alive()) return render.apply(this, args);
                const at = performance.now();
                try { return render.apply(this, args); }
                finally { span('render', scene, at, { pending: scene.pendingFrames.size, suspended: scene.suspended, revision: scene.view?.revision ?? -1, draws: device._drawCallsPerFrame, ...stats(scene) }); }
              };

            };
            let nextWait = 0;
            p.fenceStarted = (scene) => {
              if (!p.alive()) return;
              const record = { waitId: ++nextWait, at: performance.now() };
              p.emit('fence-start', { scene: id(scene), ...record, pending: scene.pendingFrames.size });
              return record;
            };
            p.fenceSettled = (scene, record) => {
              if (record) p.emit('fence-settled', { scene: id(scene), ...record, duration: performance.now() - record.at, pending: scene.pendingFrames.size });
            };
            for (const name of ['setView', 'buildLandscape', 'makeEntity', 'releaseEntity', 'update', 'destroy']) {
              const original = WildernessScene.prototype[name];
              WildernessScene.prototype[name] = function (...args) {
                if (!p.alive()) return original.apply(this, args);
                const at = performance.now();
                try { return original.apply(this, args); }
                finally {
                  const duration = performance.now() - at, sum = stats(this);
                  if (name === 'makeEntity') { sum.entities++; sum.entityMs += duration; }
                  if (name === 'releaseEntity') { sum.released++; sum.releaseMs += duration; }
                  if (name === 'update') { sum.updates++; sum.updateMs += duration; sum.updateMax = Math.max(sum.updateMax, duration); }
                  if (!['update', 'makeEntity', 'releaseEntity'].includes(name) || duration >= 20)
                    span(name, this, at, { revision: name === 'setView' ? args[0].revision : this.view?.revision ?? -1 });
                }
              };
            }
          }
          OL_TIME_FILE
          cat > "$task_dir/pins.json" <<'OL_TIME_FILE'
          {
            "files": {
              "tests/browser/time.spec.ts": "c13cb11e58ca7af8d4f2b806876f0696dfb3c1d9cf54ddbcf5d6eb5da97801e1",
              "tests/fixtures/browser.ts": "61673a8e30aa3431bc91a4f1149778ef7da26c68cd827541048478b6c59f38b2",
              "playwright.config.ts": "d9c9391fafc2f2501930f742e319725d46bc1b5b46408948b444560baf88168a",
              "apps/client/src/scene.ts": "f366535f8b5553abb5b8c6bbbfd9f6ad85a7ddc3f906c8130497dc21bd687481",
              "apps/client/src/world-renderer.ts": "f3d52217c0ccd1cbc0fa9acf543103c5adf28996be362a40e64edf412ca34ec0",
              "apps/client/src/main.tsx": "296b534de3dc4cae81ed731bda03f9a26d9d6de6d5b627d9c801049d3b775b00",
              "apps/client/src/tab-control.ts": "3b967c36211861e083adbb788ac65c6ae78542715a3437b42aa5ed7c03b44c72",
              "apps/client/src/tab-session.ts": "0d5af0e21acbd0eadd539c51552901c13a7587a12a66c6175267410266b6d1b3",
              "apps/client/src/api.ts": "c0f246d8187c84508c91c7015a878950dfceefba82f422f2675e3877583ccc1e",
              "pnpm-lock.yaml": "99592e42db86ec571dbb8694db84df34e166ab5bfae55f0feeb0081de25b8a41",
              "apps/client/vite.config.ts": "090f0368e53945b4aa306ecbd982ac8ce57f4701b93be464d42eb4b6875a3cf1"
            },
            "playwright": {
              "core/lib/server/chromium/crConnection.js": "0d41a058ad1f5c897329a9c821c52b952e0e709ab38c3e6e355224b167922f13",
              "core/lib/server/browserContext.js": "2e3cc0b77b6fc4c47a7abbb142f2c037baaf7c7ba003840d0aadc210a9ba81ff",
              "core/lib/utils/isomorphic/time.js": "0eebe61ffd113084f595545209536b7b354bff04faa0f8a7e0ab29ebc5fcc179",
              "runner/lib/worker/testInfo.js": "4b5b18dc41e80934c8b627afcb93592baf8f17d6a710334c8a9223a3c935a8b9",
              "runner/lib/common/globals.js": "f5922eb1fb6051900157492eb9c218e62d07378eed135bca4b2f173ed1184d1c",
              "runner/lib/worker/workerMain.js": "1cd04668c4bf6bb49e60fe6c28531c5b2cf68a4bf02752a05d21a5d6e6fffd42",
              "core/lib/server/chromium/crPage.js": "08f14f9abc4bde5b36a0679889de05e8c3c0ebbf7e15c3bafc3639830e01c174"
            }
          }
          OL_TIME_FILE
          restore_time_observation() {
            test_status=$?
            trap - EXIT
            if node "$task_dir/restore.mjs" "$test_status"; then restore_status=0; else restore_status=$?; fi
            mkdir -p test-results/time-observation
            for name in prepare.mjs restore.mjs observe.cjs page-probe.cjs scene-observer.js pins.json build-manifest.json restore.json; do
              if [ -f "$task_dir/$name" ]; then cp "$task_dir/$name" test-results/time-observation/; fi
            done
            if [ "$test_status" -ne 0 ]; then exit "$test_status"; fi
            exit "$restore_status"
          }
          trap restore_time_observation EXIT
          node "$task_dir/prepare.mjs"
          OL_TIME_OUTPUT="$PWD/test-results/time-observation" \
          NODE_OPTIONS="${NODE_OPTIONS:+$NODE_OPTIONS }--require=$task_dir/observe.cjs" \
          pnpm exec playwright test \
            tests/browser/actions.spec.ts \
            tests/browser/camera.spec.ts \
            tests/browser/conversation-ui.spec.ts \
            tests/browser/design-system.spec.ts \
            tests/browser/god-editor.spec.ts \
            tests/browser/time.spec.ts \
            --output test-results/interface
      # One finite native continuation; remove after its requested evidence is retained.
      # Passed inventory, alternate-world and creator mutation results are reused.
      - name: Exercise native camp and object care recovery
        if: ${{ !cancelled() && steps.playwright_install.outcome == 'success' }}
        timeout-minutes: 6
        run: |
          task_dir="$RUNNER_TEMP/openlegend-whole-ui"
          mkdir -p "$task_dir"
          cat > "$task_dir/camp-stage.mjs" <<'OPENLEGEND_WHOLE_UI_0'
          // One finite scratch continuation, imported from an existing CI checkout with --import tsx.
          // Root owns Chromium, the hard CI deadline, build identity and final closeTestDatabases().
          // This stage owns one disposable native host and one ordinary App browser context.
          // It is not a test-runner case, a provider fixture or a permanent verification framework.
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { mkdir, readFile, writeFile } from 'node:fs/promises';
          import { createRequire } from 'node:module';
          import { join, resolve } from 'node:path';
          import { pathToFileURL } from 'node:url';

          export async function runCampStage({ browser, outputDirectory }) {
            const output = join(outputDirectory, 'camp');
            await mkdir(output, { recursive: true });
            const report = {
              startedAt: new Date().toISOString(),
              checkout: process.env.GITHUB_SHA ?? 'unrecorded-checkout',
              browser: browser.version(),
              node: process.version,
              scope:
                'One native base-world storage/equipment/gather/fire/cook/food-offer/conversation-boundary/return journey; J16 composition and supplied J14 decisions.',
              limitations: [
                'No generated speech, reply or autonomous recipient-decision quality.',
                'No complete J13/J14/J16 acceptance: positive conversation, expiry, changed access and broader recovery remain open.',
                'No approach walking, alternative recipes, broad inventory matrix, human IME, assistive-device or uncoached-usability claim.',
                'The installed knife is equipped; ordinary gathering uses its native two-unit batch, with no claimed knife gathering bonus.',
                'Fixture positions, camp supplies and partly burned initial fuel are prepared after real App entry; NPC decline/accept are explicit supplied native decisions.',
                'Six finite time amounts are offered once to the native clock, with zero-time drains for retained navigation debt; this does not qualify wall-clock pacing.',
                'The food cell is deliberately scrolled fully into view before opening. The earlier popover detach remains recorded; delayed ancestor-scroll dismissal is a hypothesis, not an established fix.',
              ],
              providerBudgetUsd: 0,
              providerCalls: null,
              commandObservations: [],
              nativeProgress: [],
              suppliedDecisions: [],
              captures: [],
              foodOfferObservation: null,
              pageErrors: [],
              unexpectedRequests: [],
              cleanup: { finalDatabaseDrop: 'Owned by the root driver through closeTestDatabases().' },
              passed: false,
            };
            let game, store, context, page, base, authorityHeaders;
            let entered = false,
              traceStarted = false;
            let foodOfferObserverStarted = false;
            const commandRequests = [],
              destinationRequests = [],
              providerRequests = [];
            const errorText = (error) => (error instanceof Error ? error.message : String(error));
            const nativeImport = (path) => import(pathToFileURL(resolve(path)).href);
            async function finishFoodOfferObservation() {
              if (!foodOfferObserverStarted || report.foodOfferObservation || !page || page.isClosed())
                return;
              try {
                report.foodOfferObservation = await page.evaluate(() => {
                  const result = window.__campFoodOfferObservation?.();
                  delete window.__campFoodOfferObservation;
                  return result;
                });
              } catch (error) {
                report.foodOfferObservation = { unavailable: errorText(error) };
              }
            }

            try {
              const { expect } = createRequire(resolve('package.json'))('@playwright/test');
              const [
                http,
                database,
                fixture,
                entry,
                domain,
                spatialState,
                spatial,
                cognition,
                handover,
                baseActions,
                language,
              ] = await Promise.all([
                nativeImport('apps/server/src/http.ts'),
                nativeImport('tests/fixtures/database.ts'),
                nativeImport('tests/fixtures/service.ts'),
                nativeImport('tests/fixtures/browser.ts'),
                nativeImport('packages/domain/src/index.ts'),
                nativeImport('packages/domain/src/spatial-state.ts'),
                nativeImport('packages/spatial/src/index.ts'),
                nativeImport('apps/server/src/cognition.ts'),
                nativeImport('apps/server/src/handover-actions.ts'),
                nativeImport('packages/domain/src/worlds/base/actions.ts'),
                nativeImport('packages/language/src/index.ts'),
              ]);
              const {
                PLAYER_ID,
                NPC_ID,
                createItemLot,
                moveLot,
                itemsForOwner,
                inventoryFor,
                itemFor,
                seesEntity,
                canReachEntity,
                executeCommand,
                BASE_FIRE_CARE,
              } = domain;
              const { worldPosition, worldSupport, setSpatialPosition, spatialMap } = spatialState;
              const { BODY_PROFILES, canStand } = spatial;
              const { BASE_ACTION_DEFAULTS, BASE_GATHER_QUANTITY } = baseActions;
              const { namePhrase } = language;
              const sourcePaths = [
                'apps/server/src/http.ts',
                'apps/server/src/inventory-view.ts',
                'apps/server/src/action-catalogue.ts',
                'apps/server/src/fire-actions.ts',
                'apps/server/src/handover-actions.ts',
                'apps/server/src/cognition.ts',
                'apps/client/src/main.tsx',
                'apps/client/src/ui/inventory.tsx',
                'apps/client/src/ui/inventory-offer.tsx',
                'apps/client/src/ui/composer.tsx',
                'apps/client/src/ui/world-events.tsx',
                'packages/domain/src/kernel.ts',
                'packages/domain/src/handover.ts',
                'packages/domain/src/worlds/base/fire.ts',
                'packages/domain/src/worlds/base/actions.ts',
                'tests/fixtures/service.ts',
              ];
              report.sha256 = Object.fromEntries(
                await Promise.all(
                  sourcePaths.map(async (path) => [
                    path,
                    createHash('sha256')
                      .update(await readFile(resolve(path)))
                      .digest('hex'),
                  ]),
                ),
              );
              report.scriptSha256 = createHash('sha256')
                .update(await readFile(new URL(import.meta.url)))
                .digest('hex');

              const fixedNow = Date.now();
              const config = database.readConfig({
                WORLD_SEED: '73',
                AI_BUDGET_USD: '0',
                OPEN_LEGEND_GOD_MODE: 'false',
                OPEN_LEGEND_AUTH_MODE: 'local',
              });
              assert.equal(config.budgetUsd, 0);
              assert.equal(config.godMode, false);
              for (const key of [
                'jevKey',
                'llmKey',
                'embeddingKey',
                'macrofoldKey',
                'macrofoldProviderConnectionId',
                'macrofoldJevConnectionId',
                'macrofoldWorldConnectionId',
              ])
                assert.equal(config[key], '', 'Fixture must not inherit provider configuration: ' + key);
              store = await database.testRepository();
              game = await http.createGameServer({
                config,
                store,
                production: true,
                tick: false,
                now: () => fixedNow,
              });
              await new Promise((resolve) => game.server.listen(0, '127.0.0.1', resolve));
              const address = game.server.address();
              assert.ok(address && typeof address !== 'string');
              base = 'http://127.0.0.1:' + address.port;
              context = await browser.newContext({ viewport: { width: 1440, height: 960 } });
              await context.tracing.start({ screenshots: false, snapshots: true, sources: true });
              traceStarted = true;
              page = await context.newPage();
              page.setDefaultTimeout(10_000);
              page.setDefaultNavigationTimeout(20_000);
              page.on('pageerror', (error) => report.pageErrors.push(error.message));
              page.on('request', (request) => {
                const url = new URL(request.url());
                if (url.origin !== base && !['data:', 'blob:'].includes(url.protocol))
                  report.unexpectedRequests.push(url.origin + url.pathname);
                if (
                  request.method() === 'POST' &&
                  /^\/api\/(?:chat(?:\/|$)|invent(?:\/|$)|inventions\/submit|world-agent\/.*(?:messages|start|apply))/.test(
                    url.pathname,
                  )
                )
                  providerRequests.push(url.pathname);
                if (/^\/api\/god(?:\/|$)/.test(url.pathname)) report.unexpectedRequests.push(url.pathname);
                if (url.pathname === '/api/command') commandRequests.push(request.postDataJSON());
                if (url.pathname === '/api/inventory/destinations')
                  destinationRequests.push(request.postDataJSON());
                const headers = request.headers();
                if (entered && headers['x-ol-client'] && headers['x-ol-scope']) {
                  const captured = {
                    Origin: base,
                    'X-OL-Client': headers['x-ol-client'],
                    'X-OL-Scope': headers['x-ol-scope'],
                  };
                  if (
                    authorityHeaders &&
                    (authorityHeaders['X-OL-Client'] !== captured['X-OL-Client'] ||
                      authorityHeaders['X-OL-Scope'] !== captured['X-OL-Scope'])
                  )
                    report.unexpectedRequests.push('The sole browser authority changed during camp.');
                  authorityHeaders = captured;
                }
              });
              await page.goto(base + '/auth/login');
              await entry.enterGame(page);
              await expect(page.locator('#world')).toHaveAttribute('data-ready', 'true');
              assert.equal(game.service.paused, false, 'Real App entry must precede fixture preparation');
              entered = true;

              const total = (ownerId, definitionId) =>
                itemsForOwner(game.service.world, ownerId)
                  .filter((item) => item.definitionId === definitionId)
                  .reduce((sum, item) => sum + item.quantity, 0);
              const lot = (ownerId, definitionId) => {
                const found = itemsForOwner(game.service.world, ownerId).filter(
                  (item) => item.definitionId === definitionId,
                );
                assert.equal(found.length, 1, 'This small fixture expects one exact lot of ' + definitionId);
                return found[0];
              };
              const custody = () =>
                [PLAYER_ID, seed.bagId, NPC_ID].map((id) => ({
                  id,
                  revision: game.service.world.entities[id].inventoryRevision ?? 0,
                  items: itemsForOwner(game.service.world, id)
                    .map((item) => ({
                      id: item.id,
                      ownerId: item.ownerId,
                      quantity: item.quantity,
                      revision: item.revision,
                      placementRevision: item.placementRevision,
                    }))
                    .sort((a, b) => a.id.localeCompare(b.id)),
                }));
              async function readOnly(path, body) {
                assert.ok(authorityHeaders, 'Read only with authority captured from the actual App');
                const response =
                  body === undefined
                    ? await page.request.get(base + path, { headers: authorityHeaders, timeout: 10_000 })
                    : await page.request.post(base + path, {
                        headers: authorityHeaders,
                        data: body,
                        timeout: 10_000,
                      });
                assert.equal(response.status(), 200, 'Native read: ' + path);
                return response.json();
              }
              async function state() {
                const view = await readOnly('/api/state');
                assert.equal(view.player.id, PLAYER_ID);
                assert.equal(view.worldId, 'wilderness-73');
                assert.equal(view.access.controlling, true);
                assert.equal(view.godMode, false);
                assert.equal(view.clock.paused, false);
                return view;
              }
              async function inventory(containerId) {
                const value = await readOnly('/api/inventory', { containerId });
                assert.equal(value.ok, true);
                assert.equal(value.container.id, containerId);
                assert.equal(value.next, undefined, 'The small camp fixture fits one native contents page');
                return value;
              }
              async function act(label, expected, gesture, input = 'pointer click') {
                const before = commandRequests.length;
                const [response] = await Promise.all([
                  page.waitForResponse((entry) => new URL(entry.url()).pathname === '/api/command'),
                  gesture(),
                ]);
                assert.equal(response.status(), 200);
                const request = response.request(),
                  body = request.postDataJSON(),
                  result = await response.json();
                assert.equal(commandRequests.length, before + 1, label + ' sends one command');
                for (const [key, value] of Object.entries(expected))
                  assert.deepEqual(body.command[key], value, label + ': ' + key);
                const headers = await request.allHeaders();
                assert.equal(headers['x-ol-client'], authorityHeaders['X-OL-Client']);
                assert.equal(headers['x-ol-scope'], authorityHeaders['X-OL-Scope']);
                const receipt = await readOnly('/api/command/receipt', body);
                assert.equal(receipt.status, 'resolved');
                for (const key of ['ok', 'code', 'message', 'itemId', 'actionId'])
                  assert.deepEqual(receipt.result[key], result[key]);
                report.commandObservations.push({
                  label,
                  input,
                  request: body,
                  result: Object.fromEntries(
                    ['ok', 'code', 'message', 'itemId', 'actionId'].map((key) => [key, result[key]]),
                  ),
                  receiptStatus: receipt.status,
                });
                assert.equal(result.ok, true, label + ': ' + result.message);
                return result;
              }
              async function showPanel(id, label) {
                const panel = page.locator('#' + id + 'Panel');
                if (!(await panel.isVisible()))
                  await page.getByRole('button', { name: label, exact: true }).click();
                await expect(panel).toBeVisible();
                return panel;
              }
              async function hidePanel(id) {
                const panel = page.locator('#' + id + 'Panel');
                if (await panel.isVisible()) await panel.getByRole('button', { name: /^Hide / }).click();
              }
              async function nearbyRow(id) {
                const panel = await showPanel('nearby', 'In view');
                const back = panel.getByRole('button', { name: 'Back to In view', exact: true });
                if (await back.isVisible()) await back.click();
                const row = panel.locator('[data-entity="' + id + '"]').getByRole('button');
                await expect(row).toBeVisible();
                return row;
              }
              async function choice(targetId, actionId) {
                await hidePanel('inventory');
                await (await nearbyRow(targetId)).click({ button: 'right' });
                const menu = page.locator('#contextMenu');
                const row = menu.locator('[data-catalogue-action="' + actionId + '"]');
                await expect(row).toHaveAttribute('aria-disabled', 'false');
                return { menu, row };
              }
              async function capture(name) {
                assert.ok(report.captures.length < 4);
                await page.screenshot({ path: join(output, name) });
                report.captures.push(name);
              }
              async function advance(label, seconds, actionId, partial = false) {
                // Preserve the actual NavigationCoordinator. An admitted finite amount is offered
                // once; zero-time ticks only drain its retained debt after technical work settles.
                await expect.poll(() => domain.navigationBlocked(game.service.world)).toBe(false);
                const before = game.service.world.simTime;
                const target = before + seconds;
                await game.service.tick(seconds / (config.baseRatio * game.service.speed), 0);
                await expect
                  .poll(async () => {
                    await game.service.tick(0, 0);
                    return Math.abs(game.service.world.simTime - target) < 1e-6;
                  })
                  .toBe(true);
                assert.ok(
                  Math.abs(game.service.world.simTime - target) < 1e-6,
                  label + ' advances its declared game time',
                );
                const view = await state();
                if (partial) {
                  assert.equal(view.player.action.id, actionId);
                  assert.ok(view.player.action.progress > 0 && view.player.action.progress < 1);
                  assert.equal(view.player.action.advancing, true);
                  await expect(page.locator('.ol-current-work')).toContainText(view.player.action.label);
                } else {
                  assert.equal(game.service.world.entities[PLAYER_ID].actor.action, null);
                  assert.equal(view.player.action, null);
                  await expect(page.locator('.ol-current-work')).toBeHidden();
                }
                report.nativeProgress.push({
                  label,
                  seconds,
                  before,
                  after: game.service.world.simTime,
                  action: view.player.action,
                });
              }
              function active(type, result, seconds) {
                const action = game.service.world.entities[PLAYER_ID].actor.action;
                assert.equal(action.id, result.actionId);
                assert.equal(action.type, type);
                assert.equal(
                  action.stage,
                  'working',
                  'Prepared positions must avoid an unqualified approach',
                );
                assert.equal(action.totalSeconds, seconds);
                assert.equal(action.remainingSeconds, seconds);
                return action;
              }
              function completion(type, targetId) {
                const events = game.service.world.events.filter(
                  (event) =>
                    event.type === type && event.actorId === PLAYER_ID && event.targetId === targetId,
                );
                assert.equal(events.length, 1, 'One native ' + type + ' event');
                return events[0];
              }

              // Existing immutable fixture construction prepares a valid scene, not world laws.
              const seed = await fixture.editWorld(game.service, (world) => {
                assert.equal(world.itemDefinitions.woven_bag.container.capacity, 24);
                assert.equal(world.entities[PLAYER_ID].actor.equippedItemId, null);
                const player = world.entities[PLAYER_ID],
                  point = worldPosition(player),
                  surfaceId = worldSupport(player);
                assert.ok(surfaceId);
                for (const [id, dx, dz] of [
                  [NPC_ID, 1, 0],
                  ['campfire', 0, -1],
                  ['branches', -1, 0],
                ]) {
                  const entity = world.entities[id],
                    position = { ...point, x: point.x + dx, z: point.z + dz };
                  assert.equal(
                    canStand(
                      spatialMap(world),
                      { ...position, surfaceId },
                      BODY_PROFILES[entity.spatial.bodyProfileId],
                    ),
                    true,
                  );
                  setSpatialPosition(world, entity, position, surfaceId);
                  assert.equal(seesEntity(world, player, entity), true);
                  assert.equal(
                    canReachEntity(
                      world,
                      player,
                      entity,
                      Math.min(world.itemHandling.reach, BASE_ACTION_DEFAULTS.interactionRadius),
                    ),
                    true,
                  );
                }
                assert.equal(seesEntity(world, world.entities[NPC_ID], player), true);
                const fire = world.entities.campfire;
                assert.equal(fire.heat.lit, true);
                const authoredInitialFuel = fire.heat.fuelSeconds;
                fire.heat.fuelSeconds = 7200;
                assert.ok(
                  fire.heat.fuelSeconds + BASE_FIRE_CARE.fuel.secondsPerUnit <=
                    BASE_FIRE_CARE.fuel.maximumFuelSeconds,
                );
                const bagId = createItemLot(world, PLAYER_ID, 'woven_bag', 1);
                const knife = itemsForOwner(world, PLAYER_ID).find((item) => item.definitionId === 'knife');
                const wood = itemsForOwner(world, PLAYER_ID).find((item) => item.definitionId === 'wood');
                assert.equal(knife.quantity, 1);
                assert.equal(wood.quantity, 2);
                moveLot(world, knife.id, bagId, 1, 'camp-fixture-supplies');
                const branchId = moveLot(world, wood.id, bagId, 2, 'camp-fixture-supplies');
                const extra = createItemLot(world, PLAYER_ID, 'wood', 2);
                assert.equal(moveLot(world, extra, bagId, 2, 'camp-fixture-supplies'), branchId);
                const rawId = createItemLot(world, bagId, 'raw_meat', 2);
                return {
                  bagId,
                  knifeId: knife.id,
                  branchId,
                  rawId,
                  actorId: PLAYER_ID,
                  recipientId: NPC_ID,
                  authoredInitialFuel,
                  preparedInitialFuel: fire.heat.fuelSeconds,
                  fuelMaximum: BASE_FIRE_CARE.fuel.maximumFuelSeconds,
                  positions: [PLAYER_ID, NPC_ID, 'campfire', 'branches'].map((id) => ({
                    id,
                    position: worldPosition(world.entities[id]),
                    support: worldSupport(world.entities[id]),
                  })),
                };
              });
              const preparedDrop = cognition.domainCommand(
                { type: 'drop', itemId: seed.bagId, quantity: 1 },
                PLAYER_ID,
                'camp-fixture-ground-bag',
              );
              const drop = await game.service.transition((world) => executeCommand(world, preparedDrop));
              assert.equal(drop.ok, true, drop.message);
              const pileId = itemFor(game.service.world, seed.bagId).ownerId;
              assert.equal(game.service.world.entities[pileId].kind, 'item-pile');
              report.fixture = {
                ...seed,
                pileId,
                preparationCommand: preparedDrop,
                preparationOutcome: drop,
              };
              assert.equal(total(seed.bagId, 'wood'), 4);
              assert.equal(total(seed.bagId, 'raw_meat'), 2);
              assert.equal(total(PLAYER_ID, 'wood'), 0);
              assert.equal(total(PLAYER_ID, 'raw_meat'), 0);
              assert.equal(total(PLAYER_ID, 'cooked_meat'), 0);
              assert.equal(total(NPC_ID, 'cooked_meat'), 0);

              await (await nearbyRow(pileId)).click();
              await page
                .locator('#nearbyPanel')
                .getByRole('button', { name: /^Open / })
                .click();
              const ownSide = page.locator('[data-side="belongings"]'),
                otherSide = page.locator('[data-side="container"]');
              await otherSide.locator('[data-item-id="' + seed.bagId + '"]').click();
              await page
                .getByRole('dialog', { name: 'Woven bag actions and details', exact: true })
                .getByRole('button', { name: /^Open / })
                .click();
              await expect(otherSide.getByRole('heading', { name: 'Woven bag', exact: true })).toBeVisible();
              await expect(otherSide).toContainText('On the ground');
              const opened = await inventory(seed.bagId);
              assert.equal(opened.container.load, 7);
              assert.equal(opened.container.capacity, 24);
              report.openedStorage = {
                id: opened.container.id,
                location: opened.container.location,
                load: opened.container.load,
                capacity: opened.container.capacity,
              };

              async function transfer(label, fromId, toId, definitionId, quantity, keyboard = false) {
                await showPanel('inventory', 'Inventory');
                await expect(
                  otherSide.getByRole('heading', { name: 'Woven bag', exact: true }),
                ).toBeVisible();
                const from = await inventory(fromId),
                  to = await inventory(toId);
                const item = from.items.find(
                  (entry) => itemFor(game.service.world, entry.id)?.definitionId === definitionId,
                );
                assert.ok(item);
                const side = fromId === PLAYER_ID ? ownSide : otherSide;
                await side.locator('[data-item-id="' + item.id + '"]').click();
                const detail = page.getByRole('dialog', {
                  name: item.name + ' actions and details',
                  exact: true,
                });
                if (quantity < item.quantity) {
                  await detail.getByRole('button', { name: 'Move an amount…', exact: true }).click();
                  await detail.getByLabel('Quantity', { exact: true }).fill(String(quantity));
                }
                const submit = detail.getByRole('button', {
                  name: quantity < item.quantity ? 'Move amount' : /^Move to /,
                  exact: quantity < item.quantity,
                });
                const result = await act(
                  label,
                  {
                    type: 'transfer-item',
                    itemId: item.id,
                    quantity,
                    targetId: toId,
                    expectedRevision: item.revision,
                    placementRevision: item.placementRevision,
                    targetRevision: to.container.revision,
                  },
                  async () => {
                    if (keyboard) {
                      await submit.focus();
                      await expect(submit).toBeFocused();
                      await submit.press('Enter');
                    } else await submit.click();
                  },
                  keyboard ? 'keyboard Enter on the focused transfer button' : 'pointer click',
                );
                assert.equal(result.code, 'items-arranged');
                assert.equal(itemFor(game.service.world, result.itemId).ownerId, toId);
                await expect(detail).toBeHidden();
                await expect(
                  (toId === PLAYER_ID ? ownSide : otherSide).locator(
                    '[data-item-id="' + result.itemId + '"]',
                  ),
                ).toBeVisible();
                return result;
              }

              await transfer('Take the exact knife from camp storage', seed.bagId, PLAYER_ID, 'knife', 1);
              await transfer('Take two branches from camp storage', seed.bagId, PLAYER_ID, 'wood', 2);
              await transfer('Take one raw portion from camp storage', seed.bagId, PLAYER_ID, 'raw_meat', 1);
              assert.equal(total(seed.bagId, 'wood'), 2);
              assert.equal(total(seed.bagId, 'raw_meat'), 1);
              const knife = lot(PLAYER_ID, 'knife');
              await ownSide.locator('[data-item-id="' + knife.id + '"]').click();
              const knifeDetail = page.getByRole('dialog', {
                name: 'Knife actions and details',
                exact: true,
              });
              const equipped = await act(
                'Equip the retrieved knife',
                { type: 'equip', itemId: knife.id },
                () => knifeDetail.getByRole('button', { name: 'Equip', exact: true }).click(),
              );
              assert.equal(equipped.code, 'equipped');
              assert.equal(game.service.world.entities[PLAYER_ID].actor.equippedItemId, equipped.itemId);
              await expect(knifeDetail).toBeHidden();
              await expect(page.getByRole('region', { name: 'Equipped items', exact: true })).toContainText(
                'Knife',
              );

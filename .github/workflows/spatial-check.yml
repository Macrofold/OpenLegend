          export async function runOwnerStage({ browser, outputDirectory }) {
            const output = join(outputDirectory, "owner");
            await mkdir(output, { recursive: true });
            const report = {
              stage: "owner",
              startedAt: new Date().toISOString(),
              checkout: process.env.GITHUB_SHA ?? "unrecorded-local-checkout",
              headRef: process.env.GITHUB_HEAD_REF ?? "",
              scope:
                "One native local-owner definition/editor/checkpoint/Operations return session",
              fixture: {
                seed: 1086,
                setup:
                  "Unmodified native base world; the single deliberate person-name edit is performed through the real editor.",
                authority:
                  "Actual local browser entry with God mode; play/save/create/inspect/manage-access, no invented spectator grant.",
                clock:
                  "Native automatic ticking disabled; fixed wall clock, no elapsed simulation time supplied.",
                mutations:
                  "Four deliberate UI writes: create named baseline, save person name, load baseline, load its actual recovery. Native entry/presence and automatic protective captures are recorded separately.",
              },
              limits: [
                "This connects selected owner interfaces; it does not close whole J28–35/J40–45 rows.",
                "No new recipe, family, story-policy, autosave-setting, maintenance or provider mutation.",
                "Native save/authority failure, question/streaming, creator Apply and family-owner evidence are reused; no fault matrix or installation rerun.",
                "No process restart, external identity provider, multi-human, native IME, assistive-device or uncoached-player qualification.",
              ],
              additionalJevCostUsd: 0,
              cumulativeTaskJevCostUsd: 0,
              observations: [],
              writes: [],
              captures: [],
              pageErrors: [],
              unexpectedRequests: [],
              cleanup: {},
              passed: false,
            };
            let repository, game, context, page, operations, base;
            let traceStarted = false;
            const requests = [];
            const clients = new Map();
            const pageNames = new Map();
            const deliberatePaths = new Set([
              "/api/saves/create",
              "/api/god/editor/person/save",
              "/api/saves/load",
            ]);
            const controlledActor = { id: "", accountId: "", worldId: "" };
            function watch(target) {
              if (pageNames.has(target)) return;
              pageNames.set(target, "page-" + (pageNames.size + 1));
              target.setDefaultTimeout(10000);
              target.on("pageerror", (error) =>
                report.pageErrors.push({
                  page: pageNames.get(target),
                  message: error.message,
                }),
              );
              target.on("request", (request) => {
                const url = new URL(request.url());
                if (url.protocol !== "data:" && url.origin !== new URL(base).origin)
                  report.unexpectedRequests.push(request.url());
                if (!url.pathname.startsWith("/api/")) return;
                const client = request.headers()["x-ol-client"];
                if (client) clients.set(target, client);
                const entry = {
                  page: pageNames.get(target),
                  path: url.pathname,
                  method: request.method(),
                };
                if (
                  request.method() === "POST" &&
                  (deliberatePaths.has(url.pathname) ||
                    url.pathname === "/api/embodiment")
                )
                  entry.body = request.postDataJSON();
                requests.push(entry);
              });
            }
            async function nativeRead(target, path) {
              const client = clients.get(target);
              assert.ok(
                client,
                "Use the identity already issued by this actual App page",
              );
              const response = await target.request.get(base + path, {
                headers: { "X-OL-Client": client },
              });
              assert.equal(response.status(), 200, path);
              return response.json();
            }
            async function uiCall(target, path, gesture, label, writes = false) {
              const count = requests.filter(
                (entry) => entry.path === path && entry.method === "POST",
              ).length;
              const [response] = await Promise.all([
                target.waitForResponse(
                  (value) =>
                    new URL(value.url()).pathname === path &&
                    value.request().method() === "POST",
                ),
                gesture(),
              ]);
              const request = response.request().postDataJSON();
              const result = await response.json();
              assert.equal(response.status(), 200, label + " HTTP result");
              assert.equal(result.ok, true, result.message ?? label);
              assert.equal(
                requests.filter((entry) => entry.path === path && entry.method === "POST")
                  .length,
                count + 1,
                label + " sends once",
              );
              if (writes) report.writes.push({ label, path, request, result });
              return { request, result };
            }
            async function step(label, operation) {
              report.currentStep = label;
              await operation();
              report.observations.push({ label, completedAt: new Date().toISOString() });
            }
            async function capture(name) {
              assert.ok(
                report.captures.length < 2,
                "At most two requested owner captures",
              );
              await page.screenshot({ path: join(output, name), timeout: 10000 });
              report.captures.push({ name, viewport: page.viewportSize() });
            }
            async function showGame(target = page) {
              const panel = target.locator("#gamePanel");
              if (!(await panel.isVisible()))
                await target.getByRole("button", { name: "Game", exact: true }).click();
              await expect(panel).toBeVisible();
              return panel;
            }
            async function showCheckpoints(target = page) {
              const panel = target.locator("#checkpointsPanel");
              if (!(await panel.isVisible())) {
                const menu = await showGame(target);
                await menu
                  .getByRole("button", { name: "Checkpoints", exact: true })
                  .click();
              }
              await expect(
                panel.getByLabel("Checkpoint name", { exact: true }),
              ).toBeVisible();
              return panel;
            }
            async function entered(target, enterGame) {
              // Existing native God-editor readiness, not a replacement for Time's five-second gate.
              await expect(target.locator("#world")).toHaveAttribute(
                "data-ready",
                "true",
                { timeout: 20000 },
              );
              await enterGame(target);
              const view = await nativeRead(target, "/api/state");
              assert.equal(view.access.controlling, true);
              if (controlledActor.id) {
                assert.equal(view.player.id, controlledActor.id);
                assert.equal(view.worldId, controlledActor.worldId);
                assert.equal(view.access.accountId, controlledActor.accountId);
              }
              return view;
            }
            async function editor() {
              const checkpointPanel = page.locator("#checkpointsPanel");
              if (await checkpointPanel.isVisible())
                await checkpointPanel
                  .getByRole("button", { name: "Hide Checkpoints panel", exact: true })
                  .click();
              const character = page.locator("#characterPanel");
              if (!(await character.isVisible()))
                await page
                  .getByRole("button", { name: "Character", exact: true })
                  .click();
              const details = character
                .locator("details")
                .filter({
                  has: page.getByText("God mode · Character controls", { exact: true }),
                });
              if ((await details.getAttribute("open")) === null)
                await character
                  .getByText("God mode · Character controls", { exact: true })
                  .click();
              const loaded = await uiCall(
                page,
                "/api/god/editor/person",
                () =>
                  character
                    .getByRole("button", { name: "Edit Person", exact: true })
                    .click(),
                "Read actual person editor",
              );
              const dialog = page.getByRole("dialog", { name: /^Edit / });
              await expect(dialog).toBeVisible();
              await dialog.getByRole("button", { name: "Identity", exact: true }).click();
              return { dialog, loaded: loaded.result };
            }
            async function assertPerson(name) {
              assert.equal(game.service.world.entities[controlledActor.id].name, name);
              const durable = await repository.records.entitySummary(
                controlledActor.worldId,
                controlledActor.id,
              );
              assert.ok(
                durable,
                "The same actor remains present in the native stored entity records",
              );
              assert.equal(durable.id, controlledActor.id);
              assert.equal(durable.name, name);
              return durable;
            }

            try {
              const [
                { createGameServer },
                { testRepository, readConfig },
                { enterGame },
                { readDefinition },
              ] = await Promise.all([
                fromCheckout("apps/server/src/http.ts"),
                fromCheckout("tests/fixtures/database.ts"),
                fromCheckout("tests/fixtures/browser.ts"),
                fromCheckout("apps/server/src/world-graph.ts"),
              ]);
              report.sourceSha256 = Object.fromEntries(
                await Promise.all(
                  Object.keys(preparedSourceSha256).map(async (path) => [
                    path,
                    await hashFile(path),
                  ]),
                ),
              );
              assert.deepEqual(
                report.sourceSha256,
                preparedSourceSha256,
                "Review changed owners before executing this prepared segment",
              );
              const assets = (await readdir("dist/client/assets")).filter((name) =>
                /\.(js|css)$/.test(name),
              );
              report.assetSha256 = Object.fromEntries(
                await Promise.all(
                  [
                    "dist/client/index.html",
                    ...assets.map((name) => "dist/client/assets/" + name),
                  ].map(async (path) => [path, await hashFile(path)]),
                ),
              );
              const config = readConfig({
                OPEN_LEGEND_GOD_MODE: "true",
                OPEN_LEGEND_AUTH_MODE: "local",
                WORLD_SEED: "1086",
                AI_BUDGET_USD: "0",
              });
              assert.equal(config.budgetUsd, 0);
              assert.equal(
                Boolean(
                  config.jevKey ||
                    config.llmKey ||
                    config.macrofoldKey ||
                    config.embeddingKey,
                ),
                false,
              );
              repository = await testRepository();
              const now = Date.now();
              game = await createGameServer({
                config,
                store: repository,
                production: true,
                tick: false,
                now: () => now,
              });
              await new Promise((resolve) => game.server.listen(0, "127.0.0.1", resolve));
              const address = game.server.address();
              assert.ok(address && typeof address !== "string");
              base = "http://127.0.0.1:" + address.port;
              context = await browser.newContext({
                viewport: { width: 1440, height: 960 },
                locale: "en-US",
                timezoneId: "UTC",
              });
              context.on("page", watch);
              await context.tracing.start({
                screenshots: true,
                snapshots: true,
                sources: true,
              });
              traceStarted = true;
              page = await context.newPage();
              watch(page);
              await page.goto(base);
              const initial = await entered(page, enterGame);
              Object.assign(controlledActor, {
                id: initial.player.id,
                worldId: initial.worldId,
                accountId: initial.access.accountId,
              });
              assert.equal(initial.godMode, true);
              assert.equal(initial.access.canManageSaves, true);
              const nameA = initial.player.name,
                nameB = "Owner UI checkpoint check";
              const checkpointLabel = "Owner UI baseline";
              report.identity = {
                ...controlledActor,
                initialTimeline: initial.saveTimeline,
                originalName: nameA,
                editedName: nameB,
              };
              let checkpointId, originalEditor, savedEditor, timelineA, timelineB;

              await step(
                "Read installed Health, its native host relation and the original source again",
                async () => {
                  const menu = await showGame();
                  await menu.getByRole("button", { name: "Create", exact: true }).click();
                  const creation = page.locator("#agentPanel");
                  await creation
                    .getByRole("button", { name: "Inspect world", exact: true })
                    .click();
                  const inspection = creation.getByRole("region", {
                    name: "World-owner relationship inspection",
                    exact: true,
                  });
                  await inspection
                    .getByLabel("Name or ID", { exact: true })
                    .fill("wilderness:health");
                  await uiCall(
                    page,
                    "/api/world-agent/inspect",
                    () =>
                      inspection
                        .getByRole("button", { name: "Search", exact: true })
                        .click(),
                    "Search installed Health",
                  );
                  const health = await uiCall(
                    page,
                    "/api/world-agent/inspect",
                    () =>
                      inspection
                        .getByRole("list", { name: "World search results", exact: true })
                        .getByRole("button", { name: "Health", exact: true })
                        .click(),
                    "Inspect installed Health",
                  );
                  const expected = readDefinition(
                    game.service.world,
                    "attribute",
                    "wilderness:health",
                  );
                  assert.ok(expected);
                  assert.deepEqual(health.result.result.data.node, expected.node);
                  assert.deepEqual(health.result.result.data.data, expected.data);
                  const host = await uiCall(
                    page,
                    "/api/world-agent/inspect",
                    () =>
                      inspection
                        .getByRole("button", {
                          name: "Inspect native-health-v1",
                          exact: true,
                        })
                        .click(),
                    "Follow native Health implementation",
                  );
                  assert.equal(host.result.result.data.node.ref.kind, "host");
                  assert.equal(host.result.result.data.node.ref.id, "native-health-v1");
                  const implementation =
                    health.result.result.data.relationships.edges.find(
                      (edge) =>
                        edge.relation === "implements" &&
                        edge.target.kind === "host" &&
                        edge.target.id === "native-health-v1",
                    );
                  assert.ok(
                    implementation,
                    "The actual Health neighborhood declares the implementation relation",
                  );
                  assert.deepEqual(implementation.source, expected.node.ref);
                  assert.deepEqual(
                    implementation.target,
                    host.result.result.data.node.ref,
                  );
                  const back = await uiCall(
                    page,
                    "/api/world-agent/inspect",
                    () =>
                      inspection
                        .getByRole("button", { name: "Back one source", exact: true })
                        .click(),
                    "Return to Health source",
                  );
                  assert.deepEqual(back.result.result.data.node.ref, expected.node.ref);
                  await inspection
                    .getByText("Exact source record", { exact: true })
                    .click();
                  await expect(
                    inspection.getByText(
                      "Source revision: " + expected.node.ref.version,
                      { exact: true },
                    ),
                  ).toBeVisible();
                  await expect(inspection.locator("pre").first()).toContainText(
                    "native-health-v1",
                  );
                  await expect(
                    inspection.getByText(
                      "Complete for this projected neighborhood only.",
                      { exact: true },
                    ),
                  ).toBeVisible();
                  report.definition = {
                    source: expected.node.ref,
                    host: host.result.result.data.node.ref,
                    relation: implementation,
                    returnedSource: back.result.result.data.node.ref,
                  };
                  await creation
                    .getByRole("button", { name: "Hide Create panel", exact: true })
                    .click();
                },
              );

              await step(
                "Create the actual named baseline with the original actor name",
                async () => {
                  const checkpoints = await showCheckpoints();
                  await checkpoints
                    .getByLabel("Checkpoint name", { exact: true })
                    .fill(checkpointLabel);
                  const created = await uiCall(
                    page,
                    "/api/saves/create",
                    () =>
                      checkpoints
                        .getByRole("button", { name: "Create checkpoint", exact: true })
                        .click(),
                    "Create named baseline",
                    true,
                  );
                  checkpointId = created.request.id;
                  await expect(
                    checkpoints.getByRole("button", {
                      name: "Load " + checkpointLabel,
                      exact: true,
                    }),
                  ).toBeEnabled();
                  const catalog = await repository.saves.list(controlledActor.worldId);
                  assert.equal(
                    catalog.filter(
                      (save) =>
                        save.id === checkpointId && save.label === checkpointLabel,
                    ).length,
                    1,
                  );
                  const saved = await repository.saves.read(
                    controlledActor.worldId,
                    checkpointId,
                  );
                  assert.equal(
                    saved.state.world.entities[controlledActor.id].name,
                    nameA,
                  );
                  report.baseline = {
                    id: checkpointId,
                    name: checkpointLabel,
                    actorName: nameA,
                    time: saved.state.world.simTime,
                  };
                },
              );

              await step(
                "Keep the deliberate dirty name through Close, then Save and Close exactly once",
                async () => {
                  const opened = await editor();
                  originalEditor = opened.loaded;
                  const name = opened.dialog.getByLabel("Name", { exact: true });
                  await expect(name).toHaveValue(nameA);
                  await name.fill(nameB);
                  await opened.dialog
                    .getByRole("button", { name: "Close Edit " + nameA, exact: true })
                    .click();
                  const confirmation = page.getByRole("alertdialog", {
                    name: "Unsaved changes in Edit " + nameA,
                    exact: true,
                  });
                  await expect(confirmation).toBeVisible();
                  await assertPerson(nameA);
                  assert.equal(
                    requests.filter(
                      (entry) => entry.path === "/api/god/editor/person/save",
                    ).length,
                    0,
                  );
                  await capture("01-person-dirty-close.png");
                  await confirmation
                    .getByRole("button", { name: "Keep editing", exact: true })
                    .click();
                  await expect(name).toHaveValue(nameB);
                  await opened.dialog
                    .getByRole("button", { name: "Close Edit " + nameA, exact: true })
                    .click();
                  savedEditor = await uiCall(
                    page,
                    "/api/god/editor/person/save",
                    () =>
                      confirmation
                        .getByRole("button", { name: "Save and Close", exact: true })
                        .click(),
                    "Save deliberate person name",
                    true,
                  );
                  assert.equal(savedEditor.request.actorId, controlledActor.id);
                  assert.equal(savedEditor.request.generation, originalEditor.generation);
                  assert.equal(
                    savedEditor.request.manifestRevision,
                    originalEditor.manifestRevision,
                  );
                  assert.deepEqual(
                    savedEditor.request.bodyPolicyPin,
                    originalEditor.bodyPolicyPin,
                  );
                  assert.deepEqual(savedEditor.request.basePerson, originalEditor.person);
                  assert.deepEqual(savedEditor.request.memoryChanges, []);
                  assert.equal(savedEditor.request.person.name, nameB);
                  const withoutName = ({ name: _name, ...fields }) => fields;
                  assert.deepEqual(
                    withoutName(savedEditor.request.person),
                    withoutName(originalEditor.person),
                  );
                  await expect(opened.dialog).toBeHidden();
                  await assertPerson(nameB);
                  const reopened = await editor();
                  await expect(
                    reopened.dialog.getByLabel("Name", { exact: true }),
                  ).toHaveValue(nameB);
                  assert.deepEqual(
                    withoutName(reopened.loaded.person),
                    withoutName(originalEditor.person),
                  );
                  await reopened.dialog
                    .getByRole("button", { name: "Close Edit " + nameB, exact: true })
                    .click();
                  timelineA = game.service.timelineId;
                },
              );

              await step(
                "Cancel exact baseline Load once, then use its native protected restore",
                async () => {
                  const checkpoints = await showCheckpoints();
                  const load = checkpoints.getByRole("button", {
                    name: "Load " + checkpointLabel,
                    exact: true,
                  });
                  await load.click();
                  const confirmation = checkpoints.getByRole("group", {
                    name: "Load checkpoint " + checkpointLabel,
                    exact: true,
                  });
                  await expect(confirmation).toContainText("Before last load");
                  await confirmation
                    .getByRole("button", { name: "Cancel", exact: true })
                    .click();
                  await expect(load).toBeFocused();
                  assert.equal(game.service.timelineId, timelineA);
                  assert.equal(
                    requests.filter((entry) => entry.path === "/api/saves/load").length,
                    0,
                  );
                  await load.click();
                  // A successful native load reloads this actual App. Observe that document before
                  // checking entry, rather than accepting the previous document's ready marker.
                  const [, loaded] = await Promise.all([
                    page.waitForEvent("domcontentloaded"),
                    uiCall(
                      page,
                      "/api/saves/load",
                      () =>
                        confirmation
                          .getByRole("button", { name: "Confirm load", exact: true })
                          .click(),
                      "Load named baseline with protection",
                      true,
                    ),
                  ]);
                  assert.equal(loaded.request.id, checkpointId);
                  const restored = await entered(page, enterGame);
                  assert.equal(restored.player.name, nameA);
                  await assertPerson(nameA);
                  assert.notEqual(restored.saveTimeline, timelineA);
                  timelineB = restored.saveTimeline;
                  assert.equal(restored.clock.paused, true);
                  assert.equal(restored.clock.pauseReason, "manual");
                  const protectedWorld = await repository.saves.read(
                    controlledActor.worldId,
                    "before-load",
                  );
                  assert.equal(
                    protectedWorld.state.world.entities[controlledActor.id].name,
                    nameB,
                  );
                  assert.equal(
                    (
                      await repository.getIntegration(
                        "load-request:" + loaded.request.requestId,
                      )
                    ).saveId,
                    checkpointId,
                  );
                  report.firstRestore = {
                    timeline: timelineB,
                    actorName: nameA,
                    protectedActorName: nameB,
                    paused: restored.clock.pauseReason,
                  };
                },
              );

              await step(
                "Load the actual Before last load protection and recover the edited character",
                async () => {
                  const checkpoints = await showCheckpoints();
                  await checkpoints
                    .getByRole("button", { name: "Load Before last load", exact: true })
                    .click();
                  const confirmation = checkpoints.getByRole("group", {
                    name: "Load checkpoint Before last load",
                    exact: true,
                  });
                  await expect(confirmation).toContainText("Before last load");
                  await capture("02-exact-recovery-load.png");
                  const [, loaded] = await Promise.all([
                    page.waitForEvent("domcontentloaded"),
                    uiCall(
                      page,
                      "/api/saves/load",
                      () =>
                        confirmation
                          .getByRole("button", { name: "Confirm load", exact: true })
                          .click(),
                      "Recover edited world through protected slot",
                      true,
                    ),
                  ]);
                  assert.equal(loaded.request.id, "before-load");
                  const restored = await entered(page, enterGame);
                  assert.equal(restored.player.name, nameB);
                  await assertPerson(nameB);
                  assert.notEqual(restored.saveTimeline, timelineB);
                  assert.equal(restored.clock.paused, true);
                  assert.equal(restored.clock.pauseReason, "manual");
                  const replacementProtection = await repository.saves.read(
                    controlledActor.worldId,
                    "before-load",
                  );
                  assert.equal(
                    replacementProtection.state.world.entities[controlledActor.id].name,
                    nameA,
                  );
                  assert.equal(
                    (
                      await repository.getIntegration(
                        "load-request:" + loaded.request.requestId,
                      )
                    ).saveId,
                    "before-load",
                  );
                  report.finalRestore = {
                    timeline: restored.saveTimeline,
                    actorName: nameB,
                    protectedActorName: nameA,
                    paused: restored.clock.pauseReason,
                  };
                },
              );

              await step(
                "Read native Operations, maintenance and the same catalogue without entering play",
                async () => {

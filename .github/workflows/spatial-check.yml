name: Spatial world checks
on:
  push:
    branches: [feature/spatial-world-3d]
  pull_request:
    paths:
      - 'packages/**'
      - 'apps/**'
      - 'tests/browser/**'
      - 'tests/fixtures/**'
      - 'playwright.config.ts'
      - 'tsconfig*.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/spatial-check.yml'
permissions:
  contents: read
concurrency:
  group: spatial-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: openlegend
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openlegend -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      OPENLEGEND_TEST_DATABASE_URL: postgresql://openlegend:fixture@localhost:5432/postgres
      AI_BUDGET_USD: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # This focused gate supplements, not replaces, the repository's full check.
      - run: pnpm exec vitest run packages/spatial/src/spatial.test.ts packages/domain/src/spatial-world.test.ts apps/client/src/world-camera.test.ts apps/server/src/spatial-http.test.ts
      - id: playwright_install
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test tests/browser/spatial-world.spec.ts
        env:
          AI_BUDGET_USD: '0'
      # Preserve the original spatial evidence and failure while exercising the
      # existing interface journeys against their own disposable databases.
      - name: Check player and creator interfaces
        if: ${{ !cancelled() && steps.playwright_install.outcome == 'success' }}
        run: |
          pnpm exec playwright test \
            tests/browser/actions.spec.ts \
            tests/browser/camera.spec.ts \
            tests/browser/conversation-ui.spec.ts \
            tests/browser/design-system.spec.ts \
            tests/browser/god-editor.spec.ts \
            tests/browser/time.spec.ts \
            --output test-results/interface
      - name: Diagnose native owner checkpoint restoration
        if: ${{ !cancelled() && steps.playwright_install.outcome == 'success' }}
        timeout-minutes: 6
        run: |
          set -euo pipefail
          mkdir -p test-results/whole-ui-owner-diagnostic/scripts
          cat > test-results/whole-ui-owner-diagnostic/scripts/invoke.sh <<'OPENLEGEND_REVIEWED_SOURCE_0_END'
          #!/usr/bin/env bash
          # Run from the repository root. The existing driver owns all game/browser/database work.
          set -euo pipefail

          owner_scripts_dir=$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)
          owner_output=${1:-test-results/whole-ui-owner-diagnostic}
          mkdir -p -- "$owner_output"
          owner_output=$(cd -- "$owner_output" && pwd)
          owner_preservation="$owner_output/source-preservation"
          # Refuse to overwrite the source backup or report of a previous invocation.
          mkdir -- "$owner_preservation"
          owner_driver_pid=""

          restore_owner_source() {
            owner_step_status=$?
            trap - EXIT
            trap '' TERM INT
            if [ -n "$owner_driver_pid" ]; then
              kill -TERM -- "$owner_driver_pid" 2>/dev/null || true
              if wait "$owner_driver_pid"; then :; else :; fi
              owner_driver_pid=""
            fi
            if node "$owner_scripts_dir/source-variant.mjs" restore "$owner_preservation" "$owner_step_status"; then
              owner_restore_status=0
            else
              owner_restore_status=$?
            fi
            if [ "$owner_step_status" -ne 0 ]; then exit "$owner_step_status"; fi
            exit "$owner_restore_status"
          }

          interrupt_owner_diagnostic() {
            owner_signal=$1
            owner_signal_status=$2
            trap '' TERM INT
            if [ -n "$owner_driver_pid" ]; then
              kill -"$owner_signal" -- "$owner_driver_pid" 2>/dev/null || true
              if wait "$owner_driver_pid"; then :; else :; fi
              owner_driver_pid=""
            fi
            exit "$owner_signal_status"
          }

          trap restore_owner_source EXIT
          trap 'interrupt_owner_diagnostic TERM 143' TERM
          trap 'interrupt_owner_diagnostic INT 130' INT

          (cd -- "$owner_scripts_dir" && sha256sum --check inputs.sha256)
          node "$owner_scripts_dir/source-variant.mjs" install "$owner_preservation"
          node --import tsx "$owner_scripts_dir/run-whole-ui.mjs" "$owner_output" &
          owner_driver_pid=$!
          if wait "$owner_driver_pid"; then owner_run_status=0; else owner_run_status=$?; fi
          owner_driver_pid=""
          exit "$owner_run_status"
          OPENLEGEND_REVIEWED_SOURCE_0_END
          cat > test-results/whole-ui-owner-diagnostic/scripts/source-variant.mjs <<'OPENLEGEND_REVIEWED_SOURCE_1_END'
          // Temporary CI source ownership only. This script does not start the game.
          import { createHash } from 'node:crypto';
          import { readFile, writeFile, rename, rm, stat } from 'node:fs/promises';
          import { join, resolve } from 'node:path';

          const originalSha256 = '0b95431272e8801f4820f7f0714448d07c958b3c4daf0d89f57060c9e9c72263';
          const observedSha256 = '817a96f8645a9d70d5b04d95962e64260279f97597e4533cc38eb8c1a577cf84';
          const source = resolve('apps/server/src/world-service.ts');
          const mode = process.argv[2];
          const directory = resolve(process.argv[3] ?? '');
          const hash = (bytes) => createHash('sha256').update(bytes).digest('hex');
          const original = join(directory, 'world-service.original.ts');
          const installationPath = join(directory, 'installation.json');
          const restorationPath = join(directory, 'restoration.json');

          async function replaceOwnedSource(bytes, expectedCurrentSha256, fileMode) {
            const temporary = source + '.owner-observation-' + process.pid + '.tmp';
            let ownsTemporary = false;
            try {
              await writeFile(temporary, bytes, { flag: 'wx', mode: fileMode });
              ownsTemporary = true;
              if (hash(await readFile(source)) !== expectedCurrentSha256)
                throw new Error('The source changed before replacement; it was left untouched.');
              await rename(temporary, source);
              ownsTemporary = false;
            } finally {
              if (ownsTemporary) await rm(temporary);
            }
          }

          async function install() {
            const before = await readFile(source);
            const observed = await readFile(new URL('world-service.observed.ts', import.meta.url));
            if (hash(before) !== originalSha256)
              throw new Error('The current server source differs from the reviewed original.');
            if (hash(observed) !== observedSha256)
              throw new Error('The temporary observer differs from its reviewed source.');
            const fileMode = (await stat(source)).mode & 0o777;
            await writeFile(original, before, { flag: 'wx', mode: fileMode });
            if (hash(await readFile(original)) !== originalSha256)
              throw new Error('The preserved source could not be verified.');
            const record = {
              variant: 'native-load-commit-catch-observation',
              source: 'apps/server/src/world-service.ts',
              originalSha256,
              observedSha256,
              originalMode: fileMode,
              originalPreserved: true,
              installed: false,
            };
            await writeFile(installationPath, JSON.stringify(record, null, 2) + '\n', { flag: 'wx' });
            await replaceOwnedSource(observed, originalSha256, fileMode);
            record.installed = hash(await readFile(source)) === observedSha256;
            await writeFile(installationPath, JSON.stringify(record, null, 2) + '\n');
            if (!record.installed)
              throw new Error('The temporary source installation could not be verified.');
          }

          async function restore() {
            const status = process.argv[4];
            const result = {
              variant: 'native-load-commit-catch-observation',
              source: 'apps/server/src/world-service.ts',
              expectedOriginalSha256: originalSha256,
              expectedObservedSha256: observedSha256,
              stepExitStatus: /^\d+$/.test(status ?? '') ? Number(status) : null,
              originalPreserved: false,
              restoredOriginalBytes: false,
              replacementNeeded: false,
            };
            try {
              const currentHash = hash(await readFile(source));
              result.sourceBeforeRestorationSha256 = currentHash;
              let backup;
              try {
                backup = await readFile(original);
                result.originalPreserved = hash(backup) === originalSha256;
              } catch (error) {
                if (error.code !== 'ENOENT') throw error;
              }
              if (currentHash === observedSha256) {
                if (!result.originalPreserved)
                  throw new Error('The preserved original is missing or changed; restoration was refused.');
                const fileMode = (await stat(original)).mode & 0o777;
                await replaceOwnedSource(backup, observedSha256, fileMode);
                result.replacementNeeded = true;
              } else if (currentHash !== originalSha256) {
                throw new Error('An unrelated source change was left untouched; restoration is unconfirmed.');
              }
              result.sourceAfterRestorationSha256 = hash(await readFile(source));
              result.restoredOriginalBytes = result.sourceAfterRestorationSha256 === originalSha256;
              if (!result.restoredOriginalBytes)
                throw new Error('Original source restoration did not verify.');
            } catch (error) {
              result.failure = error instanceof Error ? error.message : 'Source restoration failed.';
            }
            await writeFile(restorationPath, JSON.stringify(result, null, 2) + '\n', { flag: 'wx' });
            if (!result.restoredOriginalBytes) process.exitCode = 1;
          }

          if (!process.argv[3] || !['install', 'restore'].includes(mode))
            throw new Error('Use install|restore with the invocation-owned source-preservation directory.');
          if (mode === 'install') await install();
          else await restore();
          OPENLEGEND_REVIEWED_SOURCE_1_END
          cat > test-results/whole-ui-owner-diagnostic/scripts/run-whole-ui.mjs <<'OPENLEGEND_REVIEWED_SOURCE_2_END'
          // One temporary CI continuation, from the repository cwd with --import tsx.
          // Usage: node --import tsx /path/to/run-whole-ui.mjs [test-results/whole-ui]
          // CI owns a six-minute step. At five minutes, stop new stages and close the
          // browser to release UI waits; at 5m45s, report and terminate an unclean worker.
          import { spawn } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { mkdir, readFile, readdir, rename, writeFile } from 'node:fs/promises';
          import { createRequire } from 'node:module';
          import { join, resolve } from 'node:path';
          import { fileURLToPath, pathToFileURL } from 'node:url';

          const stages = [
            {
              name: 'owner',
              file: 'owner-stage.mjs',
              entry: 'runOwnerStage',
              sha256: '6ff3a000f2952bbd7a131325ad8f3accecbc7fc56104d41ec93defc30d645777',
            },
          ];
          const reviewedSourcePins = {
            'apps/client/src/main.tsx': 'ab7fd1f448bd93c1a83fef8f17ff8825efee5027ae86f892a3dbc1382bc4a785',
            'apps/client/src/api.ts': 'c497362cebf3f548f9fa6f79a1389d27d569af88badf7d6d5279983f744fcd0c',
            'apps/client/src/ui/item-creation.tsx':
              'c5f8c4001f517cfbb1faaab40b32a75bbdc83e6c40c213e0c82a29dd50740925',
            'apps/client/src/ui/god-tools.tsx':
              'a3f0dd525e5d4080a0f62142ede8ce78872b08a480c7a64f5a8e7ab06d03b4e9',
            'apps/client/src/ui/creation-request.tsx':
              'c3bafe7b66abebae85ab0700c29f754af7b0202b0b0030381c1bfcd43e202450',
            'packages/domain/src/types.ts':
              'eef78f787d1d9435cc216c86e34356e04d1ebc9b744753820aa250c3854be82f',
            'packages/domain/src/god-tools.ts':
              '63521dd42326723ffb71514b03ac71fc9d8e022216f467b93db752a5e7efbf6d',
            'apps/server/src/http.ts': '000a7e52fce26595ac4dacef53b23c6dcf1dc2f3c1013dfc4ee863356263232e',
            'apps/server/src/world-service.ts':
              '817a96f8645a9d70d5b04d95962e64260279f97597e4533cc38eb8c1a577cf84',
            'packages/protocol/src/index.ts':
              '83ce75297b5bab5a7daae64f7c23a3b46a84286b057520851692efcf9efdee80',
            'apps/client/src/ui/world-inspection.tsx':
              '06357c8b670744ff8884d264d3379fcdc6c03f9418662ea3606bbc162da054e8',
          };
          const limits = { stopWorkMs: 300_000, terminateWorkerMs: 345_000, ciStepMinutes: 6 };
          const launchArgs = ['--use-gl=angle', '--use-angle=swiftshader', '--enable-unsafe-swiftshader'];
          const errorText = (error) => (error instanceof Error ? error.message : String(error));
          const sha256 = async (path) =>
            createHash('sha256')
              .update(await readFile(path))
              .digest('hex');
          async function checkpoint(path, value) {
            await writeFile(path + '.tmp', JSON.stringify(value, null, 2) + '\n');
            await rename(path + '.tmp', path);
          }

          // A returned assertion failure is independent only after its native host and
          // browser context have closed. Evidence/trace failures alone do not retain hosts.
          function ownedCleanupFinished(name, result) {
            if (name !== 'owner' && name !== 'creation-recovery') return false;
            const cleanup = result.cleanup;
            const cleanShutdown = (value) => value?.saved === true && value.problems?.length === 0;
            return (
              !!cleanup &&
              (name !== 'owner' ||
                (cleanup.context === 'closed or not created' &&
                  cleanup.repository === 'closed or not created')) &&
              !cleanup.contextError &&
              !cleanup.shutdownError &&
              !cleanup.repositoryError &&
              (!cleanup.shutdown || cleanShutdown(cleanup.shutdown))
            );
          }

          async function worker(outputDirectory) {
            const reportPath = join(outputDirectory, 'report.json');
            const report = {
              kind: 'one-shot native owner restore diagnosis',
              selectionNote:
                'Only the existing finite owner session is selected, with a temporary native commit-failure observer. Creation recovery remains separately unrun. Prior creator Apply, alternate-world and inventory results are reused within their recorded scopes.',
              diagnosticSource: {
                variant: 'native-load-commit-catch-observation',
                path: 'apps/server/src/world-service.ts',
                originalSha256: '0b95431272e8801f4820f7f0714448d07c958b3c4daf0d89f57060c9e9c72263',
                observedSha256: '817a96f8645a9d70d5b04d95962e64260279f97597e4533cc38eb8c1a577cf84',
                qualification: 'Temporary observer variant; no uninstrumented production pass is claimed.',
              },
              reviewedSourcePins,
              sourceSha256: {},
              reusedEvidence: {
                creator: {
                  status: 'Passed previously; not executed in this continuation',
                  checkout: '45db87d7cef957cdabe8fe02c43162c4eac3c503',
                  reportSha256: '333b5e64a73bdc1f4bbdd413dbd829a3d7dc3dc516063e4958791dcaaa84c4b8',
                },
                pairedInventory: {
                  status: 'Passed previously; not executed in this continuation',
                  checkout: '3731b364a82d89818d66380437d2c1c4c69d970a',
                  reportSha256: '06423f316185b27733410357705681e8ec38103e78d4c0f9a5bc5621be9124a8',
                },
                alternateWorld: {
                  status: 'Passed previously; not executed in this continuation',
                  checkout: '1f3faa833208b532cf99a15ca7b22939e1d0e77f',
                  reportSha256: '6c60379e9758087598f794d526de51a3687cff20d0dff37bb3ce0dd5eb474f97',
                },
              },
              startedAt: new Date().toISOString(),
              checkout: null,
              limits,
              providerBudgetUsd: 0,
              database: 'Existing explicit CI loopback PostgreSQL URL; native disposable fixtures only',
              stages: stages.map((stage) => ({
                name: stage.name,
                script: stage.file,
                expectedSha256: stage.sha256,
                report: stage.name + '/report.json',
                status: 'pending',
              })),
              cleanup: {},
              passed: false,
            };
            let browser, browserServer, closeBrowserPromise, closeTestDatabases;
            const browserNotice = (kind, pid) => {
              if (process.connected) process.send({ kind, pid }, () => {});
            };
            const closeBrowser = () =>
              (closeBrowserPromise ??= Promise.resolve().then(async () => {
                report.cleanup.browserAttempted = true;
                try {
                  if (browser) await browser.close();
                } catch (error) {
                  report.cleanup.browserError = errorText(error);
                }
                try {
                  if (browserServer) await browserServer.close();
                } catch (error) {
                  report.cleanup.browserServerError = errorText(error);
                }
                report.cleanup.browserClosed =
                  !report.cleanup.browserError && !report.cleanup.browserServerError;
              }));
            const requestStop = (signal) => {
              report.stopRequested ??= { signal, at: new Date().toISOString() };
              if (browser || browserServer) void closeBrowser();
            };
            const onTerm = () => requestStop('SIGTERM');
            const onInt = () => requestStop('SIGINT');
            process.on('SIGTERM', onTerm);
            process.on('SIGINT', onInt);
            try {
              await mkdir(outputDirectory, { recursive: true });
              if (process.env.AI_BUDGET_USD !== '0') throw new Error('AI_BUDGET_USD must be exactly 0.');
              if (!/^[a-f0-9]{40}$/i.test(process.env.GITHUB_SHA ?? ''))
                throw new Error('This one-shot CI continuation requires its exact GITHUB_SHA.');
              report.checkout = process.env.GITHUB_SHA;
              report.headRef = process.env.GITHUB_HEAD_REF ?? '';
              let databaseUrl;
              try {
                databaseUrl = new URL(process.env.OPENLEGEND_TEST_DATABASE_URL);
              } catch {
                throw new Error('The existing explicit CI loopback PostgreSQL URL is required.');
              }
              if (
                !['postgres:', 'postgresql:'].includes(databaseUrl.protocol) ||
                !['localhost', '127.0.0.1', '[::1]'].includes(databaseUrl.hostname) ||
                databaseUrl.search ||
                databaseUrl.hash
              )
                throw new Error('Use the existing CI loopback PostgreSQL URL without overrides.');
              // Never copy the URL, credentials or environment into evidence or stdout.
              for (const [index, stage] of stages.entries()) {
                const actual = await sha256(new URL(stage.file, import.meta.url));
                report.stages[index].sha256 = actual;
                if (actual !== stage.sha256)
                  throw new Error(stage.name + ' differs from its reviewed script.');
              }
              for (const [path, expected] of Object.entries(reviewedSourcePins)) {
                const actual = await sha256(path);
                report.sourceSha256[path] = actual;
                if (actual !== expected) throw new Error(path + ' differs from its reviewed source.');
              }
              report.driverSha256 = await sha256(new URL(import.meta.url));
              const assets = (await readdir('dist/client/assets'))
                .filter((name) => /\.(js|css)$/.test(name))
                .sort();
              report.buildSha256 = Object.fromEntries(
                await Promise.all(
                  ['dist/client/index.html', ...assets.map((name) => 'dist/client/assets/' + name)].map(
                    async (path) => [path, await sha256(path)],
                  ),
                ),
              );
              report.packageSha256 = Object.fromEntries(
                await Promise.all(
                  ['package.json', 'pnpm-lock.yaml'].map(async (path) => [path, await sha256(path)]),
                ),
              );
              const require = createRequire(resolve('package.json'));
              const { chromium } = require('@playwright/test');
              ({ closeTestDatabases } = await import(
                pathToFileURL(resolve('tests/fixtures/database.ts')).href
              ));
              report.runtime = {
                node: process.version,
                v8: process.versions.v8,
                platform: process.platform,
                architecture: process.arch,
                playwright: require('@playwright/test/package.json').version,
                launchArgs,
              };
              await checkpoint(reportPath, report);
              if (!report.stopRequested) {
                // Public process ownership gives the supervisor this exact Chromium group.
                // Its loopback websocket capability is never logged or saved.
                browserServer = await chromium.launchServer({
                  headless: true,
                  args: launchArgs,
                  host: '127.0.0.1',
                  handleSIGINT: false,
                  handleSIGTERM: false,
                  handleSIGHUP: false,
                });
                const browserPid = browserServer.process().pid;
                if (!Number.isInteger(browserPid) || browserPid <= 0)
                  throw new Error('The owned Chromium process identity is unavailable.');
                report.runtime.browserPid = browserPid;
                browserNotice('browser-opened', browserPid);
                browserServer.process().once('exit', () => browserNotice('browser-closed', browserPid));
                if (!report.stopRequested) {
                  browser = await chromium.connect(browserServer.wsEndpoint(), { timeout: 30_000 });
                  report.runtime.browser = browser.version();
                }
              }
              for (const [index, stage] of stages.entries()) {
                if (report.stopRequested) break;
                const entry = report.stages[index];
                entry.status = 'running';
                entry.startedAt = new Date().toISOString();
                await checkpoint(reportPath, report);
                try {
                  const module = await import(new URL(stage.file, import.meta.url).href);
                  if (report.stopRequested) {
                    entry.status = 'not run';
                    entry.reason = 'Interrupted before stage invocation';
                    break;
                  }
                  const result = await module[stage.entry]({ browser, outputDirectory });
                  entry.returned = true;
                  entry.passed = result.passed === true;
                  entry.status = entry.passed ? 'passed' : 'failed';
                  entry.failure = result.failure;
                  entry.cleanup = result.cleanup;
                  entry.remainingBrowserContexts = browser.contexts().length;
                  entry.ownedCleanupFinished =
                    entry.remainingBrowserContexts === 0 && ownedCleanupFinished(stage.name, result);
                  entry.finishedAt = new Date().toISOString();
                  await checkpoint(reportPath, report);
                  if (!entry.ownedCleanupFinished || !browser.isConnected()) {
                    report.failure = 'A returned stage did not leave a usable, clean shared runtime.';
                    break;
                  }
                } catch (error) {
                  entry.status = 'failed';
                  entry.failure = errorText(error);
                  entry.finishedAt = new Date().toISOString();
                  report.failure = 'Stage return/cleanup was not confirmed; later stages were not started.';
                  break;
                }
              }
            } catch (error) {
              report.failure = errorText(error);
            } finally {
              for (const entry of report.stages) if (entry.status === 'pending') entry.status = 'not run';
              await closeBrowser();
              report.cleanup.databaseDropAttempted = !!closeTestDatabases;
              try {
                if (closeTestDatabases) await closeTestDatabases();
                report.cleanup.databasesClosed = true;
              } catch (error) {
                report.cleanup.databaseError = errorText(error);
              }
              report.finishedAt = new Date().toISOString();
              report.elapsedMs = Date.parse(report.finishedAt) - Date.parse(report.startedAt);
              report.passed =
                !report.stopRequested &&
                !report.failure &&
                report.stages.every((entry) => entry.passed && entry.ownedCleanupFinished) &&
                report.cleanup.browserClosed === true &&
                report.cleanup.databasesClosed === true;
              await checkpoint(reportPath, report);
              process.off('SIGTERM', onTerm);
              process.off('SIGINT', onInt);
            }
            process.exitCode = report.passed ? 0 : 1;
          }

          async function supervise(outputDirectory) {
            await mkdir(outputDirectory, { recursive: true });
            const controlPath = join(outputDirectory, 'supervisor.json');
            const control = { startedAt: new Date().toISOString(), limits, passed: false };
            await checkpoint(controlPath, control);
            const child = spawn(
              process.execPath,
              ['--import', 'tsx', fileURLToPath(import.meta.url), '--worker', outputDirectory],
              {
                cwd: process.cwd(),
                env: process.env,
                stdio: ['ignore', 'inherit', 'inherit', 'ipc'],
                detached: true,
              },
            );
            let browserPid;
            child.on('message', (message) => {
              if (!Number.isInteger(message?.pid) || message.pid <= 0) return;
              if (message.kind === 'browser-opened') browserPid = message.pid;
              if (message.kind === 'browser-closed' && browserPid === message.pid) browserPid = undefined;
            });
            const terminateGroup = (pid, owner) => {
              if (!Number.isInteger(pid) || pid <= 0) return;
              try {
                process.kill(-pid, 'SIGKILL');
              } catch (error) {
                if (error.code !== 'ESRCH') control[owner + 'TerminationError'] = errorText(error);
              }
            };
            const stop = (reason) => {
              control.stopRequested ??= { reason, at: new Date().toISOString() };
              child.kill('SIGTERM');
            };
            const onTerm = () => stop('CI SIGTERM');
            const onInt = () => stop('SIGINT');
            process.on('SIGTERM', onTerm);
            process.on('SIGINT', onInt);

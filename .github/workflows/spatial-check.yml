              await transfer('Take two branches from camp storage', seed.bagId, PLAYER_ID, 'wood', 2);
              await transfer('Take one raw portion from camp storage', seed.bagId, PLAYER_ID, 'raw_meat', 1);
              assert.equal(total(seed.bagId, 'wood'), 2);

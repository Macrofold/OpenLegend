              await entry.enterGame(page);
              await expect(page.locator('#world')).toHaveAttribute('data-ready', 'true');
              assert.equal(game.service.paused, false, 'Real App entry must precede fixture preparation');
              entered = true;

              const total = (ownerId, definitionId) =>

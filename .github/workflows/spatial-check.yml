                  'No supported blank ground among the four actual scene selections: ' + purpose,
                );
              }
              async function chooseCreation(category, label) {
                await page
                  .locator('#contextMenu')
                  .getByRole('button', { name: /^Add something/ })
                  .click();
                await page
                  .getByRole('dialog', { name: 'Add something', exact: true })
                  .getByRole('button', { name: category, exact: true })
                  .click();
                await page
                  .getByRole('dialog', { name: category, exact: true })
                  .getByRole('option', { name: label, exact: true })
                  .click();
              }
              async function lose(kind, expectedBody, gesture) {
                assert.equal(await pending(), null);
                const before = report.sentCreations.length;
                active = { kind, expectedBody, posts: 0 };
                report.creations.push(active);
                await gesture();
                await expect.poll(() => active.delivery ?? active.deliveryError).toBeTruthy();
                assert.equal(routeFailure, undefined);
                assert.equal(active.delivery, 'lost after successful native commit');
                assert.equal(report.sentCreations.length, before + 1);
                await expect(recovery()).toBeVisible();
                await expect(recovery()).toContainText('The original result is not confirmed.');
                const retained = await pending();
                assert.equal(retained.kind, kind);
                assert.deepEqual(retained.body, active.request);
                assert.equal(retained.outcome, undefined);
                return active;
              }
              async function closeAndReload(record) {
                const before = report.sentCreations.length;
                await recovery()
                  .getByRole('button', { name: 'Close creation recovery', exact: true })
                  .click();
                await expect(recovery()).toBeHidden();
                assert.deepEqual((await pending()).body, record.request);
                await page.reload();
                await entry.enterGame(page);
                await expect(page.locator('#world')).toHaveAttribute('data-ready', 'true');
                const current = await state();
                assert.deepEqual(
                  lifetime(current),
                  originalLifetime,
                  'Same private owner/world/timeline/actor',
                );
                assert.equal(report.sentCreations.length, before, 'Close and reload send no creation');
                assert.deepEqual((await pending()).body, record.request);
                await expect(recovery()).toBeHidden();
                record.sameOwnerReloadRetained = true;
              }
              async function recover(record, captureName) {
                await expect(recovery()).toBeVisible();
                const retained = await pending();
                assert.deepEqual(retained.body, record.request);
                await expect(recovery()).toContainText(retained.label);
                await expect(recovery()).toContainText(retained.destinationLabel);
                await expect(page.getByRole('dialog', { name: 'Create item', exact: true })).toBeHidden();
                await expect(page.getByRole('dialog', { name: 'Create person', exact: true })).toBeHidden();
                await expect(recovery()).toContainText(
                  'Resolve this retained creation before creating something else.',
                );
                assert.equal(record.posts, 1, 'Opening a different entry does not dispatch');
                assert.ok(report.captures.length < 3);
                await page.screenshot({ path: join(output, captureName) });
                report.captures.push(captureName);
                const retry = recovery().getByRole('button', {
                  name: 'Retry original creation',
                  exact: true,
                });
                await retry.focus();
                await expect(retry).toBeFocused();
                await page.keyboard.press('Enter');
                await expect.poll(() => record.recovered || record.deliveryError).toBeTruthy();
                assert.equal(routeFailure, undefined);
                assert.equal(record.recovered, true);
                await expect(recovery()).toBeHidden();
                await expect(page.locator('#toast')).toHaveText(record.originalResult.message);
                assert.equal(await pending(), null, 'Confirmed request removed from private browser storage');
                assert.equal(record.posts, 2);
                record.retryInput = 'Focused Retry original creation button, then keyboard Enter';
                delete record.expectedBody;
                active = undefined;
              }

              // First effect: two actual raw-fiber units in the controlled character’s belongings.
              const itemOption = initial.godTools.itemOptions.find((option) => option.id === 'raw_fiber');
              const personOption = initial.godTools.spawnOptions.find((option) => option.id === 'person');
              const environmentOption = initial.godTools.spawnOptions.find(
                (option) => option.id === 'river-stones',
              );
              assert.ok(itemOption && personOption && environmentOption);
              assert.equal(environmentOption.category, 'Environment');
              const beforeItem = total(PLAYER_ID, itemOption.id);
              const beforeItemEvents = eventCount('god-item-created');
              await inventoryEntry();
              const itemForm = page.getByRole('dialog', { name: 'Create item', exact: true });
              await itemForm.getByRole('combobox', { name: 'Item', exact: true }).fill(itemOption.label);
              await page
                .getByRole('option', {
                  name: new RegExp('^' + itemOption.label.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')),
                })
                .click();
              await itemForm.getByRole('spinbutton', { name: 'Quantity', exact: true }).fill('2');
              const itemRecord = await lose(
                'item',
                {
                  definitionId: itemOption.id,
                  quantity: 2,
                  destination: { actorId: PLAYER_ID },
                },
                () => itemForm.getByRole('button', { name: 'Create 2 items', exact: true }).click(),
              );
              assert.equal(total(PLAYER_ID, itemOption.id), beforeItem + 2);
              assert.equal(eventCount('god-item-created'), beforeItemEvents + 1);
              assert.equal(itemFor(world(), itemRecord.originalResult.itemId).ownerId, PLAYER_ID);
              await closeAndReload(itemRecord);
              await ground('object', 'Open an environment entry while the item remains unresolved');
              await chooseCreation('Environment', environmentOption.label);
              await recover(itemRecord, '01-original-item-recovered-from-environment-entry.png');
              assert.equal(total(PLAYER_ID, itemOption.id), beforeItem + 2);
              assert.equal(eventCount('god-item-created'), beforeItemEvents + 1);

              // Second effect: one actual person with the native starting belongings and random traits.
              const personPosition = await ground('person', 'Create a person on actual blank ground');
              await chooseCreation('Actors', personOption.label);
              const personForm = page.getByRole('dialog', { name: 'Create person', exact: true });
              const person = {
                name: 'Mira',
                personality: 'Patient and observant.',
                backstory: 'Arrived at the clearing today.',
                traitIds: [],
                initialGoals: ['Learn the paths around the clearing.'],
              };
              await personForm.getByRole('textbox', { name: 'Name', exact: true }).fill(person.name);
              await personForm
                .getByRole('textbox', { name: 'Personality', exact: true })
                .fill(person.personality);
              await personForm
                .getByRole('textbox', { name: 'Backstory', exact: true })
                .fill(person.backstory);
              await personForm
                .getByRole('textbox', { name: 'Initial goals', exact: true })
                .fill(person.initialGoals[0]);
              const personRoots = worldRootEntities(world()).length;
              const beforePersonEvents = eventCount('god-spawned');
              const personRecord = await lose('person', { position: personPosition, ...person }, () =>
                personForm.getByRole('button', { name: 'Create person', exact: true }).click(),
              );
              const personId = personRecord.originalResult.entityId;
              assert.equal(worldRootEntities(world()).length, personRoots + 1);
              assert.equal(world().entities[personId].name, person.name);
              assert.deepEqual(worldPosition(world().entities[personId]), {
                x: personPosition.x,
                y: personPosition.y,
                z: personPosition.z,
              });
              assert.equal(worldSupport(world().entities[personId]), personPosition.surfaceId);
              assert.equal(world().entities[personId].actor.traits.length, 3);
              assert.equal(total(personId, 'stone_tool'), 1);
              assert.equal(total(personId, 'berries'), 3);
              assert.equal(eventCount('god-spawned'), beforePersonEvents + 1);
              const personTraits = structuredClone(world().entities[personId].actor.traits);
              await recovery().getByRole('button', { name: 'Close', exact: true }).click();
              await inventoryEntry();
              await recover(personRecord, '02-original-person-recovered-from-item-entry.png');
              assert.deepEqual(world().entities[personId].actor.traits, personTraits);
              assert.equal(total(personId, 'stone_tool'), 1);
              assert.equal(total(personId, 'berries'), 3);
              assert.equal(worldRootEntities(world()).length, personRoots + 1);
              assert.equal(eventCount('god-spawned'), beforePersonEvents + 1);
              personRecord.nativeStartingPossessions = { stone_tool: 1, berries: 3 };
              personRecord.nativeTraitCount = personTraits.length;

              // Third effect: one actual world-authored resource chosen from the selected ground’s menu.
              const environmentPosition = await ground('object', 'Create environment on actual blank ground');
              const environmentRoots = worldRootEntities(world()).length;
              const beforeEnvironmentEvents = eventCount('god-spawned');
              const environmentRecord = await lose(
                'environment',
                {
                  type: environmentOption.id,
                  position: environmentPosition,
                },
                () => chooseCreation('Environment', environmentOption.label),
              );
              const environmentId = environmentRecord.originalResult.entityId;
              const environment = world().entities[environmentId];
              assert.equal(worldRootEntities(world()).length, environmentRoots + 1);
              assert.equal(environment.name, environmentOption.label);
              assert.equal(environment.resource.definitionId, 'stone');
              assert.equal(environment.resource.quantity, 60);
              assert.deepEqual(worldPosition(environment), {
                x: environmentPosition.x,
                y: environmentPosition.y,
                z: environmentPosition.z,
              });
              assert.equal(worldSupport(environment), environmentPosition.surfaceId);
              assert.equal(eventCount('god-spawned'), beforeEnvironmentEvents + 1);
              await closeAndReload(environmentRecord);
              await inventoryEntry();
              await recover(environmentRecord, '03-original-environment-recovered-after-reload.png');
              assert.deepEqual(world().entities[environmentId], environment);
              assert.equal(worldRootEntities(world()).length, environmentRoots + 1);
              assert.equal(eventCount('god-spawned'), beforeEnvironmentEvents + 1);

              const final = await state();
              assert.deepEqual(lifetime(final), originalLifetime);
              assert.deepEqual(worldPosition(world().entities[PLAYER_ID]), initialPosition);
              assert.equal(world().simTime, initialTime);
              assert.equal(report.sentCreations.length, 6);
              assert.equal(report.creations.length, 3);
              assert.equal(new Set(report.creations.map((record) => record.request.id)).size, 3);
              assert.equal(
                Object.keys(world().commandReceipts).filter((id) => !initialReceiptIds.has(id)).length,
                3,
              );
              assert.equal(final.ai.budget.spentUsd, 0);
              assert.equal(final.ai.budget.reservedUsd, 0);
              assert.equal(final.ai.usage.llmCalls + final.ai.usage.jevCalls, 0);
              assert.deepEqual(report.pageErrors, []);
              assert.deepEqual(report.unexpectedRequests, []);
              report.final = {
                creationPosts: 6,
                firstCreations: 3,
                explicitOriginalRetries: 3,
                createdItemId: itemRecord.originalResult.itemId,
                createdPersonId: personId,
                createdEnvironmentId: environmentId,
                gameplayCommands: 0,
                suppliedWorldTransitions: 0,
                simulationSecondsAdvanced: 0,
                providerCalls: 0,
                providerCostUsd: 0,
                pendingCreation: false,
              };
              report.passed = true;
            } catch (error) {
              report.failure = errorText(error);
            } finally {
              if (deliveries.size) {
                const results = await Promise.allSettled([...deliveries]);
                if (results.some((result) => result.status === 'rejected')) {
                  report.cleanup.deliveryError = 'An owned delivery did not settle successfully.';
                  report.passed = false;
                }
              }
              if (routeFailure) {
                report.cleanup.routeError = routeFailure;
                report.passed = false;
              }
              if (traceStarted && context)
                try {
                  await context.tracing.stop({ path: join(output, 'trace.zip') });
                  report.trace = 'trace.zip';
                } catch (error) {
                  report.cleanup.traceError = errorText(error);
                  report.passed = false;
                }
              if (context)
                try {
                  await context.close();
                  report.cleanup.contextClosed = true;
                } catch (error) {
                  report.cleanup.contextError = errorText(error);
                  report.passed = false;
                }
              if (game)
                try {
                  report.cleanup.shutdown = await game.shutdown();
                  if (!report.cleanup.shutdown.saved || report.cleanup.shutdown.problems.length)
                    report.passed = false;
                } catch (error) {
                  report.cleanup.shutdownError = errorText(error);
                  report.passed = false;
                }
              if (store)
                try {
                  await store.close();
                  report.cleanup.repositoryClosed = true;
                } catch (error) {
                  report.cleanup.repositoryError = errorText(error);
                  report.passed = false;
                }
              report.finishedAt = new Date().toISOString();
              report.elapsedMs = Date.parse(report.finishedAt) - Date.parse(report.startedAt);
              await writeFile(join(output, 'report.json'), JSON.stringify(report, null, 2) + '\n');
            }
            return report;
          }

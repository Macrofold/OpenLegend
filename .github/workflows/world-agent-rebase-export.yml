name: Export World Agent rebase history
on:
  push:
    branches: [review/invention-extensibility]
    paths: [.github/workflows/world-agent-rebase-export.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: git bundle create /tmp/world-agent-rebase.bundle HEAD refs/remotes/origin/main
      - uses: actions/upload-artifact@v4
        with:
          name: world-agent-rebase-history
          path: /tmp/world-agent-rebase.bundle
          retention-days: 1

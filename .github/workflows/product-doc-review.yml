name: Product documentation review
on:
  push:
    branches: [docs/product-scalability]
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare guarded documentation and verify exact content
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/product-doc-review.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-documentation-final-review
          path: /tmp/product-documentation-final-review.zip
          retention-days: 1

name: Invention capability review export
on:
  push:
    branches: [review/invention-extensibility]
    paths: [.github/workflows/invention-capability-review.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export source and history only
        run: |
          git bundle create /tmp/openlegend-capability.bundle HEAD refs/remotes/origin/main refs/remotes/origin/review/invention-extensibility
      - uses: actions/upload-artifact@v4
        with:
          name: invention-capability-source
          path: /tmp/openlegend-capability.bundle
          retention-days: 1

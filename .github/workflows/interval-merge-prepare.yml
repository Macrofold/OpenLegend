name: Prepare reviewed interval merge
on:
  push:
    branches: [feature/spatial-world-3d]
    paths: [.github/workflows/interval-merge-prepare.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: controller
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: cfa7ab6cf6119a327e4b2b4df8149cdbee4b2bb6
          path: feature
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: c466b63f818021a6cd65d0809b94f220cce642d4
          path: common-base
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 03105fed9209c126e4e69e9faeb4687f42d1e74a
          path: current-main
          persist-credentials: false
      - name: Reproduce reviewed file reconciliation
        run: MERGE_ROOT="$GITHUB_WORKSPACE" python3 controller/.github/interval-merge-source.py
      - name: Prepare immutable objects only; branch publication uses the connector
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const paths = JSON.parse(fs.readFileSync('merge-paths.json', 'utf8'));
            const {owner,repo} = context.repo;
            const entries = [];
            for (const p of paths) {
              const bytes = fs.readFileSync(path.join('feature',p));
              const {data} = await github.rest.git.createBlob({owner,repo,content:bytes.toString('base64'),encoding:'base64'});
              entries.push({path:p,mode:'100644',type:'blob',sha:data.sha});
            }
            const {data:commit} = await github.rest.git.getCommit({owner,repo,commit_sha:context.sha});
            const {data:tree} = await github.rest.git.createTree({owner,repo,base_tree:commit.tree.sha,tree:entries});
            fs.writeFileSync('prepared-merge.json',JSON.stringify({parent:context.sha,main:'03105fed9209c126e4e69e9faeb4687f42d1e74a',tree:tree.sha,entries},null,2));
      - uses: actions/upload-artifact@v4
        with:
          name: prepared-interval-merge
          path: prepared-merge.json
          retention-days: 2

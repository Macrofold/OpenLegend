name: Publish reviewed documentation replay
on:
  push:
    branches: [docs/full-documentation-review-reconciled-2026-10-03]
    paths: [.github/workflows/full-documentation-review-rebase.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: full-documentation-review-rebase
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: review-reconcile
    env:
      AI_BUDGET_USD: '0'
      REVIEWED_ORIGINAL: 673f5085ec7168f8ec946d17ac8b295ae2e5217c
      REVIEWED_CANDIDATE: eaf299b50b397d2dd7bc09fb08ffc0f2d0345004
      REVIEWED_MAIN: 34233ae24365eb8911fe1995c9c232bd57f34616
      REVIEW_BRANCH: docs/full-documentation-review-reconciled-2026-10-03
      BACKUP_BRANCH: backup/full-doc-review-before-34233ae-20261005
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: review-reconcile
          fetch-depth: 0
          persist-credentials: false
          show-progress: false
      - uses: actions/download-artifact@v4
        with:
          name: documentation-review-replay-34233ae
          run-id: 37403623373
          github-token: ${{ github.token }}
          path: reviewed-replay
      - name: Install the exact reviewed candidate and preserve this publication commit
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$REVIEWED_ORIGINAL"
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/full-documentation-review-rebase.yml
          test "$(git rev-parse refs/remotes/origin/main)" = "$REVIEWED_MAIN"
          echo '65a94f3cc67599e0e5e1d885ebeaf156bcea0c2f5061dee0b521ad2236e2ac33  ../reviewed-replay/replay.bundle' | sha256sum --check
          test "$(cat ../reviewed-replay/after.txt)" = "$REVIEWED_CANDIDATE"
          git fetch ../reviewed-replay/replay.bundle HEAD
          test "$(git rev-parse FETCH_HEAD)" = "$REVIEWED_CANDIDATE"
          git checkout --detach "$REVIEWED_CANDIDATE"
          git config user.name 'OpenLegend documentation review'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          GIT_EDITOR=true git cherry-pick "$GITHUB_SHA"
          git diff --exit-code "$REVIEWED_CANDIDATE" HEAD -- . ':!.github/workflows/full-documentation-review-rebase.yml'
          git diff --exit-code "$REVIEWED_MAIN" HEAD -- AGENTS.md
          git diff --check "$REVIEWED_MAIN" HEAD
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: review-reconcile/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: review-reconcile/pnpm-lock.yaml
      - run: pnpm install --ignore-scripts --frozen-lockfile
      - name: Verify guidance, resolved-file formatting and comment-only source differences
        run: |
          pnpm guidance:check
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess
          paths = [entry['path'] for entry in json.loads(pathlib.Path('../reviewed-replay/resolutions.json').read_text())]
          subprocess.run(['pnpm', 'exec', 'prettier', '--check', *paths], check=True)
          base = os.environ['REVIEWED_MAIN']
          names = subprocess.check_output(['git', 'diff', '--name-only', base, 'HEAD', '--', 'apps', 'packages', 'scripts'], text=True).splitlines()
          for name in names:
              before = subprocess.check_output(['git', 'show', f'{base}:{name}'], text=True)
              after = pathlib.Path(name).read_text()
              before = re.sub(r'docs/projects/(?!completed/)', 'docs/projects/completed/', before)
              after = re.sub(r'docs/projects/(?!completed/)', 'docs/projects/completed/', after)
              before = before.replace('// Only replenishment transfers and health regeneration against damage remain here.', '// Conserved replenishment against a reservoir drain retains this one-second fallback.\n  // Health rates below require immediate integration, but do not select this fallback.')
              assert before == after, ('non-documentation source change', name)
          print(f'{len(paths)} resolved files formatted; {len(names)} runtime-source differences are documentation references/comments only. No game, database or provider checks run.')
          PY
      - name: Preserve the original branch and publish without overwriting concurrent work
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test "$(git ls-remote origin "refs/heads/$REVIEW_BRANCH" | cut -f1)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$REVIEWED_MAIN"
          test -z "$(git ls-remote origin "refs/heads/$BACKUP_BRANCH")"
          git -c 'credential.helper=!f() { printf "username=x-access-token\npassword=%s\n" "$GH_TOKEN"; }; f' push origin "$GITHUB_SHA:refs/heads/$BACKUP_BRANCH"
          git -c 'credential.helper=!f() { printf "username=x-access-token\npassword=%s\n" "$GH_TOKEN"; }; f' push --force-with-lease="refs/heads/$REVIEW_BRANCH:$GITHUB_SHA" origin "HEAD:refs/heads/$REVIEW_BRANCH"
          mkdir -p "$RUNNER_TEMP/review-published"
          git rev-parse HEAD | tee "$RUNNER_TEMP/review-published/head.txt"
          printf 'branch=%s\nbackup=%s\noriginal=%s\nmain=%s\ncheckout=%s\n' "$REVIEW_BRANCH" "$BACKUP_BRANCH" "$GITHUB_SHA" "$REVIEWED_MAIN" "$PWD" | tee "$RUNNER_TEMP/review-published/refs.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: documentation-review-published-34233ae
          path: ${{ runner.temp }}/review-published/
          retention-days: 7
          if-no-files-found: warn

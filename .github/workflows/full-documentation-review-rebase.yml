name: Refresh documentation review base
on:
  push:
    branches: [docs/full-documentation-review-reconciled-2026-10-03]
    paths: [.github/workflows/full-documentation-review-rebase.yml]
permissions:
  contents: read
concurrency:
  group: full-documentation-review-rebase
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    defaults:
      run:
        working-directory: review-reconcile
    env:
      AI_BUDGET_USD: '0'
      OLD_BASE: b50ec6ce75f260d68c18ec99d767982c65b0fccb
      NEW_BASE: c4e18d91848b5b6d367dda1d7214a9f8222cf070
      REVIEW_TIP: 398f97bdf03c7d63d6779c46ee46dfee25350161
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: review-reconcile
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve pinned sources and inspect replay without remote writes
        shell: bash
        run: |
          set -euo pipefail
          export REVIEW_OUTPUT="$RUNNER_TEMP/review-reconciliation"
          mkdir -p "$REVIEW_OUTPUT"
          pwd > "$REVIEW_OUTPUT/checkout-path.txt"
          git config user.name 'OpenLegend documentation review'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test "$(git merge-base "$GITHUB_SHA" "$NEW_BASE")" = "$OLD_BASE"
          test -z "$(git status --porcelain)"
          git diff "$OLD_BASE" "$NEW_BASE" > "$REVIEW_OUTPUT/upstream.patch"
          git diff "$OLD_BASE" "$REVIEW_TIP" > "$REVIEW_OUTPUT/prior-review.patch"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, zipfile
          output = pathlib.Path(os.environ['REVIEW_OUTPUT'])
          extensions = {'.md', '.mdc', '.txt', '.ts', '.tsx', '.mts', '.js', '.mjs', '.cjs', '.json', '.yaml', '.yml', '.css', '.html', '.sql', '.py', '.sh', '.toml'}
          for label, ref in [('review', os.environ['REVIEW_TIP']), ('main', os.environ['NEW_BASE'])]:
              rows = []
              with zipfile.ZipFile(output / f'{label}-source.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
                  for entry in subprocess.check_output(['git', 'ls-tree', '-r', '-z', '--long', ref]).split(b'\0'):
                      if not entry:
                          continue
                      metadata, raw_name = entry.split(b'\t', 1)
                      mode, kind, sha, size = metadata.decode().split()
                      name = raw_name.decode()
                      row = {'path': name, 'git_sha': sha, 'size': int(size) if size != '-' else None, 'included': False}
                      if kind == 'blob' and mode != '120000' and (pathlib.Path(name).suffix in extensions or name in ('LICENSE', '.env.example', '.gitignore', '.prettierignore')):
                          data = subprocess.check_output(['git', 'show', f'{ref}:{name}'])
                          text = data.decode('utf-8')
                          if 'archive' not in pathlib.PurePosixPath(name).parts:
                              archive.writestr(name, data)
                              row.update(included=True, sha256=hashlib.sha256(data).hexdigest())
                          elif pathlib.Path(name).suffix in ('.md', '.mdc', '.txt'):
                              row['headings'] = [line for line in text.splitlines() if line.startswith('#')]
                              row['incoming_references'] = [{'line': i, 'text': line} for i, line in enumerate(text.splitlines(), 1) if 'docs/' in line]
                      rows.append(row)
                  archive.writestr('_review_source_inventory.json', json.dumps({'revision': ref, 'files': rows}, indent=2))
          PY
          printf '%s\n' "$GITHUB_SHA" > "$REVIEW_OUTPUT/before.txt"
          if ! git rebase --onto "$NEW_BASE" "$OLD_BASE"; then
            git status --short > "$REVIEW_OUTPUT/conflicts.txt"
            git diff --cc > "$REVIEW_OUTPUT/conflicts.diff"
            git rev-parse REBASE_HEAD > "$REVIEW_OUTPUT/stopped-commit.txt"
            python3 - <<'PY'
          import os, pathlib, subprocess, zipfile
          output = pathlib.Path(os.environ['REVIEW_OUTPUT'])
          names = subprocess.check_output(['git', 'diff', '--name-only', '--diff-filter=U', '-z']).decode().strip('\0').split('\0')
          with zipfile.ZipFile(output / 'conflict-stages.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for name in names:
                  if not name:
                      continue
                  if pathlib.Path(name).is_file():
                      archive.write(name, 'worktree/' + name)
                  for stage in (1, 2, 3):
                      result = subprocess.run(['git', 'show', f':{stage}:{name}'], capture_output=True)
                      if result.returncode == 0:
                          archive.writestr(f'stage-{stage}/' + name, result.stdout)
              directory = pathlib.Path('.git/rebase-merge')
              for path in directory.glob('*'):
                  if path.is_file():
                      archive.write(path, 'rebase-state/' + path.name)
          PY
            exit 1
          fi
          git diff --check "$NEW_BASE" HEAD
          git range-diff "$OLD_BASE..$GITHUB_SHA" "$NEW_BASE..HEAD" > "$REVIEW_OUTPUT/range-diff.txt"
          git diff --binary --full-index "$NEW_BASE" HEAD > "$REVIEW_OUTPUT/review.patch"
          git rev-parse HEAD > "$REVIEW_OUTPUT/after.txt"
          git archive --format=zip --output="$REVIEW_OUTPUT/replayed-docs.zip" HEAD docs .agents AGENTS.md README.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: documentation-review-replay-c4e18d9
          path: ${{ runner.temp }}/review-reconciliation/
          retention-days: 3
          if-no-files-found: error

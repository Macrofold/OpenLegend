name: Refresh documentation review base
on:
  push:
    branches: [docs/full-documentation-review-reconciled-2026-10-03]
    paths:
      - .github/workflows/full-documentation-review-rebase.yml
      - .github/full-documentation-review-resolutions.json
permissions:
  contents: write
concurrency:
  group: full-documentation-review-rebase
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: review-reconcile
    env:
      AI_BUDGET_USD: '0'
      OLD_BASE: c4e18d91848b5b6d367dda1d7214a9f8222cf070
      NEW_BASE: d36ec3bd66f9b317748147003cc174f58cfd5642
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: review-reconcile
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve source and replay only explicitly reviewed conflicts
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, zipfile
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'review-reconciliation'
          output.mkdir()
          before, old, new = os.environ['GITHUB_SHA'], os.environ['OLD_BASE'], os.environ['NEW_BASE']
          def git(*args):
              return subprocess.check_output(['git', *args])
          assert git('merge-base', before, new).decode().strip() == old
          assert not git('status', '--porcelain')
          (output / 'refs.json').write_text(json.dumps({'before': before, 'old_base': old, 'new_base': new, 'checkout': str(pathlib.Path.cwd())}, indent=2))
          (output / 'upstream.patch').write_bytes(git('diff', '--binary', old, new))
          (output / 'original-review.patch').write_bytes(git('diff', '--binary', old, before))
          extensions = {'.md', '.mdc', '.txt', '.ts', '.tsx', '.mts', '.js', '.mjs', '.cjs', '.json', '.yaml', '.yml', '.css', '.html', '.sql', '.py', '.sh', '.toml'}
          def snapshot(ref, filename):
              inventory = []
              with zipfile.ZipFile(output / filename, 'w', zipfile.ZIP_DEFLATED) as archive:
                  for entry in git('ls-tree', '-r', '-z', '--long', ref).split(b'\0'):
                      if not entry:
                          continue
                      metadata, raw_name = entry.split(b'\t', 1)
                      mode, kind, sha, size = metadata.decode().split()
                      name = raw_name.decode()
                      path = pathlib.PurePosixPath(name)
                      row = {'path': name, 'git_sha': sha, 'included': False}
                      if kind == 'blob' and mode != '120000' and (path.suffix in extensions or name in ('LICENSE', '.env.example', '.gitignore', '.prettierignore')):
                          data = git('show', f'{ref}:{name}')
                          text = data.decode('utf-8')
                          if 'archive' not in path.parts:
                              archive.writestr(name, data)
                              row.update(included=True, sha256=hashlib.sha256(data).hexdigest())
                          elif path.suffix in ('.md', '.mdc', '.txt'):
                              row['headings'] = [line for line in text.splitlines() if line.startswith('#')]
                              row['incoming_references'] = [{'line': i, 'text': line} for i, line in enumerate(text.splitlines(), 1) if 'docs/' in line]
                      inventory.append(row)
                  archive.writestr('_review_inventory.json', json.dumps({'revision': ref, 'files': inventory}, indent=2))
          snapshot(before, 'review-source.zip')
          snapshot(new, 'main-source.zip')
          configuration = {}
          config_path = pathlib.Path('.github/full-documentation-review-resolutions.json')
          if config_path.exists():
              candidate = json.loads(config_path.read_text())
              if candidate.get('old_base') == old and candidate.get('new_base') == new:
                  configuration = candidate
          (output / 'resolutions.json').write_text(json.dumps(configuration, indent=2))
          subprocess.run(['git', 'config', 'user.name', 'OpenLegend documentation review'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          environment = dict(os.environ, GIT_EDITOR='true')
          result = subprocess.run(['git', 'rebase', '--onto', new, old], env=environment)
          while result.returncode:
              stopped = git('rev-parse', 'REBASE_HEAD').decode().strip()
              names = [x for x in git('diff', '--name-only', '--diff-filter=U', '-z').decode().split('\0') if x]
              resolution = configuration.get('resolutions', {}).get(stopped)
              if resolution is None or set(names) != {item['path'] for item in resolution['files']}:
                  (output / 'stopped-commit.txt').write_text(stopped + '\n')
                  (output / 'conflicts.txt').write_bytes(git('status', '--short'))
                  (output / 'conflicts.diff').write_bytes(git('diff', '--cc'))
                  with zipfile.ZipFile(output / 'conflict-stages.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
                      for name in names:
                          if pathlib.Path(name).is_file():
                              archive.write(name, 'worktree/' + name)
                          for stage in (1, 2, 3):
                              data = subprocess.run(['git', 'show', f':{stage}:{name}'], capture_output=True)
                              if data.returncode == 0:
                                  archive.writestr(f'stage-{stage}/' + name, data.stdout)
                      for path in pathlib.Path('.git/rebase-merge').glob('*'):
                          if path.is_file():
                              archive.write(path, 'rebase-state/' + path.name)
                  raise SystemExit('Unreviewed conflict preserved; no remote history published.')
              for item in resolution['files']:
                  path = pathlib.Path(item['path'])
                  assert not path.is_absolute() and '..' not in path.parts and not path.is_symlink()
                  text = path.read_text()
                  assert hashlib.sha256(text.encode()).hexdigest() == item['before_sha256'], ('changed conflict', str(path))
                  for stage, expected in item['stages'].items():
                      assert hashlib.sha256(git('show', f':{stage}:{path}')).hexdigest() == expected
                  end = 0
                  for start, stop, replacement in item['edits']:
                      assert type(start) is int and type(stop) is int and 0 <= end <= start <= stop <= len(text)
                      assert isinstance(replacement, str)
                      end = stop
                  for start, stop, replacement in reversed(item['edits']):
                      text = text[:start] + replacement + text[stop:]
                  assert hashlib.sha256(text.encode()).hexdigest() == item['after_sha256']
                  path.write_text(text)
              subprocess.run(['git', 'add', '--', *names], check=True)
              result = subprocess.run(['git', 'rebase', '--continue'], env=environment)
          subprocess.run(['git', 'diff', '--check', new, 'HEAD'], check=True)
          (output / 'range-diff.txt').write_bytes(git('range-diff', '--no-color', f'{old}..{before}', f'{new}..HEAD'))
          (output / 'review.patch').write_bytes(git('diff', '--binary', new, 'HEAD'))
          (output / 'after.txt').write_bytes(git('rev-parse', 'HEAD'))
          (output / 'publish.txt').write_text('yes' if configuration.get('publish') is True else 'no')
          snapshot('HEAD', 'replayed-source.zip')
          print('Replay prepared; publication remains disabled unless exact resolutions and publication are explicitly supplied.')
          PY
      - name: Check guidance without runtime or provider execution
        run: node scripts/check-agent-guidance.mjs
      - name: Publish only the reviewed replay with an exact lease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(cat "$RUNNER_TEMP/review-reconciliation/publish.txt")" = yes ]; then
            git -c 'credential.helper=!f() { printf "username=x-access-token\npassword=%s\n" "$GH_TOKEN"; }; f' push --force-with-lease=refs/heads/docs/full-documentation-review-reconciled-2026-10-03:${{ github.sha }} origin HEAD:refs/heads/docs/full-documentation-review-reconciled-2026-10-03
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: documentation-review-replay-d36ec3b
          path: ${{ runner.temp }}/review-reconciliation/
          retention-days: 7
          if-no-files-found: error

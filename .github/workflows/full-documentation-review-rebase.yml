name: Refresh documentation review base
on:
  push:
    branches: [docs/full-documentation-review-reconciled-2026-10-03]
    paths: [.github/workflows/full-documentation-review-rebase.yml]
permissions:
  contents: read
concurrency:
  group: full-documentation-review-rebase
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: review-reconcile
    env:
      AI_BUDGET_USD: '0'
      OLD_BASE: 34bfbc316394fc884dfd5f84fe1ce3607ea410a6
      NEW_BASE: 34233ae24365eb8911fe1995c9c232bd57f34616
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: review-reconcile
          fetch-depth: 0
          persist-credentials: false
          show-progress: false
      - name: Reuse the exact reviewed replay with one additional reviewed resolution
        run: |
          python3 - <<'PY'
          import subprocess, textwrap
          source = subprocess.check_output(['git', 'show', '4e5a052cc97431a29429bfc2bb7a09c09993b871:.github/workflows/full-documentation-review-rebase.yml'], text=True)
          marker = "          python3 - <<'PY'\n"
          script = textwrap.dedent(source.split(marker, 1)[1].split('\n          PY\n', 1)[0])
          old = "    '9f31c8079049d0a6b359712fa3a63b2eff22bc90': ('docs/maintainers/inventions-and-world-evolution.md', 1),"
          assert script.count(old) == 1
          script = script.replace(old, old + "\n    'ae85790a9c38095a4539ebc7849210811d287b15': ('docs/maintainers/world-agent-writes.md', 1),")
          marker = "            elif path.name.startswith('parallel-batch-03-personal-game-'):"
          assert script.count(marker) == 1
          additional = '''            elif stopped.startswith('ae85790a'):
                          assert hashlib.sha256(ours.encode()).hexdigest() == 'f01f922c4e06cc4626c1078b4eb12e04601dda899099923298facde3196c88a8'
                          assert hashlib.sha256(theirs.encode()).hexdigest() == 'ed1bd8b5076af0eccce9f74b4a16159db7c538e66ecd2dc7303b33372c901372'
                          old_note = 'Keep active work, resources, evidence and uncertainty coherent; do not change the unresolved owner-authoring exception.'
                          new_note = "Keep active work, resources, evidence and uncertainty coherent. Creator administration and scoped special-player invention freedom are accepted targets still awaiting INV-1.7/MP02 admission and persistence; do not turn them into an implicit runtime lock exception or broaden this adapter's grant."
                          assert ours.count(old_note) == 1
                          private = '  - **Private-subject authorization after awaited reads:**'
                          assert theirs.count(private) == 1
                          replacement = ours.replace(old_note, new_note) + private + theirs.split(private, 1)[1]
          '''
          # The literal above keeps its desired first-line indentation; normalize its body once.
          lines = additional.splitlines()
          additional = lines[0] + '\n' + '\n'.join(line[10:] for line in lines[1:] if line.strip()) + '\n'
          script = script.replace(marker, additional + marker)
          exec(compile(script, '<reviewed-replay>', 'exec'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: documentation-review-replay-34233ae
          path: ${{ runner.temp }}/review-reconciliation/
          retention-days: 7
          if-no-files-found: error

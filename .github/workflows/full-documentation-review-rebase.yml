name: Refresh documentation review base
on:
  push:
    branches: [docs/full-documentation-review-reconciled-2026-10-03]
    paths: [.github/workflows/full-documentation-review-rebase.yml]
permissions:
  contents: read
concurrency:
  group: full-documentation-review-rebase
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: review-reconcile
    env:
      AI_BUDGET_USD: '0'
      OLD_BASE: 34bfbc316394fc884dfd5f84fe1ce3607ea410a6
      NEW_BASE: 34233ae24365eb8911fe1995c9c232bd57f34616
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: review-reconcile
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare replay and preserve any conflicts without publishing
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/review-reconciliation"
          mkdir -p "$output"
          test -z "$(git status --porcelain)"
          test "$(git merge-base "$GITHUB_SHA" "$NEW_BASE")" = "$OLD_BASE"
          printf 'before=%s\nold_base=%s\nnew_base=%s\ncheckout=%s\n' "$GITHUB_SHA" "$OLD_BASE" "$NEW_BASE" "$PWD" | tee "$output/refs.txt"
          git config user.name 'OpenLegend documentation review'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --binary "$OLD_BASE" "$NEW_BASE" > "$output/upstream.patch"
          git diff --binary "$OLD_BASE" "$GITHUB_SHA" > "$output/original-review.patch"
          if ! GIT_EDITOR=true git -c rerere.enabled=false rebase --onto "$NEW_BASE" "$OLD_BASE"; then
            git status --short | tee "$output/conflicts.txt"
            git rev-parse REBASE_HEAD | tee "$output/stopped-commit.txt"
            git diff --cc | tee "$output/conflicts.diff"
            tar -czf "$output/conflicted-checkout.tar.gz" .git $(git diff --name-only --diff-filter=U)
            echo 'Replay stopped. Conflicted checkout preserved; remote history unchanged.'
            exit 1
          fi
          git diff --check "$NEW_BASE" HEAD
          git range-diff --no-color "$OLD_BASE..$GITHUB_SHA" "$NEW_BASE..HEAD" > "$output/range-diff.txt"
          git diff --binary "$NEW_BASE" HEAD > "$output/review.patch"
          git diff --stat "$NEW_BASE" HEAD
          git rev-parse HEAD | tee "$output/after.txt"
          git bundle create "$output/replay.bundle" HEAD
          cat "$output/range-diff.txt"
          echo 'Replay prepared only; no branch or main ref was updated.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: documentation-review-replay-34233ae
          path: ${{ runner.temp }}/review-reconciliation/
          retention-days: 7
          if-no-files-found: error

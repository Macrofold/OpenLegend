name: Refresh documentation review base
on:
  push:
    branches: [docs/full-documentation-review-reconciled-2026-10-03]
    paths: [.github/full-documentation-review-resolutions.json]
permissions:
  contents: write
concurrency:
  group: full-documentation-review-rebase
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    defaults:
      run:
        working-directory: review-reconcile
    env:
      AI_BUDGET_USD: '0'
      OLD_BASE: b50ec6ce75f260d68c18ec99d767982c65b0fccb
      NEW_BASE: c4e18d91848b5b6d367dda1d7214a9f8222cf070
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: review-reconcile
          fetch-depth: 0
          persist-credentials: false
      - name: Replay with exact reviewed resolutions only
        shell: bash
        run: |
          set -euo pipefail
          export REVIEW_OUTPUT="$RUNNER_TEMP/review-reconciliation"
          mkdir -p "$REVIEW_OUTPUT"
          pwd > "$REVIEW_OUTPUT/checkout-path.txt"
          git config user.name 'OpenLegend documentation review'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test "$(git merge-base "$GITHUB_SHA" "$NEW_BASE")" = "$OLD_BASE"
          test -z "$(git status --porcelain)"
          cp .github/full-documentation-review-resolutions.json "$REVIEW_OUTPUT/resolutions.json"
          printf '%s\n' "$GITHUB_SHA" > "$REVIEW_OUTPUT/before.txt"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, zipfile
          output = pathlib.Path(os.environ['REVIEW_OUTPUT'])
          configuration = json.loads((output / 'resolutions.json').read_text())
          environment = dict(os.environ, GIT_EDITOR='true')
          result = subprocess.run(['git', 'rebase', '--onto', os.environ['NEW_BASE'], os.environ['OLD_BASE']], env=environment)
          while result.returncode:
              stopped = subprocess.check_output(['git', 'rev-parse', 'REBASE_HEAD']).decode().strip()
              names = subprocess.check_output(['git', 'diff', '--name-only', '--diff-filter=U', '-z']).decode().strip('\0').split('\0')
              resolution = configuration['resolutions'].get(stopped)
              if resolution is None or set(names) != {item['path'] for item in resolution['files']}:
                  (output / 'stopped-commit.txt').write_text(stopped + '\n')
                  (output / 'conflicts.txt').write_bytes(subprocess.check_output(['git', 'status', '--short']))
                  (output / 'conflicts.diff').write_bytes(subprocess.check_output(['git', 'diff', '--cc']))
                  with zipfile.ZipFile(output / 'conflict-stages.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
                      for name in names:
                          if not name:
                              continue
                          if pathlib.Path(name).is_file():
                              archive.write(name, 'worktree/' + name)
                          for stage in (1, 2, 3):
                              data = subprocess.run(['git', 'show', f':{stage}:{name}'], capture_output=True)
                              if data.returncode == 0:
                                  archive.writestr(f'stage-{stage}/' + name, data.stdout)
                      for path in pathlib.Path('.git/rebase-merge').glob('*'):
                          if path.is_file():
                              archive.write(path, 'rebase-state/' + path.name)
                  raise SystemExit('Stopped at an unreviewed conflict; no remote history published.')
              planned = []
              for item in resolution['files']:
                  path = pathlib.Path(item['path'])
                  assert not path.is_absolute() and '..' not in path.parts and not path.is_symlink()
                  text = path.read_text()
                  assert hashlib.sha256(text.encode()).hexdigest() == item['before_sha256'], ('unreviewed conflict bytes', str(path))
                  for stage, expected in item['stages'].items():
                      data = subprocess.check_output(['git', 'show', f':{stage}:{path}'])
                      assert hashlib.sha256(data).hexdigest() == expected, ('unreviewed stage', str(path), stage)
                  end = 0
                  for start, stop, replacement in item['edits']:
                      assert type(start) is int and type(stop) is int and 0 <= end <= start <= stop <= len(text)
                      assert isinstance(replacement, str)
                      end = stop
                  for start, stop, replacement in reversed(item['edits']):
                      text = text[:start] + replacement + text[stop:]
                  assert hashlib.sha256(text.encode()).hexdigest() == item['after_sha256'], ('unexpected resolution', str(path))
                  planned.append((path, text))
              for path, text in planned:
                  path.write_text(text)
              subprocess.run(['git', 'add', '--', *names], check=True)
              result = subprocess.run(['git', 'rebase', '--continue'], env=environment)
          (output / 'publish.txt').write_text('yes' if configuration.get('publish') is True else 'no')
          PY
          git diff --check "$NEW_BASE" HEAD
          git range-diff "$OLD_BASE..$GITHUB_SHA" "$NEW_BASE..HEAD" > "$REVIEW_OUTPUT/range-diff.txt"
          git diff --binary --full-index "$NEW_BASE" HEAD > "$REVIEW_OUTPUT/review.patch"
          git rev-parse HEAD > "$REVIEW_OUTPUT/after.txt"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, zipfile
          out = pathlib.Path(os.environ['REVIEW_OUTPUT'])
          revision = subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode().strip()
          extensions = {'.md', '.mdc', '.txt', '.ts', '.tsx', '.mts', '.js', '.mjs', '.cjs', '.json', '.yaml', '.yml', '.css', '.html', '.sql', '.py', '.sh', '.toml'}
          inventory = []
          with zipfile.ZipFile(out / 'replayed-source.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for entry in subprocess.check_output(['git', 'ls-tree', '-r', '-z', '--long', 'HEAD']).split(b'\0'):
                  if not entry:
                      continue
                  metadata, raw_name = entry.split(b'\t', 1)
                  mode, kind, sha, size = metadata.decode().split()
                  name = raw_name.decode()
                  row = {'path': name, 'git_sha': sha, 'size': int(size) if size != '-' else None, 'included': False}
                  path = pathlib.Path(name)
                  if kind == 'blob' and mode != '120000' and (path.suffix in extensions or name in ('LICENSE', '.env.example', '.gitignore', '.prettierignore')):
                      data = path.read_bytes()
                      text = data.decode('utf-8')
                      if 'archive' not in path.parts:
                          archive.writestr(name, data)
                          row.update(included=True, sha256=hashlib.sha256(data).hexdigest())
                      elif path.suffix in ('.md', '.mdc', '.txt'):
                          row['headings'] = [line for line in text.splitlines() if line.startswith('#')]
                          row['incoming_references'] = [{'line': i, 'text': line} for i, line in enumerate(text.splitlines(), 1) if 'docs/' in line]
                  inventory.append(row)
              archive.writestr('_review_source_inventory.json', json.dumps({'revision': revision, 'files': inventory}, indent=2))
          PY
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: review-reconcile/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify guidance and format the reviewed action inventory
        run: |
          pnpm install --ignore-scripts --frozen-lockfile
          pnpm exec prettier --write docs/maintainers/action-capabilities.md
          python3 - <<'PYCODE'
          import hashlib, pathlib
          path = pathlib.Path('docs/maintainers/action-capabilities.md')
          assert hashlib.sha256(path.read_bytes()).hexdigest() == 'a93f9ca9d56197aa7ce7a0199960799813804c342b0e12044f0a68bdd81b3e68', 'unexpected formatted action tracker'
          PYCODE
          pnpm guidance:check
          pnpm exec prettier --check docs/maintainers/action-capabilities.md docs/limits/persistence.md docs/maintainers/save-and-load.md docs/architecture.md docs/maintainers/agent-guidance.md docs/maintainers/needs-design.md
          git diff --check
          if ! git diff --quiet -- docs/maintainers/action-capabilities.md; then
            git add -- docs/maintainers/action-capabilities.md
            git commit -m 'docs: format reconciled action-capability inventory'
          fi
          git rev-parse HEAD > "$RUNNER_TEMP/review-reconciliation/verified-after.txt"
          git diff --binary --full-index "$NEW_BASE" HEAD > "$RUNNER_TEMP/review-reconciliation/verified-review.patch"
      - name: Publish only an explicitly reviewed replay with an exact lease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(cat "$RUNNER_TEMP/review-reconciliation/publish.txt")" = yes ]; then
            git -c 'credential.helper=!f() { printf "username=x-access-token\npassword=%s\n" "$GH_TOKEN"; }; f' push --force-with-lease=refs/heads/docs/full-documentation-review-reconciled-2026-10-03:${{ github.sha }} origin HEAD:refs/heads/docs/full-documentation-review-reconciled-2026-10-03
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: documentation-review-replay-c4e18d9
          path: ${{ runner.temp }}/review-reconciliation/
          retention-days: 3
          if-no-files-found: error

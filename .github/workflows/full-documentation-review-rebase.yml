name: Refresh documentation review base
on:
  push:
    branches: [docs/full-documentation-review-reconciled-2026-10-03]
    paths: [.github/workflows/full-documentation-review-rebase.yml]
permissions:
  contents: read
concurrency:
  group: full-documentation-review-rebase
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: review-reconcile
    env:
      AI_BUDGET_USD: '0'
      OLD_BASE: 34bfbc316394fc884dfd5f84fe1ce3607ea410a6
      NEW_BASE: 34233ae24365eb8911fe1995c9c232bd57f34616
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: review-reconcile
          fetch-depth: 0
          persist-credentials: false
          show-progress: false
      - name: Replay only exact reviewed resolutions and preserve other conflicts
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess, tarfile, zipfile
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'review-reconciliation'
          out.mkdir()
          before, old, new = os.environ['GITHUB_SHA'], os.environ['OLD_BASE'], os.environ['NEW_BASE']
          def git(*args):
              return subprocess.check_output(['git', *args])
          assert not git('status', '--porcelain')
          assert git('merge-base', before, new).decode().strip() == old
          (out / 'refs.json').write_text(json.dumps({'before': before, 'old_base': old, 'new_base': new, 'checkout': str(pathlib.Path.cwd())}, indent=2))
          subprocess.run(['git', 'config', 'user.name', 'OpenLegend documentation review'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          (out / 'upstream.patch').write_bytes(git('diff', '--binary', old, new))
          (out / 'original-review.patch').write_bytes(git('diff', '--binary', old, before))
          env = dict(os.environ, GIT_EDITOR='true')
          def replay(*args):
              result = subprocess.run(['git', *args], env=env, capture_output=True)
              with (out / 'replay.log').open('ab') as log:
                  log.write(result.stdout + result.stderr)
              return result
          result = replay('-c', 'rerere.enabled=false', 'rebase', '--onto', new, old)
          resolved = []
          allowed = {
              '751525b3cb5b459a7dba47d55bd16d568b03a1b3': ('docs/maintainers/performance-profiling.md', 1),
              '21c16580c1830b1e83c6cb2fce42539d548123fb': ('docs/projects/shadow-quality-feature-spec.md', 1),
              'b7ceb27c64017e9adad942f2ef2145cae45c70ac': ('docs/projects/shadow-quality-tech-design.md', 2),
              '666a454f75f5b5aba660a7bb0db4ac6dd3b3b2cf': ('docs/projects/parallel-batch-03-personal-game-feature-spec.md', 1),
          }
          while result.returncode:
              stopped = git('rev-parse', 'REBASE_HEAD').decode().strip()
              names = [name for name in git('diff', '--name-only', '--diff-filter=U', '-z').decode().split('\0') if name]
              if stopped in allowed and names == [allowed[stopped][0]]:
                  path = pathlib.Path(names[0])
                  text = path.read_text()
                  pattern = r'^<<<<<<< HEAD\n(.*?)^=======\n(.*?)^>>>>>>> [^\n]+\n'
                  matches = list(re.finditer(pattern, text, re.MULTILINE | re.DOTALL))
                  assert len(matches) == allowed[stopped][1], ('changed conflict count', stopped)
                  merged = text
                  for match in reversed(matches):
                      ours, theirs = match.group(1), match.group(2)
                      if stopped.startswith('751525b3'):
                          intro, shared = ours.split('\n\n', 1)
                          assert intro.startswith('The profiler explicitly takes control through the player endpoint,')
                          assert shared.count('refused before migrations.') == 1
                          assert theirs == shared.replace('refused before migrations.', 'refused before disposable-fixture initialization.'), 'changed profiler conflict'
                          replacement = ours.replace('refused before migrations.', 'refused before disposable-fixture initialization.')
                      elif stopped.startswith('666a454f'):
                          assert "PG03 and scoped PG04 are delivered; PG01's exact billing hold, PG02/PG05 and broader PF05 qualification remain open." in ours
                          assert 'PG02, PG03 and PG04 are underway on separate branches; integrated delivery and the remaining acceptance are open.' in theirs
                          assert ours.startswith('| Status') and theirs.startswith('| Status')
                          assert 'PG03 and the scoped offer/drop preview work are included here; PG02 and other PG04 work retain their independent acceptance.' in ours
                          replacement = ours
                      elif ours.startswith('| Status'):
                          assert 'Shadow improvements and scoped PG04 preview optimization are delivered; reliable sustained tails and physical lower-end qualification remain open.' in ours
                          assert 'Artwork-aligned shadows and the supplied model are delivered; frame-time, combined-model and physical-device qualification remain open.' in theirs
                          assert all(line.startswith('|') for side in (ours, theirs) for line in side.splitlines())
                          replacement = ours
                      else:
                          assert stopped.startswith('b7ceb27c')
                          first, rest = ours.split('\n\n', 1)
                          old_ending = 'Existing floor-hearing test failure is reproduced on the original code and tracked in SW08/HE05. The plan remains partially delivered, not closed by these narrower gains.'
                          new_ending = 'The floor-hearing test failure was reproduced on the original code at that checkpoint. The later [October 1 fixture correction](../verification/hearing-main-integration.md#floor-hearing-regression--october-1-2026) repairs those obsolete sight-barrier and speech-origin assertions without changing production acoustics; that specific SW08 regression is no longer an open blocker. HE05 retains broader hearing qualification. The plan remains partially delivered because the narrower route-query gains do not establish whole-game tail improvement or physical lower-end performance.'
                          assert first.count(old_ending) == 1
                          assert theirs == first.replace(old_ending, new_ending) + '\n', 'changed hearing correction'
                          assert rest.startswith('The October 4 [PG04 follow-up]')
                          assert '### Meter/follow preview extension' in rest
                          replacement = theirs + '\n' + rest
                      merged = merged[:match.start()] + replacement + merged[match.end():]
                  assert not re.search(r'^(<<<<<<<|=======|>>>>>>>)', merged, re.MULTILINE)
                  path.write_text(merged)
                  print('RESOLVED:', stopped, str(path))
                  resolved.append({'commit': stopped, 'path': str(path), 'sha256': hashlib.sha256(merged.encode()).hexdigest()})
                  subprocess.run(['git', 'add', '--', str(path)], check=True)
                  result = replay('rebase', '--continue')
                  continue
              (out / 'stopped-commit.txt').write_text(stopped + '\n')
              (out / 'conflicts.txt').write_bytes(git('status', '--short'))
              diff = git('diff', '--cc')
              (out / 'conflicts.diff').write_bytes(diff)
              print('STOPPED COMMIT:', stopped)
              print(diff.decode())
              with tarfile.open(out / 'conflicted-checkout.tar.gz', 'w:gz') as archive:
                  archive.add('.git')
                  for name in names:
                      if pathlib.Path(name).exists():
                          archive.add(name)
              raise SystemExit('Unresolved conflict preserved; no remote history published.')
          (out / 'resolutions.json').write_text(json.dumps(resolved, indent=2))
          subprocess.run(['git', 'diff', '--check', new, 'HEAD'], check=True)
          rangediff = git('range-diff', '--no-color', f'{old}..{before}', f'{new}..HEAD')
          (out / 'range-diff.txt').write_bytes(rangediff)
          (out / 'review.patch').write_bytes(git('diff', '--binary', new, 'HEAD'))
          (out / 'after.txt').write_bytes(git('rev-parse', 'HEAD'))
          subprocess.run(['git', 'bundle', 'create', str(out / 'replay.bundle'), 'HEAD'], check=True)
          extensions = {'.md', '.mdc', '.txt', '.ts', '.tsx', '.mts', '.js', '.mjs', '.cjs', '.json', '.yaml', '.yml', '.css', '.html', '.sql', '.py', '.sh', '.toml'}
          for ref, label in [(before, 'original'), (new, 'main'), ('HEAD', 'replayed')]:
              inventory = []
              with zipfile.ZipFile(out / f'{label}-source.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
                  for entry in git('ls-tree', '-r', '-z', ref).split(b'\0'):
                      if not entry:
                          continue
                      metadata, raw_name = entry.split(b'\t', 1)
                      mode, kind, sha = metadata.decode().split()
                      name = raw_name.decode()
                      path = pathlib.PurePosixPath(name)
                      row = {'path': name, 'git_sha': sha, 'included': False}
                      if kind == 'blob' and mode != '120000' and (path.suffix in extensions or name in ('LICENSE', '.env.example', '.prettierignore', '.gitignore')):
                          data = git('show', f'{ref}:{name}')
                          text = data.decode('utf-8')
                          if 'archive' not in path.parts:
                              archive.writestr(name, data)
                              row.update(included=True, sha256=hashlib.sha256(data).hexdigest())
                          elif path.suffix == '.md':
                              row['headings'] = [line for line in text.splitlines() if line.startswith('#')]
                      inventory.append(row)
                  archive.writestr('_review_inventory.json', json.dumps({'revision': git('rev-parse', ref).decode().strip(), 'files': inventory}, indent=2))
          print(rangediff.decode())
          print('Replay prepared only; no remote ref updated.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: documentation-review-replay-34233ae
          path: ${{ runner.temp }}/review-reconciliation/
          retention-days: 7
          if-no-files-found: error

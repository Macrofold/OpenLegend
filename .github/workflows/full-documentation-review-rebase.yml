name: Refresh documentation review base
on:
  push:
    branches: [docs/full-documentation-review-reconciled-2026-10-03]
    paths: [.github/workflows/full-documentation-review-rebase.yml]
permissions:
  contents: read
concurrency:
  group: full-documentation-review-rebase
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: review-reconcile
    env:
      AI_BUDGET_USD: '0'
      OLD_BASE: 34bfbc316394fc884dfd5f84fe1ce3607ea410a6
      NEW_BASE: 34233ae24365eb8911fe1995c9c232bd57f34616
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: review-reconcile
          fetch-depth: 0
          persist-credentials: false
      - name: Replay only exact reviewed resolutions and preserve other conflicts
        run: |
          python3 - <<'PY'
          import difflib, hashlib, json, os, pathlib, re, subprocess, tarfile
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'review-reconciliation'
          out.mkdir()
          before, old, new = os.environ['GITHUB_SHA'], os.environ['OLD_BASE'], os.environ['NEW_BASE']
          def git(*args):
              return subprocess.check_output(['git', *args])
          assert not git('status', '--porcelain')
          assert git('merge-base', before, new).decode().strip() == old
          (out / 'refs.json').write_text(json.dumps({'before': before, 'old_base': old, 'new_base': new, 'checkout': str(pathlib.Path.cwd())}, indent=2))
          subprocess.run(['git', 'config', 'user.name', 'OpenLegend documentation review'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          (out / 'upstream.patch').write_bytes(git('diff', '--binary', old, new))
          (out / 'original-review.patch').write_bytes(git('diff', '--binary', old, before))
          env = dict(os.environ, GIT_EDITOR='true')
          result = subprocess.run(['git', '-c', 'rerere.enabled=false', 'rebase', '--onto', new, old], env=env)
          resolved = []
          while result.returncode:
              stopped = git('rev-parse', 'REBASE_HEAD').decode().strip()
              names = [name for name in git('diff', '--name-only', '--diff-filter=U', '-z').decode().split('\0') if name]
              if stopped == '751525b3cb5b459a7dba47d55bd16d568b03a1b3' and names == ['docs/maintainers/performance-profiling.md']:
                  path = pathlib.Path(names[0])
                  text = path.read_text()
                  pattern = r'^<<<<<<< HEAD\n(.*?)^=======\n(.*?)^>>>>>>> [^\n]+\n'
                  matches = list(re.finditer(pattern, text, re.MULTILINE | re.DOTALL))
                  assert len(matches) == 1, 'changed profiler conflict count'
                  match = matches[0]
                  ours, theirs = match.group(1), match.group(2)
                  intro, shared = ours.split('\n\n', 1)
                  assert intro.startswith('The profiler explicitly takes control through the player endpoint,')
                  assert shared.count('refused before migrations.') == 1
                  assert theirs == shared.replace('refused before migrations.', 'refused before disposable-fixture initialization.'), 'changed profiler conflict'
                  replacement = ours.replace('refused before migrations.', 'refused before disposable-fixture initialization.')
                  merged = text[:match.start()] + replacement + text[match.end():]
                  assert not re.search(r'^(<<<<<<<|=======|>>>>>>>)', merged, re.MULTILINE)
                  path.write_text(merged)
                  print('RESOLVED: profiler control/measurement addition retained; only obsolete migration wording replaced.')
                  resolved.append({'commit': stopped, 'path': str(path), 'sha256': hashlib.sha256(merged.encode()).hexdigest()})
                  subprocess.run(['git', 'add', '--', str(path)], check=True)
                  result = subprocess.run(['git', 'rebase', '--continue'], env=env)
                  continue
              (out / 'stopped-commit.txt').write_text(stopped + '\n')
              (out / 'conflicts.txt').write_bytes(git('status', '--short'))
              diff = git('diff', '--cc')
              (out / 'conflicts.diff').write_bytes(diff)
              print('STOPPED COMMIT:', stopped)
              print(diff.decode())
              with tarfile.open(out / 'conflicted-checkout.tar.gz', 'w:gz') as archive:
                  archive.add('.git')
                  for name in names:
                      if pathlib.Path(name).exists():
                          archive.add(name)
              raise SystemExit('Unresolved conflict preserved; no remote history published.')
          (out / 'resolutions.json').write_text(json.dumps(resolved, indent=2))
          subprocess.run(['git', 'diff', '--check', new, 'HEAD'], check=True)
          rangediff = git('range-diff', '--no-color', f'{old}..{before}', f'{new}..HEAD')
          (out / 'range-diff.txt').write_bytes(rangediff)
          (out / 'review.patch').write_bytes(git('diff', '--binary', new, 'HEAD'))
          (out / 'after.txt').write_bytes(git('rev-parse', 'HEAD'))
          subprocess.run(['git', 'bundle', 'create', str(out / 'replay.bundle'), 'HEAD'], check=True)
          print(rangediff.decode())
          print('Replay prepared only; no remote ref updated.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: documentation-review-replay-34233ae
          path: ${{ runner.temp }}/review-reconciliation/
          retention-days: 7
          if-no-files-found: error

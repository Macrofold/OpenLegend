name: Publish reviewed unified authoring interface
on:
  push:
    branches: [feature/invention-repertoire-foundation]
    paths: [.github/workflows/agent-ui-publish.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply reviewed interface and native review diff without tests
        run: |
          cat .agent-ui-part0 .agent-ui-part1 .agent-ui-part2 | base64 --decode | gzip -d > /tmp/agent-ui.patch
          echo '53f96c1570f8f3dd2f99b3bc3af167cdcc6143f5e3398edcbab985fe8523075e  /tmp/agent-ui.patch' | sha256sum -c -
          git apply --unidiff-zero --check /tmp/agent-ui.patch
          git apply --unidiff-zero /tmp/agent-ui.patch
          rm .agent-ui-part0 .agent-ui-part1 .agent-ui-part2 .github/workflows/agent-ui-publish.yml
          git add -A
          test "$(git write-tree)" = "10f13be4f7e2fa6d63ea1faa2b88267ac1c9e2d1"
          git -c user.name='OpenLegend implementation' -c user.email='implementation@users.noreply.github.com' commit -m '[skip ci] Connect unified owner conversation to durable MCP reviews and exact Apply'
          git push origin HEAD:feature/invention-repertoire-foundation

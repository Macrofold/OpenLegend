name: UI completion verification
on:
  push:
    branches: [docs/game-ui-research-redesign]
    paths: [.github/workflows/ui-completion.yml]
permissions:
  contents: write
jobs:
  qualify:
    if: github.repository == 'Macrofold/OpenLegend'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: openlegend
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U openlegend -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AI_BUDGET_USD: '0'
      OPENLEGEND_TEST_DATABASE_URL: postgresql://openlegend:fixture@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          show-progress: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install the pinned runtime and browser
        run: |
          pnpm install --frozen-lockfile > "$RUNNER_TEMP/install.log" 2>&1 || { tail -60 "$RUNNER_TEMP/install.log"; exit 1; }
          pnpm exec playwright install --with-deps chromium > "$RUNNER_TEMP/browser-install.log" 2>&1 || { tail -60 "$RUNNER_TEMP/browser-install.log"; exit 1; }
      - name: Run required code and ordinary browser checks without changing deadlines
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, urllib.request
          from pathlib import Path
          report = Path(os.environ['RUNNER_TEMP']) / 'ui-required'
          report.mkdir()
          results = {}
          def run(label, args):
              with (report / (label + '.log')).open('w') as output:
                  results[label] = subprocess.run(args, stdout=output, stderr=subprocess.STDOUT).returncode
              print(label + ': ' + str(results[label]), flush=True)
              print('\n'.join((report / (label + '.log')).read_text().splitlines()[-100 if results[label] else -5:]), flush=True)
          # Code stopped on these exact formatting differences, before any tests.
          # Preserve logic and pinned tooling; do not treat formatting as a game failure.
          run('format-correction', ['pnpm', 'exec', 'prettier', '--write', '.github/workflows/ui-completion.yml', 'docs/maintainers/ui-ux.md', 'packages/spatial/src/coverage.ts'])
          for label, args in [
              ('guidance', ['pnpm', 'guidance:check']),
              ('configuration', ['pnpm', 'config:check']),
              ('format', ['pnpm', 'format:check']),
              ('types', ['pnpm', 'typecheck']),
              ('build', ['pnpm', 'build']),
              ('tests', ['pnpm', 'exec', 'vitest', 'run', '--reporter=json', '--outputFile=' + str(report / 'tests.json')]),
              ('browser', ['pnpm', 'exec', 'playwright', 'test', '--reporter=line']),
          ]:
              run(label, args)
          if (report / 'tests.json').exists():
              data = json.loads((report / 'tests.json').read_text())
              failures = []
              for suite in data['testResults']:
                  for test in suite['assertionResults']:
                      if test['status'] == 'failed':
                          failures.append({'file': str(Path(suite['name']).relative_to(Path.cwd())), 'name': test['fullName'], 'errors': test.get('failureMessages', [])})
              summary = {'total': data['numTotalTests'], 'passed': data['numPassedTests'], 'failed': data['numFailedTests'], 'failures': failures}
              (report / 'test-summary.json').write_text(json.dumps(summary, indent=2))
              print('TEST_SUMMARY=' + json.dumps(summary, indent=2), flush=True)
          def git(*args): return subprocess.check_output(['git', *args])
          paths = git('diff', '--name-only').decode().splitlines()
          allowed = {'.github/workflows/ui-completion.yml', 'docs/maintainers/ui-ux.md', 'packages/spatial/src/coverage.ts'}
          assert set(paths) <= allowed, paths
          assert not git('ls-files', '--others', '--exclude-standard').decode().strip()
          git('diff', '--check')
          patch = git('diff')
          (report / 'format.patch').write_bytes(patch)
          print('FORMAT_DIFF=' + patch.decode(), flush=True)
          tree = git('rev-parse', 'HEAD^{tree}').decode().strip()
          if paths:
              payload = {'base_tree': tree, 'tree': [{'path': path, 'type': 'blob', 'mode': '100644', 'content': Path(path).read_text()} for path in paths]}
              request = urllib.request.Request('https://api.github.com/repos/Macrofold/OpenLegend/git/trees', method='POST', data=json.dumps(payload).encode(), headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(request, timeout=120) as response: tree = json.load(response)['sha']
              git('add', '--', *paths)
              assert git('write-tree').decode().strip() == tree
          metadata = {'parent': os.environ['GITHUB_SHA'], 'tree': tree, 'checks': results, 'changed_paths': paths}
          (report / 'metadata.json').write_text(json.dumps(metadata, indent=2))
          print('REQUIRED_CHECKS=' + json.dumps(metadata, indent=2), flush=True)
          print('Detached checkout ' + os.getcwd() + '; no commits or branch references changed by this runner.', flush=True)
          if any(results.values()): raise SystemExit(1)
          PY
      - name: Preserve results and original failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-required
          path: |
            ${{ runner.temp }}/ui-required/
            test-results/
          retention-days: 3
          if-no-files-found: error

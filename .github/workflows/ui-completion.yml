name: UI completion verification
on:
  push:
    branches: [docs/game-ui-research-redesign]
    paths: [.github/workflows/ui-completion.yml]
permissions:
  contents: read
  actions: read
jobs:
  qualify:
    if: github.repository == 'Macrofold/OpenLegend'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read only the saved fixture responses from the UI trace
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --location --max-time 120 --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' https://api.github.com/repos/Macrofold/OpenLegend/actions/artifacts/11945195031/zip --output "$RUNNER_TEMP/ui-observations.zip"
          python3 - <<'PY'
          import hashlib, io, json, os, zipfile
          from pathlib import Path
          archive = Path(os.environ['RUNNER_TEMP']) / 'ui-observations.zip'
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == 'b309fc2aad58b4213ad927a6297adcec6abad93076f4b80ec7c799aafee1243c'
          with zipfile.ZipFile(archive) as outer:
              for name in outer.namelist():
                  if not name.endswith('trace.zip'): continue
                  print('SCENARIO=' + name, flush=True)
                  with zipfile.ZipFile(io.BytesIO(outer.read(name))) as trace:
                      for network in trace.namelist():
                          if not network.endswith('.network'): continue
                          for line in trace.read(network).decode().splitlines():
                              record = json.loads(line).get('snapshot', {})
                              request = record.get('request', {})
                              response = record.get('response', {})
                              url = request.get('url', '')
                              if not url.endswith(('/api/inventory/destinations', '/api/inventory', '/api/command')): continue
                              content = response.get('content', {})
                              sha = content.get('_sha1')
                              print('REQUEST=' + url.rsplit('/', 2)[-2] + '/' + url.rsplit('/', 1)[-1] + ' ' + request.get('postData', {}).get('text', ''), flush=True)
                              print('STATUS=' + str(response.get('status')), flush=True)
                              if sha and 'resources/' + sha in trace.namelist():
                                  body = json.loads(trace.read('resources/' + sha))
                                  # Scope tokens and credentials are not needed to diagnose a UI choice.
                                  if isinstance(body, dict):
                                      for key in ['scope', 'access', 'commandEpoch', 'checkpoint']: body.pop(key, None)
                                  print('REPLY=' + json.dumps(body, ensure_ascii=False)[:24000], flush=True)
          print('Read existing disposable UI evidence only. No game, provider or Git mutation.', flush=True)
          PY

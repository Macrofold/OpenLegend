name: UI completion verification
on:
  push:
    branches: [docs/game-ui-research-redesign]
    paths: [.github/workflows/ui-completion.yml, .github/scripts/ui-finish.py, .github/scripts/ui-verify.py]
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'Macrofold/OpenLegend'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: openlegend
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U openlegend -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AI_BUDGET_USD: '0'
      OPENLEGEND_TEST_DATABASE_URL: postgresql://openlegend:fixture@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          show-progress: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install pinned dependencies and Chromium
        run: |
          pnpm install --frozen-lockfile > "$RUNNER_TEMP/install.log" 2>&1 || { tail -60 "$RUNNER_TEMP/install.log"; exit 1; }
          pnpm exec playwright install --with-deps chromium > "$RUNNER_TEMP/browser-install.log" 2>&1 || { tail -60 "$RUNNER_TEMP/browser-install.log"; exit 1; }
      - name: Exercise the real App server and PostgreSQL recovery paths
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/ui-verify.py
      - name: Preserve exact results and images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-finish
          path: ${{ runner.temp }}/ui-finish/
          retention-days: 3
          if-no-files-found: error

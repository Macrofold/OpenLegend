name: Temporary finite UI completion observations
on:
  push:
    branches: [docs/game-ui-research-redesign]
    paths:
      - '.github/workflows/ui-completion.yml'
      - 'playwright.ui-completion.config.ts'
      - 'scripts/ui-completion-*'
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: openlegend
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openlegend -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      OPENLEGEND_TEST_DATABASE_URL: postgresql://openlegend:fixture@localhost:5432/postgres
      AI_BUDGET_USD: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Prepare native browser zoom on the disposable display
        run: |
          sudo apt-get update
          sudo apt-get install -y xdotool xauth
          command -v Xvfb
          command -v xvfb-run
          command -v xdotool
          command -v xauth
      - name: Observe corrected connected cases and native browser zoom
        id: connected
        continue-on-error: true
        run: >-
          xvfb-run -a -s '-screen 0 1920x1080x24'
          pnpm exec playwright test --config playwright.ui-completion.config.ts
          --grep 'invitation description search|native Chromium 200%'
          --output /tmp/openlegend-connected-cloud
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finite-ui-completion-${{ github.sha }}
          retention-days: 7
          path: |
            /tmp/openlegend-connected-cloud
      - name: Require the remaining connected observations to pass
        if: always()
        run: |
          test '${{ steps.connected.outcome }}' = success

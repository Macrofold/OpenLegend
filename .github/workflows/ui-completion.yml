name: UI completion verification
on:
  push:
    branches: [docs/game-ui-research-redesign]
    paths: [.github/workflows/ui-completion.yml, .github/scripts/ui-completion.py, .github/scripts/ui-completion-context.py]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ui-completion-${{ github.ref }}
  cancel-in-progress: false
jobs:
  recovery:
    if: github.repository == 'Macrofold/OpenLegend'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: openlegend
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U openlegend -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AI_BUDGET_USD: '0'
      OPENLEGEND_TEST_DATABASE_URL: postgresql://openlegend:fixture@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          show-progress: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install pinned dependencies and restore exact verification scripts
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          python3 - <<'PY'
          import os, subprocess, textwrap
          from pathlib import Path
          source = subprocess.check_output(['git', 'show', 'd4b7ac01c751864f69e4a6b2f543173c65f2b256:.github/workflows/ui-completion.yml'], text=True)
          temp = Path(os.environ['RUNNER_TEMP'])
          def step(name):
              block = source.split('      - name: ' + name + '\n', 1)[1].split('\n      - ', 1)[0]
              return textwrap.dedent(block.split('        run: |\n', 1)[1])
          (temp / 'ui-prepare.sh').write_text(step('Apply the connected recovery changes'))
          native = step('Exercise original results through the real HTTP and PostgreSQL owners')
          before = "  const game = await createGameServer({ config: readConfig({ AI_BUDGET_USD: '0' }), store: await testRepository(), production: true, tick: false });"
          assert native.count(before) == 1
          native = native.replace(before, "  const store = await testRepository();\n  const game = await createGameServer({ config: readConfig({ AI_BUDGET_USD: '0' }), store, production: true, tick: false });")
          assert native.count('game.service.store.db') == 2
          native = native.replace('game.service.store.db', 'store.db')
          native = native.replace("from '@open-legend/domain'", "from '../packages/domain/src/index.js'")
          native = native.replace('expect(admitted.ok).toBe(true);', 'expect(admitted, JSON.stringify(admitted)).toMatchObject({ ok: true });')
          (temp / 'ui-native.sh').write_text(native)
          (temp / 'ui-export.sh').write_text(step('Export the exact checked candidate without updating any branch'))
          PY
          bash -e -o pipefail "$RUNNER_TEMP/ui-prepare.sh"
      - name: Build the unchanged production candidate
        run: pnpm build
      - name: Verify the corrected native observation
        run: bash -e -o pipefail "$RUNNER_TEMP/ui-native.sh"
      - name: Remove the temporary observation
        if: always()
        run: rm -f tests/ui-completion-recovery.test.ts
      - name: Export immutable checked sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash -e -o pipefail "$RUNNER_TEMP/ui-export.sh"
      - name: Retain exact evidence and affected diff
        if: always()
        run: |
          git diff HEAD -- apps packages docs > "$RUNNER_TEMP/ui-recovery/changes.patch"
          git diff --stat HEAD -- apps packages docs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-recovery-completion
          path: ${{ runner.temp }}/ui-recovery/
          retention-days: 7

name: Temporary finite UI completion observations
on:
  push:
    branches: [docs/game-ui-research-redesign]
    paths:
      - '.github/workflows/ui-completion.yml'
      - 'playwright.ui-completion.config.ts'
      - 'scripts/ui-completion-*'
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: openlegend
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openlegend -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      OPENLEGEND_TEST_DATABASE_URL: postgresql://openlegend:fixture@localhost:5432/postgres
      AI_BUDGET_USD: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Observe remaining connected UI and recovery cases
        id: connected
        continue-on-error: true
        run: >-
          pnpm exec playwright test --config playwright.ui-completion.config.ts
          --output /tmp/openlegend-connected-cloud
      - name: Observe retained completed-task presentation
        id: care
        continue-on-error: true
        run: >-
          node --import tsx scripts/ui-completion-care.mjs
          /tmp/openlegend-care-cloud
      - name: Observe alternate-world task recovery and persistence
        id: alternate
        timeout-minutes: 6
        continue-on-error: true
        run: >-
          node --import tsx scripts/ui-completion-alternate.mjs
          /tmp/openlegend-alternate-cloud
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finite-ui-completion-${{ github.sha }}
          retention-days: 7
          path: |
            /tmp/openlegend-connected-cloud
            /tmp/openlegend-care-cloud
            /tmp/openlegend-alternate-cloud
      - name: Require all three observations to pass
        if: always()
        run: |
          test '${{ steps.connected.outcome }}' = success
          test '${{ steps.care.outcome }}' = success
          test '${{ steps.alternate.outcome }}' = success

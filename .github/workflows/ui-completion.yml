name: UI completion verification
on:
  push:
    branches: [docs/game-ui-research-redesign]
    paths: [.github/workflows/ui-completion.yml]
permissions:
  contents: read
jobs:
  qualify:
    if: github.repository == 'Macrofold/OpenLegend'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AI_BUDGET_USD: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          show-progress: false
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install pinned checking tools
        run: pnpm install --frozen-lockfile > "$RUNNER_TEMP/install.log" 2>&1 || { tail -60 "$RUNNER_TEMP/install.log"; exit 1; }
      - name: Check documentation and exact cleanup boundaries
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess
          from pathlib import Path
          paths = ['docs/maintainers/projectile-progress-bug.md', 'docs/projects/game-interaction-redesign-completion.md', 'docs/verification/ui-completion-2026-10-14.md']
          temporary = ['.github/scripts/ui-finish.py', '.github/scripts/ui-native-worlds.ts', '.github/scripts/ui-recovery-browser.ts', '.github/scripts/ui-refine.py', '.github/scripts/ui-verify.py', '.github/scripts/ui-composed-journeys.ts', '.github/workflows/ui-completion.yml']
          baseline = 'c7d456fce76e14a277e33736df21c9fefbff56a3'
          changed = subprocess.check_output(['git', 'diff', '--name-only', baseline, 'HEAD'], text=True).splitlines()
          allowed = set(paths + temporary + ['.github/workflows/ui-completion-source-read-20261014.yml'])
          assert set(changed) <= allowed, changed
          assert not subprocess.check_output(['git', 'diff', baseline, 'HEAD', '--', 'apps', 'packages', 'tests', '.github/workflows/check.yml', '.github/workflows/spatial-check.yml'])
          for path in temporary:
              assert Path(path).is_file(), path
          assert not Path('.github/workflows/ui-completion-source-read-20261014.yml').exists()
          print('UI_ONLY_DIFF=' + json.dumps(changed), flush=True)
          print('TEMPORARY_CLEANUP=' + json.dumps(temporary), flush=True)
          # Check local file references in the three changed documents. Existing
          # cross-document anchors retain their original contracts.
          for path in paths:
              for link in re.findall(r'\]\(([^)]+)\)', Path(path).read_text()):
                  if '://' in link or link.startswith('#'):
                      continue
                  target = Path(path).parent / link.split('#', 1)[0]
                  assert target.is_file(), (path, link)
          checks = {}
          for label, command in [('guidance', ['pnpm', 'guidance:check']), ('configuration', ['pnpm', 'config:check'])]:
              result = subprocess.run(command, text=True, capture_output=True)
              checks[label] = result.returncode
              print(label.upper() + '=' + str(result.returncode) + '\n' + result.stdout + result.stderr, flush=True)
          # A formatting-only preview is not a Git publication. The connector
          # applies any required text change; the runner never updates a ref.
          subprocess.run(['pnpm', 'exec', 'prettier', '--write', *paths], check=True)
          subprocess.run(['pnpm', 'exec', 'prettier', '--check', *paths], check=True)
          patch = subprocess.check_output(['git', 'diff', '--unified=2', '--', *paths], text=True)
          print('DOC_FORMAT_DIFF_BEGIN\n' + patch + 'DOC_FORMAT_DIFF_END', flush=True)
          print('DOC_BLOBS=' + json.dumps({path: hashlib.sha1(('blob ' + str(len(Path(path).read_bytes())) + '\0').encode() + Path(path).read_bytes()).hexdigest() for path in paths}), flush=True)
          subprocess.run(['git', 'diff', '--check'], check=True)
          print('DOC_CHECKS=' + json.dumps(checks), flush=True)
          print('No gameplay or provider checks were run; no commits or branch references were changed.', flush=True)
          assert all(value == 0 for value in checks.values()), checks
          PY

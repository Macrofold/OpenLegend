name: UI completion verification
on:
  push:
    branches: [docs/game-ui-research-redesign]
    paths: [.github/workflows/ui-completion.yml]
permissions:
  contents: write
jobs:
  reconcile:
    if: github.repository == 'Macrofold/OpenLegend'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AI_BUDGET_USD: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          show-progress: false
      - name: Calculate and inspect the exact merge without changing references
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, urllib.request
          def git(*args): return subprocess.check_output(['git', *args], text=True)
          target = 'b72e9d9aab8072eb1b5ae9d25f620a4421509148'
          source = os.environ['GITHUB_SHA']
          result = subprocess.run(['git', 'merge-tree', '--write-tree', source, target], capture_output=True, text=True)
          assert result.returncode in (0, 1), result.stderr
          tree = result.stdout.splitlines()[0]
          print('MERGE_RESULT=' + result.stdout, flush=True)
          conflicted = set(re.findall(r'CONFLICT .*? in (.+)', result.stdout))
          for path in sorted(conflicted):
              text = git('show', tree + ':' + path)
              print('CONFLICT_OWNER=' + path, flush=True)
              lines = text.splitlines()
              for match in re.finditer(r'^<<<<<<< .*?^>>>>>>> [^\n]+', text, re.M | re.S):
                  start = text[:match.start()].count('\n'); end = text[:match.end()].count('\n')
                  print('\n'.join(str(i+1)+': '+lines[i] for i in range(max(0,start-5), min(len(lines),end+6))), flush=True)
          print('GUIDANCE_DELTA=' + git('diff', '1cf678802d62652d8dd466776d4b95a9d0d19166', target, '--', 'AGENTS.md'), flush=True)
          for path in ['apps/server/AGENTS.md', 'packages/domain/AGENTS.md', 'packages/protocol/AGENTS.md']:
              print('GUIDANCE=' + path + '\n' + git('show', target + ':' + path), flush=True)
          if not conflicted:
              def entries(ref):
                  out = {}
                  for item in subprocess.check_output(['git','ls-tree','-rz',ref]).split(b'\0'):
                      if not item: continue
                      header, path = item.split(b'\t',1)
                      mode, kind, sha = header.decode().split()
                      assert kind == 'blob'
                      out[path.decode()] = (mode, sha)
                  return out
              old=entries(source); new=entries(tree)
              changes=[{'path':path,'mode':mode,'type':'blob','sha':sha} for path,(mode,sha) in new.items() if old.get(path)!=(mode,sha)]
              changes += [{'path':path,'mode':mode,'type':'blob','sha':None} for path,(mode,_) in old.items() if path not in new]
              known = {sha for _,sha in [*old.values(), *entries(target).values()]}
              for entry in changes:
                  if entry['sha'] is not None and entry['sha'] not in known:
                      entry['content']=git('cat-file','blob',entry.pop('sha'))
              current=git('rev-parse',source+'^{tree}').strip()
              for index in range(0,len(changes),15):
                  request=urllib.request.Request('https://api.github.com/repos/Macrofold/OpenLegend/git/trees',method='POST',data=json.dumps({'base_tree':current,'tree':changes[index:index+15]}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
                  with urllib.request.urlopen(request,timeout=60) as response: current=json.load(response)['sha']
              assert current==tree, (current,tree)
              print('EXPORTED_MERGE_TREE='+tree,flush=True)
          print('SOURCE='+source+' TARGET='+target,flush=True)
          print('Detached checkout: '+os.getcwd()+'. No commit or reference was changed by this job.',flush=True)
          PY

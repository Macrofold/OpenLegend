name: Publish reviewed spatial changes
on:
  push:
    branches: [feature/spatial-world-3d]
    paths: [.github/workflows/spatial-review-export.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Apply hash-verified source changes without executing tests
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = "ce7d9d1900c7852073dc46582544a2841afc58ea"
          python3 - <<'PY'
          import base64, hashlib, json, lzma, subprocess
          from pathlib import Path, PurePosixPath
          parts = sorted(Path('.github/spatial-review-payload').glob('part-*.b64'))
          assert len(parts) == 3
          raw = lzma.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts), validate=True))
          assert hashlib.sha256(raw).hexdigest() == 'da6fd703e1aa1ad659dbb9c4f947cc9954446e073130736f4b9e0509bf21d1fa'
          files = json.loads(raw)
          assert len(files) == 12 and len({f['path'] for f in files}) == 12
          paths = []
          for item in files:
              path = PurePosixPath(item['path'])
              assert not path.is_absolute() and '..' not in path.parts
              assert path.parts[0] in ('packages', 'docs', 'archive')
              assert '.test.' not in str(path) and '.spec.' not in str(path)
              target = Path(path)
              assert target.is_file() and not target.is_symlink()
              before = target.read_bytes()
              assert hashlib.sha256(before).hexdigest() == item['before'], str(path)
              lines = before.decode('utf-8').splitlines(keepends=True)
              for start, count, replacement in reversed(item['edits']):
                  assert 0 <= start <= len(lines) and 0 <= count <= len(lines)-start
                  lines[start:start+count] = replacement
              content = ''.join(lines).encode('utf-8')
              assert hashlib.sha256(content).hexdigest() == item['sha256'], str(path)
              target.write_bytes(content)
              paths.append(str(path))
          subprocess.run(['git', 'add', '--', *paths], check=True)
          changed = subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines()
          assert sorted(changed) == sorted(paths)
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '[skip ci] Lazily evaluate spatial routes and skip inert native work' -m 'Preserve exact geometry, directed seams, native timing and observation isolation. Bound exhausted-search negative proofs. Record matched manual runtime evidence, remaining latency gaps and deferred regression coverage. No automated tests added or run.'
          git push origin HEAD:refs/heads/feature/spatial-world-3d

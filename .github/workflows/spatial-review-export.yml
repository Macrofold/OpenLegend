name: Publish reconciled spatial continuation
on:
  push:
    branches: [feature/spatial-world-3d]
    paths: [.github/workflows/spatial-review-export.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Apply digest-verified reviewed source without running tests
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = "2e8bd07dfd674ecee117f3094c909506a723790f"
          python3 - <<'PY'
          import base64, hashlib, lzma
          from pathlib import Path
          root = Path('.github/spatial-continuation-payload')
          parts = [root / 'part-01.b64', root / 'part-02.b64']
          patch = lzma.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts), validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'e8f8fb915b62d0e84f334ca570126d42c7625d15cacd0a52e03e48d2165cce11', 'Reviewed patch digest mismatch'
          Path('/tmp/spatial-continuation.patch').write_bytes(patch)
          PY
          git apply --index --check /tmp/spatial-continuation.patch
          git apply --index /tmp/spatial-continuation.patch
          git diff --cached --check
          python3 - <<'PY'
          import subprocess
          expected = {
              'archive/05-project/implementation-status.md',
              'archive/07-technical-architecture/spatial-world-runtime.md',
              'docs/architecture.md', 'docs/documentation-changelog.md',
              'docs/maintainers/TODO.md', 'docs/maintainers/performance.md',
              'docs/maintainers/spatial-world.md', 'docs/performance.md',
              'docs/verification.md', 'packages/domain/src/draft.ts',
              'packages/spatial/src/geometry.ts', 'packages/spatial/src/navigation.ts',
          }
          actual = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          assert actual == expected, 'Unexpected reviewed paths'
          PY
          git rm -- .github/spatial-continuation-payload/part-01.b64 .github/spatial-continuation-payload/part-02.b64
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '[skip ci] Share equivalent spatial navigation and reuse exact stances' -m 'Retain concurrent lazy navigation, directed negative proofs and native roster work. Share only identical public movement patches while preserving physical records and endpoint identity; reduce JSON copy allocation. Record matched native and application observations, remaining latency limits and deferred regression TODOs. No automated tests added or run.'
          git push origin HEAD:refs/heads/feature/spatial-world-3d

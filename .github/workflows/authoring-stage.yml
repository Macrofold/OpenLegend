name: Publish reviewed authoring transport
on:
  push:
    branches: [feature/invention-repertoire-foundation]
    paths: [.github/workflows/authoring-stage.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Publish exact reviewed transport without tests or paid calls
        run: |
          test "$(git rev-parse HEAD^)" = 2330388afc2c49a2cdad74fc71127bb86e43c91b
          python3 - <<'PY'
          from pathlib import Path
          import base64,gzip,hashlib
          data=gzip.decompress(base64.b64decode(''.join(Path(f'.authoring-stage{i}').read_text() for i in range(11)),validate=True))
          assert hashlib.sha256(data).hexdigest()=='a6f53318d217d6794404c49908a5c8ab8227c9659e77aa1d60534fc42e39fea2'
          Path('/tmp/authoring.patch').write_bytes(data)
          PY
          git apply --index /tmp/authoring.patch
          git rm .authoring-stage{0..10} .github/workflows/authoring-stage.yml
          git checkout HEAD^ -- .github/workflows/check.yml
          test "$(git write-tree)" = 38d84513552282ab9950cc23f04e51c76aff867c
          git config user.name 'OpenLegend implementation'
          git config user.email 'implementation@users.noreply.github.com'
          git commit -m '[skip ci] Connect reviewed MCP writes to session-bound native Macrofold execution'
          git push origin HEAD:refs/heads/feature/invention-repertoire-foundation

name: Action reconciliation verification
on:
  push:
    branches: [review/action-capabilities-main-20260924]
    paths: [.github/workflows/action-reconciliation-verify.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: profile-only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AI_BUDGET_USD: '0'
      PGPASSWORD: profile-only
    steps:
      - name: Read pinned reviewed source without Git mutations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os,urllib.request,tarfile,io,pathlib
          req=urllib.request.Request('https://api.github.com/repos/Macrofold/OpenLegend/tarball/0fbacabd4507521c0f6d54df45c0fc594c74e644',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=60) as response:data=response.read()
          root=pathlib.Path('/tmp/review-source');root.mkdir()
          with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as archive:
            for entry in archive:
              if not entry.isfile():continue
              path=pathlib.PurePosixPath(*pathlib.PurePosixPath(entry.name).parts[1:])
              if '..' in path.parts or path.is_absolute():raise RuntimeError('Unsafe source path')
              dest=root/path;dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(archive.extractfile(entry).read())
          PY
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Production build; no manually invoked suites
        working-directory: /tmp/review-source
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Exercise existing full-server profiler on disposable PostgreSQL only
        working-directory: /tmp/review-source
        run: |
          mkdir -p /tmp/review-results
          python - <<'PY'
          import pathlib,json
          p=pathlib.Path('scripts/performance/profile-server.mjs');s=p.read_text()
          old="OPEN_LEGEND_DATABASE_URL: '',"
          if s.count(old)!=1:raise RuntimeError('Unexpected profiler configuration')
          s=s.replace(old,"OPEN_LEGEND_DATABASE_URL: process.env.OPENLEGEND_PROFILE_POSTGRES,")
          s=s.replace('Real server timer, SQLite, SSE','Real server timer, disposable loopback PostgreSQL, SSE').replace('no browser, PostgreSQL or live model calls','no browser or live model calls')
          p.write_text(s)
          pathlib.Path('/tmp/review-small.json').write_text(json.dumps({'people':0,'animals':0,'objects':[],'steps':30,'warmup':0,'speed':1,'timeoutSeconds':60}))
          pathlib.Path('/tmp/review-dense.json').write_text(json.dumps({'seed':73,'people':100,'animals':0,'layout':'crowded','objects':[{'count':500,'name':'Profiling gem','properties':['rigid']}],'steps':180,'warmup':0,'speed':1,'timeoutSeconds':120}))
          PY
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE action_profile_small'
          OPENLEGEND_PROFILE_POSTGRES='postgresql://postgres:profile-only@127.0.0.1:5432/action_profile_small' node --import tsx scripts/performance/profile-server.mjs /tmp/review-small.json /tmp/review-results/postgres-small.json 10 1,8 100
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE action_profile_mixed'
          OPENLEGEND_PROFILE_POSTGRES='postgresql://postgres:profile-only@127.0.0.1:5432/action_profile_mixed' node --import tsx scripts/performance/profile-server.mjs scripts/performance/scenarios/mixed.json /tmp/review-results/postgres-mixed.json 10 1,3 250
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE action_profile_dense'
          OPENLEGEND_PROFILE_POSTGRES='postgresql://postgres:profile-only@127.0.0.1:5432/action_profile_dense' node --import tsx scripts/performance/profile-server.mjs /tmp/review-dense.json /tmp/review-results/postgres-dense.json 10 1 500
          psql -h 127.0.0.1 -U postgres -Atc 'SELECT version()' > /tmp/review-results/postgres-version.txt
          python - <<'PY'
          import pathlib,json,os,hashlib
          root=pathlib.Path('/tmp/review-source');files={}
          for folder in ['apps','packages','scripts']:
            for p in (root/folder).rglob('*'):
              if not p.is_file() or 'node_modules' in p.parts or 'dist' in p.parts:continue
              if str(p.relative_to(root))=='scripts/performance/profile-server.mjs':continue
              b=p.read_bytes();files[str(p.relative_to(root))]=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          pathlib.Path('/tmp/review-results/verification.json').write_text(json.dumps({'source':'0fbacabd4507521c0f6d54df45c0fc594c74e644','main':'03105fed9209c126e4e69e9faeb4687f42d1e74a','run':os.environ['GITHUB_RUN_ID'],'build':'passed','scope':'Existing profiler temporarily configured to isolated loopback PostgreSQL, unchanged gameplay source. No manually invoked suites/browser/live models or long-soak qualification. Normal CI unchanged.','paidModelCalls':0,'sourceHashes':files},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: action-reconciliation-results
          path: /tmp/review-results
          retention-days: 2

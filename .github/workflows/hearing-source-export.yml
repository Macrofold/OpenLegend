name: Hearing source export
on:
  push:
    branches: [feat/hearing-speech-captions]
    paths: [.github/workflows/hearing-source-export.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Export exact common base and new main
        run: |
          set -eu
          curl --fail --location --retry 2 https://api.github.com/repos/Macrofold/OpenLegend/tarball/fdcbd31fc9e4eb31daaf00d997648aba588c8577 -o /tmp/hearing-common.tar.gz
          curl --fail --location --retry 2 https://api.github.com/repos/Macrofold/OpenLegend/tarball/03105fed9209c126e4e69e9faeb4687f42d1e74a -o /tmp/hearing-main-latest.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: hearing-rebase-inputs
          path: /tmp/hearing-*.tar.gz
          retention-days: 1

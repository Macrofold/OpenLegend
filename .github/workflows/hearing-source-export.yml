name: Hearing source export
on:
  push:
    branches: [feat/hearing-speech-captions]
    paths: [.github/workflows/hearing-source-export.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Export pinned main without repository mutation
        run: curl --fail --location --retry 2 https://api.github.com/repos/Macrofold/OpenLegend/tarball/3c1198bc307bd95f4a1e0ed444aa9d3e1a00d238 -o /tmp/hearing-main.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: hearing-main-source
          path: /tmp/hearing-main.tar.gz
          retention-days: 1

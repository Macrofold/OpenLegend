name: Cadence completion source
on:
  push:
    branches: [feature/simulation-cadence]
    paths: [.github/workflows/cadence-completion-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a0a7745d232820c421576885f3d88e352bdb547a
          persist-credentials: false
      - name: Export reviewed repository source only
        run: |
          python3 - <<'PY'
          import os, pathlib, zipfile
          root = pathlib.Path.cwd()
          with zipfile.ZipFile('/tmp/cadence-reviewed-source.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for directory, dirs, files in os.walk(root):
                  dirs[:] = [d for d in dirs if d not in ('.git', 'node_modules', '.data')]
                  for name in files:
                      if name == '.env' or name.startswith('.env.') and name != '.env.example':
                          continue
                      p = pathlib.Path(directory) / name
                      archive.write(p, p.relative_to(root))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cadence-reviewed-source
          path: /tmp/cadence-reviewed-source.zip
          retention-days: 2

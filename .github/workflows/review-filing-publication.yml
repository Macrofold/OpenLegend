name: Publish validated foundation filing
on:
  push:
    branches: [docs/full-documentation-review-reconciled-2026-10-03]
    paths: [.github/workflows/review-filing-publication.yml]
permissions:
  contents: write
concurrency:
  group: full-documentation-review-reconciled-patch
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      AI_BUDGET_USD: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Pin the already-verified application script
        run: |
          test "$(git rev-parse HEAD^)" = c09ff7f752517bc332fee2e5c4fc245b77a10230
          test "$(git hash-object .github/workflows/review-source-snapshot.yml)" = 2e58fd66935737fd87411492de2b186cba728d56
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --ignore-scripts --frozen-lockfile
      - name: Reuse the exact hash-checked filing without replaying its faulty publication step
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { parse } from 'yaml';
          const workflow = parse(readFileSync('.github/workflows/review-source-snapshot.yml', 'utf8'));
          const steps = workflow.jobs.filing.steps.filter(step => step.name === 'Apply only the already-reviewed content and verify every output hash');
          assert.equal(steps.length, 1);
          assert.equal(typeof steps[0].run, 'string');
          writeFileSync('/tmp/review-filing-apply.sh', steps[0].run);
          JS
          bash -e /tmp/review-filing-apply.sh
          pnpm guidance:check
          git diff --check
      - name: Stage new destinations before comparing the exact changed-path set
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess
          paths = json.loads(pathlib.Path('/tmp/review-filing-paths.json').read_text())['paths']
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD:.github/full-documentation-review-patch.json'], text=True).strip() == '27f1ef5b9520acfb819c8549b7760f6f4bf928cd', 'concurrent pending patch'
          subprocess.run(['git', 'add', '--all', '--', *paths], check=True)
          actual = subprocess.check_output(['git', 'diff', '--cached', '--no-renames', '--name-only', '-z']).decode().strip('\0').split('\0')
          assert set(actual) == set(paths), ('unexpected staged diff', actual)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          subprocess.run(['git', 'rm', '--', '.github/full-documentation-review-patch.json', '.github/workflows/review-source-snapshot.yml', '.github/workflows/review-filing-publication.yml'], check=True)
          subprocess.run(['git', 'config', 'user.name', 'OpenLegend documentation review'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'commit', '-m', 'docs: file completed foundation projects and reconcile current follow-through'], check=True)
          PY
          git -c 'credential.helper=!f() { printf "username=x-access-token\npassword=%s\n" "$GH_TOKEN"; }; f' push origin HEAD:refs/heads/docs/full-documentation-review-reconciled-2026-10-03

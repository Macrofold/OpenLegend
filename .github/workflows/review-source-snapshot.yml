name: Documentation review continuation snapshot
on:
  push:
    branches: [docs/full-documentation-review-reconciled-2026-10-03]
    paths: [.github/workflows/review-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      AI_BUDGET_USD: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7682e7ee56a099e1a8b835b13f044fed2d1ea24c
          fetch-depth: 0
          persist-credentials: false
      - name: Package pinned text, prior diff and incoming archive references
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, zipfile
          root = pathlib.Path.cwd()
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'documentation-review-continuation.zip'
          revision = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          allowed = {'.md', '.mdc', '.txt', '.ts', '.tsx', '.mts', '.js', '.mjs', '.cjs', '.json', '.yaml', '.yml', '.css', '.html', '.sql', '.py', '.sh', '.toml'}
          inventory, archived = [], []
          with zipfile.ZipFile(target, 'w', zipfile.ZIP_DEFLATED) as output:
              for entry in subprocess.check_output(['git', 'ls-tree', '-r', '-z', '--long', 'HEAD']).split(b'\0'):
                  if not entry:
                      continue
                  metadata, raw_name = entry.split(b'\t', 1)
                  mode, kind, sha, size = metadata.decode().split()
                  name = raw_name.decode()
                  path = root / name
                  row = {'path': name, 'git_sha': sha, 'size': int(size) if size != '-' else None, 'included': False}
                  if kind == 'blob' and mode != '120000' and (path.suffix in allowed or name in ('LICENSE', '.env.example', '.prettierignore', '.gitignore')):
                      data = path.read_bytes()
                      text = data.decode('utf-8')
                      if 'archive' not in pathlib.PurePosixPath(name).parts:
                          output.writestr(name, data)
                          row.update(included=True, sha256=hashlib.sha256(data).hexdigest())
                      elif path.suffix in ('.md', '.mdc', '.txt'):
                          archived.append({'path': name, 'headings': [line for line in text.splitlines() if line.startswith('#')], 'incoming_project_references': [{'line': i, 'text': line} for i, line in enumerate(text.splitlines(), 1) if 'docs/projects/' in line]})
                  inventory.append(row)
              output.writestr('_review_source_inventory.json', json.dumps({'revision': revision, 'files': inventory}, indent=2))
              output.writestr('_review_archive_reference_metadata.json', json.dumps(archived, indent=2))
              output.writestr('_review_prior_changes.patch', subprocess.check_output(['git', 'diff', '--binary', 'b50ec6ce75f260d68c18ec99d767982c65b0fccb', 'HEAD']))
          print(f'Revision {revision}; {sum(x["included"] for x in inventory)} tracked text files. Archived content excluded; only heading/reference metadata retained for link repair.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-review-continuation-7682e7e
          path: ${{ runner.temp }}/documentation-review-continuation.zip
          retention-days: 1
          if-no-files-found: error

name: Documentation review incoming project references
on:
  push:
    branches: [docs/full-documentation-review-reconciled-2026-10-03]
    paths: [.github/workflows/review-source-snapshot.yml]
permissions:
  contents: read
jobs:
  references:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      AI_BUDGET_USD: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aeab5fe6d11caed3b2b9b8fd45b826cdcb6b5a8f
          persist-credentials: false
      - name: Package only archived sources with incoming project references
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, zipfile
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'review-project-references.zip'
          matches = []
          with zipfile.ZipFile(target, 'w', zipfile.ZIP_DEFLATED) as out:
              for name in subprocess.check_output(['git', 'ls-files', '-z', '--', 'archive']).decode().split('\0'):
                  if not name or pathlib.Path(name).suffix not in ('.md', '.mdc', '.txt'):
                      continue
                  data = pathlib.Path(name).read_bytes()
                  text = data.decode('utf-8')
                  hits = [{'line': i, 'text': line} for i, line in enumerate(text.splitlines(), 1) if 'docs/projects/' in line]
                  if not hits:
                      continue
                  out.writestr(name, data)
                  matches.append({'path': name, 'sha256': hashlib.sha256(data).hexdigest(), 'references': hits})
              out.writestr('_incoming_references.json', json.dumps({'revision': 'aeab5fe6d11caed3b2b9b8fd45b826cdcb6b5a8f', 'files': matches}, indent=2))
          print(f'{len(matches)} archived files contain incoming project references; these copies support reference repair only, not an archive-review completion claim.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: review-project-references-aeab5fe
          path: ${{ runner.temp }}/review-project-references.zip
          retention-days: 1
          if-no-files-found: error

name: Apply exact reviewed foundation filing
on:
  push:
    branches: [docs/full-documentation-review-reconciled-2026-10-03]
    paths: [.github/workflows/review-source-snapshot.yml]
permissions:
  contents: write
concurrency:
  group: full-documentation-review-reconciled-patch
  cancel-in-progress: false
jobs:
  filing:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      AI_BUDGET_USD: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - run: test "$(git rev-parse HEAD^)" = 251ae58d145e18a7a0cf70075f9b4bf243c84d86
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --ignore-scripts --frozen-lockfile
      - name: Apply only the already-reviewed content and verify every output hash
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, posixpath, re, subprocess
          root = pathlib.Path.cwd()

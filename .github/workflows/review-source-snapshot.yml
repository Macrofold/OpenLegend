            text = read(name).replace('Priority 1 in [remaining foundational work]', 'Original foundation priority 1 in [remaining foundational work]')
            for n in (2, 3, 4): text = text.replace(f'Priority {n}.', f'Original foundation priority {n}.')
            put(name, text)
          for kind in ('feature-spec', 'tech-design'):
           replace(f'docs/projects/persistent-objects-{kind}.md', 'reachable world containers, explicit actor access lists, giving without recipient inspection,', 'reachable world containers, explicit actor access lists, and giving by recipient-accepted offer without private inventory inspection,')
          name = 'docs/projects/shared-state-contributions-tech-design.md'
          replace(name, 'Illustrative internal contracts, not a new public protocol:', 'Historical illustrative contracts, not runtime types or a new public protocol:')
          replace(name, 'Each union branch has a strict codec and service-specific semantic validator.', 'The delivered [resource owner](../../packages/domain/src/resource-claims.ts) uses `ResourceOperation.amount`, exact definition pins and `ResourceStock.precision` (`whole` or `native-continuous`), rather than the sketch’s `amountQuanta` field or another parallel schema. Each current union branch has a strict codec and service-specific semantic validator.')
          paragraph(name, 'New discrete/conserved resource families use', 'The delivered item and gathering ports use whole units (scale one) and checked safe arithmetic; reservoir attributes and sources retain native continuous numbers. Each port’s exact definition pin fixes its resource meaning. New discrete/conserved families need a declared scale and safe arithmetic at their owner boundary when a real consumer requires them; this project did not deliver an unused general fixed-point framework. Wire quantities remain bounded validated numbers. A larger representation would need its own supported codec, not a silent precision loss or a compatibility alias.')
          paragraph(name, 'Native health/fullness/energy retain', 'The extraction preserved native health/fullness/energy and fractional charge rather than reclassifying every number as fungible conserved matter or rounding stock to fit a new table. SC04’s evidence includes exact 17.125-unit holds and native recharge. This was a precision-preserving implementation decision, not a requirement for future save conversion; the root development policy controls current-format support.')
          paragraph(name, 'For admitted rates, integrate', 'Current [replenishment](../../packages/domain/src/kernel.ts) computes the continuous requested transfer from the admitted rate and elapsed action time, caps it through the resource owner, and records the actual transferred amount and remaining action time. It does not add the draft’s generic `lastIntegratedSimTime`/fractional-carry record or a second timer. A future quantized-rate family must preserve its own remainder across pause, subdivision and restart. The [elapsed-time contract](../simulation-time.md) owns current integration boundaries. Conversion between different resources would require an explicit native policy with ratio, output/waste/source semantics and supported rounding; the same-resource transfer does not implement a general chemical solver.')
          replace(name, 'Qualification must compare matched wilderness traces, exercise both SQLite and PostgreSQL commits, and run disposable native scenarios with zero provider budget.', 'The original qualification compared matched wilderness traces and exercised both then-supported SQLite and PostgreSQL commits with zero provider budget. Current database checks use PostgreSQL only under the root verification policy.')
          name = 'docs/projects/foundations-1-5.md'
          status(name, 'All five foundations and 46 agreed slices are delivered and locally qualified; current compatibility cleanup and broader release gates remain separately owned.')
          replace(name, '## Approved implementation plan', '''## Current reading guide

          This package records the completed September 26 foundation and its follow-up review, not the present implementation backlog. The five original priorities describe that package’s scope and dependency order; [playable-game-first selection](../repertoires/gameplay-priorities.md) controls current product priorities. Current feature contracts and focused trackers take precedence over the historical source pins, illustrative interfaces and execution instructions below.

          The [development compatibility policy](../../AGENTS.md#development-save-policy) now forbids retaining old-format readers or converters; [DF04](../maintainers/production-data.md#df04--retire-residual-compatibility-paths) tracks remaining code, including actorless reservation admission. Historical conversion tests remain evidence of their recorded runs, not current support or instructions to rebuild them. New verification follows the [current policy](../../.agents/rules/verification.md), including PostgreSQL-only database checks and selectively permitted existing tests.

          Later body rules and elapsed integration belong to [world-configured survival](../worlds/base/survival.md) and [simulation time](../simulation-time.md); continuous native resources were not converted into a universal fixed-point model. Current giving requires recipient consent under [PO10](../maintainers/persistent-objects.md#po10--shared-access-and-dependency-aware-handling). Auth0 is selected, and sole-tab entry differs from the original manual-control flow: [IDP01–IDP03 and MP18](../maintainers/multiplayer.md#identity-provider--auth0) own those later changes and remaining acceptance. None of these follow-throughs closes the outstanding mixed-workload CPU regression or hosted qualification.

          ## Approved implementation plan''')
          replace(name, 'Implementation branch: `codex/foundations-1-5`, based on refreshed `origin/main`', 'Historical implementation branch: `codex/foundations-1-5`, based on refreshed `origin/main`')
          replace(name, 'their identities and quantities; legacy records without claimant evidence remain charged\nto world/host capacity, without inventing historical ownership.', 'their identities and quantities. The original implementation also accepted actorless legacy\nrecords in world/host capacity without inventing ownership; that exception is now obsolete\nunder the root policy and its removal is explicitly tracked in DF04.')
          replace(name, '**Current execution status:** all five foundations and all 46 agreed delivery slices are', '**September 26 completion status:** all five foundations and all 46 agreed delivery slices are')
          replace(name, 'The developer requested a full review and in-scope improvements after delivery. Refreshed\n`origin/main` remains `ce7ef555f50c979ac3d2179cf5876ea4a55e1318`; the branch is already\nat that base and the complete uncommitted implementation is preserved.', 'The developer requested a full review and in-scope improvements after delivery. At that\nreview, refreshed `origin/main` was `ce7ef555f50c979ac3d2179cf5876ea4a55e1318`; the branch\nwas already at that base and its complete uncommitted implementation was preserved.')
          paragraph(name, 'Implementation should refresh from this integrated main', 'At design delivery, implementation was to refresh from that integrated main and reconcile the then-separate invention/action/hearing/cadence work through DF02. Those original integrations are now present; DF02 retains combined-owner qualification and newly introduced dependencies, not a requirement to merge those branches again. The historical design integration never qualified their gameplay or authorized discarding unique fixes.')
          replace('docs/maintainers/state-contributions.md', '- [x] Establish exact quanta for newly admitted conserved families; inspect existing values before conversion, preserve fractional carry and refuse silent rounding/reset.', '- [x] Preserve whole-unit item/gathering precision and native continuous charge, including fractional holds; refuse silent rounding or reset. The original precision audit did not introduce a generic quantized-rate/carry representation. A new precision family requires a real consumer and explicit owner semantics, not legacy-save conversion.')
          paragraph('docs/maintainers/multiplayer.md', 'The approved [feature specification](../projects/multiplayer-authority-feature-spec.md)', 'The completed [feature specification](../projects/multiplayer-authority-feature-spec.md) and [technical design](../projects/multiplayer-authority-tech-design.md) retain these original MP01/MP04 child slices. The evidence above satisfies their foundation scope. Current sole-tab entry and shared logout follow MP18; Auth0 configuration and provider logout follow IDP01–IDP03. Other MP gates retain their separate scope.')
          name = 'docs/projects/completed/README.md'
          text = read(name); at = text.index('| [Next priority batch]')
          put(name, text[:at] + '| [Five-foundation package](foundations-1-5.md) | All 46 original state, multiplayer, item, dependency and appraisal slices; linked pairs and trackers distinguish later policy changes, unfinished release work and historical evidence. |\n' + text[at:])
          name = 'docs/documentation-changelog.md'
          replace(name, 'The earlier camp-first “next milestone” directive is superseded by Mike’s explicit playable-game-first decision. The separate [priority branch’s canonical policy](https://github.com/Macrofold/OpenLegend/blob/docs/playable-game-first-priorities/docs/repertoires/gameplay-priorities.md) retains ranking ownership; this review does not claim those catalogue changes merged.', 'The earlier camp-first “next milestone” directive is superseded by Mike’s explicit playable-game-first decision. Initially maintained on a separate branch, the [canonical selection policy](repertoires/gameplay-priorities.md) and expanded rankings are now integrated in the reviewed main; this review preserves that owner rather than merging unrelated catalogue work.')
          replace(name, 'Repository-wide reconciliation remains in progress, not a blanket completion or correctness assurance.', 'The original five-foundation package and its remaining state, multiplayer, object and dependency pairs are now filed together as completed, with all incoming references repaired. Its 46-slice local qualification remains distinct from later Auth0, inventory, compatibility and scale work. Current resource documentation preserves whole-unit stock and fractional native charge instead of implying an unused generic fixed-point/carry framework. DF04 explicitly retains the actorless old-hold validation exception for removal; no runtime repair is claimed. Repository-wide reconciliation remains in progress, not a blanket completion or correctness assurance.')
          for dest in expected:
           name = next((old for old, new in moves.items() if new == dest), dest)
           if name in moves: continue
           text = read(name); new = text; substitutions = {}
           for old, new_path in moves.items():
            substitutions[old] = new_path
            substitutions[posixpath.relpath(old, posixpath.dirname(name))] = posixpath.relpath(new_path, posixpath.dirname(name))
           for old in sorted(substitutions, key=len, reverse=True): new = new.replace(old, substitutions[old])
           if new != text: put(name, new)
          link = re.compile(r'(?P<lead>\]\()(?P<target>[^\s)]+)(?P<tail>(?:\s+[^)]*)?\))')
          for old, new in moves.items():
           assert not (root / new).exists(), new
           def relocate(match):
            target = match['target']
            if target.startswith(('#', '/')) or re.match(r'[A-Za-z][\w+.-]*:', target): return match[0]
            parts = target.split('#', 1)
            path = posixpath.normpath(posixpath.join(posixpath.dirname(old), parts[0]))
            relative = posixpath.relpath(moves.get(path, path), posixpath.dirname(new))
            return match['lead'] + relative + ('#' + parts[1] if len(parts) > 1 else '') + match['tail']
           text = link.sub(relocate, read(old))
           for source, dest in moves.items(): text = text.replace(source, dest)
           put(old, text)
          assert {moves.get(name, name) for name in changed} == set(expected), 'unexpected changed file set'
          for name, text in changed.items():
           dest = root / moves.get(name, name)
           dest.parent.mkdir(parents=True, exist_ok=True); dest.write_text(text)
           if name in moves: (root / name).unlink()
          subprocess.run(['pnpm', 'exec', 'prettier', '--write', *[p for p in expected if not p.startswith('archive/')]], check=True)
          for name, digest in expected.items():
           assert hashlib.sha256((root / name).read_bytes()).hexdigest() == digest, ('unexpected output', name)
          assert not any((root / p).exists() for p in moves), 'retained duplicate project'
          print(f'Exact reviewed outputs verified: {len(expected)} files; {len(moves)} completed project moves.')
          pathlib.Path('/tmp/review-filing-paths.json').write_text(json.dumps({'paths': sorted(set(expected) | set(moves))}))

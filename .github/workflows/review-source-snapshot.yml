      - run: pnpm guidance:check && git diff --check
      - name: Publish the reviewed filing and remove failed transfer and this one-use helper
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess
          paths = json.loads(pathlib.Path('/tmp/review-filing-paths.json').read_text())['paths']
          actual = subprocess.check_output(['git', 'diff', '--no-renames', '--name-only', '-z']).decode().strip('\0').split('\0')
          assert set(actual) == set(paths), ('unexpected diff', actual)
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD:.github/full-documentation-review-patch.json'], text=True).strip() == '27f1ef5b9520acfb819c8549b7760f6f4bf928cd', 'concurrent pending patch'
          subprocess.run(['git', 'add', '--all', '--', *paths], check=True)
          subprocess.run(['git', 'rm', '--', '.github/full-documentation-review-patch.json', '.github/workflows/review-source-snapshot.yml'], check=True)
          subprocess.run(['git', 'config', 'user.name', 'OpenLegend documentation review'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'commit', '-m', 'docs: file completed foundation projects and reconcile current follow-through'], check=True)
          PY
          git -c 'credential.helper=!f() { printf "username=x-access-token\npassword=%s\n" "$GH_TOKEN"; }; f' push origin HEAD:refs/heads/docs/full-documentation-review-reconciled-2026-10-03

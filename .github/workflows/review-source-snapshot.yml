name: Documentation review incoming references
on:
  push:
    branches: [docs/full-documentation-review-reconciled-2026-10-03]
    paths: [.github/workflows/review-source-snapshot.yml]
permissions:
  contents: read
jobs:
  references:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 18e6876e50c319379f5bea2080ef68d0c38057e6
          persist-credentials: false
      - name: Package only archived files with incoming active-project references
        env:
          AI_BUDGET_USD: '0'
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, zipfile
          paths = subprocess.check_output(['git', 'ls-files', '-z', '--', 'archive']).decode().split('\0')
          matches = []
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'review-archived-project-references.zip'
          with zipfile.ZipFile(target, 'w', zipfile.ZIP_DEFLATED) as out:
              for name in paths:
                  if not name or pathlib.Path(name).suffix not in ('.md', '.mdc', '.txt'):
                      continue
                  data = pathlib.Path(name).read_bytes()
                  text = data.decode('utf-8')
                  hits = [{'line': i, 'text': line} for i, line in enumerate(text.splitlines(), 1) if 'docs/projects/' in line]
                  if not hits:
                      continue
                  out.writestr(name, data)
                  matches.append({'path': name, 'sha256': hashlib.sha256(data).hexdigest(), 'references': hits})
              out.writestr('_incoming_references.json', json.dumps({'revision': '18e6876e50c319379f5bea2080ef68d0c38057e6', 'files': matches}, indent=2))
          print(f'{len(matches)} archived files contain incoming project references; content is for reference repair, not additional review scope.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: review-archived-project-references-18e6876
          path: ${{ runner.temp }}/review-archived-project-references.zip
          retention-days: 1
          if-no-files-found: error

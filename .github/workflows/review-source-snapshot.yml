name: Documentation review source
on:
  push:
    branches: [docs/full-documentation-review-reconciled-2026-10-03]
    paths: [.github/workflows/review-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      AI_BUDGET_USD: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0043672ff9ba658515384a5593f3d003fb1d2a8c
          fetch-depth: 0
          persist-credentials: false
      - name: Package tracked source without archived content
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, zipfile
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'review-source.zip'
          inventory = []
          extensions = {'.md', '.mdc', '.txt', '.ts', '.tsx', '.mts', '.js', '.mjs', '.cjs', '.json', '.yaml', '.yml', '.css', '.html', '.sql', '.py', '.sh', '.toml'}
          with zipfile.ZipFile(target, 'w', zipfile.ZIP_DEFLATED) as output:
              for entry in subprocess.check_output(['git', 'ls-tree', '-r', '-z', '--long', 'HEAD']).split(b'\0'):
                  if not entry:
                      continue
                  metadata, raw_path = entry.split(b'\t', 1)
                  mode, kind, sha, size = metadata.decode().split()
                  name = raw_path.decode()
                  path = pathlib.Path(name)
                  row = {'path': name, 'git_sha': sha, 'included': False}
                  if kind == 'blob' and mode != '120000' and 'archive' not in path.parts and (path.suffix in extensions or name in ('LICENSE', '.env.example', '.prettierignore', '.gitignore')):
                      data = path.read_bytes()
                      data.decode('utf-8')
                      output.writestr(name, data)
                      row.update(included=True, sha256=hashlib.sha256(data).hexdigest())
                  inventory.append(row)
              output.writestr('_review_inventory.json', json.dumps({'revision': '0043672ff9ba658515384a5593f3d003fb1d2a8c', 'files': inventory}, indent=2))
              output.writestr('_review_diff.patch', subprocess.check_output(['git', 'diff', '--binary', 'c4e18d91848b5b6d367dda1d7214a9f8222cf070', 'HEAD']))
          print('Pinned source packaged; no provider, save or database operations.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: review-source-0043672
          path: ${{ runner.temp }}/review-source.zip
          retention-days: 7
          if-no-files-found: error

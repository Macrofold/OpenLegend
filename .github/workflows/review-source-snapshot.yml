name: Documentation review incoming references
on:
  push:
    branches: [docs/full-documentation-review-reconciled-2026-10-03]
    paths: [.github/workflows/review-source-snapshot.yml]
permissions:
  contents: read
jobs:
  references:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4a4632a88521475b87209eb7a7e1cc317c11c8df
          persist-credentials: false
      - name: Inspect only incoming archived references to completed project names
        env:
          AI_BUDGET_USD: '0'
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, zipfile
          names = ('world-agent-context', 'invention-questions-feature-spec', 'invention-questions-tech-design', 'appraisal-social-continuity-feature-spec', 'appraisal-social-continuity-tech-design')
          paths = subprocess.check_output(['git', 'ls-files', '-z', '--', 'archive']).decode().split('\0')
          matches = []
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'review-incoming-references.zip'
          with zipfile.ZipFile(target, 'w', zipfile.ZIP_DEFLATED) as out:
              for name in paths:
                  if not name or pathlib.Path(name).suffix not in ('.md', '.mdc', '.txt'):
                      continue
                  data = pathlib.Path(name).read_bytes()
                  text = data.decode('utf-8')
                  hits = [{'line': i, 'text': line} for i, line in enumerate(text.splitlines(), 1) if any(term in line for term in names)]
                  if not hits:
                      continue
                  out.writestr(name, data)
                  matches.append({'path': name, 'sha256': hashlib.sha256(data).hexdigest(), 'references': hits})
              out.writestr('_incoming_references.json', json.dumps(matches, indent=2))
          print(json.dumps(matches, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: review-completed-project-incoming-references
          path: ${{ runner.temp }}/review-incoming-references.zip
          retention-days: 1
          if-no-files-found: error

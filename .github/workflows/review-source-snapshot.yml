          families = {
           'shared-state-contributions': 'Typed state owners, finite claims and independent capability contributions are delivered and locally qualified; broader effect families remain separate.',
           'multiplayer-authority': 'Two-account control, private views and absence are delivered and locally qualified; later Auth0 and hosted-release checks remain separate.',
           'persistent-objects': 'Entity-backed items, nested containers and scoped handling are delivered and locally qualified; later inventory journeys retain their own acceptance.',
           'dependency-invalidation': 'The finite dependency, membership and work-budget foundation is delivered and locally qualified; broader performance and hosted capacity remain open.',
          }
          moves = {f'docs/projects/{f}-{k}.md': f'docs/projects/completed/{f}-{k}.md' for f in families for k in ('feature-spec', 'tech-design')}
          moves['docs/projects/foundations-1-5.md'] = 'docs/projects/completed/foundations-1-5.md'
          original, changed = {}, {}
          def read(name):
           if name not in original: original[name] = (root / name).read_text()
           return changed.get(name, original[name])
          def put(name, text):
           read(name)
           changed[name] = text
          def replace(name, old, new):
           text = read(name)
           assert text.count(old) == 1, ('ambiguous edit', name, old)
           put(name, text.replace(old, new, 1))
          def paragraph(name, prefix, new):
           text = read(name)
           assert text.count(prefix) == 1, ('ambiguous paragraph', name, prefix)
           start = text.index(prefix)
           end = text.find('\n\n', start)
           assert end > start, name
           put(name, text[:start] + new + text[end:])
          def status(name, progress):
           title, rest = read(name).split('\n', 1)
           assert '| Status' not in rest[:1000], name
           put(name, title + '\n\n| Status | Current progress | Last updated |\n| --- | --- | --- |\n| Completed | ' + progress + ' | 2026-10-04 |\n' + rest)

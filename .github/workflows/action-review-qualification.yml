name: Action reconciliation qualification
on:
  push:
    branches: [review/action-reconcile-fdcbd31]
    paths: [.github/workflows/action-review-qualification.yml]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: openlegend_review
          POSTGRES_USER: review
          POSTGRES_PASSWORD: disposable-review-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U review -d openlegend_review"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AI_BUDGET_USD: '0'
      REVIEW_DATABASE_URL: postgresql://review:disposable-review-only@127.0.0.1:5432/openlegend_review
    steps:
      - uses: actions/checkout@v4
        with: {path: control, persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          ref: 94a7682aee9f100ccb54e073969bb4ed4f9fea49
          path: branch
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: fc01e19b30060e6c7213b1c5405be13df209297e
          path: ancestor
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: fdcbd31fc9e4eb31daaf00d997648aba588c8577
          path: upstream
          persist-credentials: false
      - name: Reconcile file contents and apply reviewed fixes
        run: |
          python control/.github/action-reconcile.py
          cp -a merged baseline
          python - <<'PY'
          import pathlib,gzip,base64,hashlib,subprocess
          parts=''.join((pathlib.Path('control/.github')/f'action-review.payload.{i}').read_text().strip() for i in range(3))
          data=gzip.decompress(base64.b64decode(parts))
          if hashlib.sha256(data).hexdigest()!='4e34ee8a5e1d287051407aa3edec26d9562622cd1a3033374ca80ff55220ef61':raise RuntimeError('Reviewed patch integrity mismatch')
          subprocess.run(['patch','--batch','-p1'],input=data,cwd='merged',check=True)
          p=pathlib.Path('control/.github/action-review-runtime.mjs')
          p.write_text(p.read_text().replace("load('node_modules/pg/lib/index.js')", "load('apps/server/node_modules/pg/lib/index.js')"))
          PY
          REVIEW_FINISH_STAGE=prepare python control/.github/action-review-finish.py
          mkdir -p reports
      - uses: pnpm/action-setup@v4
        with: {package_json_file: merged/package.json}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: merged/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: merged
      - run: pnpm install --frozen-lockfile
        working-directory: baseline
      - name: Production and static checks
        run: |
          cd merged
          pnpm run build > ../reports/build.txt 2>&1
          pnpm config:check > ../reports/config.txt 2>&1
          pnpm typecheck > ../reports/typecheck-current.txt 2>&1 || true
          cd ../baseline
          pnpm exec tsc --noEmit -p tsconfig.build.json > ../reports/build-baseline.txt 2>&1
          pnpm typecheck > ../reports/typecheck-baseline.txt 2>&1 || true
          cd ../upstream
          ln -s ../merged/node_modules node_modules
          pnpm guidance:check > ../reports/guidance.txt 2>&1
      - name: Actual native and transaction boundaries
        run: |
          cd merged
          node --import tsx ../control/.github/action-review-runtime.mjs grounding > ../reports/grounding.json
          node --import tsx ../control/.github/action-review-runtime.mjs postgres > ../reports/postgres-lease.json
          cd ../baseline
          node --import tsx ../control/.github/action-review-runtime.mjs native > ../reports/native-before.json
          cd ../merged
          node --import tsx ../control/.github/action-review-runtime.mjs native > ../reports/native-after.json
      - name: Full PostgreSQL timer HTTP SSE workload
        run: |
          cd baseline
          timeout 180s node --import tsx ../control/.github/action-review-runtime.mjs server ../reports/postgres-server-before.json
          cd ../merged
          timeout 180s node --import tsx ../control/.github/action-review-runtime.mjs server ../reports/postgres-server-after.json
      - name: Record reviewed evidence and format touched files
        run: |
          python control/.github/action-review-finish.py
          python - <<'PY'
          import pathlib,subprocess
          m=pathlib.Path('merged');b=pathlib.Path('baseline');u=pathlib.Path('upstream');paths=[]
          for p in m.rglob('*'):
            rel=p.relative_to(m)
            if any(x in ['node_modules','.git','dist','.data'] for x in rel.parts) or not p.is_file() or p.suffix not in ['.ts','.tsx','.md','.mjs','.json']:continue
            old=b/rel
            if not old.exists() or p.read_bytes()!=old.read_bytes():paths.append(str(rel))
          subprocess.run(['pnpm','exec','prettier','--write',*paths],cwd=m,check=True)
          PY
          cd merged
          pnpm run build > ../reports/build-final.txt 2>&1
      - name: Package source and measurements without changing Git history
        if: always()
        run: |
          cp reconciliation.json reports/ || true
          tar --exclude=node_modules --exclude=.git --exclude=dist --exclude=.data -czf /tmp/action-reviewed-source.tgz merged baseline reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: action-reviewed-source
          path: /tmp/action-reviewed-source.tgz
          compression-level: 0
          retention-days: 1
  objects:
    needs: review
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: {name: action-reviewed-source}
      - run: tar -xzf action-reviewed-source.tgz
      - name: Stage content objects only for connector-owned commits
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const crypto = require('crypto');
            const repo = {owner:'Macrofold',repo:'OpenLegend'};
            const main = 'fdcbd31fc9e4eb31daaf00d997648aba588c8577';
            const source = '94a7682aee9f100ccb54e073969bb4ed4f9fea49';
            const mainCommit = (await github.rest.git.getCommit({...repo,commit_sha:main})).data;
            const mainTree = (await github.rest.git.getTree({...repo,tree_sha:mainCommit.tree.sha,recursive:'1'})).data;
            const sourceTree = (await github.rest.git.getTree({...repo,tree_sha:source,recursive:'1'})).data;
            if(mainTree.truncated || sourceTree.truncated) throw Error('Incomplete tree inventory');
            const before = new Map(mainTree.tree.filter(e=>e.type==='blob').map(e=>[e.path,e]));
            const known = new Set([...mainTree.tree,...sourceTree.tree].map(e=>e.sha));
            function inventory(dir,prefix='') {
              const out=[];
              for(const e of fs.readdirSync(dir,{withFileTypes:true})) {
                if(['node_modules','.git','dist','.data'].includes(e.name))continue;
                const name=prefix?prefix+'/'+e.name:e.name, full=path.join(dir,e.name);
                if(e.isSymbolicLink())throw Error('Unexpected source symlink '+name);
                if(e.isDirectory())out.push(...inventory(full,name));
                else if(e.isFile())out.push({name,full});
              }
              return out;
            }
            const manifests={main,source,baseTree:mainCommit.tree.sha,run:context.runId};
            for(const dir of ['baseline','merged']) {
              const entries=[],present=new Set();
              for(const {name,full} of inventory(dir).sort((a,b)=>a.name.localeCompare(b.name))) {
                if(name.split('/').some(p=>p==='..'||p==='.env'||p.startsWith('.env.')))throw Error('Unexpected private path');
                const data=fs.readFileSync(full);
                const sha=crypto.createHash('sha1').update('blob '+data.length+'\0').update(data).digest('hex');
                const mode=fs.statSync(full).mode&0o111?'100755':'100644';
                present.add(name);
                if(before.get(name)?.sha===sha && before.get(name)?.mode===mode)continue;
                if(!known.has(sha)) {
                  const blob=(await github.rest.git.createBlob({...repo,content:data.toString('base64'),encoding:'base64'})).data;
                  if(blob.sha!==sha)throw Error('Content hash mismatch '+name);
                  known.add(sha);
                }
                entries.push({path:name,mode,type:'blob',sha});
              }
              for(const [name,e] of before)if(!present.has(name))entries.push({path:name,mode:e.mode,type:'blob',sha:null});
              if(entries.some(e=>e.path.startsWith('.github/')))throw Error('Unexpected CI difference');
              manifests[dir]=entries;
            }
            // No trees, commits, branch updates, pushes or merges are performed by this job.
            // Those authority-changing operations remain explicit GitHub connector calls.
            fs.writeFileSync('connector-manifests.json',JSON.stringify(manifests,null,2)+'\n');
      - uses: actions/upload-artifact@v4
        with:
          name: connector-commit-manifests
          path: connector-manifests.json
          retention-days: 1

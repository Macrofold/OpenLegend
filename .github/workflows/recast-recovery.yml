name: Recast completion source
on:
  push:
    branches: [feature/spatial-world-3d]
    paths: ['.github/workflows/recast-recovery.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export tracked source only for final continuation
        run: git archive --format=zip --output=/tmp/recast-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: recast-completion-source
          path: /tmp/recast-source.zip
          retention-days: 1

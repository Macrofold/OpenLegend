name: Repertoire MCP dependencies
on:
  push:
    branches: [feature/invention-repertoire-foundation]
    paths: [.github/workflows/repertoire-foundation-export.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @open-legend/server add --save-exact --ignore-scripts @modelcontextprotocol/server@2.0.0 @modelcontextprotocol/node@2.0.0
      - name: Export exact installed dependencies and lock without executing tests
        run: |
          tar -czf /tmp/repertoire-mcp-dependencies.tar.gz node_modules apps/*/node_modules packages/*/node_modules
          tar -cf /tmp/repertoire-mcp-manifests.tar pnpm-lock.yaml apps/server/package.json
      - uses: actions/upload-artifact@v4
        with:
          name: repertoire-mcp-dependencies
          path: |
            /tmp/repertoire-mcp-dependencies.tar.gz
            /tmp/repertoire-mcp-manifests.tar
          retention-days: 1

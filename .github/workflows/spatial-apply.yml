name: Spatial implementation publication and verification
on:
  push:
    branches: [feature/spatial-world-3d]
    paths: [.github/workflows/spatial-apply.yml]
permissions:
  contents: write
concurrency:
  group: spatial-implementation-publication
  cancel-in-progress: false
jobs:
  apply-and-verify:
    if: github.ref == 'refs/heads/feature/spatial-world-3d'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/spatial-world-3d
          fetch-depth: 2
      - name: Verify and apply reviewed implementation
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          import base64, hashlib, lzma
          from pathlib import Path
          parts = sorted(Path('.github/spatial-payload').glob('*.b64'))
          assert len(parts) == 19, 'Incomplete implementation payload'
          patch = lzma.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts), validate=True))
          assert hashlib.sha256(patch).hexdigest() == '9076fbdd777bc8d13c3c7038352840124380e049e9d46d9c7e0bd4f9c5f44bc4', 'Implementation digest mismatch'
          Path('/tmp/spatial-implementation.patch').write_bytes(patch)
          PY
          git apply --index --check /tmp/spatial-implementation.patch
          git apply --index /tmp/spatial-implementation.patch
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Implement playable 3D spatial world and integrate design documentation'
          git push origin HEAD:refs/heads/feature/spatial-world-3d
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Production build
        run: pnpm run build
      - name: Focused native, camera, HTTP and restoration tests
        run: pnpm exec vitest run packages/spatial/src/spatial.test.ts packages/domain/src/spatial-world.test.ts apps/client/src/world-camera.test.ts apps/server/src/spatial-http.test.ts
      - run: pnpm exec playwright install --with-deps chromium
      - name: Real browser elevated-world verification
        env:
          AI_BUDGET_USD: '0'
        run: pnpm exec playwright test tests/browser/spatial-world.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spatial-browser-evidence
          path: test-results/
          retention-days: 7

name: Action target admission closeout
on:
  push:
    branches:
      - design/action-repertoire-and-capability-grounding
permissions:
  contents: read
jobs:
  native-target-binding:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    env:
      AI_BUDGET_USD: '0'
      OPEN_LEGEND_DATABASE_URL: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Preserve explicit targets at native admission
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('packages/domain/src/response.ts');s=p.read_text()
          old='        const selected = matches[0]!.commands;\n        const fulfillment = matches[0]!.fulfillment;'
          new='''        const selected = matches[0]!.commands;
                  // A lexical binding cannot override the explicit target, even before revision review.
                  // docs/architecture.md#action-fulfillment-and-revision-approval
                  if (act.targetEntityId && selected.some(command =>
                    ('targetId' in command && command.targetId !== undefined && command.targetId !== act.targetEntityId) ||
                    ('heatId' in command && command.heatId !== act.targetEntityId)
                  )) {
                    components[localId] = outcome(false, 'target-mismatch', 'The explicit target does not match the resolved native action.');
                    continue;
                  }
                  const fulfillment = matches[0]!.fulfillment;'''
          if s.count(old)!=1:raise RuntimeError('Response source changed; inspect before applying the target guard.')
          p.write_text(s.replace(old,new))
          with Path('docs/maintainers/TODO.md').open('a') as f:f.write('\n- Add automated coverage for contradictory explicit target references versus exact/normalized text bindings, including confirmation alternatives and cooking heat targets. Native admission rejects the mismatch before work or a misleading approval is created.\n')
          with Path('docs/architecture.md').open('a') as f:f.write('\n\nExplicit proposal targets are checked against bound native target/heat roles before plan admission or revision approval. A matching description cannot override a contradictory structured target; the actor must submit a coherent revised request.\n')
          PY
          pnpm exec prettier --write packages/domain/src/response.ts docs/maintainers/TODO.md docs/architecture.md
      - name: Production build without unit or browser suites
        run: pnpm run build
      - name: Exercise real native target admission
        run: |
          node --import tsx --input-type=module <<'JS'
          import { readFileSync, writeFileSync, appendFileSync } from 'node:fs';
          import { createWorld, observeActor, commitActorResponse, advanceWorld } from './packages/domain/src/index.ts';
          import { actionResponse } from './apps/server/src/action-response.ts';
          const world=createWorld(73);
          const actor=Object.values(world.entities).find(e=>e.actor?.controller==='player');
          const observation=observeActor(world,actor.id);
          const target=observation.visibleEntities.find(e=>e.actor?.alive && e.id!==actor.id);
          if(!target)throw new Error('Native fixture has no visible target.');
          const refs=[actor.id,...observation.visibleEntities.map(e=>e.id)];
          const description=`Follow ${target.name}`;
          const attempt=(targetEntityId)=>actionResponse({kind:'proposal',mode:'enqueue',description,targetEntityId,actionId:null,verb:null});
          const binding={description,commands:[{type:'follow',id:'bound-follow',actorId:actor.id,targetId:target.id}]};
          const wrong=commitActorResponse(world,'target-wrong',actor.id,attempt(actor.id),{},refs,actor.actor.planGeneration,[binding]);
          const correct=commitActorResponse(world,'target-correct',actor.id,attempt(target.id),{},refs,actor.actor.planGeneration,[binding]);
          const heldBinding={...binding,fulfillment:{requested:description,executableDescription:description,verdict:'confirm',supported:[description],omitted:[],reason:'Manual native approval boundary exercise.'}};
          const wrongReview=commitActorResponse(world,'target-wrong-review',actor.id,attempt(actor.id),{},refs,actor.actor.planGeneration,[heldBinding]);
          const result={run:process.env.GITHUB_RUN_ID,scope:'Native runtime exercise; no provider calls or test framework.',mismatch:wrong.world.responseReceipts['target-wrong'].components.action,mismatchPlan:wrong.world.entities[actor.id].actor.agency.plan,matching:correct.outcome,matchingAction:advanceWorld(correct.world,1).world.entities[actor.id].actor.action?.type,contradictoryApproval:wrongReview.world.responseReceipts['target-wrong-review'].components.action,pendingAfterContradiction:wrongReview.world.entities[actor.id].actor.agency.attempts.length};
          console.log('NATIVE_TARGET_ADMISSION',JSON.stringify(result));
          if(result.mismatch.code!=='target-mismatch'||result.mismatchPlan!==null||!result.matching.ok||result.matchingAction!=='follow'||result.pendingAfterContradiction!==0)throw new Error('Native target exercise did not produce the expected state.');
          const path='docs/verification/action-capability-smoke.json';
          const report=JSON.parse(readFileSync(path,'utf8'));report.explicitTargetAdmission=result;writeFileSync(path,JSON.stringify(report,null,2)+'\n');
          appendFileSync('docs/verification.md',`\n\n### Explicit target admission follow-up\n\nThe final native guard rejects contradictory structured targets before exact-text binding can queue work or create a misleading approval. Production build and a direct native runtime exercise completed in [run ${result.run}](https://github.com/Macrofold/OpenLegend/actions/runs/${result.run}); the matching target still starts native following. Results are retained under explicitTargetAdmission in the existing [action evidence](verification/action-capability-smoke.json). No unit/browser suite or paid provider was used. This small source follow-up is separate from the earlier measured stress workloads.\n`);
          JS
      - name: Restore original CI and commit final guard
        run: |
          pnpm exec prettier --write docs/verification.md docs/verification/action-capability-smoke.json
          git show ab0228c0c5c98c0ec969d7dfdedd6c0358a29111:.github/workflows/check.yml > .github/workflows/check.yml
          test "$(git hash-object .github/workflows/check.yml)" = '73ebf085d2889d173a4738e5c1f32f76576c0c6f'
          git add packages/domain/src/response.ts docs .github/workflows/check.yml
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '[skip ci] fix: preserve explicit targets in grounded action admission'
          git push origin HEAD:design/action-repertoire-and-capability-grounding

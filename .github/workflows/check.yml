name: Rebased performance review
on:
  push:
    branches: [design/action-repertoire-and-capability-grounding]
permissions:
  contents: write
concurrency:
  group: action-native-performance
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      AI_BUDGET_USD: '0'
      OPEN_LEGEND_DATABASE_URL: ''
      OPEN_LEGEND_DATA_DIR: /tmp/rebased-review-world
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Finish migration and documentation ownership
        run: |
          python .github/perf-closeout.py
          python - <<'PY'
          import pathlib,subprocess
          changed=subprocess.check_output(['git','diff','--name-only','--diff-filter=ACMR','fc01e19b30060e6c7213b1c5405be13df209297e'],text=True).splitlines()
          paths=[p for p in changed if not p.startswith('.github/') and pathlib.Path(p).suffix in ['.ts','.tsx','.mjs','.md','.json']]
          paths+=['packages/domain/src/worlds/base/navigation.ts','docs/worlds/base/navigation.md']
          subprocess.run(['pnpm','exec','prettier','--write',*sorted(set(paths))],check=True)
          PY
          pnpm run build
          node --import tsx .github/perf-upgrade-exercise.mjs > /tmp/pending-upgrade.json
          cp /tmp/pending-upgrade.json docs/verification/action-perf-pending-upgrade.json
          node --import tsx .github/perf-integration-exercise.mjs > /tmp/integration-final.json
          cp /tmp/integration-final.json docs/verification/action-perf-integration.json
          python .github/perf-review-static.py
          git diff --check
      - name: Commit reviewed source and current documentation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages apps scripts docs README.md archive
          git diff --cached --quiet || git commit -m '[skip ci] fix: preserve pending upgrades and reconcile performance ownership'
          git push origin HEAD:design/action-repertoire-and-capability-grounding
      - name: Retain focused failure diagnostics
        if: failure()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p .github/closeout-diagnostics
          git diff > .github/closeout-diagnostics/source.patch
          for f in /tmp/pending-upgrade.json /tmp/integration-final.json; do test ! -f "$f" || cp "$f" .github/closeout-diagnostics/; done
          git add .github/closeout-diagnostics
          git diff --cached --quiet || git commit -m '[skip ci] chore: retain review diagnostics'
          git push origin HEAD:design/action-repertoire-and-capability-grounding

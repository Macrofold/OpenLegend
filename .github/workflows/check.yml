name: Persistence review qualification
on:
  push:
    branches: [design/action-repertoire-and-capability-grounding]
permissions:
  contents: write
concurrency:
  group: action-native-performance
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-profile-only
          POSTGRES_DB: ol_persistence_profile
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AI_BUDGET_USD: '0'
      OPENAI_API_KEY: ''
      JEV_API_KEY: ''
      MACROFOLD_API_KEY: ''
      OPEN_LEGEND_DATABASE_URL: ''
      OPEN_LEGEND_DATA_DIR: /tmp/persistence-review-world
      PROFILE_DATABASE_URL: postgresql://postgres:disposable-profile-only@127.0.0.1:5432/ol_persistence_profile
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Review fixes and production build
        run: |
          python .github/persistence-review.py
          pnpm exec prettier --write apps/server/src/sqlite-database.ts docs/performance.md docs/maintainers/TODO.md
          pnpm run build
          git diff --check
      - name: Execute recovery and actual PostgreSQL history
        run: |
          node --import tsx .github/persistence-worker-exercise.mjs /tmp/worker-review.json > /tmp/worker-review.log
          node --import tsx .github/persistence-postgres-exercise.mjs /tmp/postgres-history.json > /tmp/postgres-history.log
          mkdir -p docs/verification
          cp /tmp/worker-review.json docs/verification/persistence-worker-review.json
          cp /tmp/postgres-history.json docs/verification/persistence-postgres.json
      - name: Profile mature dense native execution and 8x small server
        run: |
          printf '%s\n' '{"seed":73,"people":100,"animals":0,"layout":"crowded","warmup":30,"steps":600,"speed":1,"timeoutSeconds":120,"objects":[{"count":500,"name":"Profiling gem","properties":["rigid"]}]}' > /tmp/dense-warm.json
          printf '%s\n' '{"seed":73,"people":0,"animals":0,"warmup":0}' > /tmp/small.json
          node --import tsx scripts/stress-native.ts /tmp/dense-warm.json /tmp/dense-warm.cpuprofile > /tmp/dense-warm-result.json
          node --import tsx scripts/performance/profile-server.mjs /tmp/small.json /tmp/server-fast.json 30 8 25 > /tmp/server-fast.log
          python - <<'PY'
          import json,pathlib,os
          native=json.loads(pathlib.Path('/tmp/dense-warm-result.json').read_text())
          server=json.loads(pathlib.Path('/tmp/server-fast.json').read_text())
          report={'scope':'Current implementation, mature native dense workload and 30-second 8x small-server load; not matched latency qualification, full PostgreSQL server, browser, live cognition or a long soak. No paid APIs.','inputCommit':os.environ['GITHUB_SHA'],'run':os.environ['GITHUB_RUN_ID'],'native':native,'server':server}
          pathlib.Path('docs/verification/persistence-review-stress.json').write_text(json.dumps(report,indent=2)+'\n')
          p=server['phases'][0]
          summary={'scope':report['scope'],'run':report['run'],'native':{k:native[k] for k in ['steps','warmupSteps','totalMs','p50Ms','p95Ms','maxStepMs','finalCounts','nativeHeadroomAtRequestedSpeed','hottestSelfMs']},'server':{k:p[k] for k in ['achievedSpeed','eventLoop','storageError','memoryBacklog','counters']},'commands':p['client']['commands'],'errors':p['client']['errors']}
          pathlib.Path('docs/verification/persistence-review-summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary,indent=2))
          PY
      - name: Commit reviewed implementation and evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/server/src/sqlite-database.ts docs/performance.md docs/maintainers/TODO.md docs/verification/persistence-worker-review.json docs/verification/persistence-postgres.json docs/verification/persistence-review-stress.json docs/verification/persistence-review-summary.json
          git commit -m '[skip ci] fix: bound SQLite admissions and fence shutdown failures'
          git push origin HEAD:design/action-repertoire-and-capability-grounding
      - name: Retain failure diagnostics
        if: failure()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p .github/persistence-diagnostics
          git diff > .github/persistence-diagnostics/source.patch
          for f in /tmp/worker-review.json /tmp/postgres-history.json /tmp/dense-warm-result.json /tmp/server-fast.json /tmp/worker-review.log /tmp/postgres-history.log /tmp/server-fast.log; do test ! -f "$f" || cp "$f" .github/persistence-diagnostics/; done
          git add .github/persistence-diagnostics
          git diff --cached --quiet || git commit -m '[skip ci] chore: retain persistence review diagnostics'
          git push origin HEAD:design/action-repertoire-and-capability-grounding

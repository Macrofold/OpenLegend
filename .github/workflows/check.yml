name: Code checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    if: github.ref != 'refs/heads/design/action-repertoire-and-capability-grounding'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
  action-implementation:
    if: github.event_name == 'push' && github.ref == 'refs/heads/design/action-repertoire-and-capability-grounding'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    env:
      AI_BUDGET_USD: '0'
      OPEN_LEGEND_DATABASE_URL: ''
      OPEN_LEGEND_DATA_DIR: /tmp/action-slice-world
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply bounded implementation slice
        run: |
          sed -i 's/s.count(old)!=count/s.count(old)<count/;s/s.replace(old,new))/s.replace(old,new,count))/' .github/action-slice.py
          python .github/action-slice.py
      - name: Format changed source
        run: git ls-files -m -o --exclude-standard apps packages docs archive README.md | grep -E '\.(ts|tsx|md)$' | xargs -r pnpm exec prettier --write
      - name: Production typecheck and build without test suites
        run: pnpm run build
      - name: Runtime smoke
        run: |
          node --import tsx --input-type=module <<'JS'
          import { createWorld, advanceWorld, observeActor, sameSurfacePoint, bindNavigationInvocation, commitActorResponse } from './packages/domain/src/index.ts';
          let world = { ...createWorld(73), paused: false };
          const actor = Object.values(world.entities).find(e => e.actor?.controller === 'player');
          const observation=observeActor(world,actor.id);
          const refs=[actor.id,...observation.visibleEntities.map(e=>e.id)];
          const point = sameSurfacePoint(world,actor,actor.position.x+.5,actor.position.z);
          const invocation={family:'move',x:point.x,z:point.z,surfaceId:point.surfaceId,targetEntityId:null,distance:null};
          console.log('BIND',bindNavigationInvocation(world,actor.id,'smoke-bind',invocation,refs));
          const response={operations:[{localId:'move',requiresAccepted:[],talk:null,think:null,goal:null,plan:null,act:{kind:'invoke',actionId:null,verb:null,targetEntityId:null,description:null,mode:'enqueue',invocation}}]};
          const result=commitActorResponse(world,'smoke-invoke',actor.id,response,{},refs,actor.actor.planGeneration);
          console.log('INVOKE',result.outcome,result.world.responseReceipts['smoke-invoke']);
          world=advanceWorld(result.world,20).world;
          console.log('INVOKE_END',world.entities[actor.id].position,world.entities[actor.id].actor.agency.plan);
          JS
      - name: Native stress
        run: |
          node --import tsx scripts/stress-native.ts scripts/performance/scenarios/mixed.json /tmp/action-after.cpuprofile > /tmp/action-stress.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/action-stress.json'))
          print(json.dumps({k:d.get(k) for k in ['steps','totalMs','p50Ms','p95Ms','maxStepMs','heapUsedBytes','finalWorldDigest']},indent=2))
          PY
      - name: Commit qualified source slice
        run: |
          git add apps packages docs archive README.md
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "$(cat /tmp/action-message)"
            git push origin HEAD:design/action-repertoire-and-capability-grounding
          fi
      - name: Source diff
        if: always()
        run: git diff --stat

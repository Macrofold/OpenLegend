name: Cooperative native implementation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  implementation:
    if: github.ref == 'refs/heads/design/action-repertoire-and-capability-grounding' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    env:
      AI_BUDGET_USD: '0'
      OPEN_LEGEND_DATABASE_URL: ''
      OPEN_LEGEND_DATA_DIR: /tmp/perception-performance-world
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply cooperative checkpoints
        run: python .github/burst-run.py
      - name: Format and production build, no test suites
        run: |
          git diff --name-only -- '*.ts' '*.tsx' | xargs -r pnpm exec prettier --write
          pnpm exec prettier --write apps/server/src/native-step.ts
          pnpm run build
      - name: Actual native burst exercise
        run: node --import tsx .github/burst-runtime.mjs
      - name: Commit working slice
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages apps docs
          git commit -m '[skip ci] perf: yield within native bursts without exposing partial simulation state'
          git push origin HEAD:design/action-repertoire-and-capability-grounding
      - name: Diagnostics
        if: always()
        run: git diff --stat
  check:
    if: github.ref != 'refs/heads/design/action-repertoire-and-capability-grounding'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check

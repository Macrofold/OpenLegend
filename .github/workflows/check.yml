name: SQLite isolation qualification
on:
  push:
    branches: [design/action-repertoire-and-capability-grounding]
permissions:
  contents: write
concurrency:
  group: action-native-performance
  cancel-in-progress: false
jobs:
  persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AI_BUDGET_USD: '0'
      OPENAI_API_KEY: ''
      JEV_API_KEY: ''
      MACROFOLD_API_KEY: ''
      OPEN_LEGEND_DATABASE_URL: ''
      OPEN_LEGEND_DATA_DIR: /tmp/persistence-review-world
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Matched baseline
        run: |
          node --import tsx .github/persistence-exercise.mjs /tmp/persistence-before.json > /tmp/before.log
          printf '%s\n' '{"seed":73,"people":100,"animals":0,"layout":"crowded","warmup":0,"objects":[{"count":500,"name":"Profiling gem","properties":["rigid"]}]}' > /tmp/dense.json
          printf '%s\n' '{"seed":73,"people":0,"animals":0,"warmup":0}' > /tmp/small.json
          node --import tsx scripts/performance/profile-server.mjs /tmp/dense.json /tmp/server-before.json 15 1 > /tmp/server-before.log
      - name: Implement isolated SQLite and build
        run: |
          python .github/persistence-worker.py
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/server/src/sqlite-database.ts');s=p.read_text().replace('workerData: { path }, execArgv: [],','workerData: { path }, execArgv: [],\n      env: process.env.TZ ? { TZ: process.env.TZ } : {},');p.write_text(s)
          p=Path('scripts/performance/profile-server.mjs');s=p.read_text()
          s=s.replace("const [scenarioPath, output, secondsText = '15', speedText = '1,3,8']", "const [scenarioPath, output, secondsText = '15', speedText = '1,3,8', intervalText = '500']")
          s=s.replace('const seconds = Number(secondsText),','const seconds = Number(secondsText),\n    commandIntervalMs = Number(intervalText),')
          s=s.replace('    seconds > 60 ||','    seconds > 60 ||\n    !Number.isInteger(commandIntervalMs) || commandIntervalMs < 25 || commandIntervalMs > 1000 ||')
          s=s.replace('    secondsPerPhase: seconds,','    secondsPerPhase: seconds,\n    commandIntervalMs,')
          s=s.replace('        presenceId,\n','        presenceId,\n        commandIntervalMs,\n')
          s=s.replace('periodic(500, async (i) => {','periodic(settings.commandIntervalMs ?? 500, async (i) => {')
          s=s.replace("[5..60 seconds per phase] [1,3,8]'", "[5..60 seconds per phase] [1,3,8] [25..1000 command interval ms]'" )
          s=s.replace('  p95Ms: percentile(values, 0.95),','  p95Ms: percentile(values, 0.95),\n  p99Ms: percentile(values, 0.99),')
          p.write_text(s)
          PY
          pnpm exec prettier --write apps/server/src/sqlite-database.ts apps/server/src/sqlite-worker.mjs scripts/performance/profile-server.mjs docs/performance.md docs/architecture.md docs/maintainers/performance.md docs/maintainers/TODO.md
          pnpm run build
          git diff --check
      - name: Actual worker recovery, history and full server workload
        run: |
          node --import tsx .github/persistence-worker-exercise.mjs /tmp/worker-recovery.json > /tmp/recovery.log
          node --import tsx .github/persistence-exercise.mjs /tmp/persistence-after.json > /tmp/after.log
          node --import tsx scripts/performance/profile-server.mjs /tmp/dense.json /tmp/server-after.json 15 1 > /tmp/server-after.log
          node --import tsx scripts/performance/profile-server.mjs /tmp/small.json /tmp/server-commands.json 60 1 25 > /tmp/server-commands.log
          python - <<'PY'
          import json,pathlib,os
          load=lambda name:json.loads(pathlib.Path('/tmp/'+name+'.json').read_text())
          before=load('persistence-before');after=load('persistence-after')
          for old,new in zip(before['cases'],after['cases']):
            if old['worldDigest']!=new['worldDigest'] or old['history']!=new['history']: raise RuntimeError('Changed authoritative native/history outcome: '+old['name'])
          report={'scope':'Matched in-process/worker SQLite on one runner; real rollback/recovery and HTTP/SSE/native timer plus bounded 60-second high-command-count run. No automated suites or paid models.','baseline':os.environ['GITHUB_SHA'],'run':os.environ['GITHUB_RUN_ID'],'before':before,'after':after,'serverBefore':load('server-before'),'serverAfter':load('server-after'),'commands':load('server-commands'),'recovery':load('worker-recovery')}
          pathlib.Path('docs/verification/persistence-worker.json').write_text(json.dumps(report,indent=2)+'\n')
          summary={'run':report['run'],'cpu':after['cpu'],'nativeAndHistoryDigestsMatch':True,'before':{r['name']:{'nativeMs':r['nativeMs'],'commits':r['commits']} for r in before['cases']},'after':{r['name']:{'nativeMs':r['nativeMs'],'commits':r['commits']} for r in after['cases']},'recovery':report['recovery']}
          for variant in ['serverBefore','serverAfter','commands']:
            p=report[variant]['phases'][0]
            summary[variant]={k:p[k] for k in ['achievedSpeed','eventLoop','heapUsedBytes','storageError','memoryBacklog','counters']}
            summary[variant]['commands']=p['client']['commands'];summary[variant]['errors']=p['client']['errors']
            summary[variant]['metrics']={k:v for k,v in p['metrics'].items() if k.startswith(('history.','sqlite.','persistence.','native.','public.'))}
          pathlib.Path('docs/verification/persistence-worker-summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary,indent=2))
          PY
      - name: Commit isolated connection and qualification
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/server/src/sqlite-database.ts apps/server/src/sqlite-worker.mjs scripts/performance/profile-server.mjs docs/performance.md docs/architecture.md docs/maintainers/performance.md docs/maintainers/TODO.md docs/verification/persistence-worker.json docs/verification/persistence-worker-summary.json
          git commit -m '[skip ci] perf: isolate SQLite behind the existing single-writer transaction lane'
          git push origin HEAD:design/action-repertoire-and-capability-grounding
      - name: Retain failure diagnostics
        if: failure()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p .github/persistence-diagnostics
          git diff > .github/persistence-diagnostics/source.patch
          for f in /tmp/persistence-before.json /tmp/persistence-after.json /tmp/server-before.json /tmp/server-after.json /tmp/worker-recovery.json /tmp/server-commands.json /tmp/recovery.log /tmp/before.log /tmp/after.log /tmp/server-before.log /tmp/server-after.log /tmp/server-commands.log; do test ! -f "$f" || cp "$f" .github/persistence-diagnostics/; done
          git add .github/persistence-diagnostics
          git diff --cached --quiet || git commit -m '[skip ci] chore: retain bounded persistence diagnostics'
          git push origin HEAD:design/action-repertoire-and-capability-grounding

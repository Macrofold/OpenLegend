name: Action review
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    if: github.ref != 'refs/heads/design/action-repertoire-and-capability-grounding' && github.head_ref != 'design/action-repertoire-and-capability-grounding'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
  review:
    if: github.event_name == 'push' && github.ref == 'refs/heads/design/action-repertoire-and-capability-grounding'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      AI_BUDGET_USD: '0'
      OPEN_LEGEND_DATABASE_URL: ''
      OPEN_LEGEND_DATA_DIR: /tmp/action-review-world
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply reviewed source changes
        run: python .github/review-edit.py
      - name: Format affected source only
        run: |
          git ls-files -m -o --exclude-standard apps packages docs archive README.md | grep -E '\.(ts|tsx|md|json)$' | while IFS= read -r f; do if [ -f "$f" ]; then printf '%s\n' "$f"; fi; done | xargs -r pnpm exec prettier --write
      - name: Production typecheck and build, no test suites
        run: pnpm run build
      - name: Native execution and matched-host stress
        run: timeout 180s node --import tsx .github/review-fixture-loader.mjs
      - name: Commit reviewed source and documentation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps packages docs archive README.md
          if ! git diff --cached --quiet; then
            git commit -m '[skip ci] fix: preserve queued prerequisites and reconcile action delivery docs'
            git push origin HEAD:design/action-repertoire-and-capability-grounding
          fi
      - name: Review diagnostics
        if: always()
        run: git diff --stat

name: Code checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    if: github.ref != 'refs/heads/design/action-repertoire-and-capability-grounding'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
  action-implementation:
    if: github.event_name == 'push' && github.ref == 'refs/heads/design/action-repertoire-and-capability-grounding'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    env:
      AI_BUDGET_USD: '0'
      OPEN_LEGEND_DATABASE_URL: ''
      OPEN_LEGEND_DATA_DIR: /tmp/action-slice-world
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply bounded implementation slice
        run: |
          sed -i 's/config.openaiKey/config.llmKey/g' .github/action-slice.py
          python .github/action-slice.py
      - name: Format affected source
        run: |
          git ls-files -m -o --exclude-standard apps packages docs archive README.md | grep -E '\.(ts|tsx|md)$' | while IFS= read -r file; do if [ -f "$file" ]; then printf '%s\n' "$file"; fi; done | xargs -r pnpm exec prettier --write
          pnpm exec prettier --write packages/domain/src/action-capabilities.ts apps/server/src/action-grounding.ts apps/client/src/ui/action-attempts.tsx
      - name: Production typecheck and build without test suites
        run: pnpm run build
      - name: Action lifecycle and HTTP runtime smoke
        run: timeout 90s node --import tsx .github/action-smoke.mjs
      - name: Existing native stress scenarios
        run: |
          node --import tsx scripts/stress-native.ts scripts/performance/scenarios/mixed.json /tmp/action-mixed.cpuprofile > /tmp/action-mixed.json
          node --import tsx scripts/stress-native.ts scripts/performance/scenarios/gems.json /tmp/action-gems.cpuprofile > /tmp/action-gems.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('docs/verification/action-capability-smoke.json');r=json.loads(p.read_text())
          for name in ['mixed','gems']:
            d=json.load(open('/tmp/action-'+name+'.json'))
            r['stress'][name]={k:d.get(k) for k in ['scenario','initial','steps','totalMs','p50Ms','p95Ms','maxStepMs','heapUsedBytes','finalWorldDigest']}
            print(name,json.dumps(r['stress'][name]))
          p.write_text(json.dumps(r,indent=2)+'\n')
          PY
      - name: Commit qualified source slice
        run: |
          pnpm exec prettier --write docs/verification/action-capability-smoke.json
          git add apps packages docs archive README.md
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "$(cat /tmp/action-message)"
            git push origin HEAD:design/action-repertoire-and-capability-grounding
          fi
      - name: Diagnostic diff and schema references
        if: always()
        run: |
          git diff --stat
          grep -R -n -E 'schemaVersion.*(9|10)|SAVE_FORMAT' packages/domain/src/data.ts packages/domain/src/world-modules.ts apps/server/src/game-saves.ts | head -20

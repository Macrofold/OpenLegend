name: Perception verified closeout
on:
  push:
permissions:
  contents: read
jobs:
  closeout:
    if: github.ref == 'refs/heads/design/action-repertoire-and-capability-grounding'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
    env:
      AI_BUDGET_USD: '0'
      OPEN_LEGEND_DATABASE_URL: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Confirm qualified source, record rejected experiment and restore CI
        run: |
          git fetch --depth=1 origin cb830dbce0f475b442b8417c5d3a1bf9b529eb37 0582e8660e154e6383a407ffb09e75f0b8c6223a
          python .github/perception-closeout.py
          pnpm exec prettier --write docs/verification.md docs/maintainers/performance.md docs/maintainers/TODO.md docs/documentation-changelog.md
          pnpm run build
          git diff --check
      - name: Commit qualified closeout
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs .github
          git commit -m '[skip ci] docs: close perception performance work with measured limits'
          git push origin HEAD:design/action-repertoire-and-capability-grounding

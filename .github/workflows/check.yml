name: Rebased exposure performance
on:
  push:
    branches: [design/action-repertoire-and-capability-grounding]
permissions:
  contents: write
concurrency:
  group: action-native-performance
  cancel-in-progress: true
jobs:
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AI_BUDGET_USD: '0'
      OPEN_LEGEND_DATABASE_URL: ''
      OPEN_LEGEND_DATA_DIR: /tmp/rebased-perf-world
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Measure native dense and warm paths
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('.github/perf-density.py').read_text()
          s=s.replace("'packages/domain/src/draft.ts','packages/domain/src/experience.ts'", "'packages/domain/src/events.ts','packages/domain/src/status-effects.ts','packages/domain/src/experience.ts'")
          s=s.replace('perf-density-edit.py','perf-exposure-edit.py').replace('action-perf-density.json','action-perf-exposure.json')
          s=s.replace('owned-evidence and scalar-capture changes','category-local exposure and inactive status pruning')
          exec(compile(s,'exposure-profile','exec'))
          PY
      - name: Commit measured work and evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --check
          git add packages apps docs
          git diff --cached --quiet || git commit -m '[skip ci] perf: reuse unchanged acquisition sets and prune inapplicable status work'
          git push origin HEAD:design/action-repertoire-and-capability-grounding

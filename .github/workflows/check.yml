name: Code checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    if: ${{ !contains(github.event.head_commit.message, '[spatial-review]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check

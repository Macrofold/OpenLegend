          encoded=b''
          for item in segments:
            if isinstance(item,str): encoded+=item.encode();continue
            sha,start,length=item; data=b''.join(next(root.glob('*-'+sha)).read_bytes().split());encoded+=data[start:start+length]
          bundle=gzip.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(bundle).hexdigest()=='8a61e036d69e216f8126e467264f0b621b05184ea431b0afcf71fdc433c9c353'
          pathlib.Path('/tmp/recovered.bundle').write_bytes(bundle)
          PY
          git bundle verify /tmp/recovered.bundle
          git fetch /tmp/recovered.bundle HEAD
          test "$(git rev-parse FETCH_HEAD)" = da2094825fb5d468b7f697e2d536ad95685ee22a
          test "$(git rev-parse FETCH_HEAD^{tree})" = 9d65f06fa5eb574c9a84d08db274fe5035b173f6
          git config user.name 'OpenLegend implementation'
          git config user.email 'implementation@users.noreply.github.com'
          commit=$(printf '%s\n' '[skip ci] Publish recovered invention foundation and remove temporary recovery workflows' | git commit-tree 9d65f06fa5eb574c9a84d08db274fe5035b173f6 -p "$GITHUB_SHA" -p da2094825fb5d468b7f697e2d536ad95685ee22a)
          git push origin "$commit:refs/heads/feature/invention-repertoire-foundation"
          git branch published-invention "$commit"
          git bundle create /tmp/published-invention.bundle --all
          echo "Published $commit"
      - uses: actions/upload-artifact@v4
        with:
          name: published-invention-history
          path: /tmp/published-invention.bundle
          retention-days: 1

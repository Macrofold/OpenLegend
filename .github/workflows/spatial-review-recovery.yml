name: Spatial review continuation source
on:
  push:
    branches: [feature/spatial-world-3d]
    paths: [.github/workflows/spatial-review-recovery.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive --format=zip --output=/tmp/review-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: spatial-review-continuation-source
          path: /tmp/review-source.zip
          retention-days: 1

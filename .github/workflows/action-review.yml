name: Action reconciliation review
on:
  push:
    branches: [review/action-main-reconciled]
permissions:
  contents: read
concurrency:
  group: action-reconciliation-review
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AI_BUDGET_USD: '0'
      OPEN_LEGEND_DATABASE_URL: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Apply reviewed three-way reconciliation in the disposable workspace
        run: python .github/reconcile-action.py
      - run: pnpm install --frozen-lockfile
      - name: Format resolved files and build production source
        run: |
          pnpm exec prettier --write README.md apps/server/src/decision-context.ts apps/server/src/game-saves.ts apps/server/src/upgrade-world.ts docs/documentation-changelog.md packages/domain/src/kernel.ts packages/domain/src/perception-frame.ts packages/domain/src/contact-acquisition.ts
          pnpm run build
      - name: Describe the exact candidate
        if: always()
        shell: python
        run: |
          from pathlib import Path
          import hashlib,json,os
          paths=json.loads(Path('.github/reconciled-paths.json').read_text())
          entries=[]
          for path in paths:
            data=Path(path).read_bytes()
            entries.append({'path':path,'mode':'100644','type':'blob','sha':hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest(),'bytes':len(data)})
          Path('/tmp/reconciliation-candidate.json').write_text(json.dumps({'run':os.environ['GITHUB_RUN_ID'],'files':entries},indent=2))
          print(Path('/tmp/reconciliation-candidate.json').read_text())
      - name: Retain source and installed dependencies, never checkout credentials
        if: always()
        run: |
          tar --exclude=./.git --exclude=./.data -czf /tmp/action-reviewed-workspace.tgz .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: action-reviewed-workspace
          path: |
            /tmp/action-reviewed-workspace.tgz
            /tmp/reconciliation-candidate.json
          compression-level: 0
          retention-days: 1

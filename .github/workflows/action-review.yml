name: Reconciled action PostgreSQL review
on:
  push:
    branches: [review/action-main-reconciled]
permissions:
  contents: read
concurrency:
  group: action-postgres-review
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16-bookworm
        env:
          POSTGRES_USER: review
          POSTGRES_PASSWORD: review
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U review -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      no-vector:
        image: postgres:16
        env:
          POSTGRES_USER: review
          POSTGRES_PASSWORD: review
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U review -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AI_BUDGET_USD: '0'
      OPEN_LEGEND_PROFILE_POSTGRES_URL: postgres://review:review@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Prepare disposable workload descriptions
        shell: python
        run: |
          from pathlib import Path
          import json
          dense={'seed':73,'people':100,'animals':0,'layout':'crowded','steps':180,'warmup':0,'speed':1,'timeoutSeconds':120,'objects':[{'count':500,'name':'Review gem','properties':['rigid'],'quantity':1,'workSeconds':1}]}
          Path('/tmp/action-dense.json').write_text(json.dumps(dense))
          Path('/tmp/action-tiny.json').write_text(json.dumps({'seed':73,'people':0,'animals':0,'objects':[],'steps':5,'warmup':0}))
      - name: Exercise real timer, HTTP, durable commands and SSE on fresh PostgreSQL databases
        timeout-minutes: 3
        run: |
          timeout --kill-after=5s 90s node --import tsx scripts/performance/profile-server.mjs scripts/performance/scenarios/mixed.json /tmp/action-postgres-mixed.json 15 1,3 25
          timeout --kill-after=5s 60s node --import tsx scripts/performance/profile-server.mjs /tmp/action-dense.json /tmp/action-postgres-dense.json 15 1 500
      - name: Exercise unavailable-vector startup and cleanup without hanging
        timeout-minutes: 1
        run: |
          set +e
          OPEN_LEGEND_PROFILE_POSTGRES_URL=postgres://review:review@127.0.0.1:5433/postgres timeout --kill-after=5s 30s node --import tsx scripts/performance/profile-server.mjs /tmp/action-tiny.json /tmp/action-postgres-unavailable.json 5 1 500
          status=$?
          set -e
          echo "Unavailable-extension process exit: $status"
          test "$status" -eq 1
      - name: Inspect resource cleanup and retain bounded measurements
        if: always()
        run: |
          node --input-type=module <<'JS'
          import {createRequire} from 'node:module';
          import {writeFile,readFile} from 'node:fs/promises';
          const require=createRequire(process.cwd()+'/apps/server/package.json');
          const {Client}=require('pg');
          const resources=[];
          for(const port of [5432,5433]) {
            const client=new Client({connectionString:`postgres://review:review@127.0.0.1:${port}/postgres`,connectionTimeoutMillis:5000,statement_timeout:5000});
            try {
              await client.connect();
              const version=await client.query('SHOW server_version');
              const remaining=await client.query("SELECT datname FROM pg_database WHERE datname LIKE 'openlegend_profile_%'");
              resources.push({port,version:version.rows[0].server_version,remaining:remaining.rows});
              if(remaining.rows.length)process.exitCode=1;
            } finally {await client.end();}
          }
          const reports={};
          for(const name of ['mixed','dense','unavailable']) {
            try {reports[name]=JSON.parse(await readFile(`/tmp/action-postgres-${name}.json`,'utf8'));}
            catch(error){if(error.code!=='ENOENT')throw error;}
          }
          const summary={source:process.env.GITHUB_SHA,run:process.env.GITHUB_RUN_ID,scope:'Committed profiler and production source; fresh loopback PostgreSQL databases; no unit/browser suite or paid calls. Short diagnostic phases, not capacity qualification.',resources,reports};
          await writeFile('/tmp/action-postgres-review.json',JSON.stringify(summary,null,2));
          console.log(JSON.stringify({source:summary.source,resources,reports:Object.fromEntries(Object.entries(reports).map(([name,r])=>[name,{database:r.database,error:r.error,cleanupErrors:r.cleanupErrors,phases:r.phases.map(p=>({speed:p.speed,achievedSpeed:p.achievedSpeed,commands:p.client.commands,eventLoop:p.eventLoop,storageError:p.storageError}))}]))},null,2));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: action-postgres-review
          path: /tmp/action-postgres-*.json
          retention-days: 1

name: UI merge source export
on:
  push:
    branches: [docs/game-ui-research-redesign]
    paths: [.github/workflows/ui-merge-source.yml, .github/scripts/ui-reconcile.py]
permissions:
  contents: read
jobs:
  reconcile:
    if: github.repository == 'Macrofold/OpenLegend'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: openlegend
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U openlegend -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      OPENLEGEND_TEST_DATABASE_URL: postgresql://openlegend:fixture@localhost:5432/postgres
      AI_BUDGET_USD: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          show-progress: false
      - name: Prepare explicitly resolved source
        run: |
          git fetch --quiet --unshallow origin
          python3 .github/scripts/ui-reconcile.py
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install pinned dependencies
        working-directory: ${{ runner.temp }}/ui-reconciled
        run: pnpm install --frozen-lockfile
      - name: Format resolved paths
        shell: bash
        run: |
          python3 - <<'PY'
          import ast, os
          from pathlib import Path
          module = ast.parse(Path('.github/scripts/ui-reconcile.py').read_text())
          decisions = next(node.value for node in module.body if isinstance(node, ast.Assign) and any(isinstance(target, ast.Name) and target.id == 'DECISIONS' for target in node.targets))
          Path(os.environ['RUNNER_TEMP'], 'ui-resolved-paths.txt').write_text('\n'.join(key.value for key in decisions.keys) + '\n')
          PY
          cd "$RUNNER_TEMP/ui-reconciled"
          xargs -d '\n' pnpm exec prettier --write < "$RUNNER_TEMP/ui-resolved-paths.txt"
      - name: Check reconciled current contracts
        working-directory: ${{ runner.temp }}/ui-reconciled
        run: pnpm run check
      - name: Report candidate review and source hashes
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'], 'ui-reconciled')
          if root.exists():
              for relative in ['apps/client/src/ui/world-events.tsx', 'apps/client/src/ui/world-agent-session.tsx', 'apps/client/src/ui/world-agent.tsx', 'packages/domain/src/worlds/base/world.ts']:
                  path = root / relative
                  if path.exists():
                      data = path.read_text()
                      print(relative, hashlib.sha256(data.encode()).hexdigest())
                      for i, line in enumerate(data.splitlines(), 1):
                          if any(term in line for term in ['<<<<<<<', '=======', '>>>>>>>', 'BASE_ACTION_DESCRIPTIONS', 'activityHostPin', 'requestedSelection', 'nativeOpeningSession', 'ScopedWorldEvents', 'ScopedComparisonOwner', 'visible={visible}', 'WorldEventScope']):
                              print(f'{i}: {line}')
          PY

name: UI merge source export
on:
  push:
    branches: [docs/game-ui-research-redesign]
    paths: [.github/workflows/ui-merge-source.yml, .github/scripts/ui-reconcile.py]
permissions:
  contents: read
jobs:
  reconcile:
    if: github.repository == 'Macrofold/OpenLegend'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: candidate
            ref: 9bb7e74a4916396248368cd192df9f12bcde0ff3
          - label: main
            ref: 1cf678802d62652d8dd466776d4b95a9d0d19166
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: openlegend
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U openlegend -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AI_BUDGET_USD: '0'
      OPENLEGEND_TEST_DATABASE_URL: postgresql://openlegend:fixture@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
          show-progress: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install exact pinned dependencies
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/ui-final-checks"
          pnpm install --frozen-lockfile > "$RUNNER_TEMP/ui-final-checks/install.log" 2>&1 || { tail -80 "$RUNNER_TEMP/ui-final-checks/install.log"; exit 1; }
      - name: Check candidate guidance after installing its declared dependencies
        if: matrix.label == 'candidate'
        shell: bash
        run: |
          set -o pipefail
          test "$(git rev-parse 'HEAD^{tree}')" = 01741f2bc222456711d77c190c3efab4fe4c2099
          pnpm guidance:check 2>&1 | tee "$RUNNER_TEMP/ui-final-checks/guidance.log"
      - name: Check the three existing world installations through native owners
        if: matrix.label == 'candidate'
        shell: bash
        run: |
          set -o pipefail
          pnpm exec tsx --eval "
          import assert from 'node:assert/strict';
          import { createWorld } from './packages/domain/src/data.ts';
          import { createReservoirDemo, createTouchDemo } from './packages/domain/src/world-presets.ts';
          import { activityRequestDescriptors, activityHostPin } from './packages/domain/src/activity-hosts.ts';
          import { BASE_NATIVE_ACTIVITY_HOSTS } from './packages/domain/src/worlds/base/native-activities.ts';
          const base = createWorld(73);
          const rechargeId = 'reservoir-demo:recharge-session';
          assert.equal(activityRequestDescriptors(base).some(request => request.id === rechargeId), false);
          for (const host of BASE_NATIVE_ACTIVITY_HOSTS) {
            assert.ok(base.moduleManifest.activityHosts.some(pin => JSON.stringify(pin) === JSON.stringify(activityHostPin(host))), host.definition.id);
          }
          for (const [name, create] of [['recharge', createReservoirDemo], ['touch', createTouchDemo]] as const) {
            const world = create(73);
            assert.equal(activityRequestDescriptors(world).some(request => request.id === rechargeId), true, name);
          }
          console.log('PASS: base native activities stay installed; recharge remains available in both alternate worlds and absent from the base world. No provider calls.');
          " 2>&1 | tee "$RUNNER_TEMP/ui-final-checks/world-installation.log"
      - name: Isolate the existing save and departure test without changing its deadline
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e
          pnpm exec vitest run apps/server/src/spatial-http.test.ts -t 'preserves elevated position and manual route snapshots while departure cancels walking' --reporter=json --outputFile="$RUNNER_TEMP/ui-final-checks/spatial.json" > "$RUNNER_TEMP/ui-final-checks/spatial.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/ui-final-checks/spatial.log"
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          report = Path(os.environ['RUNNER_TEMP']) / 'ui-final-checks'
          result = json.loads((report / 'spatial.json').read_text())
          print('EXACT_COMMIT=' + subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip())
          print('TOTAL=' + str(result['numTotalTests']) + ' PASSED=' + str(result['numPassedTests']) + ' FAILED=' + str(result['numFailedTests']))
          for suite in result['testResults']:
              for test in suite['assertionResults']:
                  if test['status'] == 'failed': print(json.dumps(test, indent=2))
          PY
          exit "$status"
      - name: Preserve source-specific final evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-final-checks-${{ matrix.label }}
          path: ${{ runner.temp }}/ui-final-checks/
          retention-days: 3
          if-no-files-found: error

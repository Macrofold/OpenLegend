name: UI merge source export
on:
  push:
    branches: [docs/game-ui-research-redesign]
    paths: [.github/workflows/ui-merge-source.yml, .github/scripts/ui-reconcile.py]
permissions:
  contents: write
jobs:
  reconcile:
    if: github.repository == 'Macrofold/OpenLegend'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AI_BUDGET_USD: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1cf678802d62652d8dd466776d4b95a9d0d19166
          fetch-depth: 0
          persist-credentials: false
          show-progress: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install main's exact dependencies
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/ui-merge-completion"
          pnpm install --frozen-lockfile > "$RUNNER_TEMP/ui-merge-completion/install.log" 2>&1 || { tail -80 "$RUNNER_TEMP/ui-merge-completion/install.log"; exit 1; }
      - name: Reproduce the alternate-world failure on unchanged main
        shell: bash
        run: |
          cat > tests/ui-merge-main-baseline.test.ts <<'TS'
          import { it } from 'vitest';
          import { createReservoirDemo } from '../packages/domain/src/world-presets.js';
          it('constructs the existing alternate world on main', () => {
            createReservoirDemo(73);
          });
          TS
          set +e
          pnpm exec vitest run tests/ui-merge-main-baseline.test.ts --reporter=json --outputFile="$RUNNER_TEMP/ui-merge-completion/main-world.json" > "$RUNNER_TEMP/ui-merge-completion/main-world.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/ui-merge-completion/main-world.log"
          printf '%s\n' "$status" > "$RUNNER_TEMP/ui-merge-completion/main-world.exit"
          rm tests/ui-merge-main-baseline.test.ts
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          report = Path(os.environ['RUNNER_TEMP']) / 'ui-merge-completion'
          results = json.loads((report / 'main-world.json').read_text())
          errors = [message for suite in results['testResults'] for test in suite['assertionResults'] for message in test.get('failureMessages', [])]
          assert len(errors) == 1 and 'Invalid status effect: object attribute binding.' in errors[0], errors
          assert 'createReservoirDemo' in errors[0] and 'status-effect-validation.ts' in errors[0], errors
          print('PREEXISTING_MAIN_FAILURE=' + errors[0], flush=True)
          print('MAIN_COMMIT=' + subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), flush=True)
          PY
      - name: Export the exact already-passing save fixture
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess, textwrap, urllib.request
          from pathlib import Path
          workspace = Path.cwd()
          temp = Path(os.environ['RUNNER_TEMP'])
          report = temp / 'ui-merge-completion'
          root = temp / 'ui-verified-fixture'
          path = 'apps/server/src/spatial-http.test.ts'
          (root / path).parent.mkdir(parents=True)
          original = subprocess.check_output(['git', 'show', '9bb7e74a4916396248368cd192df9f12bcde0ff3:' + path])
          (root / path).write_bytes(original)
          workflow = subprocess.check_output(['git', 'show', '40f4a61802924ed194fc4866cc5f4213cf7b4794:.github/workflows/ui-merge-source.yml'], text=True)
          block = workflow.split('      - name: Reconcile only the stale save-test setup\n', 1)[1].split('\n      - ', 1)[0]
          shell = textwrap.dedent(block.split('        run: |\n', 1)[1])
          code = shell.split("python3 - <<'PY'\n", 1)[1].split('\nPY', 1)[0].split('          # Run the same', 1)[0]
          code = code.split('# Run the same one-off installation scenario', 1)[0]
          os.chdir(root)
          exec(compile(code, 'exact-passing-fixture-from-40f4a618', 'exec'), {})
          data = (root / path).read_bytes()
          expected = hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()
          # The 40f4a618 job printed this exact formatted blob and passed both
          # spatial HTTP tests. Its only failure was the separate world probe.
          assert expected.startswith('a9ff6b6'), expected
          assert data.split(b"it('preserves elevated position", 1)[0] == original.split(b"it('preserves elevated position", 1)[0]
          request = urllib.request.Request('https://api.github.com/repos/Macrofold/OpenLegend/git/blobs', method='POST', data=json.dumps({'content': data.decode(), 'encoding': 'utf-8'}).encode(), headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
          with urllib.request.urlopen(request, timeout=120) as response: result = json.load(response)
          assert result['sha'] == expected
          os.chdir(workspace)
          assert subprocess.check_output(['git', 'status', '--porcelain'], text=True).strip() == ''
          metadata = {'source_tree': '01741f2bc222456711d77c190c3efab4fe4c2099', 'changed_path': path, 'changed_blob': expected, 'production_code_unchanged': True, 'save_check_run': 38619340966, 'save_check_job': 116042477636, 'save_tests_passed': 2, 'types_passed': True, 'temporary_probes_removed': True, 'alternate_world_failure_reproduced_on_main': '1cf678802d62652d8dd466776d4b95a9d0d19166'}
          (report / 'metadata.json').write_text(json.dumps(metadata, indent=2) + '\n')
          print('VERIFIED_FIXTURE=' + json.dumps(metadata, indent=2), flush=True)
          print('No commits or branch references were changed by this job.', flush=True)
          PY
      - name: Preserve the baseline failure and passing fixture identity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-merge-completion
          path: ${{ runner.temp }}/ui-merge-completion/
          retention-days: 3
          if-no-files-found: error
      - name: Keep the pre-existing failure visible
        if: ${{ !cancelled() && success() }}
        run: exit "$(cat "$RUNNER_TEMP/ui-merge-completion/main-world.exit")"

name: UI merge source export
on:
  push:
    branches: [docs/game-ui-research-redesign]
    paths: [.github/workflows/ui-merge-source.yml, .github/scripts/ui-reconcile.py]
permissions:
  contents: write
jobs:
  reconcile:
    if: github.repository == 'Macrofold/OpenLegend'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AI_BUDGET_USD: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9bb7e74a4916396248368cd192df9f12bcde0ff3
          fetch-depth: 0
          persist-credentials: false
          show-progress: false
      - name: Export the already-passing fixture without rerunning completed tests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os, subprocess, textwrap
          from pathlib import Path
          (Path(os.environ['RUNNER_TEMP']) / 'ui-merge-completion').mkdir()
          source = subprocess.check_output(['git', 'show', '38bf684fa34372d5485f82d74289e3d3fa168b08:.github/workflows/ui-merge-source.yml'], text=True)
          block = source.split('      - name: Export the exact already-passing save fixture\n', 1)[1].split('\n      - ', 1)[0]
          shell = textwrap.dedent(block.split('        run: |\n', 1)[1])
          script = Path(os.environ['RUNNER_TEMP']) / 'export-verified-fixture.sh'
          script.write_text(shell)
          subprocess.run(['bash', '-e', '-o', 'pipefail', str(script)], check=True)
          PY
      - name: Preserve the verified fixture identity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-verified-fixture
          path: ${{ runner.temp }}/ui-merge-completion/
          retention-days: 3
          if-no-files-found: error

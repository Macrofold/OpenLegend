name: UI merge source export
on:
  push:
    branches: [docs/game-ui-research-redesign]
    paths: [.github/workflows/ui-merge-source.yml, .github/scripts/ui-reconcile.py]
permissions:
  contents: read
jobs:
  reconcile:
    if: github.repository == 'Macrofold/OpenLegend'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AI_BUDGET_USD: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          show-progress: false
          fetch-depth: 0
      - name: Restore the previously reviewed candidate
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess
          allowed = {'.github/workflows/ui-merge-source.yml', '.github/scripts/ui-reconcile.py', '.github/scripts/ui-reconcile-publish.py'}
          changes = subprocess.check_output(['git', 'diff', '--name-only', '705efb2bd102ba151123659b129372aea62b6a79', 'HEAD'], text=True).splitlines()
          assert set(changes) <= allowed, changes
          workflow = subprocess.check_output(['git', 'show', 'cc156ef87852d3e2bd743314cbbd4021c68ad0b9:.github/workflows/ui-merge-source.yml'], text=True)
          code = workflow.split("          python3 - <<'PY'\n", 1)[1].split('\n          PY', 1)[0]
          exec(compile('\n'.join(line[10:] for line in code.splitlines()), 'previously-reviewed-candidate', 'exec'))
          PY
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install the pinned formatter
        working-directory: ${{ runner.temp }}/ui-reconciled
        shell: bash
        run: pnpm install --frozen-lockfile > "$RUNNER_TEMP/ui-install.log" 2>&1 || { tail -80 "$RUNNER_TEMP/ui-install.log"; exit 1; }
      - name: Reproduce the reviewed formatting
        working-directory: ${{ runner.temp }}/ui-reconciled
        shell: bash
        run: xargs -d '\n' pnpm exec prettier --write < "$RUNNER_TEMP/ui-resolved-paths.txt"
      - name: Calculate the refreshed merge without changing branch references
        id: merge
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess, tarfile
          from pathlib import Path
          old = '1700f3b23a39acfdd14f3a6ab34c8ce330847bc3'
          target = '1cf678802d62652d8dd466776d4b95a9d0d19166'
          temp = Path(os.environ['RUNNER_TEMP'])
          root = temp / 'ui-reconciled'
          out = temp / 'ui-merge-review'
          out.mkdir()
          def git(*args, **kwargs):
              return subprocess.check_output(['git', *args], **kwargs)
          env = dict(os.environ, GIT_DIR=str(Path.cwd() / '.git'), GIT_WORK_TREE=str(root), GIT_INDEX_FILE=str(temp / 'ui-review.index'))
          subprocess.run(['git', 'read-tree', '1404c65ec38ae7f4765ea303a13f00608e0dbfbf'], env=env, check=True)
          subprocess.run(['git', 'add', '-u'], env=env, check=True)
          tree = git('write-tree', env=env, text=True).strip()
          subprocess.run(['git', 'diff', '--check', '705efb2bd102ba151123659b129372aea62b6a79', tree], check=True)
          # This unreferenced, runner-local object supplies ancestry only. The
          # connector will publish the real merge commit after final review.
          local = git('-c', 'user.name=Open Legend reconciliation', '-c', 'user.email=reconciliation@invalid', 'commit-tree', tree, '-p', old, '-p', '705efb2bd102ba151123659b129372aea62b6a79', '-m', 'Temporary merge calculation; no branch reference', text=True).strip()
          result = subprocess.run(['git', 'merge-tree', '--write-tree', local, target], text=True, capture_output=True)
          assert result.returncode in (0, 1), result.stderr
          merged = result.stdout.splitlines()[0]
          (out / 'merge.txt').write_text(result.stdout)
          (out / 'upstream.patch').write_bytes(git('diff', '--binary', old, target))
          (out / 'overlap.patch').write_bytes(git('diff', '--binary', target, merged, '--', 'apps', 'packages'))
          (out / 'reviewed.patch').write_bytes(git('diff', '--binary', '1404c65ec38ae7f4765ea303a13f00608e0dbfbf', tree))
          metadata = {'ui_parent': os.environ['GITHUB_SHA'], 'old_main': old, 'main_parent': target, 'reviewed_tree': tree, 'merged_tree': merged, 'conflicted': result.returncode != 0}
          (out / 'metadata.json').write_text(json.dumps(metadata, indent=2) + '\n')
          # Export repository sources, never credentials, databases or node_modules.
          for label, ref in [('reviewed', tree), ('main', target), ('merged', merged)]:
              (out / (label + '.tar')).write_bytes(git('archive', ref))
          print(json.dumps(metadata, indent=2))
          print(result.stdout)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('conflicted=' + str(result.returncode != 0).lower() + '\n')
          PY
      - name: Preserve exact sources for the affected-diff review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-refreshed-merge-review
          path: ${{ runner.temp }}/ui-merge-review/
          retention-days: 3
          if-no-files-found: error
      - name: Keep unresolved conflicts visible
        if: steps.merge.outputs.conflicted == 'true'
        run: exit 1

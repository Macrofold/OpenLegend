name: UI merge source export
on:
  push:
    branches: [docs/game-ui-research-redesign]
    paths: [.github/workflows/ui-merge-source.yml, .github/scripts/ui-reconcile.py]
permissions:
  contents: write
jobs:
  reconcile:
    if: github.repository == 'Macrofold/OpenLegend'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: openlegend
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U openlegend -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      OPENLEGEND_TEST_DATABASE_URL: postgresql://openlegend:fixture@localhost:5432/postgres
      AI_BUDGET_USD: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          show-progress: false
      - name: Prepare reviewed candidate and isolated check index
        shell: bash
        run: |
          git fetch --quiet --unshallow origin
          python3 - <<'PY'
          import subprocess
          workflow = subprocess.check_output(['git', 'show', '10a0f5db15e15a1b48cba7d1b03c59aa93571dd9:.github/workflows/ui-merge-source.yml'], text=True)
          code = workflow.split("          python3 - <<'PY'\n", 1)[1].split('\n          PY', 1)[0]
          exec(compile('\n'.join(line[10:] for line in code.splitlines()), 'reviewed-candidate-preparation', 'exec'))
          world = ROOT / 'packages/domain/src/worlds/base/world.ts'
          data = replace(world.read_text(), "import { activityHostPins } from '../../activity-hosts.js';", "import { activityHostPin, STOCK_ACTIVITY_HOST } from '../../activity-hosts.js';\nimport { BASE_FIRE_ACTIVITY_HOST } from './fire-activity.js';\nimport { BASE_CAMP_ACTIVITY_HOST } from './camp-activity.js';\nimport { BASE_OUTING_HOST } from './outing.js';\nimport { BASE_CANOPY_ACTIVITY_HOST } from './canopies.js';")
          data = replace(data, 'activityHostPins()', '[STOCK_ACTIVITY_HOST, BASE_FIRE_ACTIVITY_HOST, BASE_CAMP_ACTIVITY_HOST, BASE_OUTING_HOST, BASE_CANOPY_ACTIVITY_HOST].map(activityHostPin)')
          world.write_text(data)
          name = 'BASE_COOKING_PRESENTATION'
          readers = []
          for directory in [ROOT / 'apps', ROOT / 'packages']:
              for path in directory.rglob('*.ts*'):
                  if path.is_file() and name in path.read_text() and path.name != 'presentation.ts':
                      readers.append(path)
          assert set(readers) == {ROOT / 'apps/server/src/action-catalogue.ts', ROOT / 'packages/domain/src/index.ts'}
          for path in readers:
              assert path.read_text().count(name) == 1
              data, count = re.subn(r'^\s*BASE_COOKING_PRESENTATION,\n', '', path.read_text(), flags=re.M)
              assert count == 1
              path.write_text(data)
          presentation = ROOT / 'packages/domain/src/worlds/base/presentation.ts'
          data = presentation.read_text()
          start = data.index('export const BASE_COOKING_PRESENTATION = {')
          end = data.index('export const BASE_ACTION_DESCRIPTIONS', start)
          data = data[:start] + data[end:]
          if data.count('BASE_FAMILY_FACTS') == 1:
              data = replace(data, "import { BASE_FAMILY_FACTS } from './actions.js';\n", '')
          presentation.write_text(data)
          with open(Path(os.environ['RUNNER_TEMP'], 'ui-resolved-paths.txt'), 'a') as output:
              output.write('packages/domain/src/index.ts\n')
          PY
          export GIT_DIR="$GITHUB_WORKSPACE/.git"
          export GIT_WORK_TREE="$RUNNER_TEMP/ui-reconciled"
          export GIT_INDEX_FILE="$RUNNER_TEMP/ui-check.index"
          git read-tree 1404c65ec38ae7f4765ea303a13f00608e0dbfbf
          git update-index --force-remove .github/workflows/ui-merge-source.yml
          printf 'GIT_DIR=%s\nGIT_WORK_TREE=%s\nGIT_INDEX_FILE=%s\n' "$GIT_DIR" "$GIT_WORK_TREE" "$GIT_INDEX_FILE" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install pinned dependencies
        working-directory: ${{ runner.temp }}/ui-reconciled
        run: pnpm install --frozen-lockfile > "$RUNNER_TEMP/ui-install.log" 2>&1 || { tail -80 "$RUNNER_TEMP/ui-install.log"; exit 1; }
      - name: Format resolved paths
        working-directory: ${{ runner.temp }}/ui-reconciled
        run: xargs -d '\n' pnpm exec prettier --write < "$RUNNER_TEMP/ui-resolved-paths.txt"
      - name: Run every required Code check
        working-directory: ${{ runner.temp }}/ui-reconciled
        shell: bash
        run: |
          failed=0
          for check in guidance:check config:check format:check typecheck test build; do
            log="$RUNNER_TEMP/ui-${check//:/-}.log"
            if pnpm run "$check" > "$log" 2>&1; then
              echo "CHECK_PASS=$check"
              tail -8 "$log"
            else
              echo "CHECK_FAIL=$check"
              tail -180 "$log"
              failed=1
            fi
          done
          test "$failed" -eq 0
      - name: Publish checked tree without changing branch refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/ui-reconcile-publish.py
      - name: Restore checkout environment
        if: always()
        run: printf 'GIT_DIR=%s/.git\nGIT_WORK_TREE=%s\nGIT_INDEX_FILE=%s/.git/index\n' "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

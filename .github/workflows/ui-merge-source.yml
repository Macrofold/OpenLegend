name: UI merge source export
on:
  push:
    branches: [docs/game-ui-research-redesign]
    paths: [.github/workflows/ui-merge-source.yml, .github/scripts/ui-reconcile.py]
permissions:
  contents: write
  actions: read
jobs:
  reconcile:
    if: github.repository == 'Macrofold/OpenLegend'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: openlegend
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U openlegend -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      OPENLEGEND_TEST_DATABASE_URL: postgresql://openlegend:fixture@localhost:5432/postgres
      AI_BUDGET_USD: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          show-progress: false
      - name: Prepare reviewed candidate and isolated check index
        shell: bash
        run: |
          git fetch --quiet --unshallow origin
          python3 - <<'PY'
          import subprocess
          workflow = subprocess.check_output(['git', 'show', 'b3c8ef51bc76c6cf4b598b28d51610aa0d5f3c2a:.github/workflows/ui-merge-source.yml'], text=True)
          code = workflow.split("          python3 - <<'PY'\n", 1)[1].split('\n          PY', 1)[0]
          exec(compile('\n'.join(line[10:] for line in code.splitlines()), 'checked-candidate-preparation', 'exec'))
          path = ROOT / 'apps/server/src/spatial-http.test.ts'
          data = replace(path.read_text(), "    await game.service.command('saved-ramp', {", "    // An idle snapshot still needs departure reconciliation after transport reset.\n    // Moving work is separately checked below and must survive a paused load.\n    const idleId = randomUUID();\n    await game.service.createSave('Idle before the ramp', idleId);\n    const idleStored = await game.service.store.saves!.read(game.service.world.id, idleId);\n    await game.service.command('saved-ramp', {")
          data = replace(data, '// A completed install cannot hide a failure saving its following departure state.', '// An idle checkpoint install cannot hide a failure saving its following departure state.')
          data = replace(data, 'game.service.restoreSave(id, requestId, stored)', 'game.service.restoreSave(idleId, requestId, idleStored)')
          data = replace(data, 'expect(game.service.world.entities[actorId]!.actor!.action).toEqual(snapshot!.actor!.action);', 'expect(game.service.world.entities[actorId]!.actor!.action).toEqual(\n      idleStored.state.world.entities[actorId]!.actor!.action,\n    );')
          data = replace(data, 'toEqual({ saveId: id });', 'toEqual({ saveId: idleId });')
          path.write_text(data)
          PY
          export GIT_DIR="$GITHUB_WORKSPACE/.git"
          export GIT_WORK_TREE="$RUNNER_TEMP/ui-reconciled"
          export GIT_INDEX_FILE="$RUNNER_TEMP/ui-check.index"
          git read-tree 1404c65ec38ae7f4765ea303a13f00608e0dbfbf
          git update-index --force-remove .github/workflows/ui-merge-source.yml
          printf 'GIT_DIR=%s\nGIT_WORK_TREE=%s\nGIT_INDEX_FILE=%s\n' "$GIT_DIR" "$GIT_WORK_TREE" "$GIT_INDEX_FILE" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install pinned dependencies
        working-directory: ${{ runner.temp }}/ui-reconciled
        run: pnpm install --frozen-lockfile > "$RUNNER_TEMP/ui-install.log" 2>&1 || { tail -80 "$RUNNER_TEMP/ui-install.log"; exit 1; }
      - name: Format resolved paths
        working-directory: ${{ runner.temp }}/ui-reconciled
        run: xargs -d '\n' pnpm exec prettier --write < "$RUNNER_TEMP/ui-resolved-paths.txt"
      - name: Guidance configuration formatting TypeScript and build
        working-directory: ${{ runner.temp }}/ui-reconciled
        shell: bash
        run: |
          for check in guidance:check config:check format:check typecheck build; do
            log="$RUNNER_TEMP/ui-${check//:/-}.log"
            pnpm run "$check" > "$log" 2>&1 || { tail -100 "$log"; exit 1; }
            echo "CHECK_PASS=$check"
          done
      - name: Full test suite - retain actual failure result
        id: tests
        continue-on-error: true
        working-directory: ${{ runner.temp }}/ui-reconciled
        run: pnpm exec vitest run --reporter=json --outputFile="$RUNNER_TEMP/ui-test.json" > "$RUNNER_TEMP/ui-test.log" 2>&1 || { tail -30 "$RUNNER_TEMP/ui-test.log"; exit 1; }
      - name: Verify no newly failing tests against existing main Code evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, urllib.request
          from pathlib import Path
          request = urllib.request.Request('https://api.github.com/repos/Macrofold/OpenLegend/actions/jobs/115928417532/logs', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(request, timeout=60) as response:
              raw = response.read()
          log = re.sub(r'\x1b\[[0-9;]*[a-zA-Z]', '', raw.decode('utf-8-sig'))
          previous = {(m[1], m[2].strip()) for m in re.finditer(r'\bFAIL\s+(\S+\.test\.tsx?)\s+>\s+([^\n]+)', log)}
          assert previous, 'No baseline failure evidence was parsed.'
          report = json.loads(Path(os.environ['RUNNER_TEMP'], 'ui-test.json').read_text())
          assert report['numTotalTests'] == 344
          current = set()
          for file in report['testResults']:
              relative = str(Path(file['name']).relative_to(Path(os.environ['RUNNER_TEMP'], 'ui-reconciled')))
              for test in file['assertionResults']:
                  if test['status'] == 'failed':
                      name = ' > '.join([*test.get('ancestorTitles', []), test['title']])
                      current.add((relative, name))
                      print('FAILED_TEST=' + relative + ' > ' + name)
                      print('FAILURE_REASON=' + '\n'.join(test.get('failureMessages', []))[:900])
          added = current - previous
          print('MAIN_LOG_SHA256=' + hashlib.sha256(raw).hexdigest())
          print('MAIN_RECORDED_RESULT=29 failed / 314 passed; job 115928417532')
          print(f"CANDIDATE_RESULT={report['numFailedTests']} failed / {report['numPassedTests']} passed")
          print('NEWLY_FAILING_TESTS=' + json.dumps(sorted(added)))
          assert not added, 'New failures require reconciliation; baseline failures remain failures.'
          print('RECONCILIATION_CHECK=No newly failing test identities; full Code gate remains failed.')
          PY
      - name: Publish verified reconciliation tree without changing branch refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/ui-reconcile-publish.py
      - name: Restore checkout environment
        if: always()
        run: printf 'GIT_DIR=%s/.git\nGIT_WORK_TREE=%s\nGIT_INDEX_FILE=%s/.git/index\n' "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

name: Action rebase review
on:
  push:
    branches: [review/action-capabilities-fdcbd31]
    paths: ['.github/workflows/action-rebase-review.yml', '.github/action-review/**']
permissions:
  contents: read
concurrency:
  group: action-fdcbd31-review
  cancel-in-progress: true
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      AI_BUDGET_USD: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 94a7682aee9f100ccb54e073969bb4ed4f9fea49
          path: _before
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: fc01e19b30060e6c7213b1c5405be13df209297e
          path: _ancestor
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve reviewed semantic overlaps
        run: python .github/action-review/reconcile.py
      - name: Production build
        run: pnpm build
      - name: Retain source and dependency workspace for review
        if: always()
        shell: python
        run: |
          from pathlib import Path
          import tarfile
          root=Path.cwd()
          def filter_entry(item):
            if '.git' in Path(item.name).parts or item.name.startswith('./dist/') or item.name.startswith('./.data/'):
              return None
            return item
          with tarfile.open('/tmp/reconciled-workspace.tgz','w:gz') as archive:
            for path in root.iterdir():
              if path.name not in ['.git','dist','.data']:
                archive.add(path,arcname=path.name,filter=filter_entry)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reconciled-workspace
          path: /tmp/reconciled-workspace.tgz
          compression-level: 0
          retention-days: 1

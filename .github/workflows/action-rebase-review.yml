name: Action rebase review
on:
  push:
    branches: [review/action-capabilities-fdcbd31]
    paths: ['.github/workflows/action-rebase-review.yml', '.github/action-review/**']
permissions:
  contents: write
concurrency:
  group: action-fdcbd31-review
  cancel-in-progress: true
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      AI_BUDGET_USD: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 94a7682aee9f100ccb54e073969bb4ed4f9fea49
          path: _before
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: fc01e19b30060e6c7213b1c5405be13df209297e
          path: _ancestor
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve reviewed semantic overlaps
        run: |
          python .github/action-review/reconcile.py
          python .github/action-review/fix-binding.py
          python - <<'PY'
          import pathlib,json,subprocess
          p=pathlib.Path('apps/server/src/ai-director.ts')
          p.write_text(p.read_text().replace('docs/action-capabilities.md#references-targets-quantities-and-evidence','docs/architecture.md#jev-first-action-grounding'))
          paths=json.loads(pathlib.Path('_review-paths.json').read_text())
          targets=[p for p in paths if pathlib.Path(p).is_file() and pathlib.Path(p).suffix in ['.ts','.tsx','.mjs','.md']]
          subprocess.run(['pnpm','exec','prettier','--write',*targets],check=True)
          PY
      - name: Production and generated-contract checks
        run: |
          pnpm build
          pnpm config:check
          pnpm guidance:check
      - name: Prepare immutable replay tree only
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const base=await github.rest.git.getCommit({...context.repo,commit_sha:context.sha});
            const paths=JSON.parse(fs.readFileSync('_review-paths.json','utf8'));
            const reportPath='docs/verification/action-rebase-fdcbd31.json';
            fs.writeFileSync(reportPath,JSON.stringify({main:'fdcbd31fc9e4eb31daaf00d997648aba588c8577',source:'94a7682aee9f100ccb54e073969bb4ed4f9fea49',scope:'Consolidated semantic replay on a separate main-based branch; original history preserved. Production build and config/guidance checks; no automated suites or live provider calls.',build:'passed',config:'passed',guidance:'passed',runtimeReview:'ongoing',paidModelCalls:0,run:context.runId},null,2)+'\n');
            paths.push(reportPath);
            const tree=paths.map(path=>fs.existsSync(path)?{path,mode:'100644',type:'blob',content:fs.readFileSync(path,'utf8')}:{path,mode:'100644',type:'blob',sha:null});
            const prepared=await github.rest.git.createTree({...context.repo,base_tree:base.data.tree.sha,tree});
            // No commits, branch updates or merges here. The GitHub connector performs those.
            console.log('PREPARED_REPLAY '+JSON.stringify({parent:context.sha,tree:prepared.data.sha,files:paths.length}));

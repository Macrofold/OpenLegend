name: Hearing profiling workspace
on:
  push:
    branches: [feat/hearing-speech-captions]
    paths: [.github/workflows/hearing-workspace.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Package source and locked dependencies only
        run: tar --exclude=.git --exclude=.env --exclude=.data --exclude=.data-* -czf /tmp/hearing-workspace.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: hearing-rebased-workspace
          path: /tmp/hearing-workspace.tar.gz
          retention-days: 1

name: UI completion qualification
on:
  push:
    branches: [docs/game-ui-research-redesign]
    paths: [.github/workflows/ui-completion-source-read-20261014.yml]
permissions:
  contents: read
jobs:
  qualify:
    if: github.repository == 'Macrofold/OpenLegend'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: openlegend
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U openlegend -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AI_BUDGET_USD: '0'
      OPENLEGEND_TEST_DATABASE_URL: postgresql://openlegend:fixture@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile > "$RUNNER_TEMP/install.log" 2>&1 || { tail -60 "$RUNNER_TEMP/install.log"; exit 1; }
      - name: Qualify the committed source without modifying it
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          report=Path(os.environ['RUNNER_TEMP'])/'ui-scoped';report.mkdir()
          checks={}
          def run(label,args):
            with (report/(label+'.log')).open('w') as out:
              checks[label]=subprocess.run(args,stdout=out,stderr=subprocess.STDOUT).returncode
            print(label+': '+str(checks[label]),flush=True)
            if checks[label]:
              print('\n'.join((report/(label+'.log')).read_text().splitlines()[-70:]),flush=True)
          run('types',['pnpm','typecheck'])
          if checks['types']==0:
            run('tests',['pnpm','exec','vitest','run','apps/server/src/level1-decisions.test.ts','apps/server/src/cognition-payloads.test.ts','apps/server/src/cognition-verification.test.ts','apps/server/src/context.test.ts','apps/server/src/ai-director.test.ts','apps/server/src/http.test.ts','apps/server/src/action-catalogue.test.ts','--reporter=json','--outputFile='+str(report/'tests.json')])
          if (report/'tests.json').exists():
            data=json.loads((report/'tests.json').read_text());failures=[]
            for suite in data['testResults']:
              for test in suite['assertionResults']:
                if test['status']=='failed':
                  failures.append({'file':str(Path(suite['name']).relative_to(Path.cwd())),'test':test['fullName'],'errors':test.get('failureMessages',[])})
            print('RESULT='+json.dumps({'passed':data['numPassedTests'],'failed':data['numFailedTests'],'total':data['numTotalTests'],'failures':failures},indent=2),flush=True)
          print('ROUTING_SOURCES',flush=True)
          subprocess.run(['rg','-n','request_|offeredRoutes','apps/server/src/jev-questions.ts','apps/server/src/response-routing.ts','apps/server/src/ai-director.ts'],check=False)
          print('NESTED_GUIDANCE',flush=True)
          for root in ['apps','tests','docs','.github']:
            for p in sorted(Path(root).rglob('AGENTS.md')):print(p,flush=True)
          metadata={'commit':os.environ['GITHUB_SHA'],'checks':checks,'providerSpendUsd':0}
          (report/'metadata.json').write_text(json.dumps(metadata,indent=2));print('COMMITTED_SOURCE='+json.dumps(metadata),flush=True)
          print('Detached qualification checkout '+os.getcwd()+'. No source, Git objects or branch references changed.',flush=True)
          if any(checks.values()):raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-scoped
          path: ${{ runner.temp }}/ui-scoped/
          retention-days: 3
          if-no-files-found: error

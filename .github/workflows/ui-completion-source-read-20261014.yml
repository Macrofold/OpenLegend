name: UI completion source inspection
on:
  push:
    branches: [docs/game-ui-research-redesign]
    paths: [.github/workflows/ui-completion-source-read-20261014.yml]
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'Macrofold/OpenLegend'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: openlegend
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U openlegend -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AI_BUDGET_USD: '0'
      OPENLEGEND_TEST_DATABASE_URL: postgresql://openlegend:fixture@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          show-progress: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile > "$RUNNER_TEMP/install.log" 2>&1 || { tail -60 "$RUNNER_TEMP/install.log"; exit 1; }
      - name: Observe the existing failing fixture without changing its assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('apps/server/src/level1-decisions.test.ts');text=p.read_text()
          old='      calls.judges.push(request);'
          assert text.count(old)==1
          p.write_text(text.replace(old,old+"\n      console.log('EXACT_FIXTURE_REQUEST=' + JSON.stringify({id: request.requestId, questions: request.questions, state: request.state}));",1))
          PY
          set +e
          pnpm exec vitest run apps/server/src/level1-decisions.test.ts -t 'eats owned food from one combined Jev request' --reporter=verbose > "$RUNNER_TEMP/fixture.log" 2>&1
          result=$?
          set -e
          python3 - <<'PY'
          import os,re,subprocess
          from pathlib import Path
          text=Path(os.environ['RUNNER_TEMP'],'fixture.log').read_text()
          for line in text.splitlines():
            if 'EXACT_FIXTURE_REQUEST=' in line:
              print(line[:22000],flush=True)
          print('\n'.join(text.splitlines()[-45:]),flush=True)
          print('SOURCE_CONTEXT',flush=True)
          spans={
            'apps/server/src/cognition-payloads.test.ts':[(100,260),(1410,1465)],
            'apps/server/src/cognition-verification.test.ts':[(110,255)],
            'apps/server/src/action-catalogue.test.ts':[(30,95)],
            'apps/server/src/http.test.ts':[(100,160)],
            'tests/browser/actions.spec.ts':[(75,130)],
            'apps/client/src/design-system/chrome.css':[(1,180)],
          }
          for name,ranges in spans.items():
            lines=Path(name).read_text().splitlines(); print('FILE='+name,flush=True)
            for a,b in ranges: print('\n'.join(str(i+1)+': '+lines[i] for i in range(a-1,min(b,len(lines)))),flush=True)
          p=Path('apps/server/src/world-service.test.ts');text=p.read_text();start=text.index("  it('settles disconnected exposure")
          end=text.find('\n  it(',start+1)
          print('TIME_TEST='+text[start:end if end>=0 else len(text)],flush=True)
          for file in ['apps/server/src/cognition-payloads.test.ts','apps/server/src/cognition-verification.test.ts']:
            text=Path(file).read_text()
            for match in re.finditer(r'async function (?:harness|setup)\(',text):
              end=text.find('\n}\n',match.start())+3
              print('SETUP='+file+'\n'+text[match.start():end],flush=True)
          print('This diagnostic changed no assertion or production code; no branch references updated.',flush=True)
          PY
          exit "$result"

name: Commit final spatial fixes and observe combined workloads
on:
  push:
    branches: [feature/spatial-world-3d]
    paths: [.github/workflows/spatial-review.yml]
permissions:
  contents: write
jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Commit the reviewed two-file runtime diff before browser observation
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 57755b4128e6998c7204357f6b2e222f6af58d6c
          git apply --check .github/spatial-review-final.patch
          git apply .github/spatial-review-final.patch
          pnpm run build
          git add apps/client/src/world-presentation.ts apps/server/src/navigation/coordinator.ts
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '[skip ci] Reuse lightweight shadow geometry and handle immediate navigation-worker failures'
          git push origin HEAD:refs/heads/feature/spatial-world-3d
      - run: pnpm exec playwright install --with-deps chromium
      - name: Observe prior and final mixed scenes, plus the normal starter world
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$PWD"
          mkdir -p "$RUNNER_TEMP/observations" "$RUNNER_TEMP/probe-source"
          cp .github/mixed-scene-* "$RUNNER_TEMP/probe-source/"
          # Camera projection matrices settle at render boundaries, not after an arbitrary sleep.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/mixed-scene-client.ts')
          s=p.read_text().replace("  scene.cameraCommand({type:'orbit',yaw:yaw-c.yaw,pitch:pitch-c.pitch});", "  scene.cameraCommand({type:'orbit',yaw:yaw-c.yaw,pitch:pitch-c.pitch});\n  return new Promise(resolve=>scene.app.once('frameend',resolve));")
          Path(__import__('os').environ['RUNNER_TEMP']+'/probe-source/mixed-scene-client.ts').write_text(s)
          PY
          git worktree add --detach "$RUNNER_TEMP/before" 57755b4128e6998c7204357f6b2e222f6af58d6c
          OBS_FAILED=0
          for variant in before final starter; do
            if [ "$variant" = before ]; then cd "$RUNNER_TEMP/before"; else cd "$ROOT"; fi
            pnpm install --frozen-lockfile
            cp "$RUNNER_TEMP/probe-source/mixed-scene-client.ts" apps/client/review.ts
            cp "$RUNNER_TEMP/probe-source/mixed-scene-server.mjs" .github/mixed-scene-server.mjs
            cp "$RUNNER_TEMP/probe-source/mixed-scene-browser.mjs" .github/mixed-scene-browser.mjs
            printf '%s' '<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17251d}canvas{width:100%;height:100%;display:block}</style></head><body><canvas tabindex="0"></canvas><script type="module" src="/review.ts"></script></body></html>' > apps/client/review.html
            node --input-type=module -e "import {build} from 'vite';await build({configFile:'apps/client/vite.config.ts',build:{rollupOptions:{input:{index:'apps/client/index.html',review:'apps/client/review.html'}}}})"
            export PORT=3252 AI_BUDGET_USD=0 OPEN_LEGEND_DATABASE_URL=''
            export OBS_OUT="$RUNNER_TEMP/observations/$variant" OPEN_LEGEND_DATA_DIR="$RUNNER_TEMP/world-$variant"
            mkdir -p "$OBS_OUT"
            if [ "$variant" = starter ]; then
              node --import tsx apps/server/src/main.ts --production > "$OBS_OUT/server.log" 2>&1 &
            else
              node --import tsx .github/mixed-scene-server.mjs > "$OBS_OUT/server.log" 2>&1 &
            fi
            PID=$!
            trap 'kill -TERM "$PID" 2>/dev/null || true' EXIT
            for i in $(seq 1 60); do if curl -fsS "http://127.0.0.1:$PORT/api/state" > /dev/null; then break; fi; sleep 1; done
            node .github/mixed-scene-browser.mjs || OBS_FAILED=1
            kill -TERM "$PID"
            wait "$PID"
            trap - EXIT
          done
          test "$OBS_FAILED" = 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spatial-final-review-observations
          path: ${{ runner.temp }}/observations
          retention-days: 3

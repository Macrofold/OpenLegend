name: Reconcile reviewed spatial documentation
on:
  push:
    branches: [feature/spatial-world-3d]
    paths: [.github/workflows/spatial-review.yml]
permissions:
  contents: write
jobs:
  document:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Apply checked documentation outputs without running test suites
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = bd8edeacbd3f008a920916cbd150b0ee3dbf2b50
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, re
          expected = ['a0772ccd5f432f82ccb9eb24b8c4995b101c2e199636589d3a5b12af42447c69', '9c507e268a749f92c3ec7ed683aaff1869bcbf01dd505d5f7aa0bac0953b0174']
          root = Path.cwd().resolve()
          seen = set()
          for index, digest in enumerate(expected, 1):
              raw = Path(f'.github/spatial-review-docs-{index}.json').read_bytes()
              assert hashlib.sha256(raw).hexdigest() == digest
              for item in json.loads(raw):
                  name = item['path']
                  path = Path(name)
                  assert name not in seen and path.suffix == '.md'
                  assert not path.is_symlink() and path.resolve().is_relative_to(root)
                  seen.add(name)
                  before = path.read_bytes()
                  assert hashlib.sha256(before).hexdigest() == item['before'], name
                  lines = before.decode().splitlines(keepends=True)
                  if name == 'docs/maintainers/spatial-world.md':
                      # Preserve the still-open sustained-population task found during diff review.
                      assert lines[42].startswith('- [ ] **SW14.3a**')
                      edit = next(e for e in item['edits'] if e[0] == 41)
                      assert edit[1] == 2
                      edit[1] = 1
                      item['after'] = '2c9df5d729b108af2961eef4b404554313a043f4cf8410e4fc27793faf8294d6'
                  for start, count, replacement in reversed(item['edits']):
                      assert 0 <= start <= len(lines) and 0 <= count <= len(lines)-start
                      lines[start:start+count] = [replacement]
                  after = ''.join(lines).encode()
                  assert hashlib.sha256(after).hexdigest() == item['after'], name
                  task = rb'\*\*((?:SW|PF|EPR|SR)\d+(?:\.\d+[a-z]?)?)'
                  assert set(re.findall(task, before)) <= set(re.findall(task, after)), name
                  path.write_bytes(after)
          assert len(seen) == 15
          PY
          git add README.md docs archive
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '[skip ci] Reconcile camera-facing, perception, worker and performance documentation' -m 'Mark delivered subsets and retain open scale/visual/lifecycle gates. Preserve all existing task IDs and replace only obsolete audience-cache requirements. Link actual combined application observations; no tests or paid calls.'
          git push origin HEAD:refs/heads/feature/spatial-world-3d

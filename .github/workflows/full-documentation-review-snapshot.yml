name: Documentation review source snapshot
on:
  push:
    branches: [docs/full-documentation-review-2026-10-02]
    paths: [.github/workflows/full-documentation-review-snapshot.yml]
permissions:
  contents: read
jobs:
  tracked-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export the reviewed source and refreshed documentation base
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/documentation-review"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/documentation-review/review-source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/documentation-review/review-revision.txt"
          git fetch --no-tags origin 1253415bad1560c98fc320fad060dc444e4bbcaa
          git archive --format=tar.gz 1253415bad1560c98fc320fad060dc444e4bbcaa > "$RUNNER_TEMP/documentation-review/main-source.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: openlegend-documentation-review-resume
          path: ${{ runner.temp }}/documentation-review/
          retention-days: 1
          if-no-files-found: error

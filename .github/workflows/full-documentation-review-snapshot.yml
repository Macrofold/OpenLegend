name: Documentation review source snapshot
on:
  push:
    branches: [docs/full-documentation-review-2026-10-02]
    paths: [.github/workflows/full-documentation-review-snapshot.yml]
permissions:
  contents: read
jobs:
  tracked-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8646ea4652639e25663ac2e4abde0bd2a5cbacd8
          path: review
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: e4d25a06105fbc1321c9a0e7a7a12524e7644ce1
          path: upstream
          persist-credentials: false
      - name: Package tracked sources and exact revisions
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/documentation-review/patches"
          for scope in review upstream; do
            git -C "$scope" archive --format=tar.gz HEAD > "$RUNNER_TEMP/documentation-review/$scope.tar.gz"
            git -C "$scope" rev-parse HEAD > "$RUNNER_TEMP/documentation-review/$scope-revision.txt"
          done
          git -C review format-patch --full-index --binary -o "$RUNNER_TEMP/documentation-review/patches" 8005f7c7245cfecec128652efe3ef07926604e0a..HEAD
          git -C review log --format='%H %P %s' 8005f7c7245cfecec128652efe3ef07926604e0a..HEAD > "$RUNNER_TEMP/documentation-review/review-commits.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: openlegend-documentation-review-pinned
          path: ${{ runner.temp }}/documentation-review/
          retention-days: 1
          if-no-files-found: error

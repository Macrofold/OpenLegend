name: Documentation review source snapshot
on:
  push:
    branches: [docs/full-documentation-review-2026-10-01]
    paths: [.github/workflows/full-documentation-review-snapshot.yml]
permissions:
  contents: read
jobs:
  tracked-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: openlegend
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openlegend -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      OPENLEGEND_TEST_DATABASE_URL: postgresql://openlegend:fixture@localhost:5432/postgres
      AI_BUDGET_USD: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the repository-pinned tools
        run: pnpm install --frozen-lockfile
      - name: Package the pinned documentation validators
        run: |
          mkdir -p "$RUNNER_TEMP/review-tools"
          cp -R "$(readlink -f node_modules/yaml)" "$RUNNER_TEMP/review-tools/yaml"
          cp -R "$(readlink -f node_modules/prettier)" "$RUNNER_TEMP/review-tools/prettier"
          tar -czf "$RUNNER_TEMP/openlegend-review-tools.tar.gz" -C "$RUNNER_TEMP" review-tools
      - name: Package only tracked source for the requested review
        run: |
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/openlegend-review-source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/openlegend-review-revision.txt"
      - name: Check inherited runtime blockers independently of documentation formatting
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/review-checks"
          set +e
          pnpm run typecheck > "$RUNNER_TEMP/review-checks/typecheck.txt" 2>&1
          types=$?
          pnpm test > "$RUNNER_TEMP/review-checks/tests.txt" 2>&1
          tests=$?
          pnpm run build > "$RUNNER_TEMP/review-checks/build.txt" 2>&1
          build=$?
          printf '{"typecheck_exit":%s,"tests_exit":%s,"build_exit":%s}\n' "$types" "$tests" "$build" > "$RUNNER_TEMP/review-checks/status.json"
          cat "$RUNNER_TEMP/review-checks/status.json"
          test "$types" -eq 0 && test "$tests" -eq 0 && test "$build" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openlegend-documentation-review-source
          path: |
            ${{ runner.temp }}/openlegend-review-source.tar.gz
            ${{ runner.temp }}/openlegend-review-revision.txt
            ${{ runner.temp }}/openlegend-review-tools.tar.gz
            ${{ runner.temp }}/review-checks/
          retention-days: 1
          if-no-files-found: error

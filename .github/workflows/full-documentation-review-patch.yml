name: Apply reviewed documentation patch
on:
  push:
    branches: [docs/full-documentation-review-reconciled-2026-10-03]
    paths: [.github/full-documentation-review-patch.json]
permissions:
  contents: write
concurrency:
  group: full-documentation-review-reconciled-patch
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      AI_BUDGET_USD: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --ignore-scripts --frozen-lockfile
      - name: Validate and apply exact reviewed files
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, pathlib, posixpath, subprocess, zlib
          root = pathlib.Path.cwd()
          bundle = json.loads(pathlib.Path('.github/full-documentation-review-patch.json').read_text())
          if 'compressed_patch' in bundle:
              decoder = zlib.decompressobj()
              decoded = decoder.decompress(base64.b64decode(bundle['compressed_patch'], validate=True), 8 * 1024 * 1024)
              assert decoder.eof and not decoder.unused_data and not decoder.unconsumed_tail, 'invalid or oversized patch'
              bundle = json.loads(decoded)
          def path_for(name):
              relative = pathlib.PurePosixPath(name)
              assert not relative.is_absolute() and '..' not in relative.parts, name
              path = root / name
              assert path.resolve().is_relative_to(root) and not path.is_symlink(), name
              return path
          moves = {item['before_path']: item['path'] for item in bundle['files'] if item.get('before_path', item['path']) != item['path']}
          for old, new in moves.items():
              assert old.startswith('docs/projects/') and new.startswith('docs/projects/completed/'), ('invalid move', old, new)
          outputs, inputs, planned, formatting = set(), set(), [], []
          for item in bundle['files']:
              name = item['path']
              old_name = item.get('before_path', name)
              path, source = path_for(name), path_for(old_name)
              assert name not in outputs and old_name not in inputs, ('duplicate path', name)
              outputs.add(name)
              inputs.add(old_name)
              before = source.read_bytes() if source.exists() else None
              actual = hashlib.sha256(before).hexdigest() if before is not None else None
              assert actual == item['before_sha256'], ('changed base', old_name)
              if old_name != name:
                  assert before is not None and not path.exists(), ('invalid destination', name)
              original = before.decode('utf-8') if before is not None else ''
              text, end = original, 0
              for start, stop, replacement in item['edits']:
                  assert type(start) is int and type(stop) is int and 0 <= end <= start <= stop <= len(original), ('invalid offsets', name)
                  assert isinstance(replacement, str)
                  end = stop
              for start, stop, replacement in reversed(item['edits']):
                  text = text[:start] + replacement + text[stop:]
              assert hashlib.sha256(text.encode()).hexdigest() == item['after_sha256'], ('unexpected patch', name)
              if item.get('reference_only'):
                  assert before is not None and old_name == name, ('invalid reference-only file', name)
                  expected = original
                  substitutions = {}
                  for old, new in moves.items():
                      substitutions[old] = new
                      substitutions[posixpath.relpath(old, posixpath.dirname(name))] = posixpath.relpath(new, posixpath.dirname(name))
                  for old in sorted(substitutions, key=len, reverse=True):
                      expected = expected.replace(old, substitutions[old])
                  assert text == expected, ('non-reference edit', name)
              else:
                  assert path.suffix == '.md' and not name.startswith('archive/'), ('non-documentation edit', name)
                  formatting.append(name)
              planned.append((source, path, text))
          assert not (set(moves) & outputs), 'overlapping moves'
          for source, path, text in planned:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(text)
              if source != path:
                  source.unlink()
          if formatting:
              subprocess.run(['pnpm', 'exec', 'prettier', '--check', *formatting], check=True)
          subprocess.run(['pnpm', 'guidance:check'], check=True)
          subprocess.run(['git', 'diff', '--check'], check=True)
          state = {'paths': sorted(inputs | outputs), 'message': bundle['message']}
          pathlib.Path('/tmp/review-patch-state.json').write_text(json.dumps(state))
          print(f'Validated {len(outputs)} files, {len(moves)} moves; source/archive edits are exact project-reference replacements only.')
          PY
      - name: Preserve the reviewed patch outside the repository
        if: always()
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess, zipfile
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'review-patch-evidence.zip'
          with zipfile.ZipFile(target, 'w', zipfile.ZIP_DEFLATED) as out:
              out.write('.github/full-documentation-review-patch.json', '_pending_patch.json')
              out.writestr('_changes.patch', subprocess.check_output(['git', 'diff', '--binary', '--no-ext-diff', 'HEAD']))
              state = pathlib.Path('/tmp/review-patch-state.json')
              if state.exists():
                  out.write(state, '_validated_paths.json')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewed-documentation-patch
          path: ${{ runner.temp }}/review-patch-evidence.zip
          retention-days: 1
          if-no-files-found: error
      - name: Commit and publish without overwriting concurrent work
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess
          state = json.loads(pathlib.Path('/tmp/review-patch-state.json').read_text())
          subprocess.run(['git', 'add', '--all', '--', *state['paths']], check=True)
          staged = subprocess.check_output(['git', 'diff', '--cached', '--no-renames', '--name-only', '-z']).decode().strip('\0').split('\0')
          assert set(staged) == set(state['paths']), ('unexpected staged files', staged)
          subprocess.run(['git', 'rm', '--', '.github/full-documentation-review-patch.json'], check=True)
          subprocess.run(['git', 'config', 'user.name', 'OpenLegend documentation review'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'commit', '-m', state['message']], check=True)
          PY
          git -c 'credential.helper=!f() { printf "username=x-access-token\npassword=%s\n" "$GH_TOKEN"; }; f' push origin HEAD:refs/heads/docs/full-documentation-review-reconciled-2026-10-03

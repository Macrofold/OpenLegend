name: Apply reviewed documentation patch
on:
  push:
    branches: [docs/full-documentation-review-reconciled-2026-10-03]
    paths:
      - .github/full-documentation-review-patch.json
      - .github/workflows/full-documentation-review-patch.yml
permissions:
  contents: write
concurrency:
  group: full-documentation-review-reconciled-patch
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      AI_BUDGET_USD: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --ignore-scripts --frozen-lockfile
      - name: Apply hash-fenced reviewed text, moves and incoming references
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, pathlib, subprocess, zlib
          root = pathlib.Path.cwd()
          bundle = json.loads(pathlib.Path('.github/full-documentation-review-patch.json').read_text())
          if 'compressed_patch' in bundle:
              packed = base64.b64decode(bundle['compressed_patch'], validate=True)
              decoder = zlib.decompressobj()
              decoded = decoder.decompress(packed, 8 * 1024 * 1024)
              assert decoder.eof and not decoder.unused_data and not decoder.unconsumed_tail, 'invalid or oversized patch'
              bundle = json.loads(decoded)
          comment_paths = {'apps/server/src/world-agent-questions.ts', 'apps/server/src/world-authoring-analysis.ts'}
          archive_link = 'archive/03-design-proposals/agents-and-social-simulation.md'
          def checked_path(name):
              relative = pathlib.PurePosixPath(name)
              assert not relative.is_absolute() and '..' not in relative.parts, name
              path = root / name
              markdown = path.suffix == '.md' and (name.startswith(('docs/', '.agents/')) or name in ('README.md', 'AGENTS.md', 'CONTRIBUTING.md'))
              examples = path.suffix == '.yaml' and name.startswith(('docs/projects/world-agent-context/examples/', 'docs/projects/completed/world-agent-context/examples/'))
              assert markdown or examples or name in comment_paths or name == archive_link, name
              assert path.resolve().is_relative_to(root) and not path.is_symlink(), name
              return path
          outputs, inputs, planned = set(), set(), []
          for item in bundle['files']:
              name = item['path']
              old_name = item.get('before_path', name)
              path, source = checked_path(name), checked_path(old_name)
              assert name not in outputs and old_name not in inputs, name
              outputs.add(name)
              inputs.add(old_name)
              before = source.read_bytes()
              assert hashlib.sha256(before).hexdigest() == item['before_sha256'], ('changed base', old_name)
              if old_name != name:
                  assert not path.exists() and old_name.startswith('docs/projects/') and name.startswith('docs/projects/completed/'), ('invalid move', old_name, name)
              original = before.decode('utf-8')
              text = original
              end = 0
              for start, stop, replacement in item['edits']:
                  assert type(start) is int and type(stop) is int and 0 <= end <= start <= stop <= len(original), ('invalid offsets', name)
                  assert isinstance(replacement, str)
                  end = stop
              for start, stop, replacement in reversed(item['edits']):
                  text = text[:start] + replacement + text[stop:]
              assert hashlib.sha256(text.encode()).hexdigest() == item['after_sha256'], ('unexpected patch', name)
              if name in comment_paths:
                  expected = original.replace('docs/projects/world-agent-context/', 'docs/projects/completed/world-agent-context/').replace('docs/projects/invention-questions-', 'docs/projects/completed/invention-questions-')
                  assert text == expected, ('non-reference source edit', name)
              if name == archive_link:
                  assert text == original.replace('../../docs/projects/appraisal-social-continuity-tech-design.md', '../../docs/projects/completed/appraisal-social-continuity-tech-design.md'), 'non-reference archive edit'
              planned.append((source, path, text))
          moved_sources = {str(source.relative_to(root)) for source, path, text in planned if source != path}
          assert not (moved_sources & outputs), 'overlapping move'
          for source, path, text in planned:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(text)
              if source != path:
                  source.unlink()
          paths = sorted(outputs)
          subprocess.run(['pnpm', 'exec', 'prettier', '--write', *paths], check=True)
          for item in bundle['files']:
              assert hashlib.sha256((root / item['path']).read_bytes()).hexdigest() == item['after_sha256'], ('unexpected formatting', item['path'])
          subprocess.run(['pnpm', 'guidance:check'], check=True)
          subprocess.run(['pnpm', 'exec', 'prettier', '--check', *paths], check=True)
          subprocess.run(['git', 'diff', '--check'], check=True)
          pathlib.Path('/tmp/review-patch-state.json').write_text(json.dumps({'paths': sorted(inputs | outputs), 'message': bundle['message']}))
          print(f'Validated {len(outputs)} files and {len(moved_sources)} completed-project moves.')
          PY
      - name: Check current documentation YAML through native recipe validation
        run: |
          pnpm exec tsx -e '
          import assert from "node:assert/strict";
          import { readFileSync, readdirSync } from "node:fs";
          import { parse } from "yaml";
          import { initializeCollisionRuntime } from "./packages/spatial/src/rapier.ts";
          import { createWorld } from "./packages/domain/src/worlds/base/world.ts";
          import { validateRecipeCandidate } from "./packages/domain/src/invention-families.ts";
          async function verify() {
            await initializeCollisionRuntime();
            const directory = "docs/projects/completed/world-agent-context/examples";
            const files = readdirSync(directory).filter((name) => name.endsWith(".yaml"));
            for (const name of files) parse(readFileSync(`${directory}/${name}`, "utf8"));
            const example = parse(readFileSync(`${directory}/recipe-submit.yaml`, "utf8"));
            const candidate = example.arguments.candidate;
            const world = createWorld();
            assert.deepEqual(validateRecipeCandidate(world, candidate), []);
            assert.ok(validateRecipeCandidate(world, { ...candidate, formatVersion: 1 }).length > 0);
            assert.ok(validateRecipeCandidate(world, { ...candidate, family: { ...candidate.family, id: "uninstalled:family" } }).length > 0);
            console.log(`${files.length} YAML examples parsed; current candidate admitted; obsolete envelope and uninstalled family rejected. No provider, database or save operations.`);
          }
          verify().catch((error) => { console.error(error); process.exitCode = 1; });
          '
      - name: Preserve exact review files outside the repository
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess, zipfile
          state_path = pathlib.Path('/tmp/review-patch-state.json')
          if state_path.exists():
              state = json.loads(state_path.read_text())
              target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'recovered-documentation-patch.zip'
              with zipfile.ZipFile(target, 'w', zipfile.ZIP_DEFLATED) as out:
                  out.write(state_path, '_applied_paths.json')
                  out.write('.github/full-documentation-review-patch.json', '_pending_patch.json')
                  out.write('.github/workflows/full-documentation-review-patch.yml', '_patch_workflow.yml')
                  for name in state['paths']:
                      if pathlib.Path(name).is_file():
                          out.write(name, name)
                  out.writestr('_recovered_changes.patch', subprocess.check_output(['git', 'diff', '--binary', '--no-ext-diff', 'HEAD']))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovered-documentation-patch
          path: ${{ runner.temp }}/recovered-documentation-patch.zip
          retention-days: 1
          if-no-files-found: warn
      - name: Commit only the validated patch
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess
          state = json.loads(pathlib.Path('/tmp/review-patch-state.json').read_text())
          subprocess.run(['git', 'add', '--all', '--', *state['paths']], check=True)
          staged = subprocess.check_output(['git', 'diff', '--cached', '--no-renames', '--name-only', '-z']).decode().strip('\0').split('\0')
          assert set(staged) == set(state['paths']), ('unexpected staged files', staged)
          subprocess.run(['git', 'rm', '--', '.github/full-documentation-review-patch.json'], check=True)
          subprocess.run(['git', 'config', 'user.name', 'OpenLegend documentation review'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'commit', '-m', state['message']], check=True)
          PY
      - name: Publish without overwriting concurrent work
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git -c 'credential.helper=!f() { printf "username=x-access-token\npassword=%s\n" "$GH_TOKEN"; }; f' push origin HEAD:refs/heads/docs/full-documentation-review-reconciled-2026-10-03

[package]
name = "openlegend-game-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
openlegend-simulation = { path = "../simulation" }
openlegend-world-host = { path = "../world-host" }
serde.workspace = true
serde_json.workspace = true
indexmap.workspace = true
sha2.workspace = true
tokio = { version = "=1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "=0.7.20", features = ["rt"] }
tokio-postgres = { version = "=0.7.18", features = ["with-serde_json-1"] }
tokio-postgres-rustls = { version = "=0.14.0", features = ["ring", "native-certs"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
ring = "=0.17.14"
httpdate = "=1.0.3"
libloading = "=0.9.0"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
http-body = "=1.1.0"
tower-http = { version = "=0.6.11", features = ["fs"] }
parry3d = "=0.30.2"
wasmi = { version = "=2.0.1", default-features = false, features = ["std", "validate", "stable", "auto-dispatch"] }
getrandom = "=0.4.3"
uuid = { version = "=1.29.3", features = ["serde", "v4"] }
openidconnect = { version = "=4.1.0", default-features = false }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls-native-roots", "http2"] }

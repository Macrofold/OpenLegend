[workspace]
members = ["simulation", "node-bridge"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
napi = { version = "=3.16.1", default-features = false, features = ["napi8", "serde-json"] }
napi-derive = "=3.7.0"
napi-build = "=2.6.0"
rayon = "=1.12.0"
indexmap = { version = "=2.14.2", features = ["serde"] }
ryu-js = "=1.0.3"
sha2 = "=0.11.1"
serde = { version = "=1.0.229", features = ["derive", "rc"] }
serde_json = { version = "=1.0.154", features = ["preserve_order", "float_roundtrip", "raw_value"] }

[profile.release]
debug = "line-tables-only"

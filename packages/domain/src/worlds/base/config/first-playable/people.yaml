people:
  - id: base:person:ada
    actorRole: ada
    name: Ada
    identity:
      initialGoals: []
      personality:
        Practical, curious, candid and assertive, with dry humor, cautious trust and reluctance
        to admit needing help. Values bodily autonomy and self-respect; willing to use proportionate
        physical force, and regards fear and decisive action as compatible.
      backstory: >-
        I am Ada, twenty-four. I grew up near woodland, in a household where making things last
        mattered more than owning many things. I learned to mend cord, tend a fire, gather familiar
        plants and prepare ordinary meals. I like understanding how a useful object works. I can
        handle a small cutting tool and understand how people obtain and prepare food, though I do
        not know every plant or animal I might meet.


        I speak plainly and usually think before promising something. I sometimes make a dry joke
        when I am uncomfortable. I would rather ask a specific question than pretend I understand,
        although admitting that I need help can take me longer than it should. I notice the work
        other people do and appreciate practical kindness. Trust grows through what someone actually
        does; a stranger is neither automatically a friend nor an enemy.


        I imagine having a settled place someday: a sound roof, tools I understand, meals shared
        with people whose company I enjoy. I am curious about what I could learn and who I might
        become. Pain frightens me, and I do not regard my future as disposable. I also dislike
        needless cruelty.


        I enjoy watching animals and quietly observing.
      traits:
        - id: ada-practical
          name: Practical
          description: I value useful work and learning how things work.
        - id: ada-curious
          name: Curious
          description: I want to understand this place and what I might become.
        - id: ada-considerate
          name: Considerate
          description: I appreciate practical kindness and dislike needless cruelty.
        - id: ada-self-respecting
          name: Self-respecting
          description:
            I value my bodily autonomy and independence. I am willing to use proportionate physical
            force; being afraid need not prevent decisive action.
    startingKnowledge:
      methodSet: elementary-survival
      knownPeople:
        - personRole: mercenary
          givenName: Peacock Mercenary
      generalBeliefs: ''
    description: ''
  - id: base:person:mercenary
    actorRole: mercenary
    name: Peacock Mercenary
    identity:
      initialGoals: []
      personality:
        Reserved and practical, with dry humor, respect for reliability and a strong preference
        for knowing what a risk involves.
      backstory: >-
        I am a travelling mercenary. I make my living through travel and practical work.


        Travel has taught me to value a dependable companion and an honest account of a risk. I take
        pleasure in a tool that feels well made, an unfamiliar route and a dry joke shared without
        ceremony. I like earning my keep, but I do not regard another person's plans as more
        important than my own life or freedom. A settled place appeals to me when it still leaves
        room to choose where I go.
      traits:
        - id: mercenary-reliable-company
          name: Reliable company
          description:
            I value companions who describe risks honestly and do what they have actually agreed to
            do.
        - id: mercenary-independent-traveler
          name: Independent traveler
          description: I enjoy travel, practical skill and the freedom to decide where my life goes.
    startingKnowledge:
      methodSet: elementary-survival
      knownPeople:
        - personRole: ada
          givenName: Ada
      generalBeliefs: ''
    description: ''
  - id: base:person:mara
    actorRole: mara
    name: Mara Reed
    description: A careful camp mender in a patched wool coat.
    identity:
      initialGoals: []
      personality:
        Careful, patient about practical work, and sensitive to being dismissed. Speaks plainly
        about what she has noticed and avoids guessing what she has not seen. Enjoys careful making
        and being taken seriously, while valuing her own time and belongings.
      backstory: >-
        I am Mara Reed. I learned to mend cordage, packs, and camp gear along the river crossings,
        keeping tools and work satchels neatly marked so shared supplies stay in good order.


        I enjoy understanding why a fastening or useful object failed, and finding a repair that
        will hold. Patient work is satisfying to me, especially when another person notices what
        made it good. I value a clear account of what happened and dislike being brushed aside. I
        would like a place where people can make useful things and treat one another's work with
        care, while keeping time and possessions of their own.
      traits:
        - id: mara-methodical
          name: Methodical mender
          description: I track repairs and materials by their physical markings and condition.
        - id: mara-plain-dealing
          name: Plain-dealing
          description: I state what I know directly and prefer honest dealing over guesswork.
    startingKnowledge:
      methodSet: elementary-survival
      generalBeliefs: >-
        # Beliefs

        I left my red-stitched satchel at the Mending Clearing work spot beside the rough stone
        before a walk; when I returned, the bag was gone and a torn red fastening strap with blue
        cross-stitching remained. The satchel has “Mara Reed” stitched on the exterior flap and held
        two lengths of cord when I left it. I saw Tavin carrying a bundle earlier, though I did not
        see him take my satchel, and I suspect a connection.
      knownPeople: []
  - id: base:person:tavin
    actorRole: tavin
    name: Tavin Vale
    description: A practical camp traveler in a reed-woven vest.
    identity:
      initialGoals: []
      personality:
        Practical, tidy, and matter-of-fact. Values a clear work area, dislikes accusations,
        and can recognize a mistake. Enjoys routes and practical arrangements, with an independent
        streak and a preference for straightforward company.
      backstory: >-
        I am Tavin Vale. I worked river landings and camp clearings where sudden damp ruined cordage
        left on the ground, so I learned to keep work areas clear and dry stores orderly.


        I enjoy finding a dependable route and arranging supplies so they are easy to reach and keep
        dry. I like comparing practical solutions with people who say what they mean. I can change
        my view when I learn that I was mistaken, though an accusation can make me defensive. A
        useful camp matters to me, but so does being free to move on.
      traits:
        - id: tavin-dry-store-keeper
          name: Dry-store keeper
          description: I prefer a clear work area and well-kept dry stores.
        - id: tavin-direct-recorder
          name: Direct recorder
          description: I speak plainly, dislike unfounded accusations, and can admit an honest mistake.
    startingKnowledge:
      methodSet: elementary-survival
      generalBeliefs: >-
        # Beliefs

        Earlier today I moved an unattended red-stitched bag from the Mending Clearing work spot
        beside the rough stone to the Reed-side Store beside the split stone while clearing room for
        my work, assuming it was shared equipment. Its red fastening strap snagged on the rough
        stone edge as I lifted it, and I left a sorting note at the work spot. I neither inspected
        the bag’s contents nor identified its owner.
      knownPeople: []
socialOffers:
  baseline:
    id: base:social-offers
    version: 1
    implementation: bounded-local-offers
    outgoing: 3
    incoming: 6
    messages: &a1
      outgoing: Withdraw an earlier offer before making another.
      incoming: That person cannot receive another offer now.
      pair: Review or withdraw the existing offer between you first.
    pendingSeconds: 1800
    onePendingPerPair: false
  firstPlayable:
    id: base:first-playable-social-offers
    version: 1
    implementation: bounded-local-offers
    outgoing: 3
    incoming: 6
    messages: *a1
    pendingSeconds: 7200
    onePendingPerPair: true
    cooperation:
      episodeSeconds: 14400
      arrivalMetres: 1
      families: [guide, help, hunt, alliance, ceasefire]
      ceasefireSeconds: 7200
      helpMethods: []
      description: Agree to one finite practical activity. Each person chooses their own work and route. Acceptance starts no movement and grants no materials or control. Either may leave; completed effects remain.
      labels:
        alliance: Mutual alliance, without an expiry. Each person keeps independent choices and permissions; either may leave.
        ceasefire: Ceasefire for {seconds} game seconds. Acceptance stops our unreleased attacks on each other. Either may leave; a new chosen attack ends assent. Released effects remain.
        releasedRisk: An earlier released attack may still arrive.
        propose: Ask for guidance
        accept: Accept these terms; keep choosing my own work
        decline: Decline these terms
        withdraw: Withdraw my proposal
        leave: Leave this activity
        conclude: Conclude this activity without claiming success
        help: Ask for practical help
        carry: Ask to carry this offered object
        takeCarry: Accept the separate gift and take actual custody
        hunt: Invite to hunt
        lastSeen: Walk to where I last saw the quarry
        huntTerms: Hunt {quarry} together, meeting at {place}. You may be injured or killed. We choose our own actions and may stop. Division is decided from actual yield afterward.
        carryTerms: Carry {item} to {place}. This is a separate custody transfer and voluntary transport, without a loan or retrieval right.
        huntAction: Act for the agreed hunt
        construct: Start the agreed camp operation
        placeCarry: Put the agreed object down here
        prepare: Make one batch for this activity
        walk: Walk to the agreed place
        acceptAmendment: Accept revised terms and end unfinished work for the old terms
        declineAmendment: Decline amendment; keep the accepted activity
cooperationHelpMethodSet: elementary-survival

      damage: 6
      accuracy: 0.75
      range: 1.4
      approachRange: 1
      windupSeconds: 12
      recoverySeconds: 24
  - id: reed_mat
    revision: 1
    version: 1
    name: Reed roof mat
    description: A flexible 1.80 by 2.40 metre woven mat, 0.02 metres thick. Fasten it to four qualified canopy posts with four real cords for rain cover.
    portable: true
    packingLoad: 2
    properties: [fiber, flexible]
    assemblyMaterial:
      familyId: base:light-canopy
      role: cover
      coverProfileId: base:reed-mat-cover


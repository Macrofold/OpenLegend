  introduction: Arrive empty handed beside the wayside hearth. Inspect nearby food and materials; Gather, Make and a chosen meal use real finite supplies. You can pause while reading, stop unfinished work, speak to anyone who can hear, or act while another person is busy. Other residents choose their own lives. If this body dies, Continue uses an actual reachable resting hearth; your lost belongings remain in the world.
